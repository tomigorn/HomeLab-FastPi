# Miniflux subscriptions (scripts/subscribe.py adds what is missing; with --prune it also removes what is no longer listed). Extend here, then run the script.
# High and Critical only (CVSS >= 7.0): vl-severity-feed (Docker/Vulnerability-Lookup/severity-feed) filters the Vulnerability-Lookup feeds; read over the internal network vl_feeds.

# Watchlist entries (products in ../Vulnerability-Lookup/watchlists.toml), one per vulnerability, dated when it first reached CVSS >= 7.0
[[feed]]
category = "Watchlist"
url = "http://vl-severity-feed:8080/watchlist.atom"

# CISA Known Exploited Vulnerabilities (catalog 405284c2-…), same filter
[[feed]]
category = "KEV"
url = "http://vl-severity-feed:8080/kev.atom"
