# Miniflux subscriptions (scripts/subscribe.py adds what is missing, never deletes). Extend here, then run the script.
# Vulnerability-Lookup feeds are read over the internal network vl_feeds (no SSO in between); {feed_key} comes from secrets/feed_key.

# New CVE/GHSA entries for the products in ../Vulnerability-Lookup/watchlists.toml (last 17 days, one entry per vulnerability)
[[feed]]
category = "Watchlist"
url = "http://vl-web:10001/user/notifications/watchlist/feed.atom?X-FEED-KEY={feed_key}"

# CISA Known Exploited Vulnerabilities (catalog 405284c2-…), synced from vulnerability.circl.lu into the local instance
[[feed]]
category = "KEV"
url = "http://vl-web:10001/known-exploited-vulnerabilities-catalog/feed.atom?catalog_uuid=405284c2-e461-4670-8979-7fd2c9755a60"

