# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Miniflux ################################################
# #########################################################
  # Feed reader for the CVE feeds (Vulnerability-Lookup) and release notes; Telegram integration. news.holy-grail.ch behind the Holy Grail forward auth;
  # the login is the forwarded X-authentik-username (trusted only from Traefik's pinned address), local login off.
  miniflux:
    image: miniflux/miniflux:2.3.5-distroless
    container_name: miniflux
    user: "65066:65066"
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL_FILE: /run/secrets/miniflux_db_url
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN}
      ADMIN_PASSWORD_FILE: /run/secrets/miniflux_admin_password
      BASE_URL: https://news.holy-grail.ch
      AUTH_PROXY_HEADER: X-authentik-username
      AUTH_PROXY_USER_CREATION: "0"
      TRUSTED_REVERSE_PROXY_NETWORKS: 172.24.255.3/32   # Traefik's pinned address on traefik_proxy
      DISABLE_LOCAL_AUTH: "1"
      # vl-web is on a private network (vl_feeds)
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
      POLLING_FREQUENCY: "60"
      WORKER_POOL_SIZE: "2"
      BATCH_SIZE: "20"
      CLEANUP_ARCHIVE_READ_DAYS: "60"
      CLEANUP_ARCHIVE_UNREAD_DAYS: "120"
      # the watchlist feed is computed per request (several seconds, longer while a feeder imports)
      HTTP_CLIENT_TIMEOUT: "120"
      LOG_DATE_TIME: "1"
    secrets:
      - miniflux_db_url
      - miniflux_admin_password
    ports:
      - "127.0.0.1:8097:8080"   # API for scripts/subscribe.py on the host only
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    depends_on:
      miniflux-db:
        condition: service_healthy
    networks:
      - traefik_proxy     # Traefik, and the way out (GitHub, Telegram)
      - miniflux_backend
      - vl_feeds          # Vulnerability-Lookup feeds (vl-web)
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

# #########################################################
# PostgreSQL (miniflux-db) ################################
# #########################################################
  miniflux-db:
    image: postgres:18.7-alpine
    container_name: miniflux-db
    user: "70:70"
    mem_limit: 192m
    pids_limit: 128
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_DB: miniflux
      POSTGRES_PASSWORD_FILE: /run/secrets/miniflux_db_password
    secrets:
      - miniflux_db_password
    volumes:
      - miniflux-db:/var/lib/postgresql
    networks:
      - miniflux_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

secrets:
  miniflux_db_url:
    file: ./secrets/miniflux_db_url              # 65066:65066 0400, postgres://miniflux:<pw>@miniflux-db/miniflux?sslmode=disable
  miniflux_db_password:
    file: ./secrets/miniflux_db_password         # 70:70 0400
  miniflux_admin_password:
    file: ./secrets/miniflux_admin_password      # 65066:65066 0400, unused for login (local auth off), required by CREATE_ADMIN

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  vl_feeds:
    external: true   # defined in Docker/Vulnerability-Lookup/docker-compose.yaml
  miniflux_backend:
    internal: true
    ipam:
      config:
        - subnet: 10.24.44.0/28

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  miniflux-db:
