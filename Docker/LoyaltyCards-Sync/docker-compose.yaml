# #########################################################
# Services ################################################
# #########################################################
services:
# ---------------------------------------------------------
# LoyaltyCards-Sync (Pocketbase) --------------------------
# ---------------------------------------------------------
  loyalty-sync:
    build: .
    image: loyaltycards-sync:local
    container_name: loyalty-sync
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD_FILE=/run/secrets/pb_admin_password
      - PB_PUBLIC_URL=${PB_PUBLIC_URL}
    volumes:
      - pb_data:/pb/pb_data
    secrets:
      - pb_admin_password
    networks:
      - traefik_proxy

# #########################################################
# Networks ################################################
# #########################################################
networks:
  traefik_proxy:
    external: true

# #########################################################
# Secrets #################################################
# #########################################################
secrets:
  pb_admin_password:
    file: ./secrets/pb_admin_password

# #########################################################
# Volumes #################################################
# #########################################################
volumes:
  pb_data:
