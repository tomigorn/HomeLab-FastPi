# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Claude-Mockups ##########################################
# #########################################################
  claude-mockups:
    image: caddy:alpine
    container_name: claude-mockups
    user: "65016:65016"
    mem_limit: 128m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # bind :80 as non-root
    environment:
      - XDG_CONFIG_HOME=/tmp   # caddy autosave/data (rootfs unwritable for 65016)
      - XDG_DATA_HOME=/tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro    # serves /srv with browse (auth: Traefik forward auth)
      - ./www:/srv:ro                           # demo content, one subfolder per mockup
      - ./assets:/assets:ro                     # durable client lib (served at /_assets/*)
    networks:
      - traefik_proxy
      - mockups_internal

# #########################################################
# Answer-Inbox ############################################
# #########################################################
  answer-inbox:
    build: ./inbox/rust                 # Rust, static binary in a scratch image (see inbox/rust/Dockerfile); the Node original is in inbox/legacy/
    image: claude-mockups-answer-inbox:local
    container_name: claude-mockups-inbox
    mem_limit: 16m
    cpus: 0.5
    pids_limit: 32
    restart: unless-stopped
    user: "65003:65003"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - ./answers:/data                         # received selections (Claude reads these)
    healthcheck:
      test: ["CMD", "/answer-inbox", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mockups_internal

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  # Internal-only: lets Caddy reach answer-inbox without exposing it (and gives
  # answer-inbox no outbound internet access).
  mockups_internal:
    driver: bridge
    internal: true

# =========================================================
# Volumes =================================================
# =========================================================
