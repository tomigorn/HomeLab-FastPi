# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Claude-Mockups ##########################################
# #########################################################
  claude-mockups:
    image: caddy:alpine
    container_name: claude-mockups
    user: "65016:65016"
    mem_limit: 128m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # bind :80 as non-root
    environment:
      - XDG_CONFIG_HOME=/tmp   # caddy autosave/data (rootfs unwritable for 65016)
      - XDG_DATA_HOME=/tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro    # serves /srv with browse (auth: Traefik forward auth)
      - ./www:/srv:ro                           # demo content, one subfolder per mockup
      - ./assets:/assets:ro                     # durable client lib (served at /_assets/*)
    networks:
      - traefik_proxy
      - mockups_internal

# #########################################################
# Answer-Inbox ############################################
# #########################################################
  answer-inbox:
    image: node:22-alpine
    container_name: claude-mockups-inbox
    mem_limit: 128m
    restart: unless-stopped
    user: "65003:65003"
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/server.js"]
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - ./inbox:/app:ro                         # the tiny dependency-free HTTP server
      - ./answers:/data                         # received selections (Claude reads these)
    tmpfs:
      - /tmp
    networks:
      - mockups_internal

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  # Internal-only: lets Caddy reach answer-inbox without exposing it (and gives
  # answer-inbox no outbound internet access).
  mockups_internal:
    driver: bridge
    internal: true

# =========================================================
# Volumes =================================================
# =========================================================
