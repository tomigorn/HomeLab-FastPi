# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# WireGuard wg-easy #######################################
# #########################################################
  wg-easy:
    # v15 (2026-10-17, was v14): settings now live in the database
    # (wg-easy-v15/wg-easy.db) and are edited in the Admin Panel, not via env.
    # Migrated from v14's wg0.json, so all client keys/addresses are unchanged.
    # Rollback: image wg-easy:rollback-v14 (kept locally) + the untouched ./wg-easy
    # dir + the v14 compose in ~/backups/pre-update/2026-10-17-majors/.
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    container_name: WireGuard-VPN
    mem_limit: 256m
    # wg-easy has no *_FILE option, so the OIDC client secret is read from the secret file at start.
    entrypoint: ["/bin/sh", "-c", "export OAUTH_OIDC_CLIENT_SECRET=\"$$(cat /run/secrets/oidc_client_secret)\"; exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["/usr/bin/dumb-init", "node", "server/index.mjs"]
    secrets:
      - oidc_client_secret   # root:root 0400
    environment:
      # v14 ran IPv4-only and the traefik_proxy network has no IPv6.
      - DISABLE_IPV6=true
      # Admin login via Authentik OIDC (provider/application "wg-easy", created by
      # Authentik/scripts/provision-admin-sso.py, restricted to group homelab-admins).
      # wg-easy builds the redirect URI from the request Host header, so the UI must
      # only be used at https://wg-easy.holy-grail.ch (registered in Authentik).
      # INSECURE must stay unset: the login cookie and redirect URI need https.
      - OAUTH_PROVIDERS=oidc
      - OAUTH_OIDC_NAME=Holy Grail
      - OAUTH_OIDC_SERVER=https://sso.holy-grail.ch/application/o/wg-easy/
      - OAUTH_OIDC_CLIENT_ID=${WG_EASY_OIDC_CLIENT_ID}
      # false: an Authentik login is only accepted for an existing wg-easy user with
      # the same email (linked on first login). true would create new users as ADMIN
      # (wg-easy has no permission system yet).
      - OAUTH_AUTO_REGISTER=false
      # The login page jumps straight to Authentik.
      - OAUTH_AUTO_LAUNCH=oidc
      # SSO only (2026-10-19): the password login (/api/auth/password and
      # Authorization: Basic on the API) is refused with 403.
      # Recovery when Authentik is down (server shell only): set this to false,
      # `docker compose up -d` (drops VPN tunnels for ~3 s), log in at
      # https://wg-easy.holy-grail.ch/login?auto_launch=false, then set it back.
      # Password forgotten: `docker exec -it WireGuard-VPN cli db:admin:reset`.
      - DISABLE_PASSWORD_AUTH=true
    volumes:
      - ./wg-easy-v15:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp" # WireGuard VPN port
      # not needed because we will use the web UI through the reverse proxy (Traefik)
      # - "51821:51821/tcp" # Web UI port
    # SYS_MODULE dropped: the host loads wireguard at boot (/etc/modules-load.d/wireguard.conf)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN   # wg interface, routes, iptables NAT
      - NET_RAW     # iptables-legacy opens raw sockets to init the nat table
    # Discovery/token/userinfo calls to Authentik go straight to Traefik on this host
    # (valid public cert) instead of out through the Cloudflare tunnel; the container's
    # resolver may otherwise not see AdGuard's local *.holy-grail.ch answer.
    # Traefik's address on traefik_wg: 192.168.1.2:443 from here is a DNAT'd host port, which DOCKER-USER drops for the VPN source.
    extra_hosts:
      - "sso.holy-grail.ch:10.24.5.3"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
      net.ipv4.ip_forward: '1'
    # depends_on:
    #   - adguard
    # NOTE: traefik_wg (shared only with Traefik, H-2/M-8) carries the UI for Traefik
    # (https://wg-easy.holy-grail.ch) and is the container's only network, so all VPN
    # client traffic exits through it (NAT source 10.24.5.5). Removing it breaks VPN routing.
    #
    # If the UI becomes unreachable (e.g. AdGuard DNS is down), use the Cloudflare
    # SSH tunnel as a break-glass — see README.md.
    networks:
      traefik_wg:
        # Pinned: VPN clients reach Traefik (10.24.5.3) NATed to this address; local-networks@file,
        # HOST-GUARD, DOCKER-USER and authorized_keys from= name exactly 10.24.5.5.
        ipv4_address: 10.24.5.5
    restart: unless-stopped

# =========================================================
# Secrets =================================================
# =========================================================
secrets:
  oidc_client_secret:
    file: ./secrets/oidc_client_secret

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_wg:
    external: true   # defined in Docker/Traefik/docker-compose.yaml

# =========================================================
# Volumes =================================================
# =========================================================
