# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# WireGuard wg-easy #######################################
# #########################################################
  wg-easy:
    # v15 (2026-10-17, was v14): settings now live in the database
    # (wg-easy-v15/wg-easy.db) and are edited in the Admin Panel, not via env.
    # Migrated from v14's wg0.json, so all client keys/addresses are unchanged.
    # Rollback: image wg-easy:rollback-v14 (kept locally) + the untouched ./wg-easy
    # dir + the v14 compose in ~/backups/pre-update/2026-10-17-majors/.
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    container_name: WireGuard-VPN
    mem_limit: 256m
    environment:
      # v14 ran IPv4-only and the traefik_proxy network has no IPv6.
      - DISABLE_IPV6=true
    volumes:
      - ./wg-easy-v15:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp" # WireGuard VPN port
      # not needed because we will use the web UI through the reverse proxy (Traefik)
      # - "51821:51821/tcp" # Web UI port
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
      net.ipv4.ip_forward: '1'
    # depends_on:
    #   - adguard
    # NOTE: traefik_proxy is required for the wg-easy UI to be reachable via Traefik
    # (http://wg-easy.fastpi.homelab:8080). A side effect is that the container's
    # default gateway becomes the traefik_proxy bridge, meaning all VPN client traffic
    # exits through that network. If traefik_proxy is removed, VPN routing breaks.
    #
    # If the UI becomes unreachable (e.g. AdGuard DNS is down), use the Cloudflare
    # SSH tunnel as a break-glass — see README.md.
    networks:
      - traefik_proxy
    restart: unless-stopped

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
