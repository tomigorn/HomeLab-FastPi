# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# WireGuard wg-easy #######################################
# #########################################################
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: WireGuard-VPN
    environment:
      - LANG=en
      - WG_HOST=${HOST_DOMAIN}
      - WG_PORT=51820
      - PASSWORD_HASH=${PASSWORD_HASH}
      - WG_DEFAULT_DNS=192.168.1.2
      - UI_CHART_TYPE=0
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp" # WireGuard VPN port
      # not needed because we will use the web UI through the reverse proxy (Traefik)
      # - "51821:51821/tcp" # Web UI port
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
      net.ipv4.ip_forward: '1'
    # depends_on:
    #   - adguard
    networks:
      - wireguard
      - traefik_proxy
    restart: unless-stopped

# =========================================================
# Networks ================================================
# =========================================================
networks:
  wireguard:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
