# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Activity ################################################
# #########################################################
  activity:
    build: .                       # Rust, static binary in a scratch image (see Dockerfile)
    image: activity:local
    container_name: activity
    restart: unless-stopped
    env_file: .env
    # Credentials are copies owned by this uid (README "Secrets"); read on every use, no restart after a rotation.
    secrets:
      - abs_api_key
      - qbit_pass
    volumes:
      - activity_data:/data        # last.json: last beefy snapshot, for "as of" after a restart
    healthcheck:
      test: ["CMD", "/activity", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    user: "65060:65060"            # dedicated uid (Docker/_global/docs/container-hardening.md)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m                 # RSS ~2 MB idle; a 4 MiB queue answer is parsed into typed fields only
    cpus: 0.5
    pids_limit: 32
    networks:
      traefik_proxy:
        # Pinned: the firewall rules for the Waker (HOST-GUARD :9001) and the gate (DOCKER-USER beefy :8097) name this source (README "Owner steps").
        # Top of the subnet, like Traefik's .3: Docker hands out addresses from the bottom.
        ipv4_address: 172.24.255.10
        gw_priority: 100
      traefik_mouse:
        # qBittorrent (gluetun_mouse 10.24.25.2:8080), category abr, read-only use. Pinned: gluetun's post-rules.txt must accept this source (README "Owner steps").
        ipv4_address: 10.24.25.7
      activity_metrics:            # Prometheus scrapes /metrics here; nothing else on it

# =========================================================
# Networks ================================================
# =========================================================
networks:
  # Defined by Traefik. Traefik reaches activity:8080; Audiobookshelf is here too; the only network with a gateway (egress to the Waker and the gate).
  traefik_proxy:
    external: true
  # Defined by hand (Docker/mouse README), internal: gluetun_mouse with qBittorrent.
  traefik_mouse:
    external: true
  # Only activity + Prometheus; internal = no route out. Fixed subnet: the service answers /metrics only from it (METRICS_ALLOW).
  activity_metrics:
    name: activity_metrics
    internal: true
    ipam:
      config:
        - subnet: 10.24.40.0/29

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  activity_data:

secrets:
  abs_api_key:
    file: ./secrets/abs_api_key
  qbit_pass:
    file: ./secrets/qbit_pass
