[package]
name = "beefy-waker"
version = "2.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "signal"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
