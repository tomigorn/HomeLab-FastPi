<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Jellyfin</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3}
  .card{text-align:center;max-width:30rem;padding:2rem}
  .spin{width:3.5rem;height:3.5rem;margin:0 auto 1.5rem;border:4px solid #30363d;
        border-top-color:#58a6ff;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:1.4rem;margin:.4rem 0}
  p{color:#8b949e;margin:.3rem 0}
__WAITCSS__  .ver{margin-top:1.4rem;color:#484f58;font-size:.75rem}
</style></head>
<body><div class="card">
  <div class="spin"></div>
  <h1 id="title">Starting Jellyfin&hellip;</h1>
  <div class="count" id="count">0:00</div>
  <div id="usualbox">
  <p id="usual">Usually ready after about __COUNTDOWN__ s</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="longer" hidden>Taking longer than usual, still trying&hellip;</p>
  </div>
  <p id="sub">The media server is booting. You will be taken to Jellyfin automatically.</p>
  <p id="togo" hidden></p>
  <a id="retry" href="__BASE__" hidden>Try again</a>
  <div class="ver">v__VERSION__</div>
<script>
const BASE = '__BASE__';
__WAITJS__const RETRY_TITLE = "Taking longer than it should";
const RETRY_TEXT = "The server didn't start normally, so it is being restarted the hard way (power off and on). Trying once more\u2026";
const BROKEN_TITLE = "The server can't be started right now";
const BROKEN_TEXT = "Something seems to be broken, or maintenance work is going on. The admin has been notified. Please try again later.";
const WAKING_TITLE = 'Starting Jellyfin\u2026';
const WAKING_TEXT = 'The media server is booting. You will be taken to Jellyfin automatically.';
let waited = 0;
let broken = false;
const titleEl = document.getElementById('title');
const countEl = document.getElementById('count');
const subEl = document.getElementById('sub');
const togoEl = document.getElementById('togo');
const usualEl = document.getElementById('usualbox');
const spinEl = document.querySelector('.spin');
function tick(){
  if(broken) return;
  waited += 1;
  showWait(waited);
}
function apply(st){
  const ph = st.phase || 'waking';
  const retry = (ph === 'power_cycle' || ph === 'retrying');
  broken = (ph === 'broken');
  spinEl.style.display = broken ? 'none' : '';
  document.getElementById('retry').hidden = !broken;
  countEl.hidden = broken;
  usualEl.hidden = broken || retry;
  togoEl.hidden = !(retry && typeof st.seconds_left === 'number');
  if(typeof st.waited_seconds === 'number'){ waited = st.waited_seconds; showWait(waited); }
  if(broken){
    titleEl.textContent = BROKEN_TITLE; subEl.textContent = BROKEN_TEXT;
  } else if(retry){
    titleEl.textContent = RETRY_TITLE; subEl.textContent = RETRY_TEXT;
    if(!togoEl.hidden) togoEl.textContent = 'About ' + st.seconds_left + ' s to go.';
  } else {
    titleEl.textContent = WAKING_TITLE; subEl.textContent = WAKING_TEXT;
  }
}
// null = unknown (network error, expired login redirect): keep the current view
async function status(){
  try{
    const r = await fetch(BASE + 'status', {cache:'no-store', redirect:'manual'});
    if(!r.ok) return null;
    return await r.json();
  }
  catch(e){ return null; }
}
async function poll(){
  const st = await status();
  if(st && st.up){
    titleEl.textContent = 'Jellyfin is ready';
    location.replace('/web/');
    return;
  }
  if(st) apply(st);
  setTimeout(poll, 2000);
}
(async () => {
  const st0 = await status();
  if(st0 && st0.up){ location.replace('/web/'); return; }
  if(st0) apply(st0);
  fetch(BASE + 'wake', {method:'POST', headers:{'X-Wake': '1'}})
    .then(status).then(st => { if(st && !st.up) apply(st); }).catch(()=>{});
  setInterval(tick, 1000);
  setTimeout(poll, 2000);
})();
</script>
</div></body></html>
