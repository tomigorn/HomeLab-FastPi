# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Beefy-Waker #############################################
# #########################################################
  waker:
    build: .                       # python:3.13-alpine + openssh-client (see Dockerfile)
    image: beefy-waker:local
    container_name: beefy-waker
    restart: unless-stopped
    # Host network so the magic packet can be broadcast onto the LAN
    # and so Traefik can reach the gate at <fastpi-ip>:${WAKER_LISTEN_PORT}.
    network_mode: host
    env_file: .env
    volumes:
      - ./app/waker.py:/app/waker.py:ro
      # read-only forced-command key (journalctl --list-boots only) for /history
      - ./secrets/beefy-history:/key:ro
      - ./secrets/known_hosts:/known_hosts:ro
    command: ["python", "/app/waker.py"]
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true

# =========================================================
# Networks ================================================
# =========================================================
# (none — uses host networking)

# =========================================================
# Volumes =================================================
# =========================================================
# (none — app is a single bind-mounted script)
