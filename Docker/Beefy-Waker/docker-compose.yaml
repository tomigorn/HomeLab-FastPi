# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Beefy-Waker #############################################
# #########################################################
  waker:
    build: .                       # Rust, static binary in a scratch image (see Dockerfile); legacy Python: app/
    image: beefy-waker:local
    container_name: beefy-waker
    restart: unless-stopped
    # Host network so the magic packet can be broadcast onto the LAN
    # and so Traefik can reach the gate at <fastpi-ip>:${WAKER_LISTEN_PORT}.
    network_mode: host
    env_file: .env
    volumes:
      - ./app/VERSION:/app/VERSION:ro        # app version shown in the page footer
      - /etc/localtime:/etc/localtime:ro      # local time in alert labels, like Home Assistant
      # read-only forced-command key (journalctl --list-boots only) for /history; host key pinned in known_hosts
      - ./secrets/beefy-history:/key:ro
      - ./secrets/known_hosts:/known_hosts:ro
      # node-exporter textfile dir: wake recovery metrics (beefy_wake.prom)
      - /var/lib/node-exporter/textfile:/textfile
      # Jellyfin /System/Info/Public cache (PUBLIC_INFO_CACHE=/tmp/public-info.json), kept across restarts and recreates
      - cache:/tmp
    # Liveness probe for observability (docker ps shows healthy/unhealthy). NOTE:
    # plain compose does NOT auto-restart on unhealthy — restart:unless-stopped only
    # catches crashes/OOM. /status answers whenever the gate loop is alive.
    healthcheck:
      test: ["CMD", "/beefy-waker", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Non-root + no capabilities: it binds :9001 (>1024), sends a broadcast UDP
    # packet (SO_BROADCAST is unprivileged), reads the mounted key and speaks SSH itself.
    user: "65005:65005"      # dedicated uid (not pi's 1000); secrets chowned to match; host-output-guard lets this uid reach beefy
    group_add: ["65046"]     # textfile dir group (setgid), so the metrics file can be written
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 32m           # RSS ~3 MB
    cpus: 0.5
    pids_limit: 32
    security_opt:
      - no-new-privileges:true

# =========================================================
# Networks ================================================
# =========================================================
# (none — uses host networking)

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  cache:
