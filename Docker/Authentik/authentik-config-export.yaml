- attrs:
    expression: "# Some implementations require givenName and familyName to be set\n\
      givenName, familyName = request.user.name, \" \"\nformatted = request.user.name\
      \ + \" \"\n# This default sets givenName to the name before the first space\n\
      # and the remainder as family name\n# if the user's name has no space the givenName\
      \ is the entire name\n# (this might cause issues with some SCIM implementations)\n\
      if \" \" in request.user.name:\n    givenName, _, familyName = request.user.name.partition(\"\
      \ \")\n    formatted = request.user.name\n\n# photos supports URLs to images,\
      \ however authentik might return data URIs\navatar = request.user.avatar\nphotos\
      \ = None\nif \"://\" in avatar:\n    photos = [{\"value\": avatar, \"type\"\
      : \"photo\"}]\n\nlocale = request.user.locale()\nif locale == \"\":\n    locale\
      \ = None\n\nemails = []\nif request.user.email != \"\":\n    emails = [{\n \
      \       \"value\": request.user.email,\n        \"type\": \"other\",\n     \
      \   \"primary\": True,\n    }]\nreturn {\n    \"userName\": request.user.username,\n\
      \    \"name\": {\n        \"formatted\": formatted,\n        \"givenName\":\
      \ givenName,\n        \"familyName\": familyName,\n    },\n    \"displayName\"\
      : request.user.name,\n    \"photos\": photos,\n    \"locale\": locale,\n   \
      \ \"active\": request.user.is_active,\n    \"emails\": emails,\n}"
