# yaml-language-server: $schema=./blueprint.schema.json
# Nextcloud SSO via OIDC.
#
# EDITOR NOTE - the modeline above points at a LOCAL permissive schema, not
# authentik's published one. Both alternatives are worse:
#
# authentik publishes a blueprint schema at
# https://goauthentik.io/blueprints/schema.json, and pinning it does fix the
# nonsense an editor otherwise invents by auto-matching an unrelated schema from
# SchemaStore ("Property entries is not allowed", "Missing property
# spec_version"). But that schema describes the RESOLVED API shape, not the
# authoring shape: authorization_flow is typed {"type":"string","format":"uuid"}
# with no alternative, and the file contains 0 occurrences of Find, KeyOf, Env or
# Enumerate. So every !Find / !KeyOf line below is reported as "Incorrect type.
# Expected string" - guaranteed false errors on exactly the lines that make a
# blueprint a blueprint. Verified against the 2026.5.2 schema on 2026-08-16.
#
# And dropping the modeline entirely does NOT help: the editor simply falls back
# to auto-matching the wrong SchemaStore entry again. Verified both ways.
#
# So blueprint.schema.json checks only the outer envelope (version / entries /
# per-entry model) and leaves entry contents unconstrained, which blocks the
# auto-match without touching the tagged lines. The tags themselves need
# yaml.customTags in ~/.vscode/settings.json - that is an editor setting with no
# per-file equivalent.
#
# None of this validates a blueprint properly. Do that with authentik itself:
#   docker cp blueprints/nextcloud-oidc.yaml authentik-server:/blueprints/
#   docker exec -i authentik-server ak apply_blueprint nextcloud-oidc.yaml
# Applying is idempotent - re-running after an edit is safe.
#
# ACCESS CONTROL lives in the two policybinding entries at the bottom of this
# file. Remove them and every Authentik user gets Nextcloud.
#
# client_id / client_secret are deliberately NOT stored here. Authentik
# generates them on first apply; read them back with the ak shell snippet in
# docs/superpowers/plans/2026-08-16-nextcloud-authentik-oidc.md and enter them
# in Nextcloud. That keeps this file secret-free and committable, matching
# export-config.sh.
#
# NOTE: scope mappings are looked up by NAME, not scope_name. There are two
# mappings with scope_name "email" (the authentik default plus the custom
# "audiobookshelf email (verified)"), so a scope_name lookup is ambiguous.
version: 1
metadata:
  name: nextcloud-oidc
  labels:
    blueprints.goauthentik.io/description: Nextcloud OIDC provider, cloud-users / cloud-admins groups and access gate

entries:
  # -------------------------------------------------------------------------
  # Groups
  # -------------------------------------------------------------------------
  # Membership of cloud-users grants access to Nextcloud at all.
  - model: authentik_core.group
    id: cloud-users-group
    identifiers:
      name: cloud-users
    attrs:
      is_superuser: false

  # Membership of cloud-admins additionally grants Nextcloud administrator
  # rights, via the "admin" entry the scope mapping below adds to the groups
  # claim. is_superuser stays false: that flag is about Authentik itself, not
  # Nextcloud, and setting it would hand out authentik admin by accident.
  - model: authentik_core.group
    id: cloud-admins-group
    identifiers:
      name: cloud-admins
    attrs:
      is_superuser: false

  # -------------------------------------------------------------------------
  # Scope mapping - emits the groups claim Nextcloud provisions from
  # -------------------------------------------------------------------------
  # Only Nextcloud-relevant groups are emitted. Sending every authentik group
  # would make Nextcloud provision noise like "streaming-users" and
  # "authentik Admins" as Nextcloud groups.
  #
  # "admin" is hard-coded in Nextcloud as its administrator group and cannot be
  # renamed, so cloud-admins members must receive literally that string.
  - model: authentik_providers_oauth2.scopemapping
    id: nextcloud-scope
    identifiers:
      name: Nextcloud Profile
    attrs:
      scope_name: nextcloud
      description: Nextcloud display name and group membership
      expression: |
        groups = []
        if request.user.ak_groups.filter(name="cloud-users").exists():
            groups.append("cloud-users")
        if request.user.ak_groups.filter(name="cloud-admins").exists():
            groups.append("cloud-admins")
            # Nextcloud's built-in administrator group. Hard-coded upstream.
            groups.append("admin")
        return {
            "name": request.user.name,
            "groups": groups,
        }

  # -------------------------------------------------------------------------
  # OIDC provider
  # -------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: nextcloud-provider
    identifiers:
      name: Nextcloud
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      sub_mode: user_uuid
      include_claims_in_id_token: true
      # REQUIRED. Creating a provider through the UI wizard fills these in for
      # you; creating one through a blueprint does NOT - the field defaults to
      # an empty list. With no grant types, authentik rejects every single
      # authorization request with "invalid_request / The request is otherwise
      # malformed", including a minimal scope=openid one, and Nextcloud shows
      # "Access forbidden - The identity provider failed to authenticate the
      # user". Diagnosed 2026-08-16 by diffing against the working
      # audiobookshelf provider, which had grants and this one had [].
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://cloud.holy-grail.ch/apps/user_oidc/code
        - matching_mode: strict
          url: https://cloud.holy-grail.ch
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !KeyOf nextcloud-scope

  # -------------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------------
  # policy_engine_mode "any" is required: a user in cloud-admins but not
  # cloud-users must still pass. With "all" they would be refused.
  - model: authentik_core.application
    id: nextcloud-app
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      provider: !KeyOf nextcloud-provider
      meta_launch_url: https://cloud.holy-grail.ch
      policy_engine_mode: any

  # -------------------------------------------------------------------------
  # THE ACCESS GATE
  # -------------------------------------------------------------------------
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf nextcloud-app
      group: !KeyOf cloud-users-group
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf nextcloud-app
      group: !KeyOf cloud-admins-group
      order: 1
    attrs:
      enabled: true
