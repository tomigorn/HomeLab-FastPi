# yaml-language-server: $schema=./blueprint.schema.json
#
# Enrollment interstitial - warn before the invitation is consumed.
#
# WHY THIS EXISTS
# authentik's InvitationStageView.dispatch() deletes a single_use invitation the
# moment the stage is REACHED. There is no consume-on-completion option: the same
# stage both validates and consumes. So whatever stage sits first decides when the
# link dies.
#
# With the invitation stage first (order 5), a bare GET of the invite link burned
# it - a mail-client link prefetcher, a URL/malware scanner or an accidental
# reload was enough, and the recipient then saw "Invalid invite/invite not found".
#
# This blueprint puts a static, display-only prompt stage at order 1, BEFORE the
# invitation stage. A GET only renders the warning; the invitation is not touched
# until the person presses Continue, which is a POST. That keeps the gate ahead of
# the signup form (so the form stays invite-only and the password policy is not
# reachable by strangers) and keeps invite.fixed_data prefill working, because the
# invitation stage still runs before the credentials prompt.
#
# Apply with:
#   docker cp blueprints/enrollment-invite-warning.yaml \
#     authentik-server:/blueprints/enrollment-invite-warning.yaml
#   docker exec -i authentik-server ak apply_blueprint enrollment-invite-warning.yaml
#
# Resulting stage order: 1 warning -> 5 invitation -> 10 prompt -> 20 user-write
#                        -> 30 email verify -> 40 TOTP -> 100 login
version: 1
metadata:
  name: enrollment-invite-warning
  labels:
    blueprints.goauthentik.io/description: |
      One-time-link warning shown before the invitation stage consumes the invite.

entries:
  # ---------------------------------------------------------------------------
  # Prompts (display-only: no field_key of these is ever written to the user)
  # ---------------------------------------------------------------------------
  - model: authentik_stages_prompt.prompt
    id: prompt-invite-warning
    identifiers:
      # Prompt.name is unique; Prompt.field_key is NOT. The importer matches with
      # .filter(query).first(), so identifying by field_key would silently bind to
      # an arbitrary row if another prompt ever reused the key - and if the key
      # were edited in the UI, the import would instead try to create a second
      # prompt with this same (unique) name and fail.
      name: enrollment-invite-one-time-warning
    attrs:
      field_key: invite_one_time_warning
      # Explicitly blank. Blueprint attrs only SET what they name - they do not
      # clear what they omit, so an earlier revision's sub_text survived a
      # re-apply and rendered the checklist a second time as helper text.
      placeholder: ""
      sub_text: ""
      type: alert_warning
      required: false
      order: 0
      # RENDERING, the short version: for alert_* and static prompts the frontend
      # renders `label` as the alert title and `initial_value` as the body (as
      # HTML). `placeholder` is NEVER rendered for these types - it is only used
      # for real input fields. An earlier version of this file put the text in
      # `placeholder`, which produced an alert box containing nothing but a
      # heading. Keep body copy in initial_value.
      label: One-time invitation link
      # Resolved at render time so the reader sees the real deadline. The
      # invitation stage has not run yet at order 1, so plan context has no
      # invitation object - the token is read straight out of the saved flow GET
      # args (SESSION_KEY_GET = "authentik/flows/get").
      #
      # Everything is wrapped in try/except on purpose. get_initial_value() falls
      # back to `self.initial_value` when the expression raises, which would print
      # this Python source into the alert box for the visitor to read. The
      # expression must therefore never raise: an absent, malformed (ValidationError
      # from a non-UUID pk) or already-consumed token all fall through to the
      # generic wording.
      #
      # Not a disclosure risk: the page is only meaningful to someone already
      # holding the link, the token is a 122-bit UUID4, and an expiry date tells
      # an attacker nothing they could act on.
      initial_value_expression: true
      initial_value: |
        warning = (
            "<p>This link works <strong>only once</strong>. It is used up the moment "
            "you press Continue - even if you do not finish creating your account.</p>"
        )
        tail = (
            "<p>Not ready yet? Just close this page - nothing is used up until you "
            "press Continue, and you can come back to this link later.</p>"
        )
        try:
            from zoneinfo import ZoneInfo

            from authentik.stages.invitation.models import Invitation

            token = (http_request.session.get("authentik/flows/get", {}) or {}).get("itoken")
            invite = Invitation.objects.filter(pk=token).first() if token else None
            if invite and invite.expires:
                try:
                    when = invite.expires.astimezone(ZoneInfo("Europe/Zurich"))
                except Exception:
                    when = invite.expires
                tail = (
                    "<p>Not ready yet? Just close this page - nothing is used up "
                    "until you press Continue. This invitation stays valid until "
                    "<strong>" + when.strftime("%A %d %B %Y, %H:%M %Z") + "</strong>.</p>"
                )
        except Exception:
            pass
        return warning + tail

  - model: authentik_stages_prompt.prompt
    id: prompt-invite-checklist
    identifiers:
      name: enrollment-invite-checklist
    attrs:
      field_key: invite_checklist
      placeholder: ""
      sub_text: ""
      # alert_info, NOT static, on purpose. The static branch renders
      # `<p>${initial_value}</p>`, so a <ul> inside it is invalid HTML: the
      # browser hoists the list out of the paragraph and it loses PatternFly's
      # list styling, which is why the bullets disappeared. An alert renders its
      # body inside a `pf-c-content` div, where <ul>/<li> are styled correctly.
      type: alert_info
      required: false
      order: 10
      label: Before you press Continue, have these ready
      initial_value: >-
        <ul>
        <li><strong>A username</strong> - your login name, lowercase, no spaces.</li>
        <li><strong>An email address you can open right now</strong> - we send a
        confirmation link and you must click it to activate the account.</li>
        <li><strong>A password of at least 15 characters</strong> - checked
        against known breached passwords and rejected if weak or reused. A
        passphrase of a few unrelated words works well.</li>
        <li><strong>An authenticator app on your phone</strong> - Aegis, Google
        Authenticator, 1Password or similar. Two-factor is mandatory and you set
        it up now, not afterwards.</li>
        </ul>
        <p>It takes about two minutes, in one sitting.</p>

  # ---------------------------------------------------------------------------
  # The interstitial stage itself
  # ---------------------------------------------------------------------------
  - model: authentik_stages_prompt.promptstage
    id: stage-invite-warning
    identifiers:
      name: enrollment-invite-warning
    attrs:
      fields:
        - !KeyOf prompt-invite-warning
        - !KeyOf prompt-invite-checklist

  # ---------------------------------------------------------------------------
  # Bindings. Order 1 puts the warning ahead of the invitation stage; the second
  # entry restores the invitation stage to order 5 (it was temporarily moved to
  # 15 on 2026-09-25 while trialling consume-on-submit).
  # ---------------------------------------------------------------------------
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, enrollment]]
      stage: !KeyOf stage-invite-warning
    attrs:
      order: 1
      evaluate_on_plan: true
      re_evaluate_policies: false

  # The invitation stage's own order-5 binding is deliberately NOT declared here.
  # It is part of the base enrollment flow (captured in authentik-config-export.yaml),
  # and re-asserting it from this blueprint was fragile: FlowStageBinding's
  # unique_together is (target, stage, order), so identifiers of (target, stage)
  # alone are not unique, and the !Find on the stage name resolves to null if that
  # stage is ever renamed - which fails the import on a NOT NULL violation.
