# yaml-language-server: $schema=./blueprint.schema.json
#
# Two things that make invited accounts actually usable, and visible:
#
# 1. DEFAULT GROUP. The enrollment user-write stage had create_users_group unset,
#    so a newly invited person finished sign-up - password, email verification,
#    TOTP - and landed in NO groups at all. Audiobookshelf refuses them (needs
#    streaming-users) and Nextcloud refuses them (needs cloud-users), so they saw
#    a working login with nothing behind it and no error explaining why. They now
#    get `streaming-users`, and only that; anything more is granted by hand.
#
# 2. ADMIN NOTIFICATION. An EventMatcherPolicy on model_created for
#    authentik_core.user, bound to a NotificationRule that mails the members of
#    `authentik Admins` through the existing Brevo email transport.
#
#    Timing to be aware of: this fires when the account row is CREATED, which is
#    the user-write stage - BEFORE email verification and TOTP enrolment. So the
#    mail means "somebody redeemed an invite and submitted the form", not "they
#    finished". That is deliberate: it is the earliest reliable signal, and an
#    account that never completes is itself worth seeing, because it leaves an
#    inactive user behind. It also fires for accounts an admin creates by hand.
#
# Apply with:
#   docker cp blueprints/enrollment-defaults-and-notify.yaml \
#     authentik-server:/blueprints/enrollment-defaults-and-notify.yaml
#   docker exec -i authentik-server ak apply_blueprint enrollment-defaults-and-notify.yaml
version: 1
metadata:
  name: enrollment-defaults-and-notify
  labels:
    blueprints.goauthentik.io/description: |
      Default group for invited users + admin email when an account is created.

entries:
  # ---------------------------------------------------------------------------
  # 1. Invited users land in streaming-users, and nothing else
  # ---------------------------------------------------------------------------
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: invitation-enrollment-user-write-enrollment
    attrs:
      create_users_group:
        !Find [authentik_core.group, [name, streaming-users]]

  # ---------------------------------------------------------------------------
  # 2. Match "a user object was created"
  # ---------------------------------------------------------------------------
  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: policy-user-created
    identifiers:
      name: enrollment-user-created
    attrs:
      # `user_write` rather than `model_created`, because model_created carries the
      # created object only in context["model"], a DICT - and send_email() copies
      # string values into the template context, so the name/username never reach
      # the email. user_write puts name, username and email in the context as
      # plain strings, which is what the template needs.
      #
      # Trade-off, deliberate: user_write fires from flow stages, so this notifies
      # on self-service enrolment but NOT on an account created by an admin in the
      # UI (that emits model_created only). Acceptable - an admin creating an
      # account already knows they did it.
      action: user_write
      # `app` MUST stay null. It looks like a model app-label and the API even
      # offers "authentik.core" as a choice, but passes_app() compares it against
      # Event.app, the SOURCE MODULE PATH of whatever emitted the event. Setting it
      # matches nothing and the rule silently never fires, with no error to notice.
      app: null
      model: null

  # user_write also fires on password changes and profile edits. Only a creation
  # sets context["created"] = True, and that is a bool so an EventMatcherPolicy
  # cannot test it - hence this expression alongside, with the rule in "all" mode.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-created-flag
    identifiers:
      name: enrollment-user-write-is-creation
    attrs:
      expression: |
        event = request.context.get("event")
        if not event:
            return False
        return event.context.get("created") is True

  # Dedicated transport so the stock one is left alone for other notifications.
  #
  # The stock email/event_notification.html titles the mail with the raw event
  # action ("model_created") and dumps the event context as a Python dict - you
  # cannot tell from it that somebody signed up. `email/new_account.html` lives
  # in ./custom-templates (bind-mounted at /templates, so it survives a recreate,
  # unlike this blueprints/ directory) and renders the username and email plainly.
  #
  # The SUBJECT still ends in "model_created" and that cannot be fixed here:
  # send_email() builds it as `email_subject_prefix + event.action` with no way to
  # override the second half. Note also that a TRAILING SPACE in the prefix does
  # not survive - DRF's CharField trims whitespace on save - so the prefix has to
  # read correctly with the action jammed straight onto its end.
  - model: authentik_events.notificationtransport
    id: transport-new-account
    identifiers:
      name: new-account-email-transport
    attrs:
      mode: email
      email_template: email/new_account.html
      email_subject_prefix: "New account on holy-grail.ch ·"
      send_once: false

  - model: authentik_events.notificationrule
    id: rule-user-created
    identifiers:
      name: notify-admins-user-created
    attrs:
      severity: notice
      # BOTH policies must pass: the action matcher AND the created-flag check,
      # i.e. policy_engine_mode = "all". The default is "any", which would fire on
      # every user_write including password changes.
      #
      # policy_engine_mode CANNOT be set from here: it is absent from
      # NotificationRuleSerializer.Meta.fields, so the API and the blueprint
      # importer both accept and silently DISCARD it. Set it directly:
      #
      #   docker exec -i authentik-server ak shell -c "
      #   from authentik.events.models import NotificationRule
      #   r=NotificationRule.objects.get(name='notify-admins-user-created')
      #   r.policy_engine_mode='all'; r.save()"
      #
      # Re-applying this blueprint will not revert it, precisely because the field
      # is not serialised - but a rule recreated from scratch will default to "any".
      destination_group:
        !Find [authentik_core.group, [name, authentik Admins]]
      transports:
        - !KeyOf transport-new-account

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rule-user-created
      policy: !KeyOf policy-user-created
    attrs:
      order: 0
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rule-user-created
      policy: !KeyOf policy-created-flag
    attrs:
      order: 1
      enabled: true
