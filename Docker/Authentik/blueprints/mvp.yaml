version: 1
metadata:
  name: "MVP - SSO apps (Portainer + Audiobookshelf)"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context:
  abs_client_id: !Env [ABS_OIDC_CLIENT_ID, audiobookshelf]
  abs_client_secret: !Env ABS_OIDC_CLIENT_SECRET
  portainer_client_id: !Env [PORTAINER_OIDC_CLIENT_ID, portainer]
  portainer_client_secret: !Env PORTAINER_OIDC_CLIENT_SECRET
entries:
  # ---- Groups ----
  - model: authentik_core.group
    id: group-admin
    identifiers:
      name: super-admin
    attrs:
      name: super-admin
  - model: authentik_core.group
    id: group-streaming
    identifiers:
      name: streaming
    attrs:
      name: streaming

  # ---- Custom scope mapping: ABS role via group claim ----
  - model: authentik_providers_oauth2.scopemapping
    id: abs-groups
    identifiers:
      name: "ABS groups (role claim)"
      scope_name: groups
    attrs:
      name: "ABS groups (role claim)"
      scope_name: groups
      description: "Emits admin/user for Audiobookshelf role mapping"
      expression: |
        if ak_is_group_member(user, name="super-admin"):
            return {"groups": ["admin"]}
        return {"groups": ["user"]}

  # ---- Audiobookshelf provider + application ----
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-abs
    identifiers:
      name: Audiobookshelf
    attrs:
      name: Audiobookshelf
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Context abs_client_id
      client_secret: !Context abs_client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: "https://audiobookshelf.holy-grail.ch/auth/openid/callback"
        - matching_mode: strict
          url: "https://audiobookshelf.holy-grail.ch/auth/openid/mobile-redirect"
        # ABS instance uses a /audiobookshelf base-path prefix on its callback:
        - matching_mode: strict
          url: "https://audiobookshelf.holy-grail.ch/audiobookshelf/auth/openid/callback"
        - matching_mode: strict
          url: "https://audiobookshelf.holy-grail.ch/audiobookshelf/auth/openid/mobile-redirect"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !KeyOf abs-groups
  - model: authentik_core.application
    id: app-abs
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      slug: audiobookshelf
      provider: !KeyOf provider-abs
      meta_launch_url: "https://audiobookshelf.holy-grail.ch"

  # ---- Portainer provider + application ----
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-portainer
    identifiers:
      name: Portainer
    attrs:
      name: Portainer
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Context portainer_client_id
      client_secret: !Context portainer_client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: "https://portainer.fastpi.homelab"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
  - model: authentik_core.application
    id: app-portainer
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      slug: portainer
      provider: !KeyOf provider-portainer
      meta_launch_url: "https://portainer.fastpi.homelab"

  # ---- Access bindings (which group reaches which app) ----
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-portainer
      group: !KeyOf group-admin
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-abs
      group: !KeyOf group-admin
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-abs
      group: !KeyOf group-streaming
      order: 1
    attrs:
      enabled: true
