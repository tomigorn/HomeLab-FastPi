# yaml-language-server: $schema=./blueprint.schema.json
#
# Audiobookshelf roles, driven by authentik groups.
#
# Audiobookshelf derives a user's role from an OIDC group claim, but it matches
# the LITERAL strings "admin", "user" or "guest" (lowercased) inside the claim
# array - see setUserGroup() in server/auth/OidcAuthStrategy.js. Anything else is
# not a downgrade, it is a HARD FAILURE:
#
#     throw new Error(`No valid group found in userinfo: ...`)
#
# i.e. the login is denied. That is upstream issue #3659 (the "auth loop"). So the
# mapping below ALWAYS emits a non-empty list: admins get ["admin"], everyone else
# gets ["user"]. Never return [].
#
# WHY THIS REPLACES THE DEFAULT PROFILE MAPPING RATHER THAN JOINING IT
# authentik's default "OpenID 'profile'" mapping already emits a groups claim
# containing every authentik group's display name - 'authentik Admins',
# 'streaming-users' and so on. None of those equal "admin", so with that mapping
# in place, switching on authOpenIDGroupClaim denies EVERY login. Two mappings
# emitting the same claim name is also the fragility recorded as known issue #2 in
# README.md for Nextcloud. One mapping owns the claim; the default is removed from
# this provider's property_mappings below.
#
# The scope_name is deliberately "profile", because Audiobookshelf requests
# `openid profile email` and cannot be told to ask for a custom scope.
#
# Audiobookshelf reads these exact fields (models/User.js
# createUserFromOpenIdUserInfo): preferred_username || name || sub for the
# username, and email + email_verified for the address - the latter still comes
# from the separate "audiobookshelf email (verified)" mapping, which stays.
#
# Apply with:
#   docker cp blueprints/audiobookshelf-oidc.yaml authentik-server:/blueprints/
#   docker exec -i authentik-server ak apply_blueprint audiobookshelf-oidc.yaml
#
# THEN, and only after verifying the claim renders correctly, set
# authOpenIDGroupClaim = "groups" in Audiobookshelf. Keep local password auth
# enabled until that is proven - it is the way back in if the claim is wrong.
version: 1
metadata:
  name: audiobookshelf-oidc-roles
  labels:
    blueprints.goauthentik.io/description: |
      streaming-admins group + the profile/groups scope mapping Audiobookshelf needs.

entries:
  - model: authentik_core.group
    id: group-streaming-users
    identifiers:
      name: streaming-users
    attrs:
      is_superuser: false

  # streaming-admins is nested INSIDE streaming-users: streaming-users is listed
  # as its PARENT. Direction matters and is easy to invert.
  #
  # authentik resolves membership UPWARDS - User.all_groups() is
  # `self.groups.all().with_ancestors()` - so a member of a child group is also a
  # member of every ancestor. Admins therefore inherit streaming-users
  # automatically, and nobody has to remember to add them to both.
  #
  # The reverse (streaming-users.parent = streaming-admins) would make every
  # ordinary listener inherit ADMIN. Do not swap these.
  - model: authentik_core.group
    id: group-streaming-admins
    identifiers:
      name: streaming-admins
    attrs:
      is_superuser: false
      # NOTE: the field is `parents` (plural, many-to-many) - authentik models the
      # hierarchy as a DAG, so a group can have several parents. Writing `parent:`
      # is accepted by the importer and SILENTLY IGNORED, leaving no nesting at
      # all; check `Group.parents` after applying rather than trusting a clean run.
      parents:
        - !KeyOf group-streaming-users

  - model: authentik_providers_oauth2.scopemapping
    id: mapping-abs-profile
    identifiers:
      name: Audiobookshelf Profile
    attrs:
      scope_name: profile
      description: Audiobookshelf username and role (admin/user)
      expression: |
        # Audiobookshelf matches the literal strings admin/user/guest.
        # Never return an empty list - that is a denied login, not a downgrade.
        if request.user.groups.filter(name="streaming-admins").exists():
            groups = ["admin"]
        else:
            groups = ["user"]
        return {
            "preferred_username": request.user.username,
            "name": request.user.name,
            "groups": groups,
        }

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: audiobookshelf
    attrs:
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "audiobookshelf email (verified)"]]
        - !KeyOf mapping-abs-profile

  # Application access gate. Previously this accepted only streaming-users, so an
  # account in streaming-admins alone was refused by authentik before
  # Audiobookshelf ever saw it ("Policy binding ... returned result 'False'").
  # Being an admin must imply access - otherwise every admin has to be in BOTH
  # groups and someone will eventually forget.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-abs-access
    identifiers:
      name: audiobookshelf-access
    attrs:
      expression: |
        # ak_is_group_member uses user.all_groups(), which includes ancestors, so
        # the streaming-users check alone already covers admins via the group
        # nesting above. The explicit streaming-admins check is a deliberate
        # backstop: if the parent link is ever removed, admins keep access rather
        # than being locked out silently.
        if ak_is_group_member(request.user, name="streaming-users"):
            return True
        if ak_is_group_member(request.user, name="streaming-admins"):
            return True
        ak_message("You don't have access to this application. Please contact the administrator to request access.")
        return False
