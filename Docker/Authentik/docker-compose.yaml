# =========================================================
# Services ================================================
# =========================================================
# Based on the official authentik docker-compose
# (https://goauthentik.io/docker-compose.yml), adapted for this homelab:
#   - explicit container_name for Traefik file-provider routing
#   - authentik_internal + external traefik_proxy networks
#   - no published host ports (ingress is handled by Traefik)
# Non-secret AUTHENTIK_* / PG_* config is read from .env via env_file. Secrets are files in
# secrets/ (compose secrets, read via POSTGRES_PASSWORD_FILE and Authentik's file:// values).
services:
# #########################################################
# PostgreSQL ##############################################
# #########################################################
  postgresql:
    image: docker.io/library/postgres:18.6-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    # Start directly as the image's postgres uid (PGDATA is owned by 70), so the
    # entrypoint never runs as root and needs no capabilities.
    user: "70:70"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pass
    secrets:
      - pg_pass   # 70:65019 0440, read by postgres and authentik
    volumes:
      # PG18 keeps data under /var/lib/postgresql/18/docker and wants the volume at
      # /var/lib/postgresql. The PG16 volume "database" is kept untouched for rollback.
      - database-pg18:/var/lib/postgresql
    networks:
      - authentik_internal

# #########################################################
# Authentik Server ########################################
# #########################################################
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?set AUTHENTIK_TAG in .env}
    container_name: authentik-server
    restart: unless-stopped
    user: "65019:65019"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server
    shm_size: 512mb
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/pg_pass
      AUTHENTIK_SECRET_KEY: file:///run/secrets/secret_key
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/email_password
    secrets:
      - pg_pass
      - secret_key
      - email_password
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      # Rebrands the logo in EVERY email. logo_data() (stages/email/utils.py)
      # reads web/icons/icon_left_brand.png relative to CWD (/), falling back to
      # the bundled authentik PNG when that path is absent - and tasks.py attaches
      # it to every message as cid:logo. No Brand setting reaches it; this mount is
      # the only way. It is lru_cached, so a restart is required after changing it.
      - /home/pi/Projects/HolyGrail-Branding/icons/android-chrome-192x192.png:/web/icons/icon_left_brand.png:ro
      # The central icon store, mounted at the SAME absolute path it has on the
      # host. That is deliberate: data/media/public holds SYMLINKS into this store,
      # and a symlink is resolved in the CONTAINER's namespace - so the target path
      # has to be valid both outside and inside, or it dangles in one of them.
      - /home/pi/Projects/HolyGrail-Branding/icons:/home/pi/Projects/HolyGrail-Branding/icons:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - authentik_internal
      - traefik_proxy

# #########################################################
# Authentik Worker ########################################
# #########################################################
  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?set AUTHENTIK_TAG in .env}
    container_name: authentik-worker
    restart: unless-stopped
    user: "65019:65019"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: worker
    shm_size: 512mb
    # `user: root` was REMOVED (2026-09-26). Upstream's vanilla compose sets it
    # solely so the worker can reach /var/run/docker.sock; with that mount gone
    # there is nothing left that needs root. /data and /certs are owned by the
    # authentik user (1000) and /templates is only ever read.
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/pg_pass
      AUTHENTIK_SECRET_KEY: file:///run/secrets/secret_key
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/email_password
    secrets:
      - pg_pass
      - secret_key
      - email_password
    volumes:
      # /var/run/docker.sock was REMOVED (2026-09-26). The worker ran as root with
      # the Docker socket mounted, which is host root: a compromise of it owned the
      # whole machine, every other container and every secret on it.
      #
      # It is only needed to orchestrate Docker/Kubernetes OUTPOSTS. This install
      # has exactly one outpost, the Embedded one, which runs inside the server
      # process: service_connection is None and it serves 0 providers. Verified
      # before removing. If a containerised outpost is ever added, use a
      # docker-socket-proxy rather than mounting the raw socket.
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      # The WORKER is what actually sends mail - see the note on the server service.
      - /home/pi/Projects/HolyGrail-Branding/icons/android-chrome-192x192.png:/web/icons/icon_left_brand.png:ro
      # The central icon store, mounted at the SAME absolute path it has on the
      # host. That is deliberate: data/media/public holds SYMLINKS into this store,
      # and a symlink is resolved in the CONTAINER's namespace - so the target path
      # has to be valid both outside and inside, or it dangles in one of them.
      - /home/pi/Projects/HolyGrail-Branding/icons:/home/pi/Projects/HolyGrail-Branding/icons:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - authentik_internal

# =========================================================
# Secrets =================================================
# =========================================================
secrets:
  pg_pass:
    file: ./secrets/pg_pass
  secret_key:
    file: ./secrets/secret_key
  email_password:
    file: ./secrets/email_password

# =========================================================
# Networks ================================================
# =========================================================
networks:
  authentik_internal:
    driver: bridge
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  database:
    driver: local
  database-pg18:
    driver: local
