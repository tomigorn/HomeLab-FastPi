# =========================================================
# Services ================================================
# =========================================================
# Based on the official authentik docker-compose
# (https://goauthentik.io/docker-compose.yml), adapted for this homelab:
#   - explicit container_name for Traefik file-provider routing
#   - authentik_internal + external traefik_proxy networks
#   - no published host ports (ingress is handled by Traefik)
# All AUTHENTIK_* / PG_* config (including email) is read from .env via env_file.
services:
# #########################################################
# PostgreSQL ##############################################
# #########################################################
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - authentik_internal

# #########################################################
# Authentik Server ########################################
# #########################################################
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.2}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    shm_size: 512mb
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - authentik_internal
      - traefik_proxy

# #########################################################
# Authentik Worker ########################################
# #########################################################
  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.2}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    shm_size: 512mb
    user: root
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - authentik_internal

# =========================================================
# Networks ================================================
# =========================================================
networks:
  authentik_internal:
    driver: bridge
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  database:
    driver: local
