# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# BackdropCarousel ########################################
# #########################################################
  backdrop-carousel:
    build: .
    container_name: backdrop-carousel
    user: "65008:65008"
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PHOTOS_DIR=/photos
    volumes:
      - ./photos:/photos:ro
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
