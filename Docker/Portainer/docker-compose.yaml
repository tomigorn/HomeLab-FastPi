# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Portainer ###############################################
# #########################################################
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    mem_limit: 256m
    environment:
      TZ: Europe/Zurich
    ports:
      # HTTPS, localhost only (SSO-only, 2026-10-19). Recovery when Authentik is
      # down: ssh -L 9443:127.0.0.1:9443 fastpi, then
      # https://localhost:9443/#!/internal-auth (see Traefik dynamic/portainer.yml).
      # Agents are unaffected: Portainer dials beefy's agent on :9001 outbound.
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    extra_hosts:
      # Portainer's OAuth token/userinfo calls must reach Authentik over the LAN
      # (Traefik on this host), not via the public Cloudflare tunnel.
      - "sso.holy-grail.ch:192.168.1.2"
    restart: unless-stopped
    networks:
      - traefik_proxy
# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  portainer_data:
# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true