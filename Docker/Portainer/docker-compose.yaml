# =========================================================
# Services ================================================
# =========================================================
#
# Portainer no longer mounts /var/run/docker.sock directly. That mount is ROOT ON
# THE HOST: the Docker API can start a privileged container bind-mounting / and read
# or write anything. Portainer was the last container on fastpi still holding it.
#
# It now reaches the daemon through its own tecnativa/docker-socket-proxy, on an
# internal network, exposing only the API groups Portainer actually uses. A socat
# bridge turns that TCP proxy back into a unix socket at the path Portainer's stored
# "local" endpoint already expects (/var/run/docker.sock), so nothing in Portainer
# needs reconfiguring.
#
# READ-ONLY since 2026-10-22: the proxy denies POST+EXEC, so Portainer is a pure
# viewer (no start/stop/create/exec) and is NOT root-equivalent. Manage via shell.
# (Former note kept for context:) Portainer manages containers (create/start/stop/exec), and
# container-create with bind mounts is itself root-equivalent on the host. This does
# NOT remove that. What it removes is the direct socket-file mount, blocks every
# endpoint group Portainer does not need (swarm, secrets, configs, nodes, services,
# tasks, plugins, build, commit, auth, session, distribution), and gives one
# filtered, restartable choke point in front of the daemon instead of a raw mount.
services:
# #########################################################
# SOCKET PROXY (Portainer's filtered Docker API) ##########
# #########################################################
  socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy}:${SOCKET_PROXY_TAG:-0.3.0}
    container_name: portainer-socket-proxy
    restart: unless-stopped
    environment:
      BIND_CONFIG: ":2375"   # IPv4; the internal networks have no IPv6
      # Groups Portainer needs. Everything not listed defaults to 0 (denied).
      CONTAINERS: 1      # list/inspect/logs/start/stop/restart/create/remove
      IMAGES: 1          # image list and pull
      NETWORKS: 1        # network list/inspect/create (stack + container wiring)
      VOLUMES: 1         # volume list/inspect/create
      INFO: 1            # /info - dashboard, endpoint snapshot
      SYSTEM: 1          # /system/df - dashboard disk usage
      VERSION: 1         # /version - endpoint handshake
      EVENTS: 1          # /events stream - live container state in the UI
      PING: 1            # /_ping - endpoint health
      # READ-ONLY (2026-10-22, user choice): POST+EXEC off = Portainer can VIEW every
      # stack/container/log but cannot start/stop/create/remove/exec anything. This
      # removes the root-equivalence entirely - manage containers via the shell/compose.
      POST: 0
      EXEC: 0
      # Explicitly denied, listed so the intent is obvious rather than implied.
      # Portainer has no use for these on a single standalone engine, and several
      # are the dangerous ones (secrets, configs, swarm control, build):
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - portainer_socket
    # Non-root; the docker group (991) opens the socket. The image entrypoint renders
    # haproxy.cfg into a root-owned dir, so haproxy runs the shipped template directly:
    # it expands BIND_CONFIG (environment above) itself, like $SOCKET_PATH.
    user: "65049:65049"
    group_add:
      - "991"
    entrypoint: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg.template"]
    read_only: true
    tmpfs:
      - /run:mode=1777,size=1m   # haproxy.pid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

# #########################################################
# UNIX BRIDGE (TCP proxy -> unix socket for Portainer) ####
# #########################################################
# Portainer's stored "local" endpoint is a unix socket at /var/run/docker.sock.
# socat republishes the TCP proxy as a unix socket on a named volume, which Portainer
# mounts at /var/run - so /var/run/docker.sock is now the filtered proxy, not the
# real daemon, with no change to Portainer's configuration.
  socket-proxy-unix:
    image: alpine/socat:latest
    container_name: portainer-socket-proxy-unix
    user: "65028:65028"   # socket is mode 660 -> only this uid/gid; Portainer joins the group
    restart: unless-stopped
    command: >-
      UNIX-LISTEN:/sock/docker.sock,fork,unlink-early,mode=660
      TCP:socket-proxy:2375
    volumes:
      - portainer_sock:/sock
    networks:
      - portainer_socket
    depends_on:
      - socket-proxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m

# #########################################################
# Portainer ###############################################
# #########################################################
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    user: "65030:65030"
    group_add:
      - "65028"           # read the socat bridge socket (mode 660, group 65028)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    environment:
      TZ: Europe/Zurich
    ports:
      # HTTPS, localhost only (SSO-only, 2026-10-19). Recovery when Authentik is
      # down: ssh -L 9443:127.0.0.1:9443 fastpi, then
      # https://localhost:9443/#!/internal-auth (see Traefik dynamic/portainer.yml).
      # Agents are unaffected: Portainer dials beefy's agent on :9001 outbound.
      - "127.0.0.1:9443:9443"
    volumes:
      # The filtered proxy's unix socket, mounted where Portainer expects the daemon.
      # No raw /var/run/docker.sock mount any more.
      - portainer_sock:/var/run
      - portainer_data:/data
    extra_hosts:
      # Portainer's OAuth token/userinfo calls must reach Authentik over the LAN
      # (Traefik on this host), not via the public Cloudflare tunnel.
      - "sso.holy-grail.ch:192.168.1.2"
    restart: unless-stopped
    depends_on:
      - socket-proxy-unix
    networks:
      - traefik_proxy     # inbound (Traefik) and outbound (beefy agent :9001)
      - portainer_socket  # Docker API via the proxy
# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  portainer_data:
  # Carries the bridged unix socket from socat to Portainer.
  portainer_sock:
# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  # Portainer <-> its socket proxy only. internal: no route to the internet.
  portainer_socket:
    name: portainer_socket
    driver: bridge
    internal: true
