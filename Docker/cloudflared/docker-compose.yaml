# #########################################################
# Services ################################################
# #########################################################
services:
# ---------------------------------------------------------
# Cloudflared ---------------------------------------------
# ---------------------------------------------------------
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    mem_limit: 256m
    # Protocol is left to cloudflared to negotiate (it picks http2 here).
    #
    # MEASURED 2026-09-26: forcing --protocol quic makes no difference. On a 9 MB
    # transfer, http2 averaged 32.3 MB/s and quic 32.5 MB/s - within noise. The
    # Swiss edge PoPs (zrh01, gva01) appear under both, so they were not a quic
    # effect either.
    #
    # More importantly: the tunnel is NOT the bottleneck people assume. ~32 MB/s
    # is roughly 260 Mbit/s, which is ample for audiobooks (a 508 MB average book
    # downloads in ~16s, the largest 2.9 GB one in ~90s) and comfortably above
    # even a 4K remux bitrate. An earlier measurement of 11.8 MB/s was an artifact
    # of testing with a 3 MB file, where connection setup and TCP slow start
    # dominate - not a throughput cap. Measure with something 9 MB or larger.
    command: tunnel --no-autoupdate --metrics localhost:20241 run --token-file /run/secrets/cloudflared_tunnel_token
    restart: always
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    secrets:
      - cloudflared_tunnel_token

