# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Autoheal ################################################
# #########################################################
  autoheal-antivirus:
    image: willfarrell/autoheal:latest
    container_name: autoheal-antivirus
    user: "65011:65011"
    mem_limit: 64m
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-antivirus
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container list/inspect plus
      # start/stop/restart (autoheal calls POST /containers/{id}/restart) but denies create, exec,
      # images, volumes, networks and everything else. Own network socket_proxy_heal.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy_heal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# ClamAV ##################################################
# #########################################################
  clamav:
    build: ./clamav
    image: clamav-local:latest
    container_name: clamav
    # Non-root, also for the timer's `docker exec clamav /scan.sh`. 1100 = sambashare
    # (quarantine moves out of the media tree), 65046 = writers of the node-exporter textfile dir.
    user: "65039:65039"
    group_add:
      - "1100"
      - "65046"
    mem_limit: 2g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - autoheal-antivirus=true
    environment:
      - FRESHCLAM_CHECK_INTERVAL=${FRESHCLAM_CHECK_INTERVAL:-60}
      - HOST=fastpi
      - SCAN_HOST=0   # the host root is scanned by clamav-hostscan, which has no network
      - SCAN_ROOTS=/scan/seagate-red /scan/seagate-black
      - QUARANTINE=/scan/seagate-red/antivirus-quarantine
      - STATE=/state
      - TEXTFILE=/textfile
    volumes:
      - clamav-db:/var/lib/clamav
      - type: bind
        source: /mnt/seagate-red
        target: /scan/seagate-red
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-black
        target: /scan/seagate-black
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
      - type: bind
        source: /var/lib/node-exporter/textfile
        target: /textfile
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep freshclam >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - antivirus_network

# #########################################################
# ClamAV whole-host scan ##################################
# #########################################################
  # Weekly, started by clamav-hostscan.timer (`docker compose run --rm clamav-hostscan`), never by `up`.
  # Reads the whole host, so it has no network: a scanner bug or a hostile file cannot phone home.
  clamav-hostscan:
    image: clamav-local:latest
    profiles: ["hostscan"]
    entrypoint: ["/hostscan.sh"]
    user: "0:0"   # a non-root uid has no effective capabilities in Docker, so DAC_READ_SEARCH only works for root
    network_mode: none
    read_only: true
    cpu_shares: 2   # lowest CPU weight (default 1024): only gets what the other containers leave idle
    mem_limit: 3g   # clamd with all signatures ~1 GB, plus 4 scan threads and the 512m tmpfs
    restart: "no"
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH   # read every file of the host
      - DAC_OVERRIDE      # write the state dir (owned by 65039) and the textfile dir (group 65046)
      - CHOWN             # hand the results back to 65039 for the clamav container
    environment:
      - HOST=fastpi
      - SCAN_HOST=0
      - SCAN_ROOTS=/host
      - QUARANTINE=/tmp   # unused: `all` is report only, scan.sh just needs an existing directory
      - STATE=/state
      - TEXTFILE=/textfile
      - USE_CLAMD=1   # private clamd inside this container (socket in /tmp, no network), multiscan on all cores
      - SCAN_RESUME=1   # chunked pass, only 22:00-06:00 and Sundays (local time), resumes where it stopped (state: all.*)
      # Exclusions, why: Docker/antivirus/README.md "Weekly host scan: scope". System dirs, /home (minus caches), /etc, /usr, /opt, /var/lib/docker/volumes (minus time series) stay in.
      - SCAN_EXCLUDE_DIRS=/host/var/lib/docker/overlay2 /host/var/lib/docker/containerd /host/var/lib/docker/image /host/var/lib/docker/buildkit /host/var/lib/docker/buildkit.backup /host/var/lib/docker/tmp /host/var/lib/containerd /host/var/lib/docker/volumes/monitoring__grafana_influxdb_data /host/var/lib/docker/volumes/monitoring__grafana_prometheus_data /host/home/pi/backups /host/home/pi/Documents/iso /host/home/pi/.cache /host/home/pi/.npm /host/var/lib/security-scan/trivy-cache /host/var/cache/apt
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
      - type: bind
        source: /etc/localtime   # the window is local time; the image has no tzdata
        target: /etc/localtime
        read_only: true
      - type: volume
        source: clamav-db
        target: /var/lib/clamav
        read_only: true
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
      - type: bind
        source: /var/lib/node-exporter/textfile
        target: /textfile
        bind:
          create_host_path: false

# #########################################################
# VirusTotal ##############################################
# #########################################################
  virustotal:
    build: ./virustotal
    image: virustotal-local:latest
    container_name: virustotal
    user: "65014:65014"
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - autoheal-antivirus=true
    environment:
      - VT_API_KEY_FILE=/run/secrets/vt_api_key
    secrets:
      - vt_api_key
    volumes:
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config/Downloads
        target: /scan/sabnzbd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /scan/qbittorrent
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - antivirus_network

# =========================================================
# Secrets =================================================
# =========================================================
secrets:
  vt_api_key:
    file: ./secrets/vt_api_key

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy_heal:
    external: true
  antivirus_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.34.0/24
          gateway: 10.24.34.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  clamav-db:
