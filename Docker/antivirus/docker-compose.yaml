# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Autoheal ################################################
# #########################################################
  autoheal-antivirus:
    image: willfarrell/autoheal:latest
    container_name: autoheal-antivirus
    mem_limit: 64m
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-antivirus
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container reads plus
      # POST (autoheal calls POST /containers/{id}/restart) but denies exec,
      # images, volumes, networks and everything else.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# ClamAV ##################################################
# #########################################################
  clamav:
    build: ./clamav
    image: clamav-local:latest
    container_name: clamav
    mem_limit: 2g
    restart: unless-stopped
    labels:
      - autoheal-antivirus=true
    environment:
      - FRESHCLAM_CHECK_INTERVAL=${FRESHCLAM_CHECK_INTERVAL:-60}
    volumes:
      - clamav-db:/var/lib/clamav
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config/Downloads
        target: /scan/sabnzbd
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /scan/qbittorrent
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/antivirus-quarantine
        target: /scan/quarantine
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep inotifywait >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - antivirus_network

# #########################################################
# VirusTotal ##############################################
# #########################################################
  virustotal:
    build: ./virustotal
    image: virustotal-local:latest
    container_name: virustotal
    mem_limit: 256m
    restart: unless-stopped
    labels:
      - autoheal-antivirus=true
    environment:
      - VT_API_KEY=${VT_API_KEY}
    volumes:
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config/Downloads
        target: /scan/sabnzbd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /scan/qbittorrent
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - antivirus_network

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy:
    external: true
  antivirus_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.34.0.0/16
          gateway: 172.34.0.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  clamav-db:
