# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Autoheal ################################################
# #########################################################
  autoheal-antivirus:
    image: willfarrell/autoheal:latest
    container_name: autoheal-antivirus
    user: "65011:65011"
    mem_limit: 64m
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-antivirus
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container reads plus
      # POST (autoheal calls POST /containers/{id}/restart) but denies exec,
      # images, volumes, networks and everything else.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# ClamAV ##################################################
# #########################################################
  clamav:
    build: ./clamav
    image: clamav-local:latest
    container_name: clamav
    mem_limit: 2g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN             # freshclam lchowns its .dat files to the clamav user
      - DAC_READ_SEARCH   # scan files owned by any uid without full root
      - SETUID            # clamd drops root -> clamav user
      - SETGID            # ...and initgroups() for it
    labels:
      - autoheal-antivirus=true
    environment:
      - FRESHCLAM_CHECK_INTERVAL=${FRESHCLAM_CHECK_INTERVAL:-60}
      - HOST=fastpi
      - SCAN_ROOTS=/scan/seagate-red /scan/seagate-black
      - QUARANTINE=/scan/seagate-red/antivirus-quarantine
      - STATE=/state
      - TEXTFILE=/textfile
    volumes:
      - clamav-db:/var/lib/clamav
      - type: bind
        source: /mnt/seagate-red
        target: /scan/seagate-red
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-black
        target: /scan/seagate-black
        bind:
          create_host_path: false
      # Host root for "scan.sh all", report only.
      - type: bind
        source: /
        target: /host
        read_only: true
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
      - type: bind
        source: /var/lib/node-exporter/textfile
        target: /textfile
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep freshclam >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - antivirus_network

# #########################################################
# VirusTotal ##############################################
# #########################################################
  virustotal:
    build: ./virustotal
    image: virustotal-local:latest
    container_name: virustotal
    user: "65014:65014"
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - autoheal-antivirus=true
    environment:
      - VT_API_KEY=${VT_API_KEY}
    volumes:
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config/Downloads
        target: /scan/sabnzbd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /scan/qbittorrent
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - antivirus_network

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy:
    external: true
  antivirus_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.34.0.0/16
          gateway: 172.34.0.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  clamav-db:
