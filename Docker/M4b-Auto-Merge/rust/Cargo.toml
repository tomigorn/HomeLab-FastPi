[package]
name = "m4b-auto-merge"
version = "2.0.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
inotify = { version = "0.11", default-features = false }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
