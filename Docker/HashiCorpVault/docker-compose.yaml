
# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# NAME ####################################################
# #########################################################
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    mem_limit: 512m
    cap_add:
      - IPC_LOCK  # Lock memory to prevent sensitive data from swapping to disk
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot  # Root token for dev mode
      VAULT_ADDR: http://192.168.1.2:8200  # Set the Vault address
    ports:
      - 8200:8200  # Expose Vault on port 8200
    volumes:
      - vault-data:/vault/file  # For future use, persistent storage in production
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

# =========================================================
# Networks ================================================
# =========================================================
networks:
  default:
    name: vault_network

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  vault-data:
