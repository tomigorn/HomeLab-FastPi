# Requests bar above ABR (README "Requests bar"). Read by scripts/abr_bar_usage.py every minute, no restart needed.
# No secrets here: the repo is public.

# Limits per Prowlarr indexer (prowlarr_mouse), by its name in Prowlarr. An indexer not listed here is unlimited (shown with ∞).
# searches = API calls incl. RSS, downloads = grabs; leave one out = unlimited.
# window = "rolling" (the last 24 h) or "day" (calendar day, Europe/Zurich, resets at midnight).
# MyAnonamouse has no search or grab limit for us (Prowlarr Query/Grab Limit empty), so it is not listed.
# [indexers."Example"]
# downloads = 20
# window = "rolling"

# Paid or time-limited services: shown with days left. They live in fastpi's Docker/Due-Dates/due-dates.toml (show = ["books"]), MAM VIP too.
# A [[subscriptions]] entry here (name, kind, expires = YYYY-MM-DD or lifetime = true) is only for something that belongs to this bar alone.

# MyAnonamouse seeding rule (rules.php 2.5, "Unsatisfied torrents", as of 2026-05-10): every download seeds 72 h in total within 30 days; until then it is unsatisfied.
# Unsatisfied limit per class: new member (first 2 weeks) 20, User 50, Power User 100, VIP 150, above VIP 200. Read from qBittorrent (seeding time), no MAM call.
# The VIP end date is the "mam-vip" entry in Due-Dates/due-dates.toml. When VIP ends, set class and limit to the new class.
[mam]
class = "VIP"
unsatisfied_limit = 150
