[package]
name = "audiobook-importer"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "cookies", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
form_urlencoded = "1"
percent-encoding = "2"
log = "0.4"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Unit tests: release code without the slow LTO link (cargo test --profile test-release in the Dockerfile's test stage).
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 4
strip = false
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
