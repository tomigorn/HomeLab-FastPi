<!DOCTYPE html>
<html lang="en" data-theme="nord">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="stylesheet" href="/static/globals.css">
  <script>
    // Same theme as ABR (its localStorage key).
    (function () {
      var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "nord");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    body { background: var(--color-base-100); color: var(--color-base-content); margin: 0; }
    main { max-width: 72rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: .5rem 0 1rem; }
    .tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
    .tools input { flex: 1 1 14rem; min-width: 0; }
    .tools select { flex: 0 1 auto; }
    .muted { opacity: .7; font-size: .875rem; }
    #books { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: .75rem; }
    .book { display: flex; gap: .75rem; padding: .75rem; border-radius: .5rem; background: var(--color-base-200); min-width: 0; }
    .cover { width: 5.5rem; height: 5.5rem; flex: none; object-fit: cover; border-radius: .375rem; background: var(--color-base-300); }
    .info { min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
    .title { font-weight: 700; overflow-wrap: anywhere; }
    .series { font-size: .875rem; color: var(--color-primary); }
    .meta { margin-top: .15rem; }
    .open { align-self: flex-start; margin-top: .4rem; }
    @media (max-width: 30rem) { #books { grid-template-columns: 1fr; } .cover { width: 4.5rem; height: 4.5rem; } }
  </style>
  <link rel="stylesheet" href="/_hg/bar/bar.css">
  <script src="/_hg/bar/bar.js" data-ib-data="/_hg/bar/usage.json" data-ib-quota="/_hg/bar/my-quota.json" data-ib-no-bar="^/(login|auth|init)\b" defer></script>
  <script src="/_hg/mam.js" defer></script>
</head>
<body>
  <nav class="navbar bg-base-200 shadow flex-wrap">
    <a class="btn btn-ghost text-lg" href="/">ABR</a>
    <a class="btn btn-ghost" href="/wishlist">Wishlist</a>
    <a class="btn btn-ghost" href="/_hg/requests/">All requests</a>
    <a class="btn btn-ghost" href="https://requests.holy-grail.ch/">Movies / Series</a>
  </nav>
  <main>
    <h1>Library</h1>
    <p class="muted">Every book in Audiobookshelf you can open there. The button opens it in Audiobookshelf.</p>
    <div class="tools">
      <input id="q" type="search" class="input input-bordered" placeholder="Search title, author, narrator, series" aria-label="Search">
      <select id="sort" class="select select-bordered" aria-label="Sort"></select>
      <select id="lib" class="select select-bordered" aria-label="Library"></select>
    </div>
    <p class="muted" id="state">Loading…</p>
    <div id="books"></div>
  </main>
  <script src="/_hg/library/library.js" defer></script>
</body>
</html>
