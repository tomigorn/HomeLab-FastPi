# books-proxy: Traefik -> here -> ABR. Passes everything through, adds the "Movies / Series" + "Library" links, the requests bar and the size column to HTML pages
# and checks the request limit (importer /quota) before ABR creates a request. Download buttons that skip a request are admin only.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 5m;
    # ABR's compression is turned off below (sub_filter), so compress here again.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Docker DNS, re-resolved every 10 s: a recreated container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ABR admins (Holy Grail group streaming-admins); the header comes from Traefik's forward auth.
    map $http_x_authentik_groups $abr_admin {
        "~(^|\|)streaming-admins(\||$)" 1;
        default 0;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 8080;
        # Only Traefik (static 10.24.25.3 on traefik_mouse) and the container itself (healthcheck, post-update checks).
        # The one route here (Traefik books.yml) has forward auth, which overwrites X-authentik-username/groups: trusted only because of this list.
        allow 10.24.25.3;
        allow 127.0.0.1;
        deny all;
        set $abr http://audiobookrequest:8000;
        set $importer http://audiobook-importer:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        # uncompressed from ABR, or sub_filter cannot see </head> (set here: a proxy_set_header inside a location drops all of these)
        proxy_set_header Accept-Encoding "";

        location = /_hg/health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # "All requests" page (everyone's requests with names, read-only): data from the importer, needs an ABR session like the bar.
        location = /_hg/requests/data.json {
            auth_request /_hg/bar/_auth;
            proxy_pass $importer/all-requests;
            proxy_pass_request_body off;
        }

        # Requests bar (README "Requests bar"): usage.json from the host timer, the viewer's own quota from the importer.
        # Both need an ABR session too (not only Holy Grail): ABR /api/users/me with the caller's cookie, 401 without.
        location = /_hg/bar/_auth {
            internal;
            proxy_pass $abr/api/users/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
        }

        location = /_hg/bar/usage.json {
            auth_request /_hg/bar/_auth;
            alias /srv/bar-data/usage.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /_hg/bar/my-quota.json {
            auth_request /_hg/bar/_auth;
            proxy_pass $importer/my-quota;
            proxy_pass_request_body off;
        }

        # Library page and book sizes (README "Library"): the viewer's own Audiobookshelf view, needs an ABR session like the bar.
        location = /_hg/library/data.json {
            auth_request /_hg/bar/_auth;
            proxy_pass $importer/library;
            proxy_pass_request_body off;
        }

        location ~ "^/_hg/library/cover/([A-Za-z0-9_-]{1,64})$" {
            auth_request /_hg/bar/_auth;
            proxy_pass $importer/library-cover/$1;
            proxy_pass_request_body off;
        }

        location = /_hg/sizes.json {
            auth_request /_hg/bar/_auth;
            proxy_pass $importer/sizes;
            proxy_pass_request_body off;
        }

        location /_hg/ {
            alias /srv/www/;
            add_header Cache-Control "no-cache" always;
        }

        # Request limit (5 books per 7 days, everyone): asked before ABR sees the request.
        location = /_quota {
            internal;
            proxy_pass $importer/quota;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
        }

        # Admins only: these start a download of any book ABR has saved from a search, without a request, so past the limit.
        location ~ ^/(wishlist/hx-auto-download/|api/requests/[^/]+/(auto-download|download|refresh)$) {
            if ($abr_admin = 0) {
                return 403;
            }
            proxy_pass $abr;
        }

        # ABR's htmx buttons: a refusal shows as ABR's own error toast.
        location ~ ^/(request/hx-add/|search/manual/hx-add) {
            auth_request /_quota;
            error_page 403 = @quota_toast;
            proxy_pass $abr;
        }

        location ~ ^/api/requests/[^/]+$ {
            auth_request /_quota;
            error_page 403 = @quota_api;
            proxy_pass $abr;
        }

        location @quota_toast {
            default_type text/html;
            add_header HX-Retarget "#toast-block" always;
            return 200 '<div class="hidden" id="toast-block"><script>toast("Limit reached: 5 audiobooks per 7 days. Please try again later.", "error");</script></div>';
        }

        location @quota_api {
            default_type application/json;
            return 429 '{"detail":"Limit reached: 5 audiobooks per 7 days"}';
        }

        location / {
            proxy_pass $abr;
            sub_filter_once on;
            sub_filter '</head>' '<link rel="stylesheet" href="/_hg/bar/bar.css"><script src="/_hg/links.js" defer></script><script src="/_hg/bar/bar.js" data-ib-data="/_hg/bar/usage.json" data-ib-quota="/_hg/bar/my-quota.json" data-ib-no-bar="^/(login|auth|init)\b" defer></script><script src="/_hg/mam.js" defer></script><script src="/_hg/sizes.js" defer></script></head>';
        }
    }
}
