# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Due-Dates ###############################################
# #########################################################
  # Read-only JSON for beefy's Seerr bar: https://due-dates.holy-grail.ch/due-dates.json, LAN/VPN only (Traefik local-networks@file).
  due-dates:
    image: caddy:alpine
    container_name: due-dates
    user: "65064:65064"
    mem_limit: 32m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # bind :80 as non-root
    environment:
      - XDG_CONFIG_HOME=/tmp
      - XDG_DATA_HOME=/tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DUE_DATES_DIR}:/srv:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "5", "http://127.0.0.1/due-dates.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      traefik_proxy:
        ipv4_address: 172.24.0.17

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
