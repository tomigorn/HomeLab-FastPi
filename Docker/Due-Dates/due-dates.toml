# --- Domains --------------------------------------------------------------------
# .ch RDAP publishes no end date: without `date` the next registration anniversary is used (the earliest the paid year can end). After each renewal set the real end date from the registrar.

[[due]]
id = "holy-grail-ch"
title = "holy-grail.ch"
kind = "domain"
source = "rdap"
date = 2027-02-17
registrar = "GoDaddy"
renew = "yearly at godaddy.com"
dns = "Cloudflare"

# --- No-IP hostnames ------------------------------------------------------------
# No-IP deletes an unconfirmed free hostname after 30 days (confirm mail ~7 days before, deleted ON the end date). No API tells the deadline: confirmed = the day you last confirmed. Without `confirmed` there is no timer; DdnsHostnameNotResolving stays as the backstop.
# "No-IP confirmed": set confirmed for both.

[[due]]
id = "noip-lang-tool"
title = "lang-tool.ddns.net"
kind = "ddns"
confirmed = 2026-11-10
url = "https://my.noip.com/dynamic-dns"

[[due]]
id = "noip-wg-aemtli"
title = "wg-aemtli.ddns.net"
kind = "ddns"
confirmed = 2026-11-10
url = "https://my.noip.com/dynamic-dns"

# --- Tokens ---------------------------------------------------------------------
# Docker Hub: the token list API refuses a token-based login (403), so the date is entered here by hand.

[[due]]
id = "dockerhub-wg-chores"
title = "Docker Hub token github-actions-wg-chores"
kind = "token"
category = "WG Chores image builds"
date = 2027-11-15
url = "https://app.docker.com/settings/personal-access-tokens"
howto = "New token on hub.docker.com, put it into the GitHub secret DOCKERHUB_TOKEN of WG Chores, delete the old token. WG Chores image builds stop without it."

