# Every date that needs the owner, in one place (README.md). No secrets: the repo is public.
# due_dates.py merges this file with the fetched dates (TLS, RDAP, Authentik tokens) into /var/lib/due-dates/due-dates.json every 10 minutes; Telegram warnings, the Seerr and ABR bars, Grafana and the notes page read that.
#
# Fields of a [[due]] entry:
#   id        unique, lowercase-with-dashes
#   title     shown everywhere
#   kind      subscription | domain | ddns | token | warranty | reminder | info
#   date      the day it ends or is due (TOML date, no quotes); or lifetime = true; ddns: confirmed = <date> instead (date = confirmed + cycle_days)
#   source    manual (default) | rdap (domain: RDAP fills the date when none is set here; a date set here wins)
#   category  short label after the title (indexer, VPN, …); domain and ddns build their own
#   lead      warning days before the date, e.g. [30, 7, 0] (default; ddns [5, 3, 1, 0]); the day after always gets a last one
#   alert     telegram (default) | none
#   show      bars that list it: "seerr" (beefy, Seerr), "books" (fastpi, ABR)
#   url, notes, howto (what to do, in the Telegram details)
#   domain only: registrar, renew, dns

