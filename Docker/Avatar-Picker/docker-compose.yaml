# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# AVATAR-PICKER ###########################################
# #########################################################
  avatar-picker:
    build: .
    image: avatar-picker:${AVATAR_PICKER_TAG:-local}
    container_name: avatar-picker
    restart: unless-stopped
    env_file: .env
    environment:
      AUTHENTIK_TOKEN_FILE: /run/secrets/authentik_token
      PICKER_SECRET_FILE: /run/secrets/picker_secret
      QUEUE_FILE: /data/queue.json
    volumes:
      - ./secrets/authentik_token:/run/secrets/authentik_token:ro
      - ./secrets/picker_secret:/run/secrets/picker_secret:ro
      - ./data:/data
    networks:
      - traefik_proxy
    user: "65002:65002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 1.0
    pids_limit: 64                 # with max_blocking_threads(16) in the binary
    healthcheck:
      test: ["CMD", "/avatar-picker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
