# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# AVATAR-PICKER ###########################################
# #########################################################
  avatar-picker:
    build: .
    image: avatar-picker:${AVATAR_PICKER_TAG:-local}
    container_name: avatar-picker
    restart: unless-stopped
    env_file: .env
    environment:
      AUTHENTIK_TOKEN_FILE: /run/secrets/authentik_token
      PICKER_SECRET_FILE: /run/secrets/picker_secret
    volumes:
      - ./secrets/authentik_token:/run/secrets/authentik_token:ro
      - ./secrets/picker_secret:/run/secrets/picker_secret:ro
    networks:
      - traefik_proxy
    user: "65002:65002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
