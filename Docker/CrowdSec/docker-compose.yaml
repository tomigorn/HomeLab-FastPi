# =========================================================
# Services ================================================
# =========================================================
#
# CrowdSec reads Traefik's access log, recognises attack patterns (credential
# stuffing, scanners, path traversal probes) and produces "decisions" - IP bans.
#
# Enforcement is the Traefik bouncer plugin (Traefik/traefik/dynamic/crowdsec.yml),
# in stream mode with updateMaxFailure -1: if this container is down, the edge keeps
# the last ban list and stays up (fail open). Kept current by
# scripts/crowdsec-autoupdate.sh (daily, patch/minor, verified, auto-rollback);
# see README.md.
#
# Why the Traefik plugin and not the firewall bouncer: all traffic arrives through
# the Cloudflare tunnel, so at packet level every client looks like the docker
# gateway. Only Traefik sees the real IP (via forwardedHeaders, configured
# 2026-09-26). A firewall bouncer would be blind here, or would ban the tunnel.
services:
# #########################################################
# CROWDSEC ################################################
# #########################################################
  crowdsec:
    image: ${CROWDSEC_IMAGE:-crowdsecurity/crowdsec}:${CROWDSEC_TAG:?set CROWDSEC_TAG in .env}
    container_name: crowdsec
    user: "65032:65032"   # owns its two volumes; reads Traefik's access.log (0644)
    restart: unless-stopped
    environment:
      # Parsers/scenarios for Traefik access logs and generic HTTP attacks.
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      GID: "1000"
    volumes:
      # Traefik's access log, read-only. This is the only input.
      - /home/pi/Projects/Docker/Traefik/traefik/logs:/var/log/traefik:ro
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_config:/etc/crowdsec
      - ./config/parsers/requests-signed-in.yaml:/etc/crowdsec/parsers/s02-enrich/requests-signed-in.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
    networks:
      - crowdsec
      # Traefik's bouncer plugin queries the Local API over HTTP; this network
      # is shared only with Traefik (H-2), so other apps cannot reach the LAPI.
      - traefik_crowdsec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m

# =========================================================
# Networks ================================================
# =========================================================
networks:
  crowdsec:
    name: crowdsec
    driver: bridge
  traefik_crowdsec:
    external: true   # defined in Docker/Traefik/docker-compose.yaml

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  crowdsec_config:
  crowdsec_data:
