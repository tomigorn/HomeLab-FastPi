# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# CUP #####################################################
# #########################################################
# Cup — lightweight Docker image update checker (web UI, fetch-only).
# It never updates anything: it lists running containers and tells you
# which images have a newer version available. Config lives in cup.json.
  cup:
    image: ghcr.io/sergi0g/cup:${CUP_IMAGE_TAG:-v3.5.1}
    container_name: Cup
    command: -c /config/cup.json serve
    # docker.sock mount REMOVED (2026-09-26). Even mounted :ro it grants the full
    # Docker API, which is root on the host - the read-only flag stops writes to the
    # socket FILE, not to the daemon behind it. Cup now reads through
    # socket-proxy-ro, which serves container/image reads and refuses every POST.
    # Cup only accepts a UNIX socket path (--socket is documented as such) and
    # ignores DOCKER_HOST, so it mounts the bridged socket from socket-proxy-unix
    # instead of the real one. Same restrictions apply: read-only endpoints, no POST.
    volumes:
      # The bridged socket is mounted at Cup's DEFAULT path rather than passed via
      # --socket. Cup's -s flag does not work with this socket (it fails with
      # "client error (Connect)" even though curl and the docker CLI both use the
      # same socket happily), so the volume lands on /var/run and Cup finds
      # /var/run/docker.sock where it expects it.
      - socket_bridge:/var/run
      # Committed, config-as-code (see cup.json)
      - ./cup.json:/config/cup.json:ro
    ports:
      # Direct LAN access. Traefik reaches Cup over traefik_proxy by
      # container name (http://Cup:8000), so this publish is just a
      # convenient fallback if Traefik/Cloudflare are down.
      - "8000:8000"
    mem_limit: 128m
    restart: unless-stopped
    # Healthcheck REMOVED (2026-09-26). It ran
    #   ["CMD", "wget", "-qO-", "http://localhost:8000/api/v3/json"]
    # but this image is distroless: it contains the cup binary and nothing else -
    # no shell, no wget. `docker run --entrypoint wget <image>` fails on a clean
    # container, so the check could only ever report unhealthy. Docker has no way
    # to probe inside an image with no executables, so there is nothing to replace
    # it with; Traefik's file provider does not gate routing on health anyway.
    # Cup itself is fine - it serves HTTP 200 and checked 117 images after the
    # socket-proxy migration.
    networks:
      # ONLY traefik_proxy. Cup reaches the Docker API through the bridged unix
      # socket (a volume, not a network), and it must query registries over the
      # internet - attaching it to socket_proxy, which is internal:true, left it
      # with no route out and it failed with "client error (Connect)" while
      # fetching the image list.
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true


# =========================================================
# Volumes =================================================
# =========================================================

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  # Bridged unix socket, provided by the Docker-Socket-Proxy project.
  socket_bridge:
    external: true
