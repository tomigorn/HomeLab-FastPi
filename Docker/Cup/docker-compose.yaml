# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# CUP #####################################################
# #########################################################
# Cup — lightweight Docker image update checker (web UI, fetch-only).
# It never updates anything: it lists running containers and tells you
# which images have a newer version available. Config lives in cup.json.
  cup:
    image: ghcr.io/sergi0g/cup:${CUP_IMAGE_TAG:-v3.5.1}
    container_name: Cup
    user: "65024:65024"
    # cup.json "servers": fastpi and beefy (reachable through the DOCKER-USER guard, port 8000
    # only). tower stays out while it is down (ZFS/memtest): Cup has no per-server timeout, so a
    # dead entry costs ~3 slow retries and hangs a refresh ~9 min. Cup has no schedule of its own (no refresh_interval): security-scan
    # refreshes it daily at 04:05, while beefy is up; a refresh while beefy sleeps is slow, not broken.
    command: -c /config/cup.json serve
    # docker.sock mount REMOVED (2026-09-26). Even mounted :ro it grants the full
    # Docker API, which is root on the host - the read-only flag stops writes to the
    # socket FILE, not to the daemon behind it. Cup now reads through
    # socket-proxy-ro, which serves container/image reads and refuses every POST.
    # Cup only accepts a UNIX socket path (--socket is documented as such) and
    # ignores DOCKER_HOST, so it mounts the bridged socket from socket-proxy-unix
    # instead of the real one. Same restrictions apply: read-only endpoints, no POST.
    volumes:
      # The bridged socket is mounted at Cup's DEFAULT path rather than passed via
      # --socket. Cup's -s flag does not work with this socket (it fails with
      # "client error (Connect)" even though curl and the docker CLI both use the
      # same socket happily), so the volume lands on /var/run and Cup finds
      # /var/run/docker.sock where it expects it.
      # Committed, config-as-code (see cup.json). The server itself reads no socket
      # ("socket": "none"): fastpi's images come from cup-agent-fastpi below, so
      # the UI names them "fastpi" instead of "Local images".
      - ./cup.json:/config/cup.json:ro
    ports:
      # NOT on the LAN (2026-10-19): Cup has no auth, so 0.0.0.0:8000 exposed the
      # full image inventory to every LAN/VPN client. Traefik reaches Cup over
      # traefik_proxy by container name (http://Cup:8000, behind authentik@file).
      # This bind on the traefik_proxy gateway exists only for Prometheus'
      # json-exporter (other compose network): grafana/prometheus/prometheus.yml
      # job "cup" -> http://172.24.0.1:8000/api/v3/json. From a shell:
      # curl http://172.24.0.1:8000/api/v3/json
      - "172.24.0.1:8000:8000"
    mem_limit: 128m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthcheck REMOVED (2026-09-26). It ran
    #   ["CMD", "wget", "-qO-", "http://localhost:8000/api/v3/json"]
    # but this image is distroless: it contains the cup binary and nothing else -
    # no shell, no wget. `docker run --entrypoint wget <image>` fails on a clean
    # container, so the check could only ever report unhealthy. Docker has no way
    # to probe inside an image with no executables, so there is nothing to replace
    # it with; Traefik's file provider does not gate routing on health anyway.
    # Cup itself is fine - it serves HTTP 200 and checked 117 images after the
    # socket-proxy migration.
    networks:
      # ONLY traefik_proxy. Cup reaches the Docker API through the bridged unix
      # socket (a volume, not a network), and it must query registries over the
      # internet - attaching it to socket_proxy, which is internal:true, left it
      # with no route out and it failed with "client error (Connect)" while
      # fetching the image list.
      - traefik_proxy
      - cup_agents

# #########################################################
# CUP AGENT (fastpi) ######################################
# #########################################################
# Same image in agent mode: reads fastpi's images through the bridged socket and
# serves them to the server above as server "fastpi" (like beefy and tower).
  cup-agent-fastpi:
    image: ghcr.io/sergi0g/cup:${CUP_IMAGE_TAG:-v3.5.1}
    container_name: cup-agent-fastpi
    user: "65025:65025"   # the bridged proxy socket is 0666, so no root needed to read it
    command: -c /config/cup.json serve
    volumes:
      - socket_bridge:/var/run
      - ./cup-agent.json:/config/cup.json:ro
    mem_limit: 64m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cup_agents

# #########################################################
# CUP REFRESH (one-shot) ##################################
# #########################################################
# Cup's startup refresh runs before the agent answers, so after a restart the dashboard stayed
# empty until security-scan's next refresh (04:05). Cup's image is distroless (no healthcheck, no depends_on
# service_healthy possible), so this waits for the fastpi agent and then calls Cup's documented
# refresh API once. Exits when done; restart "no". A sleeping beefy only makes that refresh slow.
  cup-refresh:
    image: curlimages/curl:8.23.0
    container_name: cup-refresh
    user: "65023:65023"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf -m 5 -o /dev/null http://cup-agent-fastpi:8000/api/v3/json; do sleep 3; done
        until curl -sf -m 5 -o /dev/null http://Cup:8000/api/v3/json; do sleep 3; done
        curl -sf -m 900 -o /dev/null http://Cup:8000/api/v3/refresh && echo "cup refreshed"
    depends_on:
      - cup
      - cup-agent-fastpi
    mem_limit: 32m
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - traefik_proxy
      - cup_agents

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  cup_agents:
    driver: bridge


# =========================================================
# Volumes =================================================
# =========================================================

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  # Bridged unix socket, provided by the Docker-Socket-Proxy project.
  socket_bridge:
    external: true
