# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Feishin #################################################
# #########################################################
  feishin:
    image: ghcr.io/jeffvli/feishin:1.17.0   # pinned; release notes: github.com/jeffvli/feishin/releases
    container_name: feishin
    user: "65063:65063"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65063,gid=65063
      # nginx renders default.conf and settings.js from the templates here at start
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=65063,gid=65063
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "5", "http://127.0.0.1:9180/feishin/settings.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      traefik_proxy:
        ipv4_address: 172.24.0.9

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
