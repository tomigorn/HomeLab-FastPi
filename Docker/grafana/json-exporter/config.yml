# json-exporter: turn JSON APIs into Prometheus metrics. Modules: default (Cup), alertmanager (silenced alerts).
#
# Cup has no /metrics endpoint - only /api/v3/json - and no notification support of
# its own (`cup --help` offers just `check` and `serve`). Rather than bolt a bespoke
# "poll Cup and post to Telegram" script onto the side, Cup is fed into the SAME
# alerting pipeline as everything else: json-exporter -> Prometheus -> Alertmanager
# -> Telegram. One notification path, one place the bot token lives, and silences
# and alert history work for container updates exactly as they do for an outage.
#
# Since 2026-10-09 these counts span BOTH hosts: fastpi reads beefy through its Cup
# agent (`servers.beefy` in Cup's config) and merges the results, so no second scrape
# job or exporter is needed here. Verified the aggregate block keeps the same shape
# with a remote server attached - monitored_images simply went 123 -> 135.
# tower joined 2026-10-19 (`servers.tower`). A host asleep at Cup's refresh is left
# out, so the counts then cover only the hosts that answered; the scrape still works.
#
# Cup's JSON already carries an aggregate `metrics` block, so this is a plain scalar
# mapping with no per-image cardinality:
#   {"major_updates":1,"minor_updates":3,"patch_updates":0,"other_updates":9,
#    "updates_available":13,"monitored_images":119,"up_to_date":4,"unknown":102}
modules:
  default:
    metrics:
      - name: cup_updates
        type: object
        path: '{.metrics}'
        help: "Container image update counts reported by Cup"
        values:
          available: '{.updates_available}'
          major: '{.major_updates}'
          minor: '{.minor_updates}'
          patch: '{.patch_updates}'
          other: '{.other_updates}'
          monitored: '{.monitored_images}'
          up_to_date: '{.up_to_date}'
          unknown: '{.unknown}'

  # Alertmanager /api/v2/alerts?active=false&silenced=true&inhibited=false&unprocessed=false: only silenced alerts, one alert_silenced series each.
  # Prometheus does not know silences; the daily digest (prometheus/rules/daily-digest.yml) uses this to mark them 🔇 instead of listing them as firing.
  # All alert labels go into one JSON label, alert_labels: a path to a label the alert lacks (host, subject, ...) logs an error on every scrape. homelab:alert_silenced unpacks it.
  alertmanager:
    metrics:
      - name: alert
        type: object
        path: '{[*]}'
        help: "1 for each alert currently silenced in Alertmanager"
        labels:
          alertname: '{.labels.alertname}'
          alert_labels: '{.labels}'
        values:
          silenced: 1
