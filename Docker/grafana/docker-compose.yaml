# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Prometheus ##############################################
# #########################################################
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    mem_limit: 1g
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Long history (2026-10-19) so the CrowdSec dashboard can show attacks per
      # country/scenario over months, not just the 15-day default. Measured: 1.4 GB
      # for 15 d at ~8.9k series -> ~35 GB/year; the root NVMe has 338 GB free.
      # The size cap is the guard: Prometheus drops the oldest blocks first.
      - "--storage.tsdb.retention.time=400d"
      - "--storage.tsdb.retention.size=60GB"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # SSO-only policy: no LAN access, Grafana reaches it by container name
    networks:
      - default
      # CrowdSec's metrics endpoint (crowdsec:6060) is only reachable on its own
      # docker network - nothing is published on the host/LAN.
      - crowdsec

# #########################################################
# Node Exporter ###########################################
# #########################################################
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    mem_limit: 128m
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node-exporter/textfile:/var/lib/node-exporter/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Textfile collector: lets host-side scheduled jobs publish metrics by
      # dropping a .prom file here, with no extra exporter or listening port per
      # concern. Used by Server/4-Security-Monitoring (secrets, pending OS
      # updates, Trivy CVEs), including beefy's figures - which fastpi collects
      # over SSH and writes here, because beefy powers itself off when idle and a
      # pull-based scrape of it would spend most of the day alerting that a
      # sleeping host is down.
      #
      # A malformed .prom file makes node-exporter drop the WHOLE file and set
      # node_textfile_scrape_error=1, which the TextfileCollectorError alert
      # watches - otherwise a formatting slip silently removes every metric in it.
      - "--collector.textfile.directory=/var/lib/node-exporter/textfile"

# #########################################################
# Blackbox Exporter #######################################
# #########################################################
# Outside-in probes of the public hostnames. Added after the 2026-10-04 outage:
# every public route 404'd for ~24 hours while Traefik's container, process and
# metrics endpoint all stayed healthy, so nothing that watched the service itself
# could see it. See prometheus/rules/public-endpoints.yml.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    container_name: blackbox-exporter
    mem_limit: 128m
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    # No ports: only Prometheus talks to it, over the project network.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# #########################################################
# Alertmanager ############################################
# #########################################################
# Routes the Prometheus alerts in prometheus/rules/ to email and (once configured)
# Telegram. Added because the 2026-10-04 edge outage lasted ~24 hours purely for
# want of a notification: the rules and probes are worthless if nothing tells you.
#
# Config is alertmanager/alertmanager.yml, which is GITIGNORED (it holds the
# recipient address and chat id); alertmanager.yml.example is the committed
# template. Secrets are files under alertmanager/secrets/, never inlined.
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.1
    container_name: alertmanager
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/secrets:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Needed for silence/unsilence links in notifications to resolve. The port
      # is localhost-only, so the links work through `ssh -L 9093:127.0.0.1:9093 fastpi`.
      - "--web.external-url=http://localhost:9093"
    # Runs as uid 1000 to MATCH the owner of alertmanager/secrets/, so the SMTP
    # password can stay mode 600 instead of being made world-readable. The image
    # defaults to nobody (65534), which produced
    #   "could not read /secrets/smtp_password: permission denied"
    # and silently retried forever - caught only by sending a test alert.
    user: "1000:1000"
    ports:
      # localhost only (2026-10-19): the UI has no auth, and anyone who reaches it
      # can create silences. During an incident: ssh -L 9093:127.0.0.1:9093 fastpi.
      # Prometheus reaches alertmanager:9093 over the project network.
      - "127.0.0.1:9093:9093"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# #########################################################
# JSON Exporter ###########################################
# #########################################################
# Turns Cup's /api/v3/json into Prometheus metrics. Cup has no /metrics endpoint and
# no notification support of its own, so instead of bolting a bespoke "poll Cup and
# post to Telegram" script onto the side, Cup is fed into the SAME pipeline as
# everything else. One notification path, one place the bot token lives, and
# silences work for container updates exactly as they do for an outage.
  json-exporter:
    image: quay.io/prometheuscommunity/json-exporter:v0.8.0
    container_name: json-exporter
    mem_limit: 128m
    restart: unless-stopped
    volumes:
      - ./json-exporter/cup.yml:/config.yml:ro
    command:
      - "--config.file=/config.yml"
    # No ports: only Prometheus talks to it, over the project network.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# #########################################################
# Grafana #################################################
# #########################################################
  grafana:
    image: grafana/grafana-oss:13.0.2   # latest tag published for grafana-oss (13.2.x is only on grafana/grafana)
    container_name: grafana
    mem_limit: 512m
    restart: unless-stopped
    ports:
      # localhost only (SSO-only, 2026-10-19): Traefik reaches grafana:3000 over
      # traefik_proxy; from elsewhere use an ssh tunnel (ssh -L 3001:127.0.0.1:3001 fastpi).
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_INFLUX_TOKEN=${GRAFANA_INFLUX_TOKEN}
      # Admin SSO via Authentik (Grafana's own OAuth, not forward auth). The
      # OIDC client is provisioned by Authentik/scripts/provision-admin-sso.py,
      # which also writes the two GRAFANA_OAUTH_* values into .env. Only members
      # of homelab-admins get in, as GrafanaAdmin. Route: Traefik dynamic/grafana.yml.
      - GF_SERVER_ROOT_URL=https://grafana.holy-grail.ch
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Holy Grail
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email offline_access
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://sso.holy-grail.ch/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://sso.holy-grail.ch/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://sso.holy-grail.ch/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=true
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS=homelab-admins
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'homelab-admins') && 'GrafanaAdmin'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=true
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://sso.holy-grail.ch/application/o/grafana/end-session/
      # SSO only (2026-10-19): no login form (POST /login is refused) and no HTTP
      # Basic auth on the API. Service-account tokens (Bearer glsa_...) still work.
      # Recovery when Authentik is down (server shell only): set
      # GF_AUTH_DISABLE_LOGIN_FORM=false, `docker compose up -d grafana`, then
      # `ssh -L 3001:127.0.0.1:3001 fastpi` and log in as admin at
      # http://localhost:3001/login?disableAutoLogin=true; set it back afterwards.
      # Lost password: docker exec grafana grafana cli admin reset-admin-password <pw>
      # (GRAFANA_ADMIN_PASSWORD in .env only applies when the DB is first created).
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
    # Pin sso.holy-grail.ch to fastpi's Traefik so the server-side token/userinfo
    # calls don't depend on DNS or a round trip through the Cloudflare tunnel.
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    networks:
      - default
      - traefik_proxy

# #########################################################
# InfluxDB ################################################
# #########################################################
  influxdb:
    image: influxdb:2.9.1   # pinned 2026-10-17 (influxdb:latest is v3 - never use it)
    container_name: influxdb
    mem_limit: 1g
    ports:
      - "127.0.0.1:8086:8086"   # SSO-only policy: HA uses 127.0.0.1, telegraf/Grafana the container name
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=rpi
      # RAM caps (2026-10-20): all data stays on disk, old ranges just load slower.
      - INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE=268435456
      - INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE=10485760
      - INFLUXD_STORAGE_SERIES_ID_SET_CACHE_SIZE=20
      - INFLUXD_QUERY_MEMORY_BYTES=134217728
    restart: unless-stopped

# #########################################################
# Telegraf ################################################
# #########################################################
  telegraf:
    image: telegraf:1.40.2
    container_name: telegraf
    mem_limit: 256m
    user: telegraf
    # The docker group membership and the docker.sock mount are GONE (2026-09-26).
    # Membership of the docker group is equivalent to root on the host: the Docker
    # API can start a privileged container that bind-mounts /. Telegraf only wants
    # container stats, so it now talks to socket-proxy-ro over TCP, which serves
    # read-only endpoints and refuses every POST.
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    networks:
      - default
      - socket_proxy
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

# =========================================================
# Networks ================================================
# =========================================================
networks:
  # Compose's implicit per-project network, named explicitly now that a second
  # network is attached to telegraf.
  default:
  # Defined by Docker-Socket-Proxy. Internal-only: no route to the internet.
  socket_proxy:
    external: true
  # Defined by CrowdSec. Prometheus joins it to scrape crowdsec:6060.
  crowdsec:
    external: true
  # Defined by Traefik. Grafana joins it so Traefik can reach grafana:3000.
  traefik_proxy:
    external: true


# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  # Silences and notification state. If this is ephemeral, every restart re-sends
  # every active alert and forgets every silence.
  alertmanager_data:
  grafana_data:
  prometheus_data:
  influxdb_data: