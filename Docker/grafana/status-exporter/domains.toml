# Domains and DDNS hostnames watched by status_exporter.py domains (README "Expiry and disk health"). No secrets: the repo is public.

# Registered domains, checked over RDAP. .ch RDAP publishes no end date: without `expires` the next registration anniversary is used (the earliest the paid year can end).
# After each renewal set the real end date from the registrar: expires = 2028-02-17 (no quotes).
# registrar / renew / dns: shown in the subscription warnings (subscription-alerts.py) and the dashboard; a set expires warns there, not in Alertmanager.
[domains."holy-grail.ch"]
expires = 2027-02-17
registrar = "GoDaddy"
renew = "yearly at godaddy.com"
dns = "Cloudflare"

# Free DDNS hostnames (No-IP). No-IP sends a confirm mail every 30 days and deletes an unconfirmed free hostname; the deadline is not readable from outside, so the check is "still resolves, to the WAN address".
[ddns."lang-tool.ddns.net"]
[ddns."wg-aemtli.ddns.net"]

# DuckDNS (no confirm mail; the duckdns container keeps it updated). Replaces lang-tool.ddns.net.
[ddns."minerva-lt.duckdns.org"]
