# Domains and DDNS hostnames watched by status_exporter.py domains (README "Expiry and disk health"). No secrets: the repo is public.

# Registered domains, checked over RDAP. .ch RDAP publishes no end date: without `expires` the next registration anniversary is used (the earliest the paid year can end).
# After each renewal set the real end date from the registrar: expires = 2028-02-17 (no quotes).
# registrar / renew / dns: shown in the subscription warnings (subscription-alerts.py) and the dashboard; a set expires warns there, not in Alertmanager.
[domains."holy-grail.ch"]
expires = 2027-02-17
registrar = "GoDaddy"
renew = "yearly at godaddy.com"
dns = "Cloudflare"

# Free DDNS hostnames (No-IP). No-IP deletes an unconfirmed free hostname after 30 days (confirm mail ~7 days before; deleted ON the end date). The deadline is not readable from outside: `confirmed` = the day you last confirmed (TOML date, no quotes), end date = confirmed + 30 days.
# subscription-alerts.py sends Telegram warnings (7, 3, 1 days left, deadline day morning, day after) and the dashboard/digest show the end date. After each confirm set the new date: confirmed = 2026-12-09. Without `confirmed` there is no timer; the resolve check (DdnsHostnameNotResolving) stays as the backstop.
[ddns."lang-tool.ddns.net"]
confirmed = 2026-11-10
[ddns."wg-aemtli.ddns.net"]
confirmed = 2026-11-10
