global:
  scrape_interval: 5s

# Where firing alerts go. Without this the rules evaluate and then die quietly in
# the Prometheus UI, which is how the 2026-10-04 outage lasted 24 hours.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "raspberry-pi"
    static_configs:
      - targets:
          - node-exporter:9100

  # Traefik metrics (per-router/service request counts). Traefik is in a
  # different compose project/network, so scrape it via the host-published
  # internal entrypoint (:8080, LAN-only).
  - job_name: "traefik"
    static_configs:
      - targets:
          - "192.168.1.2:8080"

  # ---------------------------------------------------------------------------
  # Public endpoint probes (blackbox).
  #
  # Added after the 2026-10-04 outage: a failed Traefik plugin download
  # invalidated the websecure entrypoint middleware, every public router went
  # away, and all hostnames returned 404 for ~24 hours. Traefik's process,
  # container and metrics endpoint were all healthy throughout, so this is the
  # only kind of check that would have caught it - an outside-in probe that
  # treats 404 as failure.
  #
  # 60s, not the global 5s: these leave the house and go through Cloudflare.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-public"
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [http_public]
    static_configs:
      - targets:
          - https://audiobookshelf.holy-grail.ch/
          - https://sso.holy-grail.ch/
          - https://claude-mockups.holy-grail.ch/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Cup container-update counts, via json-exporter.
  #
  # Scraped through the host-published port rather than the container name because
  # Cup lives in a different compose project/network - the same reason the traefik
  # job above uses 192.168.1.2:8080.
  #
  # 15m: Cup itself only refreshes weekly (Sundays 04:00), so anything faster is
  # just load for a number that cannot have changed.
  # ---------------------------------------------------------------------------
  - job_name: "cup"
    scrape_interval: 15m
    scrape_timeout: 60s
    metrics_path: /probe
    params:
      module: [default]
    static_configs:
      - targets:
          - http://192.168.1.2:8000/api/v3/json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: json-exporter:7979
      - target_label: instance
        replacement: cup
