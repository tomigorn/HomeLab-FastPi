global:
  # 15s is the standard resolution; no rule needs finer (all windows are >=15m).
  # scrape_timeout < interval so a slow scrape on a loaded Pi doesn't read as down.
  scrape_interval: 15s
  scrape_timeout: 10s

# Where firing alerts go. Without this the rules evaluate and then die quietly in
# the Prometheus UI, which is how the 2026-10-04 outage lasted 24 hours.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "raspberry-pi"
    static_configs:
      - targets:
          - node-exporter:9100

  # Self-scrape: rule failures, dropped notifications, failed reloads, TSDB trouble (rules/prometheus-self.yml).
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  # Alertmanager's own health, so "the notifier is down" is itself detectable.
  - job_name: "alertmanager"
    static_configs:
      - targets:
          - alertmanager:9093

  # CrowdSec engine metrics (decisions, alerts, parsers, buckets, LAPI), served on
  # the crowdsec docker network only. Feeds the "CrowdSec" Grafana dashboard.
  # 30s is plenty: these are slow-moving counters and the global 15s is wasteful.
  - job_name: "crowdsec"
    scrape_interval: 30s
    static_configs:
      - targets:
          - crowdsec:6060

  # Traefik metrics (per-router/service request counts). Traefik is in a
  # different compose project/network, so scrape it via the host-published
  # internal entrypoint (:8080, LAN-only).
  - job_name: "traefik"
    static_configs:
      - targets:
          - "192.168.1.2:8080"

  # ---------------------------------------------------------------------------
  # Public endpoint probes (blackbox).
  #
  # Added after the 2026-10-04 outage: a failed Traefik plugin download
  # invalidated the websecure entrypoint middleware, every public router went
  # away, and all hostnames returned 404 for ~24 hours. Traefik's process,
  # container and metrics endpoint were all healthy throughout, so this is the
  # only kind of check that would have caught it - an outside-in probe that
  # treats 404 as failure.
  #
  # 60s, not the global 15s: these leave the house and go through Cloudflare.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-public"
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [http_public]
    static_configs:
      - targets:
          - https://audiobookshelf.holy-grail.ch/
          - https://sso.holy-grail.ch/
          - https://claude-mockups.holy-grail.ch/
          # Jellyfin is deliberately NOT probed. Its route has no forward auth,
          # so a request goes straight to the beefy wake gate, and a 60s probe
          # sent a WoL every time beefy idled off: ~90 boots a day, beefy never
          # actually asleep (2026-10-09 → 2026-10-11). The routes above still
          # catch an edge-wide outage. Do not re-add it without a non-waking
          # health path.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Routes that MUST be behind Authentik.
  #
  # Separate job because the pass condition is stricter: only a 302 to
  # sso.holy-grail.ch counts. In the http_public job above a 200 is healthy, which
  # is why cup.holy-grail.ch sat wide open for months while its probe stayed
  # green. Here a 200 means the forwardAuth middleware is gone, and fails.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-gated"
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [http_gated]
    static_configs:
      - targets:
          - https://cup.holy-grail.ch/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Admin apps locked to LAN/VPN (local-networks@file before authentik@file).
  #
  # Healthy = 403 from this probe, which reaches the edge from outside the local
  # zone. A 200/302 means the lockdown leaked and the app is publicly reachable
  # again; 404/5xx means the route is gone. Both fail; see public-endpoints.yml.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-lan-locked"
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [http_forbidden]
    static_configs:
      - targets:
          - https://radarr.holy-grail.ch/
          - https://sonarr.holy-grail.ch/
          - https://prowlarr.holy-grail.ch/
          - https://bazarr.holy-grail.ch/
          - https://qbittorrent.holy-grail.ch/
          - https://sabnzbd.holy-grail.ch/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # beefy power state: up = sshd answers.
  #
  # Added 2026-10-11 after a 60s HTTPS probe of the Jellyfin route woke beefy
  # every time it idled off - ~180 boots over 2.5 days and nothing noticed. This
  # is the history that would have shown it; beefy-power.yml alerts on it.
  #
  # Probes 192.168.1.102:22 DIRECTLY, never a Traefik hostname: anything routed
  # through a *-wake middleware sends a WoL when beefy is down. Port 22 is also
  # excluded from beefy's idle watcher, so this probe cannot keep it awake.
  # Down is normal - beefy is asleep most of the day - so nothing alerts on
  # probe_success == 0 for this job.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-beefy"
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 192.168.1.102:22
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: beefy
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # tower power state and health, same rules as the beefy job above: probe the
  # LAN IP DIRECTLY (a Traefik hostname would go through tower-wake and send a
  # WoL), and never alert on "down" alone - tower sleeps most of the day.
  #
  # Two probes because tower can be up yet useless: on 2026-09-14 its Unraid
  # trial expired, the array never started, Nextcloud never came up and the
  # idle-shutdown (installed only after array start) never ran - and nothing
  # noticed for a month. sshd answers ~30 s before the array, Nextcloud only
  # after it, so "22 up but 8080 down for 30 min" means array/licence/Docker
  # trouble. tower-power.yml alerts on exactly that, plus a wake loop.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-tower"
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 192.168.1.101:22
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: tower
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Guard for the 2026-10-16 scanner wake-loop fix: a scanner path on the public
  # Nextcloud host must be answered 403 by Traefik's nextcloud-scanner-paths
  # router BEFORE the tower-wake gate. 15m interval on purpose: if that router
  # ever disappears, this probe itself would pass the gate and wake tower, so it
  # must not fire often. tower-power.yml alerts on a single failed probe.
  - job_name: "blackbox-tower-guard"
    scrape_interval: 15m
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_forbidden]
    static_configs:
      - targets:
          - https://cloud.holy-grail.ch/.env
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: tower-scanner-guard
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # A real page load, not just "port open": on 2026-10-17 the port answered and
  # /status.php said 200 while every page returned 500 (a crash left the
  # user_oidc app's files empty) and nothing noticed for 8 hours. /login must
  # answer 302 (redirect to the Authentik login). Direct LAN IP, so it cannot
  # wake tower; tower's idle-shutdown ignores the Blackbox User-Agent.
  - job_name: "blackbox-tower-nextcloud"
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_nextcloud_login]
    static_configs:
      - targets:
          - http://192.168.1.101:8080/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: tower-nextcloud
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Cup container-update counts, via json-exporter.
  #
  # Scraped through the host-published port rather than the container name because
  # Cup lives in a different compose project/network. Since 2026-10-19 Cup publishes
  # 8000 only on 172.24.0.1 (the traefik_proxy bridge gateway), not on the LAN, so
  # its unauthenticated API is no longer open to LAN/VPN clients.
  #
  # 15m: Cup itself only refreshes weekly (Sundays 04:00), so anything faster is
  # just load for a number that cannot have changed.
  # ---------------------------------------------------------------------------
  - job_name: "cup"
    scrape_interval: 15m
    scrape_timeout: 60s
    metrics_path: /probe
    params:
      module: [default]
    static_configs:
      - targets:
          - http://172.24.0.1:8000/api/v3/json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: json-exporter:7979
      - target_label: instance
        replacement: cup

  # ---------------------------------------------------------------------------
  # AdGuard DNS functional probe.
  #
  # AdGuard is the LAN's DHCP DNS resolver - edge-critical. Until now it was only
  # watched at container level (ContainerDown), which misses the case where the
  # container stays up but resolution is broken (wrong upstream, bad filter, empty
  # answers). This resolves a known wildcard *.holy-grail.ch name against AdGuard
  # directly (192.168.1.2:53) and fails unless it returns the expected A record.
  #
  # Named blackbox-* so BlackboxExporterDown and the Alertmanager inhibition rules
  # cover it. See prometheus/rules/adguard-dns.yml.
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-adguard-dns"
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [dns_adguard_holy_grail]
    static_configs:
      - targets:
          - 192.168.1.2:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: adguard-dns
      - target_label: __address__
        replacement: blackbox-exporter:9115
