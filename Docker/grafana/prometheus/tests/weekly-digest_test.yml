# promtool test rules tests/weekly-digest_test.yml
# promtool time 0 is Thursday 1970-01-01 00:00 UTC: Monday 5 January = 4d, Monday 1 June = 151d.
rule_files:
  - ../rules/weekly-digest.yml
evaluation_interval: 1m
tests:
  - name: winter Monday 05:00 CET is 04:00 UTC
    interval: 1m
    input_series:
      - series: 'download_integrity_corrupt_total{host="beefy",client="sabnzbd"}'
        values: '3x6200'
      - series: 'security_pending_updates{host="fastpi",type="all"}'
        values: '5x6200'
      - series: 'security_pending_updates{host="fastpi",type="security"}'
        values: '1x6200'
      - series: 'security_pending_updates{host="beefy",type="all"}'
        values: '0x6200'
      - series: 'security_pending_updates{host="beefy",type="security"}'
        values: '0x6200'
      - series: 'security_image_updates{host="fastpi",type="all"}'
        values: '2x6200'
      - series: 'security_image_updates{host="beefy",type="all"}'
        values: '1x6200'
      - series: 'security_cup_snapshot_timestamp_seconds{host="fastpi"}'
        values: '356400x6200'
      - series: 'security_cup_snapshot_timestamp_seconds{host="beefy"}'
        values: '200000x6200'
      - series: 'security_image_update_info{host="fastpi",reference="caddy:2.10-alpine",type="minor"}'
        values: '1x6200'
      - series: 'security_image_update_info{host="beefy",reference="lscr.io/linuxserver/radarr:6.4.4",type="digest"}'
        values: '1x6200'
      - series: 'security_image_vulnerabilities_fixable{host="fastpi",severity="CRITICAL"}'
        values: '3x6200'
      - series: 'security_image_vulnerabilities_fixable{host="beefy",severity="CRITICAL"}'
        values: '0x6200'
      - series: 'security_unraid_os_update{installed="7.3.2",available="7.3.3"}'
        values: '1x6200'
      - series: 'security_unraid_plugin_update{plugin="fix.common.problems"}'
        values: '1x6200'
      - series: 'security_unraid_plugin_update{plugin="user.scripts"}'
        values: '0x6200'
      - series: 'crowdsec_autoupdate_result{result="current",from="v1.8.1",to="v1.8.1"}'
        values: '1x6200'
      - series: 'crowdsec_autoupdate_result{result="updated",from="v1.8.1",to="v1.8.1"}'
        values: '0x6200'
      - series: 'crowdsec_bouncer_plugin_outdated'
        values: '0x6200'
      - series: 'clamav_last_run_timestamp_seconds{host="fastpi",mode="new"}'
        values: '356400x6200'
      - series: 'clamav_infected_last_run{host="fastpi",mode="new"}'
        values: '0x6200'
      - series: 'security_rootkit_warnings{host="beefy",tool="chkrootkit"}'
        values: '0x6200'
      - series: 'security_lynis_hardening_index{host="fastpi"}'
        values: '64x6200'
    alert_rule_test:
      - eval_time: 4d3h30m
        alertname: WeeklyUpdateDigest
        exp_alerts: []
      - eval_time: 4d5h
        alertname: WeeklyUpdateDigest
        exp_alerts: []
      - eval_time: 3d4h30m
        alertname: WeeklyUpdateDigest
        exp_alerts: []
      - eval_time: 4d4h
        alertname: WeeklyUpdateDigest
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "Weekly update digest"
              description: |-
                <b>Apt</b> (all / security)
                • beefy: 0 / 0
                • fastpi: 5 / 1

                <b>Images</b> (Cup)
                • beefy: 1 (snapshot as of 1970-01-03 07:33:20 +0000 UTC)
                • fastpi: 2
                • beefy: lscr.io/linuxserver/radarr:6.4.4 (digest)
                • fastpi: caddy:2.10-alpine (minor)

                <b>Fixable critical CVEs</b>
                • beefy: 0
                • fastpi: 3

                <b>Unraid</b>
                • OS 7.3.2 → 7.3.3
                • plugins: fix.common.problems

                <b>CrowdSec</b>
                • engine v1.8.1 (current)
                • bouncer plugin current

                <b>Antivirus</b> (last new-files scan)
                • fastpi: 1h 0m 0s ago, 0 infected
                • corrupt downloads caught this week: 0

                <b>Rootkit</b> (new findings)
                • beefy/chkrootkit: 0

                <b>Lynis</b>
                • fastpi: 64


  # Only failed local rebuilds (or none successful in 15 days) are listed; a good one is not.
  - name: rebuild section lists failed local rebuilds only
    interval: 1m
    input_series:
      - series: 'rebuild_local_result{host="fastpi",project="Avatar-Picker",result="unchanged",reason=""}'
        values: '1x17000'
      - series: 'rebuild_local_last_ok_timestamp_seconds{host="fastpi",project="Avatar-Picker"}'
        values: '300000x17000'
      - series: 'rebuild_local_result{host="fastpi",project="Stonks",result="test_failed",reason="x"}'
        values: '1x17000'
      - series: 'rebuild_local_last_ok_timestamp_seconds{host="fastpi",project="Stonks"}'
        values: '300000x17000'
      - series: 'auto_update_result{host="fastpi",project="Wiki",tier="auto",ref="caddy:alpine",result="current"}'
        values: '1x17000'
    alert_rule_test:
      - eval_time: 4d4h
        alertname: WeeklyUpdateDigest
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "Weekly update digest"
              description: |-
                <b>Apt</b> (all / security)
                • no data

                <b>Images</b> (Cup)
                • no data

                <b>Rebuild</b> (weekly local builds: failed or no success in 15 days)
                • fastpi: Stonks (test_failed)

                <b>Fixable critical CVEs</b>
                • no data

                <b>Unraid</b>
                • no data
                • plugins: none

                <b>CrowdSec</b>
                • no data
                • bouncer plugin no data

                <b>Antivirus</b> (last new-files scan)
                • no data
                • corrupt downloads caught this week: no data

                <b>Rootkit</b> (new findings)
                • no data

                <b>Lynis</b>
                • no data

  # Acceptance entries expired or expiring within 14 days are listed for re-review; one 30 days out is not. 4d4h = 360000 s.
  - name: acceptance section lists entries due for re-review
    interval: 1m
    input_series:
      - series: 'security_accept_expiry_timestamp_seconds{id="CVE-2026-1",scope="usr/local/bin/gosu"}'
        values: '1000000x17000'
      - series: 'security_accept_expiry_timestamp_seconds{id="CVE-2026-2",scope="pkg:pypi/setuptools@70.3.0"}'
        values: '300000x17000'
      - series: 'security_accept_expiry_timestamp_seconds{id="CVE-2026-3",scope="usr/bin/x"}'
        values: '3000000x17000'
    alert_rule_test:
      - eval_time: 4d4h
        alertname: WeeklyUpdateDigest
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "Weekly update digest"
              description: |-
                <b>Apt</b> (all / security)
                • no data

                <b>Images</b> (Cup)
                • no data

                <b>Fixable critical CVEs</b>
                • no data

                <b>CVE acceptances to re-review</b> (trivy-accepted.yaml: expired or expiring within 14 days)
                • CVE-2026-1 (usr/local/bin/gosu): expires in 7d 9h 46m 40s
                • CVE-2026-2 (pkg:pypi/setuptools@70.3.0): expired

                <b>Unraid</b>
                • no data
                • plugins: none

                <b>CrowdSec</b>
                • no data
                • bouncer plugin no data

                <b>Antivirus</b> (last new-files scan)
                • no data
                • corrupt downloads caught this week: no data

                <b>Rootkit</b> (new findings)
                • no data

                <b>Lynis</b>
                • no data
