# promtool test rules prometheus-self_test.yml  (see grafana/README.md, Prometheus self-monitoring)
rule_files:
  - ../rules/prometheus-self.yml
evaluation_interval: 1m
tests:
  - name: failed config reload, rule failures, missed evaluations
    interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="localhost:9090"}'
        values: '1x5 0x30'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="localhost:9090",rule_group="/etc/prometheus/rules/host.yml;host"}'
        values: '0+1x30'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="localhost:9090",rule_group="/etc/prometheus/rules/containers.yml;containers"}'
        values: '0x30'
      - series: 'prometheus_rule_group_iterations_missed_total{job="prometheus",instance="localhost:9090",rule_group="/etc/prometheus/rules/host.yml;host"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 25m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus config reload failed; it still runs the old config"
              description: "docker logs --since 1h prometheus | grep -i reload; then docker exec prometheus promtool check config /etc/prometheus/prometheus.yml."
      - eval_time: 25m
        alertname: PrometheusRuleFailures
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090", rule_group: "/etc/prometheus/rules/host.yml;host"}
            exp_annotations:
              summary: "Prometheus rules failing to evaluate: /etc/prometheus/rules/host.yml;host"
              description: "Alerts in this group cannot fire. Error: http://localhost:9090/rules (ssh -L 9090:127.0.0.1:9090 fastpi) or docker logs --since 1h prometheus | grep -i 'evaluating rule'."
      - eval_time: 25m
        alertname: PrometheusMissingRuleEvaluations
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090", rule_group: "/etc/prometheus/rules/host.yml;host"}
            exp_annotations:
              summary: "Prometheus skips evaluations of /etc/prometheus/rules/host.yml;host"
              description: "The group takes longer than its interval (the Pi is overloaded or a query is too heavy). Check: top; http://localhost:9090/rules for the slow group."

  - name: alert delivery to Alertmanager failing, dropped, or no Alertmanager
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_sent_total{job="prometheus",instance="localhost:9090",alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: '0+10x30'
      - series: 'prometheus_notifications_errors_total{job="prometheus",instance="localhost:9090",alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: '0x5 0+5x25'
      - series: 'prometheus_notifications_dropped_total{job="prometheus",instance="localhost:9090"}'
        values: '0+1x30'
      - series: 'prometheus_notifications_alertmanagers_discovered{job="prometheus",instance="localhost:9090"}'
        values: '1x5 0x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusErrorSendingAlerts
        exp_alerts: []
      - eval_time: 28m
        alertname: PrometheusErrorSendingAlerts
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090", alertmanager: "http://alertmanager:9093/api/v2/alerts"}
            exp_annotations:
              summary: "Prometheus fails to send 50% of alerts to http://alertmanager:9093/api/v2/alerts"
              description: "Alerts are not reaching Alertmanager. Check: docker logs --since 1h prometheus | grep -i notifier; curl -s 127.0.0.1:9093/-/ready."
      - eval_time: 28m
        alertname: PrometheusNotificationsDropped
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus is dropping alerts before they reach Alertmanager"
              description: "The notification queue overflows or Alertmanager rejects them. Check: docker logs --since 1h prometheus | grep -i notifier."
      - eval_time: 28m
        alertname: PrometheusNotConnectedToAlertmanagers
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus has no Alertmanager to send to"
              description: "No alert can be delivered. Check the alerting: block in prometheus.yml and that the alertmanager container runs."

  - name: TSDB compactions, reloads, WAL corruption, ingestion stopped
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_compactions_failed_total{job="prometheus",instance="localhost:9090"}'
        values: '0+1x330'
      - series: 'prometheus_tsdb_reloads_failures_total{job="prometheus",instance="localhost:9090"}'
        values: '0x330'
      - series: 'prometheus_tsdb_wal_corruptions_total{job="prometheus",instance="localhost:9090"}'
        values: '0x10 1x320'
      - series: 'prometheus_tsdb_head_samples_appended_total{job="prometheus",instance="localhost:9090",type="float"}'
        values: '0+100x200 20000x130'
      - series: 'prometheus_tsdb_head_samples_appended_total{job="prometheus",instance="localhost:9090",type="histogram"}'
        values: '0x330'
    alert_rule_test:
      - eval_time: 3h
        alertname: PrometheusTSDBCompactionsFailing
        exp_alerts: []
      - eval_time: 5h
        alertname: PrometheusTSDBCompactionsFailing
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus TSDB compactions are failing"
              description: "Blocks are not compacted, so disk use and memory grow. Check: docker logs --since 6h prometheus | grep -i compact; df -h /."
      - eval_time: 5h
        alertname: PrometheusTSDBReloadsFailing
        exp_alerts: []
      - eval_time: 1h
        alertname: PrometheusTSDBWALCorruptions
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus found a corrupted WAL"
              description: "Recent samples may be lost (unclean shutdown or disk errors). Check: docker logs --since 6h prometheus | grep -i wal; sudo dmesg | grep -i nvme."
      - eval_time: 3h
        alertname: PrometheusNotIngestingSamples
        exp_alerts: []
      - eval_time: 4h
        alertname: PrometheusNotIngestingSamples
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations:
              summary: "Prometheus stopped storing samples"
              description: "Scrapes run but nothing is written; dashboards and alerts go blank. Check: docker logs --since 1h prometheus; df -h /."

  - name: TargetDown covers scrape targets, not probes of sleeping hosts or jobs with their own alert
    interval: 1m
    input_series:
      - series: 'up{job="raspberry-pi",instance="node-exporter:9100"}'
        values: '1x3 0x20'
      - series: 'up{job="traefik",instance="traefik:8080"}'
        values: '1x23'
      - series: 'up{job="blackbox-beefy",instance="beefy"}'
        values: '0x23'
      - series: 'up{job="alertmanager",instance="alertmanager:9093"}'
        values: '0x23'
      - series: 'up{job="cup",instance="cup"}'
        values: '0x23'
    alert_rule_test:
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: warning, job: raspberry-pi, instance: "node-exporter:9100"}
            exp_annotations:
              summary: "Prometheus cannot scrape raspberry-pi (node-exporter:9100)"
              description: "Down for 5 min; every alert built on this job is blind. Why: the error column at http://localhost:9090/targets (ssh -L 9090:127.0.0.1:9090 fastpi), then docker ps -a for its container."
