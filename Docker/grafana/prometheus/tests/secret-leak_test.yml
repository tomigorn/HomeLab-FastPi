# promtool test rules tests/secret-leak_test.yml
rule_files:
  - ../rules/security-posture.yml
evaluation_interval: 1m
tests:
  - name: leak alert links the repo's real GitHub URL
    interval: 1m
    input_series:
      - series: 'security_repo_leaks_total{repo="wg-chores",url="https://github.com/tomigorn/WG-Chores",instance="node-exporter:9100"}'
        values: '1x5'
      - series: 'security_repo_leaks_total{repo="fastpi",url="https://github.com/tomigorn/HomeLab-FastPi",instance="node-exporter:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: SecretLeakedInPublicRepo
        exp_alerts:
          - exp_labels: {severity: critical, repo: wg-chores, url: "https://github.com/tomigorn/WG-Chores", instance: "node-exporter:9100"}
            exp_annotations:
              summary: "1 secret(s) found in the PUBLIC wg-chores repo history"
              description: "Secrets in the published history of https://github.com/tomigorn/WG-Chores. Assume disclosed and rotate; rewriting history recalls nothing. Details: <code>/var/lib/security-scan/gitleaks-wg-chores.json</code> on fastpi."
