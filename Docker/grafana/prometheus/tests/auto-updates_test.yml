# promtool test rules tests/auto-updates_test.yml
rule_files:
  - ../rules/auto-updates.yml
evaluation_interval: 1m
tests:
  - name: summary for one hour after a run with changes, nothing for a quiet run
    interval: 1m
    input_series:
      - series: 'auto_update_result{project="DDNS",tier="auto",ref="lscr.io/linuxserver/duckdns:latest",result="updated",from="aaaaaaaaaaaa",to="bbbbbbbbbbbb"}'
        values: '1x200'
      - series: 'auto_update_result{project="Home-Assistant",tier="notify",ref="ghcr.io/home-assistant/home-assistant:stable",result="available",from="cccccccccccc",to="dddddddddddd",command="update-project.sh /x pull ./config"}'
        values: '1x200'
      - series: 'auto_update_result{project="Claude-Mockups",tier="auto",ref="caddy:alpine",result="current",from="eeeeeeeeeeee",to="eeeeeeeeeeee"}'
        values: '1x200'
      - series: 'auto_update_last_run_timestamp_seconds'
        values: '0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: AutoUpdateNightly
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Nightly auto-update"
              description: |-
                <b>DDNS</b> lscr.io/linuxserver/duckdns:latest: updated (aaaaaaaaaaaa → bbbbbbbbbbbb)
                <b>Home-Assistant</b> ghcr.io/home-assistant/home-assistant:stable: available (cccccccccccc → dddddddddddd)
                <code>update-project.sh /x pull ./config</code>
                Waiting out the cool-down: 0. Log: journalctl -u auto-update
      - eval_time: 61m
        alertname: AutoUpdateNightly
        exp_alerts: []

  - name: quiet run sends nothing
    interval: 1m
    input_series:
      - series: 'auto_update_result{project="Claude-Mockups",tier="auto",ref="caddy:alpine",result="current",from="e",to="e"}'
        values: '1x60'
      - series: 'auto_update_last_run_timestamp_seconds'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: AutoUpdateNightly
        exp_alerts: []

  - name: failed rollback pages
    interval: 1m
    input_series:
      - series: 'auto_update_result{project="DDNS",tier="auto",ref="x:latest",result="rollback_failed",from="a",to="b"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: AutoUpdateRollbackFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              project: DDNS
              tier: auto
              ref: "x:latest"
              result: rollback_failed
              from: a
              to: b
            exp_annotations:
              summary: "DDNS: auto-update rollback failed"
              description: |-
                x:latest (a → b) failed verification and the rollback did not verify.
                cd /home/pi/Projects/Docker/DDNS && docker compose ps ; journalctl -u auto-update ; backups in ~/backups/pre-update/

  - name: no run for two days
    interval: 1m
    input_series:
      - series: 'auto_update_last_run_timestamp_seconds'
        values: '0x3100'
    alert_rule_test:
      - eval_time: 47h
        alertname: AutoUpdateNotRunning
        exp_alerts: []
      - eval_time: 50h
        alertname: AutoUpdateNotRunning
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Nightly auto-update has not run for 2d 2h 0m 0s"
              description: "systemctl status auto-update.timer auto-update.service ; journalctl -u auto-update"
