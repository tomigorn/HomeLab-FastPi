# promtool test rules tests/auto-updates_test.yml
rule_files:
  - ../rules/auto-updates.yml
evaluation_interval: 1m
tests:
  - name: summary for one hour after a run with changes, nothing for a quiet run
    interval: 1m
    input_series:
      - series: 'auto_update_result{host="fastpi",project="DDNS",tier="auto",ref="lscr.io/linuxserver/duckdns:latest",result="updated",from="aaaaaaaaaaaa",to="bbbbbbbbbbbb"}'
        values: '1x200'
      - series: 'auto_update_result{host="fastpi",project="Home-Assistant",tier="notify",ref="ghcr.io/home-assistant/home-assistant:stable",result="available",from="cccccccccccc",to="dddddddddddd",command="update-project.sh /x pull ./config"}'
        values: '1x200'
      - series: 'auto_update_result{host="fastpi",project="Claude-Mockups",tier="auto",ref="caddy:alpine",result="current",from="eeeeeeeeeeee",to="eeeeeeeeeeee"}'
        values: '1x200'
      - series: 'auto_update_last_run_timestamp_seconds{host="fastpi"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: AutoUpdateNightly
        exp_alerts:
          - exp_labels:
              severity: info
              host: fastpi
            exp_annotations:
              summary: "Nightly auto-update fastpi"
              description: |-
                <b>DDNS</b> lscr.io/linuxserver/duckdns:latest: updated (aaaaaaaaaaaa → bbbbbbbbbbbb)
                <b>Home-Assistant</b> ghcr.io/home-assistant/home-assistant:stable: available (cccccccccccc → dddddddddddd)
                <code>update-project.sh /x pull ./config</code>
                Waiting out the cool-down: 0. Log: journalctl -u auto-update on fastpi
      - eval_time: 61m
        alertname: AutoUpdateNightly
        exp_alerts: []

  - name: omitted results get a tail line
    interval: 1m
    input_series:
      - series: 'auto_update_result{host="fastpi",project="DDNS",tier="auto",ref="x:latest",result="rolled_back",from="a",to="b"}'
        values: '1x60'
      - series: 'auto_update_omitted{host="fastpi"}'
        values: '7x60'
      - series: 'auto_update_last_run_timestamp_seconds{host="fastpi"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: AutoUpdateNightly
        exp_alerts:
          - exp_labels:
              severity: info
              host: fastpi
            exp_annotations:
              summary: "Nightly auto-update fastpi"
              description: |-
                <b>DDNS</b> x:latest: rolled_back (a → b)
                … 7 more, see journalctl -u auto-update on fastpi
                Waiting out the cool-down: 0. Log: journalctl -u auto-update on fastpi

  - name: quiet run sends nothing
    interval: 1m
    input_series:
      - series: 'auto_update_result{host="fastpi",project="Claude-Mockups",tier="auto",ref="caddy:alpine",result="current",from="e",to="e"}'
        values: '1x60'
      - series: 'auto_update_last_run_timestamp_seconds{host="fastpi"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: AutoUpdateNightly
        exp_alerts: []

  - name: failed rollback pages
    interval: 1m
    input_series:
      - series: 'auto_update_result{host="fastpi",project="DDNS",tier="auto",ref="x:latest",result="rollback_failed",from="a",to="b"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: AutoUpdateRollbackFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              host: fastpi
              project: DDNS
              tier: auto
              ref: "x:latest"
              result: rollback_failed
              from: a
              to: b
            exp_annotations:
              summary: "fastpi DDNS: auto-update rollback failed"
              description: |-
                x:latest (a → b) failed verification and the rollback did not verify.
                ssh fastpi: cd ~/Projects/Docker/DDNS && docker compose ps (beefy: sudo docker) ; journalctl -u auto-update ; backups in ~/backups/pre-update/

  - name: no run for two days
    interval: 1m
    input_series:
      - series: 'auto_update_last_run_timestamp_seconds{host="fastpi"}'
        values: '0x3100'
    alert_rule_test:
      - eval_time: 47h
        alertname: AutoUpdateNotRunning
        exp_alerts: []
      - eval_time: 50h
        alertname: AutoUpdateNotRunning
        exp_alerts:
          - exp_labels:
              severity: info
              host: fastpi
            exp_annotations:
              summary: "Nightly auto-update on fastpi has not run for 2d 2h 0m 0s"
              description: "systemctl status auto-update.timer auto-update.service ; journalctl -u auto-update (beefy: its file reaches fastpi with the 04:20 security-av pull)"

  - name: two hosts, one message each, each with only its own results
    interval: 1m
    input_series:
      - series: 'auto_update_result{host="fastpi",project="DDNS",tier="auto",ref="x:latest",result="updated",from="a",to="b"}'
        values: '1x200'
      - series: 'auto_update_last_run_timestamp_seconds{host="fastpi"}'
        values: '0x200'
      - series: 'auto_update_result{host="beefy",project="Cup-Agent",tier="auto",ref="alpine/socat:latest",result="rolled_back",from="c",to="d"}'
        values: '1x200'
      - series: 'auto_update_result{host="beefy",project="Seerr",tier="notify",ref="s:1",result="current",from="e",to="e"}'
        values: '1x200'
      - series: 'auto_update_result{host="beefy",project="Ryot",tier="notify",ref="r:1",result="waiting",from="f",to="g"}'
        values: '1x200'
      - series: 'auto_update_omitted{host="beefy"}'
        values: '2x200'
      # beefy ran 70 min after fastpi; its file exists from then on
      - series: 'auto_update_last_run_timestamp_seconds{host="beefy"}'
        values: '_x69 4200x130'
    alert_rule_test:
      - eval_time: 30m
        alertname: AutoUpdateNightly
        exp_alerts:
          - exp_labels:
              severity: info
              host: fastpi
            exp_annotations:
              summary: "Nightly auto-update fastpi"
              description: |-
                <b>DDNS</b> x:latest: updated (a → b)
                Waiting out the cool-down: 0. Log: journalctl -u auto-update on fastpi
      - eval_time: 80m
        alertname: AutoUpdateNightly
        exp_alerts:
          - exp_labels:
              severity: info
              host: beefy
            exp_annotations:
              summary: "Nightly auto-update beefy"
              description: |-
                <b>Cup-Agent</b> alpine/socat:latest: rolled_back (c → d)
                … 2 more, see journalctl -u auto-update on beefy
                Waiting out the cool-down: 1. Log: journalctl -u auto-update on beefy
