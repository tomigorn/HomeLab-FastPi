rule_files:
  - ../rules/adguard-dns.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-adguard-dns", instance="adguard-dns"}'
        values: '1x5 0x10'
    alert_rule_test:
      # Healthy, then 4 minutes before the 3m `for:` has elapsed on the failure.
      - eval_time: 4m
        alertname: AdGuardDnsResolutionFailing
        exp_alerts: []
      # Resolution has been failing well past the 3m hold.
      - eval_time: 12m
        alertname: AdGuardDnsResolutionFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-adguard-dns
              instance: adguard-dns
            exp_annotations:
              summary: "AdGuard DNS is not resolving correctly"
              description: "The AdGuard resolver (192.168.1.2:53) has not returned the expected answer for a known *.holy-grail.ch name for 3 minutes. AdGuard may be up but misconfigured, or its upstream may be broken; every LAN device that uses it for DNS is affected. Check `docker logs adguardhome` and the AdGuard query log."
