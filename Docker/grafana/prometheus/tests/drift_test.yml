# promtool test rules tests/drift_test.yml  (README "Run the rule tests")
rule_files:
  - ../rules/drift.yml
evaluation_interval: 5m
tests:
  - name: drift seen for less than a day does not page
    interval: 5m
    input_series:
      - series: 'drift_items{host="fastpi",kind="compose"}'
        values: '0x24 5x250'
    alert_rule_test:
      - eval_time: 22h
        alertname: RepoDriftPersists
        exp_alerts: []

  - name: drift that stays for a day pages per host and kind, zero kinds stay quiet
    interval: 5m
    input_series:
      - series: 'drift_items{host="fastpi",kind="compose"}'
        values: '5x420'
      - series: 'drift_items{host="beefy",kind="unit"}'
        values: '12x420'
      - series: 'drift_items{host="fastpi",kind="script"}'
        values: '0x420'
    alert_rule_test:
      - eval_time: 25h
        alertname: RepoDriftPersists
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi, kind: compose}
            exp_annotations:
              summary: "fastpi: 5 compose items differ from the repo"
              description: "Changed live, not in the repo (or the reverse) for a day. The list: section Drift of the notes page homelab-architecture, or <code>python3 Docker/_global/scripts/repo_drift.py --host fastpi --prom /dev/null --json /dev/null</code> on that host."
          - exp_labels: {severity: warning, host: beefy, kind: unit}
            exp_annotations:
              summary: "beefy: 12 unit items differ from the repo"
              description: "Changed live, not in the repo (or the reverse) for a day. The list: section Drift of the notes page homelab-architecture, or <code>python3 Docker/_global/scripts/repo_drift.py --host beefy --prom /dev/null --json /dev/null</code> on that host."

  - name: drift that is fixed clears
    interval: 5m
    input_series:
      - series: 'drift_items{host="fastpi",kind="etc"}'
        values: '3x360 0x60'
    alert_rule_test:
      - eval_time: 28h
        alertname: RepoDriftPersists
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi, kind: etc}
            exp_annotations:
              summary: "fastpi: 3 etc items differ from the repo"
              description: "Changed live, not in the repo (or the reverse) for a day. The list: section Drift of the notes page homelab-architecture, or <code>python3 Docker/_global/scripts/repo_drift.py --host fastpi --prom /dev/null --json /dev/null</code> on that host."
      - eval_time: 35h
        alertname: RepoDriftPersists
        exp_alerts: []

  - name: a stale or missing check pages, a fresh one does not
    interval: 5m
    input_series:
      - series: 'drift_last_run_timestamp_seconds{host="fastpi"}'
        values: '0+300x360 108000x360'
      - series: 'drift_last_run_timestamp_seconds{host="beefy"}'
        values: '0+300x960'
    alert_rule_test:
      - eval_time: 29h
        alertname: RepoDriftCheckStale
        exp_alerts: []
      - eval_time: 70h
        alertname: RepoDriftCheckStale
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi}
            exp_annotations:
              summary: "Drift check has not run for fastpi in over a day and a half"
              description: "A silent check shows no drift. Look at <code>systemctl status repo-drift.timer</code> and <code>journalctl -u repo-drift</code> on the host (beefy: it only runs in its 03:58-04:45 window)."

  - name: no drift series at all pages for fastpi
    interval: 5m
    input_series:
      - series: 'up{job="x"}'
        values: '1x420'
    alert_rule_test:
      - eval_time: 1h
        alertname: RepoDriftCheckStale
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi}
            exp_annotations:
              summary: "Drift check has not run for fastpi in over a day and a half"
              description: "A silent check shows no drift. Look at <code>systemctl status repo-drift.timer</code> and <code>journalctl -u repo-drift</code> on the host (beefy: it only runs in its 03:58-04:45 window)."

  - name: a failing collection pages after a day
    interval: 5m
    input_series:
      - series: 'drift_collect_errors{host="beefy",kind="compose"}'
        values: '1x360'
      - series: 'drift_collect_errors{host="beefy",kind="unit"}'
        values: '0x360'
    alert_rule_test:
      - eval_time: 10h
        alertname: RepoDriftCollectFailing
        exp_alerts: []
      - eval_time: 26h
        alertname: RepoDriftCollectFailing
        exp_alerts:
          - exp_labels: {severity: warning, host: beefy, kind: compose}
            exp_annotations:
              summary: "beefy: drift check cannot collect compose"
              description: "The compose items are the previous night's. Run it by hand: <code>journalctl -u repo-drift</code> shows the error."
