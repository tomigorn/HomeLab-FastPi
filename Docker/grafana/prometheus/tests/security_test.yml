# promtool test rules tests/security_test.yml
rule_files:
  - ../rules/security-posture.yml
evaluation_interval: 1m
tests:
  - name: failed logins above 20 per 24 h
    interval: 1m
    input_series:
      - series: 'security_failed_logins_total{host="beefy",instance="node-exporter:9100"}'
        values: '21x60'
      - series: 'security_failed_logins_total{host="fastpi",instance="node-exporter:9100"}'
        values: '20x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: FailedLoginsSpike
        exp_alerts: []
      - eval_time: 20m
        alertname: FailedLoginsSpike
        exp_alerts:
          - exp_labels: {severity: info, host: beefy, instance: "node-exporter:9100"}
            exp_annotations:
              summary: "beefy: 21 failed SSH logins in 24 h"
              description: "More than 20 sshd lines with Failed password / Invalid user / authentication failure in the last 24 h. SSH is LAN-only, so the source is inside the LAN or VPN. Look: journalctl _COMM=sshd (fastpi), /var/log/auth.log (beefy), /var/log/syslog (tower)."

  - name: rootkit findings outside the baseline
    interval: 1m
    input_series:
      - series: 'security_rootkit_warnings{host="beefy",tool="chkrootkit"}'
        values: '1x30'
      - series: 'security_rootkit_warnings{host="fastpi",tool="rkhunter"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: RootkitWarning
        exp_alerts:
          - exp_labels: {severity: info, host: beefy, tool: chkrootkit}
            exp_annotations:
              summary: "beefy: 1 new chkrootkit finding(s)"
              description: "Findings not in the accepted baseline are marked NEW in /var/lib/security-scan/audit-beefy.txt on fastpi. Check them by hand; a false positive is accepted by deleting /var/lib/security-scan/audit-accepted-beefy-chkrootkit.txt and running systemctl start security-audit.service."

  - name: lynis hardening index drops more than 5 points in a week
    interval: 1m
    input_series:
      - series: 'security_lynis_hardening_index{host="fastpi"}'
        values: '70x10080 64x200'
      - series: 'security_lynis_hardening_index{host="beefy"}'
        values: '63x10080 58x200'
    alert_rule_test:
      - eval_time: 10070m
        alertname: LynisHardeningDropped
        exp_alerts: []
      - eval_time: 10160m
        alertname: LynisHardeningDropped
        exp_alerts:
          - exp_labels: {severity: info, host: fastpi}
            exp_annotations:
              summary: "fastpi: Lynis hardening index fell to 64 (6 points in 7 days)"
              description: "Something weakened the configuration since last week's audit. The warnings are in /var/lib/security-scan/audit-fastpi.txt on fastpi; the full report is /var/log/lynis-report.dat on the host."

  - name: ssh logins outside the lan or by another user
    interval: 1m
    input_series:
      - series: 'security_ssh_last_login_timestamp_seconds{host="fastpi",user="pi",source_class="lan"}'
        values: '0x120'
      - series: 'security_ssh_last_login_timestamp_seconds{host="fastpi",user="pi",source_class="vpn"}'
        values: '600x120'
      - series: 'security_ssh_last_login_timestamp_seconds{host="fastpi",user="deploy",source_class="lan"}'
        values: '600x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: SshLoginOutsideLan
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi, user: pi, source_class: vpn}
            exp_annotations:
              summary: "fastpi: SSH login of pi from vpn"
              description: "Accepted SSH login from outside the LAN (vpn = WireGuard, tunnel = cloudflared, other = unknown address) within the last hour. Source address and key fingerprint: journalctl _COMM=sshd-session | grep Accepted"
      - eval_time: 30m
        alertname: SshLoginUnexpectedUser
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi, user: deploy, source_class: lan}
            exp_annotations:
              summary: "fastpi: SSH login of unexpected user deploy"
              description: "Only pi is expected to log in over SSH. Look: journalctl _COMM=sshd-session | grep Accepted"
      - eval_time: 90m
        alertname: SshLoginOutsideLan
        exp_alerts: []

  - name: lan logins by pi stay quiet
    interval: 1m
    input_series:
      - series: 'security_ssh_last_login_timestamp_seconds{host="fastpi",user="pi",source_class="lan"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: SshLoginOutsideLan
        exp_alerts: []
      - eval_time: 10m
        alertname: SshLoginUnexpectedUser
        exp_alerts: []

  - name: watched file changed
    interval: 1m
    input_series:
      - series: 'security_integrity_changed{host="fastpi",path="/etc/sudoers"}'
        values: '0x5 1x10'
      - series: 'security_integrity_changed{host="fastpi",path="/home/pi/.ssh/authorized_keys"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: SecurityFileChanged
        exp_alerts: []
      - eval_time: 8m
        alertname: SecurityFileChanged
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi, path: /etc/sudoers}
            exp_annotations:
              summary: "fastpi: /etc/sudoers differs from the baseline"
              description: "authorized_keys, sudoers or sshd_config changed (or a file appeared or vanished) since the baseline was accepted. If it was you, accept the new state: sudo rm /var/lib/security-scan/integrity-baseline-fastpi.json && sudo systemctl start security-access.service"

  - name: access scan staleness is one hour
    interval: 1m
    input_series:
      - series: 'security_scan_last_success_timestamp_seconds{subject="integrity-fastpi"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: SecurityAccessScanStale
        exp_alerts: []
      - eval_time: 80m
        alertname: SecurityAccessScanStale
        exp_alerts:
          - exp_labels: {severity: warning, subject: integrity-fastpi}
            exp_annotations:
              summary: "Security scan integrity-fastpi has not succeeded in 1h 20m 0s"
              description: "The 5-minute security-access.timer is not producing fresh SSH login and integrity figures: systemctl status security-access.service"

  - name: staleness thresholds follow each subject's cadence
    interval: 1m
    input_series:
      - series: 'security_scan_last_success_timestamp_seconds{subject="audit-beefy"}'
        values: '0x4400'
      - series: 'security_scan_last_success_timestamp_seconds{subject="logins-tower"}'
        values: '0x4400'
      - series: 'security_scan_last_success_timestamp_seconds{subject="logins-beefy"}'
        values: '0x4400'
      - series: 'security_scan_last_success_timestamp_seconds{subject="cup-beefy"}'
        values: '0x4400'
    alert_rule_test:
      - eval_time: 72h
        alertname: SecurityScanStale
        exp_alerts:
          - exp_labels: {severity: warning, subject: logins-beefy}
            exp_annotations:
              summary: "Security scan logins-beefy has not succeeded in 3d 0h 0m 0s"
              description: "Thresholds differ by subject because the cadences do: the daily secrets/patches scan is stale after 48h (two missed runs, which tolerates one night of beefy staying asleep), tower's daily subjects after 7 days (tower is often off for days), and the weekly image and audit scans and Cup (refreshed weekly) after 14 days. Figures for this subject are still being served from the last success, so the dashboard looks populated."

  - name: unraid OS and plugin updates
    interval: 1m
    input_series:
      - series: 'security_unraid_os_update{installed="7.3.2",available="7.3.3"}'
        values: '1x90'
      - series: 'security_unraid_plugin_update{plugin="fix.common.problems"}'
        values: '1x90'
      - series: 'security_unraid_plugin_update{plugin="user.scripts"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: UnraidUpdateAvailable
        exp_alerts: []
      - eval_time: 70m
        alertname: UnraidUpdateAvailable
        exp_alerts:
          - exp_labels: {severity: info, installed: "7.3.2", available: "7.3.3"}
            exp_annotations:
              summary: "tower: Unraid OS 7.3.3 available (installed 7.3.2)"
              description: "Update by hand on tower: Tools > Update OS for the OS, Plugins > Check for updates for plugins. Weekly reminder at most (info)."
          - exp_labels: {severity: info, plugin: fix.common.problems}
            exp_annotations:
              summary: "tower: plugin fix.common.problems has an update"
              description: "Update by hand on tower: Tools > Update OS for the OS, Plugins > Check for updates for plugins. Weekly reminder at most (info)."

  - name: new critical image vulnerabilities (rise since yesterday)
    # 1-minute-dense samples: in production node-exporter serves the textfile
    # continuously, so the metric is never stale; the test mirrors that (hourly
    # samples would go stale between scans under the file's 1m eval and the 5m
    # 'for' could never accumulate).
    interval: 1m
    input_series:
      # fastpi: 2 fixable criticals for 27h, then a new disclosure makes it 5.
      - series: 'security_image_vulnerabilities_fixable{host="fastpi",severity="CRITICAL"}'
        values: '2+0x1619 5+0x360'
      # beefy: steady, never rises -> must stay silent.
      - series: 'security_image_vulnerabilities_fixable{host="beefy",severity="CRITICAL"}'
        values: '3+0x1979'
      # tower: we patched, count drops -> negative difference, must stay silent.
      - series: 'security_image_vulnerabilities_fixable{host="tower",severity="CRITICAL"}'
        values: '6+0x1619 1+0x360'
    alert_rule_test:
      # Before the rise (20h): fastpi has no sample 24h earlier -> silent.
      - eval_time: 20h
        alertname: NewCriticalImageVulnerabilities
        exp_alerts: []
      # An hour after fastpi's rise (28h): only fastpi pages; beefy (flat) and
      # tower (dropped) stay silent.
      - eval_time: 28h
        alertname: NewCriticalImageVulnerabilities
        exp_alerts:
          - exp_labels: {severity: warning, host: fastpi}
            exp_annotations:
              summary: "fastpi: 3 NEW fixable critical CVE(s) since yesterday"
              description: "The count of FIXABLE critical CVEs in images running on fastpi rose by 3 since the last daily scan - a new critical disclosure or a new image. Act today: update the affected image(s). Worst first: /var/lib/security-scan/image-cves-fastpi.txt on fastpi. Cross-check Cup at https://cup.holy-grail.ch/ for a newer tag."
