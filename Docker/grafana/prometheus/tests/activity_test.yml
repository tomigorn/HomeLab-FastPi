# promtool test rules tests/activity_test.yml  (README "Run the rule tests")
rule_files:
  - ../rules/activity.yml
evaluation_interval: 1m
tests:
  - name: beefy awake with a stale snapshot warns after 10m, clears on a fresh poll
    interval: 1m
    input_series:
      - series: 'activity_beefy_up{job="activity",instance="activity:8080"}'
        values: '1x40'
      - series: 'activity_beefy_snapshot_age_seconds{job="activity",instance="activity:8080"}'
        values: '20x4 400+60x20 20x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: ActivityBeefyDataStale
        exp_alerts: []
      - eval_time: 14m
        alertname: ActivityBeefyDataStale
        exp_alerts: []
      - eval_time: 16m
        alertname: ActivityBeefyDataStale
        exp_alerts:
          - exp_labels: {severity: warning, job: activity, instance: "activity:8080"}
            exp_annotations:
              summary: "Activity page: beefy is awake, its data is not"
              description: "Last good poll of the beefy gate 17m 40s ago (fresh is under 90 s); the page shows ❔ unavailable. Check: the gate on beefy (<code>ssh beefy-direct sudo docker ps --filter name=activity-gate</code>, <code>post-update-check.sh Activity-Gate</code>), its API keys (<code>Activity-Gate/secrets/*.apikey</code>; HTTP 401 in <code>docker logs activity</code>), the Traefik route <code>activity-gate</code> (<code>Traefik/traefik/dynamic/activity-internal.yml</code>, <code>docker logs traefik</code>)."
      - eval_time: 30m
        alertname: ActivityBeefyDataStale
        exp_alerts: []

  - name: beefy asleep with an old snapshot stays quiet
    interval: 1m
    input_series:
      - series: 'activity_beefy_up{job="activity",instance="activity:8080"}'
        values: '0x40'
      - series: 'activity_beefy_snapshot_age_seconds{job="activity",instance="activity:8080"}'
        values: '9000+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ActivityBeefyDataStale
        exp_alerts: []

  - name: beefy awake without any snapshot age warns too
    interval: 1m
    input_series:
      - series: 'activity_beefy_up{job="activity",instance="activity:8080"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ActivityBeefyDataStale
        exp_alerts: []
      - eval_time: 11m
        alertname: ActivityBeefyDataStale
        exp_alerts:
          - exp_labels: {severity: warning, job: activity, instance: "activity:8080"}
            exp_annotations:
              summary: "Activity page: beefy is awake, its data is not"
              description: "Last good poll of the beefy gate never since the start (fresh is under 90 s); the page shows ❔ unavailable. Check: the gate on beefy (<code>ssh beefy-direct sudo docker ps --filter name=activity-gate</code>, <code>post-update-check.sh Activity-Gate</code>), its API keys (<code>Activity-Gate/secrets/*.apikey</code>; HTTP 401 in <code>docker logs activity</code>), the Traefik route <code>activity-gate</code> (<code>Traefik/traefik/dynamic/activity-internal.yml</code>, <code>docker logs traefik</code>)."

  - name: listening missing warns after 15m, audiobook downloads present stay quiet
    interval: 1m
    input_series:
      - series: 'up{job="activity",instance="activity:8080"}'
        values: '1x50'
      - series: 'activity_listening_sessions{job="activity",instance="activity:8080"}'
        values: '0x4 _x30 1x15'
      - series: 'activity_audiobook_downloads{job="activity",instance="activity:8080",state="downloading"}'
        values: '0x50'
      - series: 'activity_audiobook_downloads{job="activity",instance="activity:8080",state="queued"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 18m
        alertname: ActivityLocalSourcesMissing
        exp_alerts: []
      - eval_time: 28m
        alertname: ActivityLocalSourcesMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: activity, instance: "activity:8080", source: listening}
            exp_annotations:
              summary: "Activity page: listening data missing"
              description: "The page shows listening as unavailable. Check the ABS key copy <code>Activity/secrets/abs_api_key</code> (same as <code>Audiobook-Requests/secrets/abs_api_key</code>, owner 65060, 0400; ABS key <code>audiobook-importer</code> needs admin) and that Audiobookshelf runs; the error is in <code>docker logs activity</code>."
      - eval_time: 42m
        alertname: ActivityLocalSourcesMissing
        exp_alerts: []

  - name: audiobook downloads missing warns after 15m
    interval: 1m
    input_series:
      - series: 'up{job="activity",instance="activity:8080"}'
        values: '1x30'
      - series: 'activity_listening_sessions{job="activity",instance="activity:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: ActivityLocalSourcesMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: ActivityLocalSourcesMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: activity, instance: "activity:8080", source: audiobook_downloads}
            exp_annotations:
              summary: "Activity page: audiobook_downloads data missing"
              description: "The page shows audiobook downloads as unavailable. Check the Traefik route <code>activity-qbit</code> (<code>Traefik/traefik/dynamic/activity-internal.yml</code>, <code>docker logs traefik</code>) and that gluetun and qBittorrent (mouse) run; the error is in <code>docker logs activity</code>."

  - name: the service down is TargetDown, not this alert
    interval: 1m
    input_series:
      - series: 'up{job="activity",instance="activity:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ActivityLocalSourcesMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: ActivityBeefyDataStale
        exp_alerts: []
