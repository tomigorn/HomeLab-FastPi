# promtool test rules tests/media-language_test.yml  (README "Run the rule tests")
rule_files:
  - ../rules/media-language.yml
evaluation_interval: 1h
tests:
  - name: due after the wait, once, for five days; a failed grab is a new alert
    interval: 1h
    input_series:
      # since day 0, due day 7
      - series: 'media_language_missing_since_timestamp_seconds{app="radarr",failed="0",language="Swiss German",title="The Ring Thing (2004)"}'
        values: '0x300'
      - series: 'media_language_missing_notify_timestamp_seconds{app="radarr",failed="0",language="Swiss German",title="The Ring Thing (2004)"}'
        values: '604800x300'
      # the same title after a failed grab on day 13 (the file is republished with failed="1")
      - series: 'media_language_missing_since_timestamp_seconds{app="radarr",failed="1",language="Swiss German",title="The Ring Thing (2004)"}'
        values: '_x311 0x200'
      - series: 'media_language_missing_notify_timestamp_seconds{app="radarr",failed="1",language="Swiss German",title="The Ring Thing (2004)"}'
        values: '_x311 1123200x200'
      # a series waiting only 2 days
      - series: 'media_language_missing_since_timestamp_seconds{app="sonarr",failed="0",language="Swiss German",title="Wilder (2017)"}'
        values: '432000x400'
      - series: 'media_language_missing_notify_timestamp_seconds{app="sonarr",failed="0",language="Swiss German",title="Wilder (2017)"}'
        values: '1036800x400'
    alert_rule_test:
      - eval_time: 167h
        alertname: AudioLanguageNotFound
        exp_alerts: []
      - eval_time: 169h
        alertname: AudioLanguageNotFound
        exp_alerts:
          - exp_labels: {severity: info, app: radarr, failed: "0", language: Swiss German, title: The Ring Thing (2004)}
            exp_annotations:
              summary: "Swiss German not found: The Ring Thing (2004)"
              description: "radarr: tagged audio-swiss-german, monitored, no file for 7d 1h 0m 0s; the searches so far found no acceptable release (Swiss German must be in the release name). Check Wanted -> Missing and Interactive Search; Movie-Downloads/scripts/swiss-german-check.py lists every waiting title. Sent once; a failed grab sends it again."
      - eval_time: 287h
        alertname: AudioLanguageNotFound
        exp_alerts:
          - exp_labels: {severity: info, app: radarr, failed: "0", language: Swiss German, title: The Ring Thing (2004)}
            exp_annotations:
              summary: "Swiss German not found: The Ring Thing (2004)"
              description: "radarr: tagged audio-swiss-german, monitored, no file for 11d 23h 0m 0s; the searches so far found no acceptable release (Swiss German must be in the release name). Check Wanted -> Missing and Interactive Search; Movie-Downloads/scripts/swiss-german-check.py lists every waiting title. Sent once; a failed grab sends it again."
      - eval_time: 289h
        alertname: AudioLanguageNotFound
        exp_alerts:
          - exp_labels: {severity: info, app: sonarr, failed: "0", language: Swiss German, title: Wilder (2017)}
            exp_annotations:
              summary: "Swiss German not found: Wilder (2017)"
              description: "sonarr: tagged audio-swiss-german, monitored, missing episodes for 7d 1h 0m 0s; the searches so far found no acceptable release (Swiss German must be in the release name). Check Wanted -> Missing and Interactive Search; Movie-Downloads/scripts/swiss-german-check.py lists every waiting title. Sent once; a failed grab sends it again."
      - eval_time: 313h
        alertname: AudioLanguageNotFound
        exp_alerts:
          - exp_labels: {severity: info, app: radarr, failed: "1", language: Swiss German, title: The Ring Thing (2004)}
            exp_annotations:
              summary: "Swiss German not found: The Ring Thing (2004)"
              description: "radarr: tagged audio-swiss-german, monitored, no file for 13d 1h 0m 0s; 1 grab(s) failed or were blocklisted, nothing else acceptable found yet. Check Wanted -> Missing and Interactive Search; Movie-Downloads/scripts/swiss-german-check.py lists every waiting title. Sent once; a failed grab sends it again."
          - exp_labels: {severity: info, app: sonarr, failed: "0", language: Swiss German, title: Wilder (2017)}
            exp_annotations:
              summary: "Swiss German not found: Wilder (2017)"
              description: "sonarr: tagged audio-swiss-german, monitored, missing episodes for 8d 1h 0m 0s; the searches so far found no acceptable release (Swiss German must be in the release name). Check Wanted -> Missing and Interactive Search; Movie-Downloads/scripts/swiss-german-check.py lists every waiting title. Sent once; a failed grab sends it again."
      - eval_time: 500h
        alertname: AudioLanguageNotFound
        exp_alerts: []
