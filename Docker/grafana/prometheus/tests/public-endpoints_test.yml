rule_files:
  - ../rules/public-endpoints.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-lan-locked", instance="https://radarr.holy-grail.ch/"}'
        values: '1x5 0x10'
      - series: 'probe_http_status_code{job="blackbox-lan-locked", instance="https://radarr.holy-grail.ch/"}'
        values: '403x5 302x10'
      - series: 'probe_success{job="blackbox-lan-locked", instance="https://sonarr.holy-grail.ch/"}'
        values: '1x15'
      - series: 'probe_success{job="blackbox-gated", instance="https://cup.holy-grail.ch/"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: LanLockedEndpointNotLocked
        exp_alerts: []
      - eval_time: 12m
        alertname: LanLockedEndpointNotLocked
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-lan-locked
              instance: https://radarr.holy-grail.ch/
            exp_annotations:
              summary: "LAN-locked endpoint not locked: https://radarr.holy-grail.ch/"
              description: "https://radarr.holy-grail.ch/ should answer 403 from outside the LAN/VPN but returned HTTP 302 for 3 minutes. 200 or 302 means local-networks@file is gone from its Traefik router and the app is publicly reachable; 404 means the route is gone."
      - eval_time: 12m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-gated
              instance: https://cup.holy-grail.ch/
            exp_annotations:
              summary: "Public endpoint down: https://cup.holy-grail.ch/"
              description: "https://cup.holy-grail.ch/ has not answered like a working backend for 3 minutes (HTTP ). A 404 here usually means Traefik lost the router rather than the app being down - check `docker logs traefik | grep -i plugin` first, since a failed plugin download disables the websecure entrypoint middleware and takes every public route with it."

  # 15m probe: one failed probe fires, and the alert holds until a later probe passes.
  - interval: 15m
    input_series:
      - series: 'probe_success{job="blackbox-gated-wake", instance="https://requests.holy-grail.ch/"}'
        values: '1 1 0 0 1 1 1'
      - series: 'probe_http_status_code{job="blackbox-gated-wake", instance="https://requests.holy-grail.ch/"}'
        values: '302 302 200 200 302 302 302'
    alert_rule_test:
      - eval_time: 20m
        alertname: WakeGatedEndpointNotGated
        exp_alerts: []
      - eval_time: 40m
        alertname: WakeGatedEndpointNotGated
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-gated-wake
              instance: https://requests.holy-grail.ch/
            exp_annotations:
              summary: "Wake-gated endpoint lost its login gate: https://requests.holy-grail.ch/"
              description: "https://requests.holy-grail.ch/ must answer 302 to sso.holy-grail.ch but the last probe got HTTP 200. Without authentik@file in front of its *-wake middleware every visitor (and this probe) wakes beefy. Check its router in Docker/Traefik/traefik/dynamic/ and docker logs traefik."
      - eval_time: 80m
        alertname: WakeGatedEndpointNotGated
        exp_alerts: []

  # Cloudflare path (blackbox-exporter-wan, public DNS): the tunnel is gone while Traefik on the LAN still answers.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-wan-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '1x4 0x15'
      - series: 'probe_http_status_code{job="blackbox-wan-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '200x4 530x15'
      - series: 'probe_success{job="blackbox-wan-gated", instance="https://cup.holy-grail.ch/"}'
        values: '1x4 0x15'
      - series: 'probe_http_status_code{job="blackbox-wan-gated", instance="https://cup.holy-grail.ch/"}'
        values: '302x4 530x15'
      - series: 'probe_success{job="blackbox-wan-lan-locked", instance="https://stonks.holy-grail.ch/"}'
        values: '1x4 0x15'
      - series: 'probe_success{job="blackbox-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '1x19'
      - series: 'probe_http_status_code{job="blackbox-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '200x19'
      - series: 'probe_success{job="blackbox-gated", instance="https://cup.holy-grail.ch/"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 6m
        alertname: CloudflareTunnelDown
        exp_alerts: []
      - eval_time: 10m
        alertname: CloudflareTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Cloudflare path down: all 3 public-DNS probes fail while Traefik answers on the LAN"
              description: "Every probe through Cloudflare fails but the LAN probes pass, so the tunnel, its ingress or the Cloudflare DNS records are broken (or fastpi's internet is down). Check: docker logs --since 15m cloudflared; the tunnel's Public Hostnames in the Cloudflare dashboard. Restarting cloudflared is a tunnel change: owner only."
      - eval_time: 10m
        alertname: PublicPathDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-wan-public
              instance: https://audiobookshelf.holy-grail.ch/
            exp_annotations:
              summary: "Public path through Cloudflare down: https://audiobookshelf.holy-grail.ch/"
              description: "https://audiobookshelf.holy-grail.ch/ resolved via public DNS failed for 5 minutes (HTTP 530; the LAN probe of the same job type says HTTP 200). 530/502/1033 = tunnel or cloudflared, 0 = public DNS or connection, 403 on a public route = a Cloudflare block, 200 on a LAN-locked route = local-networks@file leaked."
          - exp_labels:
              severity: critical
              job: blackbox-wan-gated
              instance: https://cup.holy-grail.ch/
            exp_annotations:
              summary: "Public path through Cloudflare down: https://cup.holy-grail.ch/"
              description: "https://cup.holy-grail.ch/ resolved via public DNS failed for 5 minutes (HTTP 530; the LAN probe of the same job type says HTTP ). 530/502/1033 = tunnel or cloudflared, 0 = public DNS or connection, 403 on a public route = a Cloudflare block, 200 on a LAN-locked route = local-networks@file leaked."
          - exp_labels:
              severity: critical
              job: blackbox-wan-lan-locked
              instance: https://stonks.holy-grail.ch/
            exp_annotations:
              summary: "Public path through Cloudflare down: https://stonks.holy-grail.ch/"
              description: "https://stonks.holy-grail.ch/ resolved via public DNS failed for 5 minutes (HTTP ; the LAN probe of the same job type says HTTP ). 530/502/1033 = tunnel or cloudflared, 0 = public DNS or connection, 403 on a public route = a Cloudflare block, 200 on a LAN-locked route = local-networks@file leaked."

  # One route broken only on the Cloudflare side (e.g. its Public Hostname deleted): no tunnel alert, one path alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-wan-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '1x4 0x15'
      - series: 'probe_success{job="blackbox-wan-public", instance="https://sso.holy-grail.ch/"}'
        values: '1x19'
      - series: 'probe_success{job="blackbox-public", instance="https://audiobookshelf.holy-grail.ch/"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 12m
        alertname: CloudflareTunnelDown
        exp_alerts: []
      - eval_time: 12m
        alertname: PublicPathDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-wan-public
              instance: https://audiobookshelf.holy-grail.ch/
            exp_annotations:
              summary: "Public path through Cloudflare down: https://audiobookshelf.holy-grail.ch/"
              description: "https://audiobookshelf.holy-grail.ch/ resolved via public DNS failed for 5 minutes (HTTP ; the LAN probe of the same job type says HTTP ). 530/502/1033 = tunnel or cloudflared, 0 = public DNS or connection, 403 on a public route = a Cloudflare block, 200 on a LAN-locked route = local-networks@file leaked."

  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared:20241"}'
        values: '4x5 0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 12m
        alertname: CloudflaredTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cloudflared
              instance: cloudflared:20241
            exp_annotations:
              summary: "cloudflared has no connection to the Cloudflare edge"
              description: "cloudflared_tunnel_ha_connections has been below 1 for 5 minutes: the tunnel is not connected, so every public route is down. Check: docker logs --since 15m cloudflared. Restarting cloudflared is a tunnel change: owner only."
