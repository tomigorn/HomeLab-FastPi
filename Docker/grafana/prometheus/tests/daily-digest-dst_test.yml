# promtool test rules tests/daily-digest-dst_test.yml
# Separate file for its 10-minute evaluation: the eval times lie months after promtool's time 0 (Thursday 1970-01-01 UTC). 1 June 1970 = 151d (CEST, UTC+2).
rule_files:
  - ../rules/weekly-digest.yml
  - ../rules/daily-digest.yml
evaluation_interval: 10m
tests:
  - name: summer 06:30 CEST is 04:30 UTC, an empty day renders every section
    interval: 10m
    input_series:
      - series: 'probe_success{job="blackbox-beefy",instance="beefy"}'
        values: '0x21800'
    alert_rule_test:
      - eval_time: 151d4h20m
        alertname: DailyDigest
        exp_alerts: []
      - eval_time: 151d4h30m
        alertname: DailyDigest
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "Morning summary – 1 Jun (last 24 h)"
              description: "⏳ still a problem · ✅ fixed by itself\n\n<b>🔕 Only shown here (no separate message)</b>\n• none\n\n<b>🔔 Problems (each was also sent as its own message)</b>\n• none\n\n<b>🛡️ Security holes with a fix ready (CVE)</b>\n• none\n\n<b>📦 Automatic updates last night</b>\n✅ updated · ❌ failed · ⏳ waiting or held back · 📦 new version, waits for you · 🔁 recreated\n• no update run in the last 24 h\n\n<b>💤 Time switched on (24 h)</b> · beefy 0.0 h\n<blockquote expandable>Small problems at night (22:00–07:00) wait until 07:00. Updates and old security holes: Monday summary. History: Grafana → updates-security.</blockquote>"
      - eval_time: 151d5h
        alertname: DailyDigest
        exp_alerts: []
