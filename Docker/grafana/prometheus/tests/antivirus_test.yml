# promtool test rules tests/antivirus_test.yml  (see Server/4-Security-Monitoring/README.md, Verify)
rule_files:
  - ../rules/weekly-digest.yml
  - ../rules/tower-power.yml
  - ../rules/antivirus.yml
evaluation_interval: 1m
tests:
  - name: malware of a report-only scan quotes the hit list, waits for the pull
    interval: 1m
    input_series:
      - series: 'clamav_infected_last_run{host="beefy",instance="node-exporter:9100",mode="all"}'
        values: '1x120'
      - series: 'clamav_infected_last_run{host="fastpi",instance="node-exporter:9100",mode="all"}'
        values: '0x120'
      - series: 'security_av_infected_info{host="beefy",path="/host/tmp/a.exe",signature="Win.Test.EICAR_HDB-1"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 40m
        alertname: MalwareFound
        exp_alerts: []
      - eval_time: 50m
        alertname: MalwareFound
        exp_alerts:
          - exp_labels: {severity: warning, host: beefy, mode: all}
            exp_annotations:
              summary: "beefy: ClamAV found 1 infected file(s) in its last all scan"
              description: "Hits: /host/tmp/a.exe (Win.Test.EICAR_HDB-1); all scans only report, nothing was moved. Full list: /var/lib/security-scan/last-infected-beefy.txt on fastpi. Clears with the next clean scan of that mode."

  - name: malware without a collected hit list still fires
    interval: 1m
    input_series:
      - series: 'clamav_infected_last_run{host="tower",mode="path"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: MalwareFound
        exp_alerts:
          - exp_labels: {severity: warning, host: tower, mode: path}
            exp_annotations:
              summary: "tower: ClamAV found 2 infected file(s) in its last path scan"
              description: "Hits: not collected yet; all scans only report, nothing was moved. Full list: /var/lib/security-scan/last-infected-tower.txt on fastpi. Clears with the next clean scan of that mode."

  - name: quarantining modes are left to MalwareQuarantined
    interval: 1m
    input_series:
      - series: 'clamav_infected_last_run{host="beefy",mode="new"}'
        values: '1x120'
      - series: 'clamav_infected_last_run{host="beefy",mode="hook"}'
        values: '1x120'
      - series: 'clamav_infected_last_run{host="beefy",mode="queue"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: MalwareFound
        exp_alerts: []

  - name: a quarantined hit alerts at once with escaped details
    interval: 1m
    input_series:
      - series: 'clamav_quarantine_hit_first_seen_timestamp_seconds{host="beefy",instance="node-exporter:9100",job="node",mode="queue",title="Tom & Jerry <2026>",file="a''b.mkv",path="/scan/ssd-hot/torrents/complete/Tom & Jerry <2026>/a''b.mkv",signature="Win.Trojan.X-1",time="Tue, 27 Oct 2026 10:00"}'
        values: '60x1500'
      - series: 'clamav_quarantine_hits_24h{host="beefy",mode="queue"}'
        values: '1x1500'
    alert_rule_test:
      - eval_time: 2m
        alertname: MalwareQuarantined
        exp_alerts:
          - exp_labels: {severity: warning, host: beefy, instance: "node-exporter:9100", job: node, mode: queue, title: "Tom & Jerry <2026>", file: "a'b.mkv", path: "/scan/ssd-hot/torrents/complete/Tom & Jerry <2026>/a'b.mkv", signature: Win.Trojan.X-1, time: "Tue, 27 Oct 2026 10:00"}
            exp_annotations:
              summary: "beefy: Win.Trojan.X-1 in Tom &amp; Jerry &lt;2026&gt; (queue)"
              description: "<code>/scan/ssd-hot/torrents/complete/Tom &amp; Jerry &lt;2026&gt;/a&#39;b.mkv</code> was moved to the quarantine on beefy (mode queue: scan = scan.sh nightly or by hand, hook = download completion, queue = background media scan). False positive: <code>docker exec clamav /scan.sh restore 'a&#39;b.mkv'</code> on beefy (sudo docker). Ends 24 h after fastpi first saw it, or when restored."
      - eval_time: 24h2m
        alertname: MalwareQuarantined
        exp_alerts: []

  - name: a counter reset alone does not fire
    interval: 1m
    input_series:
      - series: 'clamav_infected_total{host="fastpi"}'
        values: '1x30 0x60'
      - series: 'clamav_infected_last_run{host="fastpi",mode="new"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MalwareFound
        exp_alerts: []

  - name: stale scan after three days
    interval: 1m
    input_series:
      - series: 'clamav_last_run_timestamp_seconds{host="beefy",mode="new"}'
        values: '0x4500'
      - series: 'clamav_last_run_timestamp_seconds{host="beefy",mode="all"}'
        values: '255600x4500'
    alert_rule_test:
      - eval_time: 71h
        alertname: ClamavScanStale
        exp_alerts: []
      - eval_time: 74h
        alertname: ClamavScanStale
        exp_alerts:
          - exp_labels: {severity: info, host: beefy}
            exp_annotations:
              summary: "beefy: no ClamAV new-files scan for 3d 2h 0m 0s"
              description: "The nightly clamav-scan has not finished on beefy for over 3 days (fastpi, beefy) or, for tower, in the 26 h since a night it was awake at its scan time (timer stopped, container down, or the host asleep at its scan time). Check: systemctl list-timers clamav-scan."

  # promtool time 0 = 01:00 local (CET). tower's slot: up all of local 04:55-05:59 (its 05:00 scan and the 05:50 pull).
  - name: tower's scan is stale only when tower was awake at its scan time
    interval: 1m
    input_series:
      - series: 'clamav_last_run_timestamp_seconds{host="tower",mode="new"}'
        values: '0x3300'
      # tower up 1d03:50-05:10 UTC (local 04:50-06:10).
      - series: 'probe_success{job="blackbox-tower",instance="192.168.1.101:22"}'
        values: '0x1669 1x80 0x1550'
    alert_rule_test:
      # 3 days without a scan, tower asleep at its scan time: silent (was a 3 d alert before).
      - eval_time: 74h
        alertname: ClamavScanStale
        exp_alerts: []
      - eval_time: 1d6h30m
        alertname: ClamavScanStale
        exp_alerts:
          - exp_labels: {severity: info, host: tower}
            exp_annotations:
              summary: "tower: no ClamAV new-files scan for 1d 6h 30m 0s"
              description: "The nightly clamav-scan has not finished on tower for over 3 days (fastpi, beefy) or, for tower, in the 26 h since a night it was awake at its scan time (timer stopped, container down, or the host asleep at its scan time). Check: systemctl list-timers clamav-scan."

  - name: scan errors need two nightly runs
    interval: 1m
    input_series:
      - series: 'clamav_scan_errors{host="fastpi",mode="new"}'
        values: '3x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: ClamavScanErrors
        exp_alerts: []
      - eval_time: 27h
        alertname: ClamavScanErrors
        exp_alerts:
          - exp_labels: {severity: info, notify: digest, host: fastpi}
            exp_annotations:
              summary: "fastpi: ClamAV reported 3 scan error(s)"
              description: "clamscan could not read some files in two nightly runs; those files are unscanned. Details: last-new.log in the scanner's state directory."

  - name: signatures older than a week
    interval: 1m
    input_series:
      - series: 'clamav_signature_age_seconds{host="tower"}'
        values: '700000x200'
      - series: 'clamav_signature_age_seconds{host="fastpi"}'
        values: '48895x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: ClamavSignaturesStale
        exp_alerts:
          - exp_labels: {severity: info, notify: digest, host: tower}
            exp_annotations:
              summary: "tower: ClamAV signatures are 8d 2h 26m 40s old"
              description: "freshclam in the clamav container has not updated the database for over 7 days. Check: docker logs clamav."
