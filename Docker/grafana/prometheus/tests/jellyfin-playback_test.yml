# promtool test rules tests/jellyfin-playback_test.yml  (README "Run the rule tests")
rule_files:
  - ../rules/jellyfin-playback.yml
evaluation_interval: 1m
tests:
  - name: one incident fires once per episode, a new client series counts, zero does not
    interval: 5m
    input_series:
      - series: 'jellyfin_playback_incidents_total{kind="stall",client="TV"}'
        values: '0x3 1x20'
      - series: 'jellyfin_playback_incidents_total{kind="silent",client="Web"}'
        values: '_x10 1x13'
      - series: 'jellyfin_playback_incidents_total{kind="slow_transcode",client="Quiet"}'
        values: '0x23'
      - series: 'jellyfin_playback_autofix_active{action="downloads_slow"}'
        values: '1x23'
      - series: 'jellyfin_playback_autofix_active{action="background_low"}'
        values: '0x23'
    alert_rule_test:
      - eval_time: 10m
        alertname: JellyfinPlaybackStutter
        exp_alerts: []
      - eval_time: 20m
        alertname: JellyfinPlaybackStutter
        exp_alerts:
          - exp_labels: {severity: warning, kind: stall, client: TV}
            exp_annotations:
              summary: "Jellyfin stutter: stall on TV"
              description: "1 stall incident(s) on TV in the last 15 min. Active auto-fixes: downloads_slow. Details: <code>ssh beefy playback-watch report --since 1h</code>"
      - eval_time: 45m
        alertname: JellyfinPlaybackStutter
        exp_alerts: []
      - eval_time: 55m
        alertname: JellyfinPlaybackStutter
        exp_alerts:
          - exp_labels: {severity: warning, kind: silent, client: Web}
            exp_annotations:
              summary: "Jellyfin stutter: silent on Web"
              description: "1 silent incident(s) on Web in the last 15 min. Active auto-fixes: downloads_slow. Details: <code>ssh beefy playback-watch report --since 1h</code>"
      - eval_time: 100m
        alertname: JellyfinPlaybackStutter
        exp_alerts: []

  - name: watch down only with fresh beefy idle metrics, after 10m
    interval: 5m
    input_series:
      - series: 'jellyfin_playback_watch_last_poll_timestamp_seconds'
        values: '0x40'
      - series: 'beefy_idle_updated_timestamp_seconds'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: JellyfinPlaybackWatchDown
        exp_alerts: []
      - eval_time: 40m
        alertname: JellyfinPlaybackWatchDown
        exp_alerts:
          - exp_labels: {severity: info, notify: digest}
            exp_annotations:
              summary: "Jellyfin playback watch has not polled for 40m 0s"
              description: "The playback watch on beefy last polled 40m 0s ago while beefy is awake. Check <code>systemctl --user status playback-watch</code> on beefy."

  - name: watch down is silent while beefy sleeps (stale idle metrics)
    interval: 5m
    input_series:
      - series: 'jellyfin_playback_watch_last_poll_timestamp_seconds'
        values: '0x40'
      - series: 'beefy_idle_updated_timestamp_seconds'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: JellyfinPlaybackWatchDown
        exp_alerts: []
