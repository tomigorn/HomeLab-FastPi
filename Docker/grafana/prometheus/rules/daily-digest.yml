            • 🌐 {{ .Labels.domain }}: {{ if eq .Labels.source "anniversary" }}domain renewal due{{ else }}domain registration ends{{ end }} in {{ template "dg.days" .Value }}{{ end }}{{ range query `((subscription_expiry_timestamp_seconds{kind!="No-IP hostname"} - time()) / 86400 <= 30) or ((subscription_expiry_timestamp_seconds{kind="No-IP hostname"} - time()) / 86400 <= 5)` | sortByLabel "name" }}
            • 💳 {{ .Labels.name | html }}{{ if eq .Labels.kind "No-IP hostname" }} hostname: {{ if le .Value 0.0 }}deadline passed{{ else }}confirm within {{ template "dg.days" .Value }}{{ end }}{{ else }} subscription {{ if le .Value 0.0 }}has ended{{ else }}ends in {{ template "dg.days" .Value }}{{ end }}{{ end }}{{ end }}{{ range $i, $a := query `ALERTS{alertstate="firing",alertname=~"Smart.+"}` | sortByLabel "disk" | sortByLabel "host" }}{{ if lt $i 4 }}
            • 💽 {{ $a.Labels.host }}{{ with $a.Labels.disk }} {{ . }}{{ end }}: disk problem ({{ $a.Labels.alertname }}){{ end }}{{ end }}{{ end }}
