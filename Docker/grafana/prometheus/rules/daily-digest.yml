# Daily digest ("Morning summary" in the message): one Telegram message at 06:30 local time with everything that does not page. Tests: prometheus/tests/daily-digest_test.yml
# Alerts labelled notify: digest are routed to a null receiver (alertmanager.yml) and only show up here; non-critical alerts muted by the 22:00-07:00 quiet hours show up here too.
# Alertmanager routes it to telegram-digest (no resolved message, no quiet hours); it fires 06:30-06:59, so each day is a new notification. Local time comes from homelab:local_utc_offset_hours (weekly-digest.yml).
# Alerts silenced in Alertmanager show as one 🔇 line per section (homelab:alert_silenced); indexer_rate_limited events merge into one line.
# Lists are capped (8 digest alerts, 6 others, 5 CVEs, 6 projects per host, 5 download events, 4 certificates, 4 disk alerts) to stay under Telegram's 4096 characters.
groups:
  - name: daily-digest
    rules:
      # Alerts silenced in Alertmanager, from json-exporter (module alertmanager): unpacks the JSON label alert_labels into the labels the digest matches on; the scrape's own instance is dropped first.
      - record: homelab:alert_silenced
        expr: |-
          max by (alertname, host, subject, name, title, instance) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(alert_silenced,
              "instance", "", "instance", ".*"),
              "instance", "$1", "alert_labels", `.*"instance":"([^"]*)".*`),
              "host", "$1", "alert_labels", `.*"host":"([^"]*)".*`),
              "subject", "$1", "alert_labels", `.*"subject":"([^"]*)".*`),
              "name", "$1", "alert_labels", `.*"name":"([^"]*)".*`),
              "title", "$1", "alert_labels", `.*"title":"([^"]*)".*`))
      - alert: DailyDigest
        expr: |-
          vector(1)
            and on() (hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) == 6)
            and on() (minute(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) >= 30)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: 'Morning summary – {{ with query `vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))` }}{{ $d := . | first | value }}{{ with query (printf `day_of_month(vector(%f))` $d) }}{{ . | first | value | printf "%.0f" }}{{ end }} {{ with query (printf `month(vector(%f))` $d) }}{{ $m := . | first | value | printf "%.0f" }}{{ if eq $m "1" }}Jan{{ else if eq $m "2" }}Feb{{ else if eq $m "3" }}Mar{{ else if eq $m "4" }}Apr{{ else if eq $m "5" }}May{{ else if eq $m "6" }}Jun{{ else if eq $m "7" }}Jul{{ else if eq $m "8" }}Aug{{ else if eq $m "9" }}Sep{{ else if eq $m "10" }}Oct{{ else if eq $m "11" }}Nov{{ else if eq $m "12" }}Dec{{ end }}{{ end }}{{ end }} (last 24 h)'
          description: |-
            {{- define "dg.name" }}{{ if eq . "HostRebooted" }}Computer restarted{{ else if eq . "HostRebootedUnclean" }}Computer restarted without a clean shutdown{{ else if eq . "SecurityScanFailing" }}Security check keeps failing{{ else if eq . "SecurityScanStale" }}Security check has not run for a long time{{ else if eq . "SecurityAccessScanStale" }}Security check has not run for a long time{{ else if eq . "SshLoginOutsideLan" }}SSH login from outside the home network{{ else if eq . "SshLoginUnexpectedUser" }}SSH login by an unexpected user{{ else if eq . "FailedLoginsSpike" }}Many failed SSH logins{{ else if eq . "BeefyWakeLoop" }}Computer wakes up again and again{{ else if eq . "TowerWakeLoop" }}Computer wakes up again and again{{ else if eq . "BeefyAwakeLong" }}Computer was switched on for too long{{ else if eq . "ContainerCrashLooping" }}App keeps crashing and restarting{{ else if eq . "ContainerDown" }}App is not running{{ else if eq . "ContainerUnhealthy" }}App says it is unhealthy{{ else if eq . "ContainerImageStale" }}App uses an old image (update missing){{ else if eq . "SmartPendingSectors" }}Disk has unreadable spots{{ else if eq . "SmartDiskUnchecked" }}Disk health not checked for 14 days{{ else if eq . "SmartExporterStale" }}Disk health data is old{{ else if eq . "ClamavScanStale" }}Virus scan has not run for a long time{{ else if eq . "ClamavSignaturesStale" }}Virus list is old{{ else if eq . "ClamavScanErrors" }}Virus scan had errors{{ else if eq . "PublicEndpointDown" }}Website not reachable from the internet{{ else if eq . "AutoUpdateRollbackFailed" }}Update failed and could not be undone{{ else if eq . "AutoUpdateNotRunning" }}Automatic update did not run{{ else if eq . "BeefyHddSpinningUpTooOften" }}beefy HDD started too often{{ else if eq . "TowerUpButNextcloudDown" }}tower is on but Nextcloud is broken{{ else if eq . "HostFilesystemSpaceLow" }}Disk is getting full{{ else if eq . "TargetDown" }}Monitoring cannot reach a service{{ else if eq . "HostMemoryLow" }}Little free RAM{{ else if eq . "BackupStale" }}Backup is too old{{ else if eq . "TlsCertProbeFailed" }}Certificate check failed{{ else if eq . "JellyfinPlaybackWatchDown" }}Jellyfin playback watch is not running{{ else if eq . "BeefyStorageStale" }}beefy disk figures are old{{ else }}{{ . }}{{ end }}{{ end }}{{ define "dg.subj" }}{{ $i := .Labels.instance }}{{ if eq .Labels.job "raspberry-pi" }}{{ $i = "fastpi" }}{{ else if match "^Beefy" .Labels.alertname }}{{ $i = "beefy" }}{{ else if match "^Tower" .Labels.alertname }}{{ $i = "tower" }}{{ end }}{{ or .Labels.name .Labels.subject .Labels.title .Labels.host $i | reReplaceAll "^(.{30}).+$" "$1…" | html }}{{ if .Labels.source_class }}, via {{ if eq .Labels.source_class "vpn" }}VPN{{ else }}{{ .Labels.source_class }}{{ end }}{{ end }}{{ end }}{{ define "dg.days" }}{{ printf "%.0f" . }} {{ if eq (printf "%.0f" .) "1" }}day{{ else }}days{{ end }}{{ end -}}
            ⏳ still a problem · ✅ fixed by itself

            <b>🔕 Only shown here (no separate message)</b>{{ $dsil := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) and on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` }}{{ range $i, $a := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` | sortByLabel "alertname" }}{{ if lt $i 8 }}{{ $n := $a.Labels.alertname }}
            • {{ if query (printf `ALERTS{alertstate="firing",alertname="%s"} unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) }}⏳{{ else }}✅{{ end }} <b>{{ template "dg.name" $n }}</b>{{ if gt $a.Value 1.0 }} ×{{ $a.Value }}{{ end }}{{ $ss := query (printf `max_over_time(ALERTS{alertstate="firing",alertname="%s"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) | sortByLabel "subject" | sortByLabel "name" | sortByLabel "host" }}{{ if $ss }} ({{ range $j, $s := $ss }}{{ if lt $j 2 }}{{ if $j }}, {{ end }}{{ template "dg.subj" $s }}{{ end }}{{ end }}{{ if gt $a.Value 2.0 }} …{{ end }}){{ end }}{{ end }}{{ else }}{{ if not $dsil }}
            • none{{ end }}{{ end }}{{ with query `count(count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced))` }}{{ if gt (. | first | value) 8.0 }}
            • … {{ . | first | value }} alert types in total{{ end }}{{ end }}{{ with $dsil }}
            • 🔇 {{ len . }} switched off on purpose: {{ range $j, $s := . | sortByLabel "alertname" }}{{ if lt $j 4 }}{{ if $j }}, {{ end }}{{ template "dg.name" $s.Labels.alertname }}{{ end }}{{ end }}{{ if gt (len .) 4 }} …{{ end }}{{ end }}

            <b>🔔 Problems (each was also sent as its own message)</b>{{ $osil := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) and on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` }}{{ range $i, $a := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` | sortByLabel "alertname" }}{{ if lt $i 6 }}{{ $n := $a.Labels.alertname }}
            • {{ if query (printf `ALERTS{alertstate="firing",alertname="%s"} unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) }}⏳{{ else }}✅{{ end }} <b>{{ template "dg.name" $n }}</b>{{ if gt $a.Value 1.0 }} ×{{ $a.Value }}{{ end }}{{ $ss := query (printf `max_over_time(ALERTS{alertstate="firing",alertname="%s"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) | sortByLabel "subject" | sortByLabel "name" | sortByLabel "host" }}{{ if $ss }} ({{ range $j, $s := $ss }}{{ if lt $j 2 }}{{ if $j }}, {{ end }}{{ template "dg.subj" $s }}{{ end }}{{ end }}{{ if gt $a.Value 2.0 }} …{{ end }}){{ end }}{{ end }}{{ else }}{{ if not $osil }}
            • none{{ end }}{{ end }}{{ with query `count(count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced))` }}{{ if gt (. | first | value) 6.0 }}
            • … {{ . | first | value }} alert types in total{{ end }}{{ end }}{{ with $osil }}
            • 🔇 {{ len . }} switched off on purpose: {{ range $j, $s := . | sortByLabel "alertname" }}{{ if lt $j 4 }}{{ if $j }}, {{ end }}{{ template "dg.name" $s.Labels.alertname }}{{ end }}{{ end }}{{ if gt (len .) 4 }} …{{ end }}{{ end }}

            <b>🛡️ Security holes with a fix ready (CVE)</b>{{ range $i, $v := query `count by (id, severity) (max_over_time(security_new_vuln_info[24h]) == 1)` | sortByLabel "id" | sortByLabel "severity" }}{{ if lt $i 5 }}{{ $id := $v.Labels.id }}
            • <b>{{ $id | html }}</b> {{ $v.Labels.severity }} · in {{ range $j, $p := query (printf `count by (pkg) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1)` $id) | sortByLabel "pkg" }}{{ if lt $j 3 }}{{ if $j }}, {{ end }}{{ $p.Labels.pkg | html }}{{ end }}{{ end }} · {{ with query (printf `count(count by (image) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1))` $id) }}{{ $c := . | first | value }}{{ $c }} image{{ if gt $c 1.0 }}s{{ end }}: {{ range $j, $m := query (printf `count by (image) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1)` $id) | sortByLabel "image" }}{{ if lt $j 3 }}{{ if $j }}, {{ end }}{{ $m.Labels.image | reReplaceAll "@sha256:.*" "" | reReplaceAll "^.*/" "" | html }}{{ end }}{{ end }}{{ if gt $c 3.0 }} …{{ end }}{{ end }}{{ end }}{{ else }}
            • none{{ end }}{{ with query `count(count by (id) (max_over_time(security_new_vuln_info[24h]) == 1))` }}{{ if gt (. | first | value) 5.0 }}
            • … {{ . | first | value }} CVEs in total{{ end }}{{ end }}

            <b>📦 Automatic updates last night</b>
            ✅ updated · ❌ failed · ⏳ waiting or held back · 📦 new version, waits for you · 🔁 recreated{{ range query `auto_update_last_run_timestamp_seconds > time() - 86400` | sortByLabel "host" }}{{ $h := .Labels.host }}
            • {{ $h }}: {{ range $j, $r := query (printf `auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1` $h) | sortByLabel "project" }}{{ if lt $j 6 }}{{ if $j }}, {{ end }}{{ if eq $r.Labels.result "updated" }}✅{{ else if eq $r.Labels.result "available" }}📦{{ else if match "^(rolled_back|rollback_failed|error)$" $r.Labels.result }}❌{{ else if match "^(drift|recreated)$" $r.Labels.result }}🔁{{ else }}⏳{{ end }} {{ $r.Labels.project }}{{ end }}{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1) > 6` $h) }} …{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1)` $h) }}{{ else }}nothing changed{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result="waiting"} == 1)` $h) }} · ⏳ {{ . | first | value }} waiting{{ end }}{{ else }}
            • no update run in the last 24 h{{ end }}

            <b>💤 Time switched on (24 h)</b>{{ range query `avg_over_time(probe_success{job=~"blackbox-beefy|blackbox-tower"}[24h]) * 24` | sortByLabel "job" }} · {{ .Labels.job | reReplaceAll "blackbox-" "" }} {{ .Value | printf "%.1f" }} h{{ end }}{{ with query `100 * (1 - beefy_storage_avail_bytes / beefy_storage_size_bytes)` }}

            <b>🗄️ beefy disks</b>{{ range . | sortByLabel "branch" }} · {{ .Labels.branch | toUpper }} {{ .Value | printf "%.0f" }} % full{{ end }}{{ with query `sum(last_over_time(beefy_disk_smart_raw{disk="ssd",attribute="Total_LBAs_Written"}[3d])) * 512 / 1e12` }}
            • SSD has written {{ . | first | value | printf "%.1f" }} TB in total{{ end }}{{ with query `max(max_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Start_Stop_Count"}[1d])) - max(min_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Start_Stop_Count"}[1d]))` }}
            • last 24 h: HDD started {{ . | first | value | printf "%.0f" }}×{{ with query `max(max_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Power_Cycle_Count"}[1d])) - max(min_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Power_Cycle_Count"}[1d]))` }}, beefy switched on {{ . | first | value | printf "%.0f" }}×{{ end }}{{ end }}{{ range query `beefy_mover_moved_titles > 0 and on() (beefy_mover_dry_run == 0) and on() (beefy_mover_last_run_timestamp_seconds > time() - 86400)` }}
            • moved from SSD to HDD: {{ .Value | printf "%.0f" }} title{{ if ne (printf "%.0f" .Value) "1" }}s{{ end }}, {{ with query `beefy_mover_moved_bytes / 1e9` }}{{ . | first | value | printf "%.0f" }}{{ end }} GB (SSD was {{ with query `100 * beefy_mover_ssd_used_ratio{when="before"}` }}{{ . | first | value | printf "%.0f" }}{{ end }} % full, now {{ with query `100 * beefy_mover_ssd_used_ratio{when="after"}` }}{{ . | first | value | printf "%.0f" }}{{ end }} %){{ end }}{{ end }}{{ with query `beefy_watchdog_event_timestamp_seconds > time() - 86400` }}

            <b>🎬 Downloads (fixed by themselves)</b>{{ $all := . }}{{ $rl := query `beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400` }}{{ $cap := 5 }}{{ if $rl }}{{ $cap = 4 }}{{ end }}{{ range $i, $e := query `beefy_watchdog_event_timestamp_seconds{kind!="indexer_rate_limited"} > time() - 86400` | sortByLabel "title" | sortByLabel "kind" }}{{ if lt $i $cap }}
            • {{ if eq $e.Labels.kind "indexer_recovered" }}indexer {{ $e.Labels.title | html }} works again{{ else }}{{ if eq $e.Labels.kind "guard_removed" }}wrong release removed{{ else if eq $e.Labels.kind "malware_removed" }}fake download removed{{ else if eq $e.Labels.kind "failed" }}failed, searching again{{ else if eq $e.Labels.kind "stalled" }}stuck, searching again{{ else if eq $e.Labels.kind "auto_imported" }}added to the library{{ else if eq $e.Labels.kind "partial_imported" }}season only partly added{{ else if eq $e.Labels.kind "subtitle_repaired" }}subtitle fixed (broken letters){{ else if eq $e.Labels.kind "subtitle_suspect" }}please check this subtitle (odd letters){{ else if eq $e.Labels.kind "subtitle_forced_synced" }}forced subtitle synced{{ else if eq $e.Labels.kind "subtitle_forced_unverified" }}forced subtitle not synced (no clear match){{ else }}{{ $e.Labels.kind | reReplaceAll "_" " " }}{{ end }} · {{ if eq $e.Labels.kind "partial_imported" }}{{ $e.Labels.title | html }}{{ else }}{{ $e.Labels.title | reReplaceAll "^(.{40}).+$" "$1…" | html }}{{ end }}{{ end }}{{ end }}{{ end }}{{ with $rl }}
            • {{ range $j, $x := query `count by (idx) (label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){1}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){2}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){3}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?")) unless on(idx) vector(1)` | sortByLabel "idx" }}{{ if $j }}, {{ end }}{{ $x.Labels.idx | html }}{{ end }}{{ if gt (len .) 1 }} ×{{ len . }}{{ end }} paused: too many searches{{ end }}{{ with query `((count(beefy_watchdog_event_timestamp_seconds{kind!="indexer_rate_limited"} > time() - 86400)) or vector(0)) + ((count(beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400) > bool 0) or vector(0)) > 5` }}
