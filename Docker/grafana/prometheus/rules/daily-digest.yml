# Daily digest: one Telegram message at 06:30 local time with everything that does not page. Tests: prometheus/tests/daily-digest_test.yml
# Alerts labelled notify: digest are routed to a null receiver (alertmanager.yml) and only show up here; non-critical alerts muted by the 22:00-07:00 quiet hours show up here too.
# Alertmanager routes it to telegram-digest (no resolved message, no quiet hours); it fires 06:30-06:59, so each day is a new notification. Local time comes from homelab:local_utc_offset_hours (weekly-digest.yml).
# Alerts silenced in Alertmanager show as one 🔇 line per section (homelab:alert_silenced); indexer_rate_limited events merge into one line.
# Lists are capped (8 digest alerts, 6 others, 5 CVEs, 6 projects per host, 5 download events, 4 certificates, 4 disk alerts) to stay under Telegram's 4096 characters.
groups:
  - name: daily-digest
    rules:
      # Alerts silenced in Alertmanager, from json-exporter (module alertmanager): unpacks the JSON label alert_labels into the labels the digest matches on; the scrape's own instance is dropped first.
      - record: homelab:alert_silenced
        expr: |-
          max by (alertname, host, subject, name, title, instance) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(alert_silenced,
              "instance", "", "instance", ".*"),
              "instance", "$1", "alert_labels", `.*"instance":"([^"]*)".*`),
              "host", "$1", "alert_labels", `.*"host":"([^"]*)".*`),
              "subject", "$1", "alert_labels", `.*"subject":"([^"]*)".*`),
              "name", "$1", "alert_labels", `.*"name":"([^"]*)".*`),
              "title", "$1", "alert_labels", `.*"title":"([^"]*)".*`))
      - alert: DailyDigest
        expr: |-
          vector(1)
            and on() (hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) == 6)
            and on() (minute(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) >= 30)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Daily digest"
          description: |-
            📅 {{ with query "vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))" }}{{ . | first | value | humanizeTimestamp | reReplaceAll " .*" "" }}{{ end }} · last 24 h · ⏳ still firing, ✔️ cleared

            <b>🔕 Digest only</b>{{ $dsil := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) and on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` }}{{ range $i, $a := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` | sortByLabel "alertname" }}{{ if lt $i 8 }}{{ $n := $a.Labels.alertname }}
            • {{ if query (printf `ALERTS{alertstate="firing",alertname="%s"} unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) }}⏳{{ else }}✔️{{ end }} <b>{{ $n }}</b>{{ if gt $a.Value 1.0 }} ×{{ $a.Value }}{{ end }} · {{ range $j, $s := query (printf `max_over_time(ALERTS{alertstate="firing",alertname="%s"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) | sortByLabel "subject" | sortByLabel "name" | sortByLabel "host" }}{{ if lt $j 2 }}{{ if $j }}, {{ end }}{{ or $s.Labels.name $s.Labels.subject $s.Labels.title $s.Labels.host $s.Labels.instance | reReplaceAll "^(.{30}).+$" "$1…" | html }}{{ if $s.Labels.source_class }} via {{ $s.Labels.source_class }}{{ end }}{{ end }}{{ end }}{{ if gt $a.Value 2.0 }} …{{ end }}{{ end }}{{ else }}{{ if not $dsil }}
            • none{{ end }}{{ end }}{{ with query `count(count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="digest",alertname!~"AutoUpdateNightly|NewFixableImageVulnerability"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced))` }}{{ if gt (. | first | value) 8.0 }}
            • … {{ . | first | value }} alert types in total{{ end }}{{ end }}{{ with $dsil }}
            • 🔇 {{ len . }} silenced: {{ range $j, $s := . | sortByLabel "alertname" }}{{ if lt $j 4 }}{{ if $j }}, {{ end }}{{ $s.Labels.alertname }}{{ end }}{{ end }}{{ if gt (len .) 4 }} …{{ end }}{{ end }}

            <b>🔔 Other alerts</b> (sent, or muted overnight){{ $osil := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) and on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` }}{{ range $i, $a := query `count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced)` | sortByLabel "alertname" }}{{ if lt $i 6 }}{{ $n := $a.Labels.alertname }}
            • {{ if query (printf `ALERTS{alertstate="firing",alertname="%s"} unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) }}⏳{{ else }}✔️{{ end }} <b>{{ $n }}</b>{{ if gt $a.Value 1.0 }} ×{{ $a.Value }}{{ end }} · {{ range $j, $s := query (printf `max_over_time(ALERTS{alertstate="firing",alertname="%s"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced` $n) | sortByLabel "subject" | sortByLabel "name" | sortByLabel "host" }}{{ if lt $j 2 }}{{ if $j }}, {{ end }}{{ or $s.Labels.name $s.Labels.subject $s.Labels.title $s.Labels.host $s.Labels.instance | reReplaceAll "^(.{30}).+$" "$1…" | html }}{{ if $s.Labels.source_class }} via {{ $s.Labels.source_class }}{{ end }}{{ end }}{{ end }}{{ if gt $a.Value 2.0 }} …{{ end }}{{ end }}{{ else }}{{ if not $osil }}
            • none{{ end }}{{ end }}{{ with query `count(count by (alertname) (max_over_time(ALERTS{alertstate="firing",notify="",severity=~"critical|warning|info",alertname!~"DailyDigest|WeeklyUpdateDigest"}[24h]) unless on(alertname, host, subject, name, title, instance) homelab:alert_silenced))` }}{{ if gt (. | first | value) 6.0 }}
            • … {{ . | first | value }} alert types in total{{ end }}{{ end }}{{ with $osil }}
            • 🔇 {{ len . }} silenced: {{ range $j, $s := . | sortByLabel "alertname" }}{{ if lt $j 4 }}{{ if $j }}, {{ end }}{{ $s.Labels.alertname }}{{ end }}{{ end }}{{ if gt (len .) 4 }} …{{ end }}{{ end }}

            <b>🛡️ New fixable CVEs</b>{{ range $i, $v := query `count by (id, severity) (max_over_time(security_new_vuln_info[24h]) == 1)` | sortByLabel "id" | sortByLabel "severity" }}{{ if lt $i 5 }}{{ $id := $v.Labels.id }}
            • <b>{{ $id | html }}</b> {{ $v.Labels.severity }} · {{ range $j, $p := query (printf `count by (pkg) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1)` $id) | sortByLabel "pkg" }}{{ if lt $j 3 }}{{ if $j }}, {{ end }}{{ $p.Labels.pkg | html }}{{ end }}{{ end }} · {{ with query (printf `count(count by (image) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1))` $id) }}{{ $c := . | first | value }}{{ $c }} image{{ if gt $c 1.0 }}s{{ end }}: {{ range $j, $m := query (printf `count by (image) (max_over_time(security_new_vuln_info{id="%s"}[24h]) == 1)` $id) | sortByLabel "image" }}{{ if lt $j 3 }}{{ if $j }}, {{ end }}{{ $m.Labels.image | reReplaceAll "@sha256:.*" "" | reReplaceAll "^.*/" "" | html }}{{ end }}{{ end }}{{ if gt $c 3.0 }} …{{ end }}{{ end }}{{ end }}{{ else }}
            • none{{ end }}{{ with query `count(count by (id) (max_over_time(security_new_vuln_info[24h]) == 1))` }}{{ if gt (. | first | value) 5.0 }}
            • … {{ . | first | value }} CVEs in total{{ end }}{{ end }}

            <b>📦 Auto-updates</b>{{ range query `auto_update_last_run_timestamp_seconds > time() - 86400` | sortByLabel "host" }}{{ $h := .Labels.host }}
            • {{ $h }}: {{ range $j, $r := query (printf `auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1` $h) | sortByLabel "project" }}{{ if lt $j 6 }}{{ if $j }}, {{ end }}{{ if eq $r.Labels.result "updated" }}✅{{ else if eq $r.Labels.result "available" }}📦{{ else if eq $r.Labels.result "rolled_back" }}↩️{{ else if eq $r.Labels.result "rollback_failed" }}🔴{{ else if eq $r.Labels.result "error" }}❌{{ else if eq $r.Labels.result "major_held" }}✋{{ else if eq $r.Labels.result "held_back" }}⏸️{{ else if eq $r.Labels.result "skipped" }}⏭️{{ else if eq $r.Labels.result "drift" }}🔁{{ else if eq $r.Labels.result "recreated" }}♻️{{ else }}⏳{{ end }} {{ $r.Labels.project }}{{ end }}{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1) > 6` $h) }} …{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result!~"current|local_build|waiting"} == 1)` $h) }}{{ else }}nothing changed{{ end }}{{ with query (printf `count(auto_update_result{host="%s",result="waiting"} == 1)` $h) }} · ⏳ {{ . | first | value }} waiting{{ end }}{{ else }}
            • no run in the last 24 h{{ end }}

            <b>💤 Awake</b> (24 h){{ range query `avg_over_time(probe_success{job=~"blackbox-beefy|blackbox-tower"}[24h]) * 24` | sortByLabel "job" }} · {{ .Labels.job | reReplaceAll "blackbox-" "" }} {{ .Value | printf "%.1f" }} h{{ end }}{{ with query `100 * (1 - beefy_storage_avail_bytes / beefy_storage_size_bytes)` }}

            <b>🗄️ beefy storage</b>{{ range . | sortByLabel "branch" }} · {{ .Labels.branch | toUpper }} {{ .Value | printf "%.0f" }} %{{ end }}{{ with query `sum(last_over_time(beefy_disk_smart_raw{disk="ssd",attribute="Total_LBAs_Written"}[3d])) * 512 / 1e12` }}
            • SSD written {{ . | first | value | printf "%.1f" }} TB{{ end }}{{ with query `max(max_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Start_Stop_Count"}[1d])) - max(min_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Start_Stop_Count"}[1d]))` }}
            • HDD (24 h): {{ . | first | value | printf "%.0f" }} start/stops{{ with query `max(max_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Power_Cycle_Count"}[1d])) - max(min_over_time(beefy_disk_smart_raw{disk="hdd",attribute="Power_Cycle_Count"}[1d]))` }}, {{ . | first | value | printf "%.0f" }} power cycles{{ end }}{{ end }}{{ range query `beefy_mover_moved_titles > 0 and on() (beefy_mover_dry_run == 0) and on() (beefy_mover_last_run_timestamp_seconds > time() - 86400)` }}
            • mover: {{ .Value | printf "%.0f" }} title(s), {{ with query `beefy_mover_moved_bytes / 1e9` }}{{ . | first | value | printf "%.0f" }}{{ end }} GB SSD → HDD, SSD {{ with query `100 * beefy_mover_ssd_used_ratio{when="before"}` }}{{ . | first | value | printf "%.0f" }}{{ end }} % → {{ with query `100 * beefy_mover_ssd_used_ratio{when="after"}` }}{{ . | first | value | printf "%.0f" }}{{ end }} %{{ end }}{{ end }}{{ with query `beefy_watchdog_event_timestamp_seconds > time() - 86400` }}

            <b>🎬 Downloads</b> (beefy, handled automatically){{ $all := . }}{{ $rl := query `beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400` }}{{ $cap := 5 }}{{ if $rl }}{{ $cap = 4 }}{{ end }}{{ range $i, $e := query `beefy_watchdog_event_timestamp_seconds{kind!="indexer_rate_limited"} > time() - 86400` | sortByLabel "title" | sortByLabel "kind" }}{{ if lt $i $cap }}
            • {{ if eq $e.Labels.kind "guard_removed" }}wrong release removed{{ else if eq $e.Labels.kind "malware_removed" }}fake download removed{{ else if eq $e.Labels.kind "failed" }}failed, re-searching{{ else if eq $e.Labels.kind "stalled" }}stalled, re-searching{{ else if eq $e.Labels.kind "indexer_recovered" }}indexers back{{ else if eq $e.Labels.kind "auto_imported" }}imported automatically{{ else if eq $e.Labels.kind "partial_imported" }}partial season imported{{ else if eq $e.Labels.kind "subtitle_repaired" }}subtitle repaired (broken characters fixed){{ else if eq $e.Labels.kind "subtitle_suspect" }}subtitle needs a look (suspicious characters){{ else if eq $e.Labels.kind "subtitle_forced_synced" }}forced subtitle synced{{ else if eq $e.Labels.kind "subtitle_forced_unverified" }}forced subtitle left unsynced (no clear match){{ else }}{{ $e.Labels.kind | reReplaceAll "_" " " }}{{ end }} · {{ if eq $e.Labels.kind "partial_imported" }}{{ $e.Labels.title | html }}{{ else }}{{ $e.Labels.title | reReplaceAll "^(.{40}).+$" "$1…" | html }}{{ end }}{{ end }}{{ end }}{{ with $rl }}
            • indexer paused (rate limit) · {{ range $j, $x := query `count by (idx) (label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){1}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){2}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?") or label_replace((beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400), "idx", "$1", "title", "(?:[^,]+, ){3}([^,]+?)(?: [(]Prowlarr[)])?(?:, .*)?")) unless on(idx) vector(1)` | sortByLabel "idx" }}{{ if $j }}, {{ end }}{{ $x.Labels.idx | html }}{{ end }}{{ if gt (len .) 1 }} ×{{ len . }}{{ end }}{{ end }}{{ with query `((count(beefy_watchdog_event_timestamp_seconds{kind!="indexer_rate_limited"} > time() - 86400)) or vector(0)) + ((count(beefy_watchdog_event_timestamp_seconds{kind="indexer_rate_limited"} > time() - 86400) > bool 0) or vector(0)) > 5` }}
            • … {{ len $all }} events in total{{ end }}{{ end }}{{ with query `((tls_cert_not_after_timestamp_seconds - time()) / 86400 <= 21) or ((domain_expiry_timestamp_seconds - time()) / 86400 <= 30) or (((subscription_expiry_timestamp_seconds{kind!="No-IP hostname"} - time()) / 86400 <= 30) or ((subscription_expiry_timestamp_seconds{kind="No-IP hostname"} - time()) / 86400 <= 5)) or ALERTS{alertstate="firing",alertname=~"Smart.+"}` }}

            <b>⏰ Expiry and disks</b> (needs attention){{ range $i, $c := query `(tls_cert_not_after_timestamp_seconds - time()) / 86400 <= 21` | sortByLabel "host" }}{{ if lt $i 4 }}
            • 🔐 {{ $c.Labels.host }}: certificate {{ if le $c.Value 0.0 }}expired{{ else }}ends in {{ $c.Value | printf "%.0f" }} d{{ end }}{{ end }}{{ end }}{{ range query `(domain_expiry_timestamp_seconds - time()) / 86400 <= 30` | sortByLabel "domain" }}
            • 🌐 {{ .Labels.domain }}: {{ if eq .Labels.source "anniversary" }}renewal due{{ else }}registration ends{{ end }} in {{ .Value | printf "%.0f" }} d{{ end }}{{ range query `((subscription_expiry_timestamp_seconds{kind!="No-IP hostname"} - time()) / 86400 <= 30) or ((subscription_expiry_timestamp_seconds{kind="No-IP hostname"} - time()) / 86400 <= 5)` | sortByLabel "name" }}
            • 💳 {{ .Labels.name | html }}: {{ if le .Value 0.0 }}ended{{ else }}ends in {{ .Value | printf "%.0f" }} d{{ end }}{{ end }}{{ range $i, $a := query `ALERTS{alertstate="firing",alertname=~"Smart.+"}` | sortByLabel "disk" | sortByLabel "host" }}{{ if lt $i 4 }}
            • 💽 {{ $a.Labels.host }}{{ with $a.Labels.disk }} {{ . }}{{ end }}: {{ $a.Labels.alertname }}{{ end }}{{ end }}{{ end }}
            <blockquote expandable>Non-critical alerts are muted 22:00-07:00; one still firing at 07:00 is sent then. Updates, Unraid and standing CVE counts: Monday digest. History: Grafana dashboard updates-security.</blockquote>
