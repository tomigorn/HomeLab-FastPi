# Security posture alerts, fed by Server/4-Security-Monitoring/security_scan.py
# through node-exporter's textfile collector.
#
# Routing (see alertmanager/alertmanager.yml): critical and warning reach email
# AND Telegram; info is Telegram-only and at most weekly. The split is chosen so
# that the alerts which mean "act today" are the ones that can wake you, and the
# standing counts that can only ever be worked through gradually cannot train you
# to ignore the channel.
groups:
  - name: security-secrets
    rules:
      # The one that matters most. Both repositories are PUBLIC, so a secret
      # reaching them is disclosed the moment it is pushed - and pushing is not
      # reversible, because rewriting history does not un-publish what has
      # already been fetched, cached or indexed. The only remedy is rotation,
      # and rotation only happens if someone finds out.
      - alert: SecretLeakedInPublicRepo
        expr: security_repo_leaks_total > 0
        for: 0m          # no delay: a single scrape saying this is enough
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} secret(s) found in the PUBLIC {{ $labels.repo }} repo history"
          description: >-
            Secrets in the published history of github.com/tomigorn/HomeLab-{{ $labels.repo }}. Assume disclosed and rotate; rewriting history recalls nothing. Details: <code>/var/lib/security-scan/gitleaks-{{ $labels.repo }}.json</code> on fastpi.

      # A real secret file tracked in git. Distinct from the above because
      # gitleaks matches on content and this matches on filename: an .env whose
      # values happen to be low-entropy would slip past the content scan.
      - alert: SecretFileCommittedToRepo
        expr: security_secret_files{verdict="exposed"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} secret file(s) tracked in git on {{ $labels.host }}"
          description: >-
            A secret-named file is tracked by git; .gitignore does not help. Run <code>git rm --cached</code>, then rotate. List: <code>/var/lib/security-scan/hygiene-problems.txt</code>.

      # Not yet public, but one `git add -A` away. Worth catching while it is
      # still cheap - the fix is a .gitignore line rather than a rotation.
      - alert: SecretFileNotIgnored
        expr: security_secret_files{verdict="at_risk"} > 0
        for: 30m
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "{{ $value }} unignored secret file(s) on {{ $labels.host }}"
          description: >-
            Neither tracked nor ignored, so <code>git add -A</code> would commit it to a public repo. Add a .gitignore line (an <code>.env</code> entry does not match <code>.env.bak</code>). List: <code>/var/lib/security-scan/hygiene-problems.txt</code> on fastpi.

  - name: security-patches
    rules:
      - alert: PendingSecurityUpdates
        expr: security_pending_updates{type="security"} > 0
        # 72h, deliberately long: beefy runs unattended-upgrades, so a security
        # update appearing and then clearing on its own is the system working.
        # Three days of it NOT clearing means unattended-upgrades is not doing
        # its job, which is the thing worth being told about.
        for: 72h
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} security update(s) pending for 3+ days"
          description: >-
            Not clearing on its own: unattended-upgrades is off or failing. Check <code>systemctl status unattended-upgrades</code> and /var/log/unattended-upgrades/.

      # tower (Unraid) has no apt; its OS and plugins are checked daily by the patches group when tower is awake.
      - alert: UnraidUpdateAvailable
        expr: security_unraid_os_update > 0 or security_unraid_plugin_update > 0
        for: 1h
        labels:
          severity: info
          notify: weekly
        annotations:
          summary: "tower: {{ if $labels.plugin }}plugin {{ $labels.plugin }} has an update{{ else }}Unraid OS {{ $labels.available }} available (installed {{ $labels.installed }}){{ end }}"
          description: >-
            Update by hand on tower: Tools > Update OS for the OS, Plugins > Check for updates for plugins.
            Weekly reminder at most (info).

  - name: security-images
    rules:
      # notify: weekly - no message of its own, the Monday digest (weekly-digest.yml) lists the count. A standing
      # count of CRITICALs across 60 images is a backlog to work through, not an
      # incident, and mailing it would be the fastest possible way to teach
      # yourself to filter these alerts away.
      # Fires on the FIXABLE count, not the total. A CVE with no upstream fix
      # cannot be resolved by any image update, so including it would make this
      # alert impossible to ever clear - and an alert that can never clear is one
      # you learn to dismiss. The total is still recorded in
      # security_image_vulnerabilities for context.
      - alert: CriticalImageVulnerabilities
        expr: security_image_vulnerabilities_fixable{severity="CRITICAL"} > 0
        for: 1h
        labels:
          severity: info
          notify: weekly
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} FIXABLE critical CVE(s) in running images"
          description: >-
            Critical CVEs in running images on {{ $labels.host }}, usually fixed by a newer tag (Cup: https://cup.holy-grail.ch/). Worst first: <code>/var/lib/security-scan/image-cves-{{ $labels.host }}.txt</code> on fastpi.

      # Per finding, not per count: fires for each fixable CRITICAL/HIGH (image, CVE, package) first seen in the last 24 h, from the hourly code scan (scope code-<repo>) or the nightly running-image scan (scope = host). Images new to the scan are baselined, so this is "a new CVE in something we already run", not the backlog. notify: digest: listed once per CVE in the 06:30 daily digest (daily-digest.yml), no message of its own.
      - alert: NewFixableImageVulnerability
        expr: security_new_vuln_info == 1
        for: 0m
        labels:
          severity: info
          notify: digest
        annotations:
          summary: "{{ $labels.scope }}: new fixable {{ $labels.severity }} {{ $labels.id }} in {{ $labels.image }} ({{ $labels.pkg }})"
          description: >-
            Update the image (Cup: https://cup.holy-grail.ch/). All findings: <code>/var/lib/security-scan/code-cves-&lt;repo&gt;.txt</code> or <code>image-cves-&lt;host&gt;.txt</code> on fastpi.

      - alert: ImagesUnscannable
        expr: security_images_unscannable > 0
        for: 1d
        labels:
          severity: info
          notify: digest
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} image(s) could not be scanned"
          description: >-
            Locally built images cannot be read through the Docker socket proxy; listed so CVE totals do not understate coverage.

  - name: security-logins
    rules:
      # Stands in for CrowdSec on beefy and tower: SSH is LAN-only there, so a count is enough (Server/4-Security-Monitoring/README.md).
      - alert: FailedLoginsSpike
        expr: security_failed_logins_total > 20
        for: 15m
        labels:
          severity: info
          notify: digest
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} failed SSH logins in 24 h"
          description: >-
            More than 20 sshd lines with Failed password / Invalid user / authentication failure in the last 24 h.
            SSH is LAN-only, so the source is inside the LAN or VPN.
            Look: journalctl _COMM=sshd (fastpi), /var/log/auth.log (beefy), /var/log/syslog (tower).

  - name: security-access
    rules:
      # Scan every 5 min; the last-login timestamp keeps the alert up for an hour. lan logins (beefy automation, 192.168.1.102) stay quiet.
      # vpn and tunnel logins are the owner's own: daily digest only. An unclassified source pages.
      - alert: SshLoginOutsideLan
        expr: security_ssh_last_login_timestamp_seconds{source_class=~"vpn|tunnel"} > time() - 3600
        for: 0m
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "{{ $labels.host }}: SSH login of {{ $labels.user }} from {{ $labels.source_class }}"
          description: >-
            Accepted SSH login from outside the LAN (vpn = WireGuard, tunnel = cloudflared, other = unknown address) within the last hour.
            Source address and key fingerprint: journalctl _COMM=sshd-session | grep Accepted

      - alert: SshLoginOutsideLan
        expr: security_ssh_last_login_timestamp_seconds{source_class!~"lan|vpn|tunnel"} > time() - 3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: SSH login of {{ $labels.user }} from {{ $labels.source_class }}"
          description: >-
            Accepted SSH login from outside the LAN (vpn = WireGuard, tunnel = cloudflared, other = unknown address) within the last hour.
            Source address and key fingerprint: journalctl _COMM=sshd-session | grep Accepted

      - alert: SshLoginUnexpectedUser
        expr: security_ssh_last_login_timestamp_seconds{user!="pi"} > time() - 3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: SSH login of unexpected user {{ $labels.user }}"
          description: >-
            Only pi is expected to log in over SSH. Look: journalctl _COMM=sshd-session | grep Accepted

      - alert: SecurityFileChanged
        expr: security_integrity_changed > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.path }} differs from the baseline"
          description: >-
            authorized_keys, sudoers or sshd_config changed since the baseline. If it was you, accept it: <code>sudo rm /var/lib/security-scan/integrity-baseline-fastpi.json &amp;&amp; sudo systemctl start security-access.service</code>

      - alert: SecurityAccessScanStale
        expr: time() - security_scan_last_success_timestamp_seconds{subject=~"(ssh-logins|integrity)-.*"} > 3600
        for: 10m
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "Security scan {{ $labels.subject }} has not succeeded in {{ $value | humanizeDuration }}"
          description: "The 5-minute security-access.timer is not producing fresh SSH login and integrity figures: systemctl status security-access.service"

  - name: security-audit
    rules:
      # Weekly (security-audit.timer, Sun 04:05), fastpi and beefy. Telegram only, by decision: rootkit checkers are noisy, so only findings outside the accepted baseline count.
      # Alerts for 25 h after the set of NEW findings changed (security_rootkit_new_fingerprint), not for as long as a known finding stays: the weekly digest lists the standing count.
      - alert: RootkitWarning
        expr: |-
          security_rootkit_warnings > 0
            and on(host, tool) changes(security_rootkit_new_fingerprint[25h]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} new {{ $labels.tool }} finding(s)"
          description: >-
            The set of findings outside the accepted baseline changed in the last audit; they are marked NEW in /var/lib/security-scan/audit-{{ $labels.host }}.txt on fastpi.
            Check them by hand; a false positive is accepted by deleting /var/lib/security-scan/audit-accepted-{{ $labels.host }}-{{ $labels.tool }}.txt and running systemctl start security-audit.service.
            A set that stays the same does not alert again.

      - alert: LynisHardeningDropped
        expr: (security_lynis_hardening_index offset 7d) - security_lynis_hardening_index > 5
        for: 1h
        labels:
          severity: info
          notify: digest
        annotations:
          summary: "{{ $labels.host }}: Lynis hardening index fell to {{ with query (printf \"security_lynis_hardening_index{host='%s'}\" $labels.host) }}{{ . | first | value }}{{ end }} ({{ $value }} points in 7 days)"
          description: >-
            Something weakened the configuration since last week's audit.
            The warnings are in /var/lib/security-scan/audit-{{ $labels.host }}.txt on fastpi; the full report is /var/log/lynis-report.dat on the host.

  - name: security-scan-health
    rules:
      # Without these the whole mechanism is a dashboard that reads "0 secrets
      # found" whether it is working or not. This is the same failure that let
      # the 2026-10-04 edge outage run for 24 hours and that Alertmanager's
      # unreadable-secret retry loop reproduced: the absence of bad news is not
      # good news unless something is checking that the news still arrives.
      - alert: SecurityScanFailing
        expr: security_scan_errors > 0
        for: 2h
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "Security scan subject {{ $labels.subject }} is failing"
          description: >-
            Errored (not merely unreachable); old values are still served and going stale. Run <code>systemctl start security-scan.service</code> on fastpi, then <code>journalctl -u security-scan -n 50</code>.

      # Catches both a silently dead timer and a host that stopped being
      # reachable for longer than its normal off-hours.
      # tower sleeps most days, so its subjects count only when tower was awake at their scan time (tower:awake_for_scan, tower-power.yml): 04:05 for logins/patches, 05:00 + 05:50 for av/avhits.
      - alert: SecurityScanStale
        expr: >-
          (time() - security_scan_last_success_timestamp_seconds{subject!~"(images|audit|cup|ssh-logins|integrity)-.*|.*-tower"} > 172800)
          or
          ((time() - security_scan_last_success_timestamp_seconds{subject=~"(logins|patches)-tower"} > 93600)
            and on() (max_over_time(tower:awake_for_scan{slot="0405"}[24h]) == 1))
          or
          ((time() - security_scan_last_success_timestamp_seconds{subject=~"(av|avhits)-tower"} > 93600)
            and on() (max_over_time(tower:awake_for_scan{slot="0550"}[24h]) == 1))
          or
          (time() - security_scan_last_success_timestamp_seconds{subject=~"(images|audit|cup)-.*"} > 1209600)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Security scan {{ $labels.subject }} has not succeeded in {{ $value | humanizeDuration }}"
          description: >-
            Stale after 48h (daily scans) or 14d (weekly image, audit and Cup scans).
            tower sleeps most of the time, so its subjects count only when tower was awake at their scan time in the last 24 h and there is still no result for 26 h.
            Old figures are still served, so the dashboard looks fine.

      # Guards the transport itself. A malformed .prom file makes node-exporter
      # discard the WHOLE file, so a formatting slip silently removes every
      # metric above rather than just one - and every alert above would then
      # stop evaluating with no firing alert to show it.
      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error > 0
        for: 15m
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "node-exporter cannot read a textfile metric file"
          description: >-
            A malformed .prom file in /var/lib/node-exporter/textfile makes node-exporter drop all its metrics, so dependent security_* alerts stop evaluating. Check <code>ls -l</code> there and <code>docker logs node-exporter | tail</code>.
