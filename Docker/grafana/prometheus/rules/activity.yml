# Alert rules for the Activity status page (Docker/Activity, job activity): the service runs but a data source is gone, so the page sits at "❔ unavailable" with nothing else saying so.
# The service itself down is TargetDown/ContainerDown; both rules need the service up.
# Tests: prometheus/tests/activity_test.yml
groups:
  - name: activity
    rules:
      # Waker says up, but no good poll for 5 min (or none at all): gate stopped, rotated key (401), broken Traefik route. Asleep beefy has old data by design.
      - alert: ActivityBeefyDataStale
        expr: activity_beefy_up == 1 unless on(job, instance) activity_beefy_snapshot_age_seconds <= 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Activity page: beefy is awake, its data is not"
          description: >-
            Last good poll of the beefy gate {{ with query "activity_beefy_snapshot_age_seconds" }}{{ . | first | value | humanizeDuration }} ago{{ else }}never since the start{{ end }} (fresh is under 90 s); the page shows ❔ unavailable.
            Check: the gate on beefy (<code>ssh beefy-direct sudo docker ps --filter name=activity-gate</code>, <code>post-update-check.sh Activity-Gate</code>),
            its API keys (<code>Activity-Gate/secrets/*.apikey</code>; HTTP 401 in <code>docker logs activity</code>),
            the Traefik route <code>activity-gate</code> (<code>Traefik/traefik/dynamic/activity-internal.yml</code>, <code>docker logs traefik</code>).

      # The fastpi sources: a metric is absent when its last read failed (ABS key copy stale, ABS down, qBittorrent route broken).
      - alert: ActivityLocalSourcesMissing
        expr: |-
          label_replace(up{job="activity"} == 1 unless on(job, instance) activity_listening_sessions, "source", "listening", "", "")
            or
          label_replace(up{job="activity"} == 1 unless on(job, instance) count by (job, instance) (activity_audiobook_downloads), "source", "audiobook_downloads", "", "")
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Activity page: {{ $labels.source }} data missing"
          description: >-
            {{ if eq $labels.source "listening" }}The page shows listening as unavailable.
            Check the ABS key copy <code>Activity/secrets/abs_api_key</code> (same as <code>Audiobook-Requests/secrets/abs_api_key</code>, owner 65060, 0400; ABS key <code>audiobook-importer</code> needs admin) and that Audiobookshelf runs;
            {{- else }}The page shows audiobook downloads as unavailable.
            Check the Traefik route <code>activity-qbit</code> (<code>Traefik/traefik/dynamic/activity-internal.yml</code>, <code>docker logs traefik</code>) and that gluetun and qBittorrent (mouse) run;
            {{- end }} the error is in <code>docker logs activity</code>.
