# Weekly update digest: one Telegram message on Monday 05:00 local time. Tests: prometheus/tests/weekly-digest_test.yml
# Alertmanager routes it to telegram-digest (no resolved message); the alert fires for one hour, so each Monday is a new notification.
groups:
  - name: weekly-digest
    rules:
      # Prometheus only knows UTC. CEST (UTC+2) runs from the last Sunday in March to the last Sunday in October; day_of_month - day_of_week is the date of the most recent Sunday, and a last Sunday always falls on the 25th or later. Off by an hour only during the switch night itself.
      - record: homelab:local_utc_offset_hours
        expr: |-
          (vector(2) and on() (
              (month() > 3 and month() < 10)
            or (month() == 3 and (day_of_month() - day_of_week()) >= 25)
            or (month() == 10 and (day_of_month() - day_of_week()) < 25)
          )) or vector(1)

      # Local minutes since midnight (0-1439), for rules that look at a local time slot (tower-power.yml).
      - record: homelab:local_minute_of_day
        expr: |-
          hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) * 60
            + minute(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours)))

      - alert: WeeklyUpdateDigest
        expr: |-
          vector(1)
            and on() (day_of_week(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) == 1)
            and on() (hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) == 5)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Weekly update digest"
          description: |-
            <b>Apt</b> (all / security){{ range query `security_pending_updates{type="all"}` | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Value }} / {{ with query (printf `security_pending_updates{type="security",host="%s"}` .Labels.host) }}{{ . | first | value }}{{ else }}?{{ end }}{{ else }}
            • no data{{ end }}

            <b>Images</b> (Cup){{ range query `security_image_updates{type="all"}` | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Value }}{{ with query (printf `security_cup_snapshot_timestamp_seconds{host="%s"} and on(host) (time() - security_cup_snapshot_timestamp_seconds > 129600)` .Labels.host) }} (snapshot as of {{ . | first | value | humanizeTimestamp }}){{ end }}{{ else }}
            • no data{{ end }}{{ range query `security_image_update_info` | sortByLabel "reference" | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Labels.reference | html }} ({{ .Labels.type }}){{ end }}

            {{ with query `vector(1) and on() (day_of_month(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) <= 7) and on() count(auto_update_result{result="local_build"} == 1)` }}<b>Rebuild</b> (monthly, custom builds: refresh the base image){{ range query `count by (host, project) (auto_update_result{result="local_build"} == 1)` | sortByLabel "project" | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Labels.project }}{{ end }}

            {{ end }}<b>Fixable critical CVEs</b>{{ range query `security_image_vulnerabilities_fixable{severity="CRITICAL"}` | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Value }}{{ else }}
            • no data{{ end }}

            <b>Unraid</b>
            • {{ with query `security_unraid_os_update` }}{{ with first . }}{{ if eq .Value 1.0 }}OS {{ .Labels.installed }} → {{ .Labels.available }}{{ else }}OS {{ .Labels.installed }} current{{ end }}{{ end }}{{ else }}no data{{ end }}
            • plugins: {{ range $i, $s := query `security_unraid_plugin_update == 1` | sortByLabel "plugin" }}{{ if $i }}, {{ end }}{{ $s.Labels.plugin }}{{ else }}none{{ end }}

            <b>CrowdSec</b>{{ range query `crowdsec_autoupdate_result == 1` }}
            • engine {{ .Labels.to }} ({{ .Labels.result }}){{ else }}
            • no data{{ end }}
            • bouncer plugin {{ with query `crowdsec_bouncer_plugin_outdated` }}{{ if eq (. | first | value) 1.0 }}OUTDATED{{ else }}current{{ end }}{{ else }}no data{{ end }}

            <b>Antivirus</b> (last new-files scan){{ range query `time() - clamav_last_run_timestamp_seconds{mode="new"}` | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Value | humanizeDuration }} ago, {{ with query (printf `clamav_infected_last_run{mode="new",host="%s"}` .Labels.host) }}{{ . | first | value }}{{ else }}?{{ end }} infected{{ else }}
            • no data{{ end }}

            <b>Rootkit</b> (new findings){{ range query `security_rootkit_warnings` | sortByLabel "tool" | sortByLabel "host" }}
            • {{ .Labels.host }}/{{ .Labels.tool }}: {{ .Value }}{{ else }}
            • no data{{ end }}

            <b>Lynis</b>{{ range query `security_lynis_hardening_index` | sortByLabel "host" }}
            • {{ .Labels.host }}: {{ .Value }}{{ else }}
            • no data{{ end }}
