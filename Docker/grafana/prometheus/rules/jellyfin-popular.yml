# Alert rules for beefy's "Popular movies/shows" job (Docker/Jellyfin scripts/popular.py, beefy repo): Netflix Top 10 + streaming lists and the request allow-list.
# Data: popular.py writes ~/.local/state/jellyfin-popular.prom after every run (04:39, and 22:20 when beefy is awake); Server/4-Security-Monitoring/beefy-idle-pull.sh copies it here. The copy stays while beefy sleeps.
# Single titles that fail are skipped (jf_popular_errors); success 0 = the run failed or too many titles failed, and the published lists were kept. After 9 days without a good run the request backend refuses every request.
# Tests: prometheus/tests/jellyfin-popular_test.yml
groups:
  - name: jellyfin-popular
    rules:
      # The file only changes at the end of a run, so 10m just rides out a re-pull.
      - alert: JellyfinPopularFailed
        expr: jf_popular_last_run_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Jellyfin Popular movies/shows: last run failed"
          description: >-
            The run of {{ with query "jf_popular_last_run_timestamp_seconds" }}{{ . | first | value | humanizeTimestamp }}{{ end }} failed
            ({{ with query "jf_popular_errors" }}{{ . | first | value | printf "%.0f" }}{{ end }} title lookups failed); the lists from the last good run stay published.
            Look at <code>journalctl --user -u jellyfin-popular</code> on beefy (Seerr, Jellyfin or Prowlarr down?). Retries at the next run.

      # Runs twice a day at most; two days without any run = the timer or the pull is broken.
      - alert: JellyfinPopularStale
        expr: time() - jf_popular_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jellyfin Popular movies/shows: no run for {{ $value | humanizeDuration }}"
          description: >-
            The last run was {{ $value | humanizeDuration }} ago. After 9 days the request backend refuses every request from the popular page.
            Check <code>systemctl --user list-timers jellyfin-popular.timer</code> on beefy and the beefy-idle-pull copy on fastpi.
