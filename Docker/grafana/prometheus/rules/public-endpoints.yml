# Alert rules for the public edge.
#
# Written after the 2026-10-04 outage: every public hostname returned 404 for
# ~24 hours and nobody noticed. Traefik's container was running, its process was
# healthy, and its metrics endpoint answered - so no process- or container-level
# check could have caught it. Only an outside-in probe can.
groups:
  - name: public-endpoints
    rules:
      # The main one. probe_success goes 0 when the endpoint answers 404 or 5xx,
      # times out, or fails TLS - see blackbox.yml for why 404 counts as failure.
      #
      # Every expression here is scoped to the two edge jobs. blackbox-beefy also
      # produces probe_success, and for it 0 just means beefy is asleep - unscoped,
      # these rules would page every time beefy idles off.
      - alert: PublicEndpointDown
        expr: probe_success{job=~"blackbox-public|blackbox-gated"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint down: {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} has not answered like a working backend for
            3 minutes (HTTP {{ with printf "probe_http_status_code{instance=%q,job=%q}" $labels.instance $labels.job | query }}{{ . | first | value }}{{ end }}).
            A 404 here usually means Traefik lost the router rather than the app
            being down - check `docker logs traefik | grep -i plugin` first, since
            a failed plugin download disables the websecure entrypoint middleware
            and takes every public route with it.

      # The LAN/VPN-locked admin apps must answer 403 to this off-LAN probe.
      # Any other result fails: 200/302 = the lockdown leaked, 404/5xx = route gone.
      - alert: LanLockedEndpointNotLocked
        expr: probe_success{job="blackbox-lan-locked"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "LAN-locked endpoint not locked: {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} should answer 403 from outside the LAN/VPN but
            returned HTTP {{ with printf "probe_http_status_code{instance=%q,job=%q}" $labels.instance $labels.job | query }}{{ . | first | value }}{{ end }}
            for 3 minutes. 200 or 302 means local-networks@file is gone from its
            Traefik router and the app is publicly reachable; 404 means the route is gone.

      # Gated routes behind a *-wake gate, probed every 15m (blackbox-gated-wake): one failed probe fires, held until a later probe passes.
      - alert: WakeGatedEndpointNotGated
        expr: min_over_time(probe_success{job="blackbox-gated-wake"}[20m]) == 0
        labels:
          severity: critical
        annotations:
          summary: "Wake-gated endpoint lost its login gate: {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} must answer 302 to sso.holy-grail.ch but the last probe got
            HTTP {{ with printf "last_over_time(probe_http_status_code{instance=%q}[20m])" $labels.instance | query }}{{ . | first | value }}{{ end }}.
            Without authentik@file in front of its *-wake middleware every visitor (and this probe) wakes beefy.
            Check its router in Docker/Traefik/traefik/dynamic/ and docker logs traefik.

      # The same routes through Cloudflare (blackbox-exporter-wan resolves via 1.1.1.1, so it goes out and back in through the tunnel).
      # The LAN jobs above never leave the house: AdGuard's wildcard sends *.holy-grail.ch straight to Traefik.
      - alert: PublicPathDown
        expr: probe_success{job=~"blackbox-wan-.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Public path through Cloudflare down: {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} resolved via public DNS failed for 5 minutes
            (HTTP {{ with printf "probe_http_status_code{instance=%q,job=%q}" $labels.instance $labels.job | query }}{{ . | first | value }}{{ end }};
            the LAN probe of the same job type says HTTP {{ with printf "probe_http_status_code{instance=%q,job=%q}" $labels.instance (reReplaceAll "^blackbox-wan-" "blackbox-" $labels.job) | query }}{{ . | first | value }}{{ end }}).
            530/502/1033 = tunnel or cloudflared, 0 = public DNS or connection, 403 on a public route = a Cloudflare block,
            200 on a LAN-locked route = local-networks@file leaked.

      - alert: CloudflareTunnelDown
        expr: >-
          count(probe_success{job=~"blackbox-wan-.*"} == 0) == count(probe_success{job=~"blackbox-wan-.*"})
          and on() max(probe_success{job=~"blackbox-public|blackbox-gated"}) == 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare path down: all {{ $value }} public-DNS probes fail while Traefik answers on the LAN"
          description: >-
            Every probe through Cloudflare fails but the LAN probes pass, so the tunnel, its ingress or the
            Cloudflare DNS records are broken (or fastpi's internet is down). Check: docker logs --since 15m cloudflared;
            the tunnel's Public Hostnames in the Cloudflare dashboard. Restarting cloudflared is a tunnel change: owner only.

      # cloudflared's own view: HA connections to the Cloudflare edge (usually 4). Fires before/independently of the outside-in probes.
      # A dead scrape (up == 0) is covered by TargetDown; CloudflareTunnelDown is inhibited while this fires.
      - alert: CloudflaredTunnelDown
        expr: cloudflared_tunnel_ha_connections < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cloudflared has no connection to the Cloudflare edge"
          description: >-
            cloudflared_tunnel_ha_connections has been below 1 for 5 minutes: the tunnel is not connected, so every public route is down.
            Check: docker logs --since 15m cloudflared. Restarting cloudflared is a tunnel change: owner only.

      # Catches the whole edge going at once, which is the plugin-failure
      # signature and is worth a louder, faster alert than a single service.
      - alert: AllPublicEndpointsDown
        expr: >-
          min(probe_success{job=~"blackbox-public|blackbox-gated"}) == 0
          and count(probe_success{job=~"blackbox-public|blackbox-gated"} == 0) == count(probe_success{job=~"blackbox-public|blackbox-gated"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ALL public endpoints are down ({{ $value }})"
          description: >-
            Every probed hostname is failing simultaneously. That points at
            Traefik or the Cloudflare tunnel rather than any single app. The
            2026-10-04 cause was Traefik failing to download the CrowdSec plugin
            at startup, which invalidated the entrypoint middleware and disabled
            every router. A `docker compose restart traefik` fixed it.

      # The probe itself going away would otherwise look like "all clear".
      # All blackbox jobs, not just blackbox-public: `up` here is the scrape of
      # the exporter, so it is 1 even while beefy sleeps (probe_success says that).
      - alert: BlackboxExporterDown
        expr: up{job=~"blackbox-.*"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Blackbox exporter is not being scraped ({{ $labels.job }})"
          description: >-
            The public-endpoint probes are not running, so an edge outage would
            now go undetected again. Absence of alerts is not evidence of health.

      # Certificates are renewed by Traefik; this is the backstop for when that
      # quietly stops working.
      - alert: PublicCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox-public|blackbox-gated|blackbox-lan-locked"} - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in under 14 days"
          description: >-
            Traefik renews via the cloudflare resolver; if this fires, renewal is
            failing and there are about two weeks to fix it.
