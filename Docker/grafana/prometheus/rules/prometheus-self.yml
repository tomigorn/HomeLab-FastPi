# Prometheus watching itself (job prometheus, self-scrape) plus a generic TargetDown.
# Subset of the upstream prometheus-mixin. Prometheus being fully down is caught by container-exporter's own Telegram fallback, not here.
# Tests: prometheus/tests/prometheus-self_test.yml
groups:
  - name: prometheus-self
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: max_over_time(prometheus_config_last_reload_successful{job="prometheus"}[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed; it still runs the old config"
          description: >-
            docker logs --since 1h prometheus | grep -i reload; then docker exec prometheus promtool check config /etc/prometheus/prometheus.yml.

      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rules failing to evaluate: {{ $labels.rule_group }}"
          description: >-
            Alerts in this group cannot fire. Error: http://localhost:9090/rules (ssh -L 9090:127.0.0.1:9090 fastpi) or docker logs --since 1h prometheus | grep -i 'evaluating rule'.

      - alert: PrometheusMissingRuleEvaluations
        expr: increase(prometheus_rule_group_iterations_missed_total{job="prometheus"}[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus skips evaluations of {{ $labels.rule_group }}"
          description: >-
            The group takes longer than its interval (the Pi is overloaded or a query is too heavy). Check: top; http://localhost:9090/rules for the slow group.

      - alert: PrometheusErrorSendingAlerts
        expr: >-
          100 * rate(prometheus_notifications_errors_total{job="prometheus"}[5m])
          / rate(prometheus_notifications_sent_total{job="prometheus"}[5m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus fails to send {{ $value | printf \"%.0f\" }}% of alerts to {{ $labels.alertmanager }}"
          description: >-
            Alerts are not reaching Alertmanager. Check: docker logs --since 1h prometheus | grep -i notifier; curl -s 127.0.0.1:9093/-/ready.

      - alert: PrometheusNotificationsDropped
        expr: increase(prometheus_notifications_dropped_total{job="prometheus"}[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is dropping alerts before they reach Alertmanager"
          description: >-
            The notification queue overflows or Alertmanager rejects them. Check: docker logs --since 1h prometheus | grep -i notifier.

      - alert: PrometheusNotConnectedToAlertmanagers
        expr: max_over_time(prometheus_notifications_alertmanagers_discovered{job="prometheus"}[5m]) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus has no Alertmanager to send to"
          description: >-
            No alert can be delivered. Check the alerting: block in prometheus.yml and that the alertmanager container runs.

      - alert: PrometheusTSDBCompactionsFailing
        expr: increase(prometheus_tsdb_compactions_failed_total{job="prometheus"}[3h]) > 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB compactions are failing"
          description: >-
            Blocks are not compacted, so disk use and memory grow. Check: docker logs --since 6h prometheus | grep -i compact; df -h /.

      - alert: PrometheusTSDBReloadsFailing
        expr: increase(prometheus_tsdb_reloads_failures_total{job="prometheus"}[3h]) > 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB cannot reload its blocks"
          description: >-
            Usually a corrupt block on disk. Check: docker logs --since 6h prometheus | grep -iE 'reload|block'.

      - alert: PrometheusTSDBWALCorruptions
        expr: increase(prometheus_tsdb_wal_corruptions_total{job="prometheus"}[3h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus found a corrupted WAL"
          description: >-
            Recent samples may be lost (unclean shutdown or disk errors). Check: docker logs --since 6h prometheus | grep -i wal; sudo dmesg | grep -i nvme.

      # Summed over type: the histogram counter stays 0 without native histograms.
      - alert: PrometheusNotIngestingSamples
        expr: sum without (type) (rate(prometheus_tsdb_head_samples_appended_total{job="prometheus"}[5m])) <= 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus stopped storing samples"
          description: >-
            Scrapes run but nothing is written; dashboards and alerts go blank. Check: docker logs --since 1h prometheus; df -h /.

      # Excluded jobs have their own alert: blackbox-* (BlackboxExporterDown; probes of sleeping beefy/tower keep up=1 anyway), alertmanager (AlertmanagerDown), cup (CupNotReporting, 1h).
      - alert: TargetDown
        expr: up{job!~"blackbox-.*|alertmanager|cup"} == 0
        for: 5m
        labels:
          severity: warning
          notify: digest
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
          description: >-
            Down for 5 min; every alert built on this job is blind. Why: the error column at http://localhost:9090/targets (ssh -L 9090:127.0.0.1:9090 fastpi), then docker ps -a for its container.
