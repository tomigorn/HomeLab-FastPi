# Container image updates, from Cup via json-exporter.
#
# severity: info on purpose - these route to Telegram only (see
# alertmanager/alertmanager.yml), never to email. A weekly nag by mail is how people
# learn to filter alerts into the bin, and then miss a real one.
groups:
  - name: container-updates
    rules:
      - alert: ContainerImageUpdatesAvailable
        # Cup is scraped every 15m but a sample is only current for 5m (staleness), so last_over_time bridges the gap; a bare selector would reset `for:` every cycle and never fire.
        expr: last_over_time(cup_updates_available[20m]) > 0
        for: 30m
        labels:
          severity: info
          notify: weekly
        annotations:
          summary: "{{ $value }} container image update(s) available"
          description: >-
            Cup reports {{ $value }} image(s) with updates
            ({{ with query "last_over_time(cup_updates_major[20m])" }}{{ . | first | value }}{{ end }} major,
            {{ with query "last_over_time(cup_updates_minor[20m])" }}{{ . | first | value }}{{ end }} minor).
            Details at https://cup.holy-grail.ch/ . This counts BOTH hosts since
            2026-10-09 (fastpi locally + beefy via its Cup agent), so the dashboard's
            `server` column says which machine to act on. Note Cup watches every image
            present on a host including ones not in use, so check in_use before acting.

      - alert: CupNotReporting
        # Same 15m scrape / 5m staleness gap as above.
        expr: last_over_time(up{job="cup"}[20m]) == 0
        for: 1h
        labels:
          severity: info
          notify: digest
        annotations:
          summary: "Cup update check is not being scraped"
          description: >-
            json-exporter cannot reach Cup, so update notifications have stopped.
            Silence rather than ignore - absence of update alerts would otherwise
            look like "everything is current".
