# Nightly image auto-update (Docker/_global/scripts/auto_update.py): fastpi 03:10, beefy 04:12 (its file is pulled by security-av at 04:20). Every series has a host label; one message per host. Doc: Server/4-Security-Monitoring/auto-updates.md. Tests: tests/auto-updates_test.yml
groups:
  - name: auto-updates
    rules:
      # One Telegram per night when anything happened; fires for the first hour after the run, routed to telegram-digest (no resolved message), so each night is a new message.
      - alert: AutoUpdateNightly
        expr: |-
          count by (host) (auto_update_result{result!~"current|local_build|waiting"}) > 0
            and on(host) (time() - auto_update_last_run_timestamp_seconds < 3600)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Nightly auto-update {{ $labels.host }}"
          description: |-
            {{ $h := $labels.host }}{{ range printf "auto_update_result{host=%q,result!~%q}" $h "current|local_build|waiting" | query | sortByLabel "project" }}• {{ if eq .Labels.result "updated" }}✅{{ else if eq .Labels.result "available" }}📦{{ else if eq .Labels.result "rolled_back" }}↩️{{ else if eq .Labels.result "rollback_failed" }}🔴{{ else if eq .Labels.result "error" }}❌{{ else if eq .Labels.result "major_held" }}✋{{ else if eq .Labels.result "held_back" }}⏸️{{ else if eq .Labels.result "skipped" }}⏭️{{ else }}⏳{{ end }} <b>{{ .Labels.project }}</b> · {{ .Labels.result }} · {{ .Labels.ref | html }} ({{ .Labels.from }} → {{ .Labels.to }}){{ with .Labels.command }}
            <code>{{ . | html }}</code>{{ end }}
            {{ end }}{{ with printf "auto_update_omitted{host=%q}" $h | query }}{{ if gt (. | first | value) 0.0 }}• … {{ . | first | value | printf "%.0f" }} more
            {{ end }}{{ end }}• ⏳ {{ with printf "count(auto_update_result{host=%q,result=\"waiting\"})" $h | query }}{{ . | first | value }}{{ else }}0{{ end }} waiting out the cool-down
            <blockquote expandable>Log: <code>journalctl -u auto-update</code> on {{ $h }}</blockquote>

      # The update failed its checks AND the rollback did not verify: something is down now. On fastpi the script has also paged out of band (oob-alert.sh); beefy has no such path, this alert is its page.
      - alert: AutoUpdateRollbackFailed
        expr: auto_update_result{result="rollback_failed"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} {{ $labels.project }}: auto-update rollback failed"
          description: |-
            Failed verification, rollback did not verify: {{ $labels.ref | html }} ({{ $labels.from }} → {{ $labels.to }}). Check: <code>cd ~/Projects/Docker/{{ $labels.project }} && docker compose ps</code> on {{ $labels.host }} (beefy: sudo docker). Log: <code>journalctl -u auto-update</code>, backups in ~/backups/pre-update/

      - alert: AutoUpdateNotRunning
        expr: time() - auto_update_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Nightly auto-update on {{ $labels.host }} has not run for {{ $value | humanizeDuration }}"
          description: "Check <code>systemctl status auto-update.timer</code> and <code>journalctl -u auto-update</code> (beefy: its file reaches fastpi with the 04:20 security-av pull)"
