# Alert rules for beefy's sleep/wake cycle.
#
# Written 2026-10-11. For 2.5 days a 60s blackbox probe of the Jellyfin route
# woke beefy every time its idle watcher powered it off: ~180 boots, ~30 W around
# the clock, and nothing noticed. Each cycle looked healthy in isolation - the
# watcher slept on schedule, the waker woke on request - so only the RATE gives
# it away. This rule watches the rate, whatever the cause: a probe, a client
# polling a beefy route, a wake gate listed before authentik@file.
#
# Data: the blackbox-beefy job (direct TCP to sshd, cannot itself wake beefy).
groups:
  - name: beefy-power
    rules:
      # A normal day is the 03:55 maintenance wake (security scans 04:05-04:25) and a
      # handful of real sessions - each boot is two changes (up, down), so well
      # under 20. The 2026-10-09 loop produced ~180 changes a day and would have
      # crossed 20 within about four hours.
      - alert: BeefyWakeLoop
        expr: changes(probe_success{job="blackbox-beefy"}[24h]) > 20
        labels:
          severity: warning
        annotations:
          summary: "beefy keeps waking up ({{ $value }} state changes in 24h)"
          description: >-
            beefy has switched between up and down {{ $value }} times in the last
            24 hours, so something keeps waking it right after it idles off.
            Find the source in the Beefy-Waker log (`docker logs` on it is
            truncated; use `sudo grep -a 'beefy down\|manual wake'` on its json
            log file): "beefy down (...:PORT)" lines come through a Traefik
            *-wake gate, "manual wake" from 192.168.1.2 is `ssh beefy` on fastpi.
            The 2026-10-09 cause was a blackbox probe of an un-authenticated
            beefy route (Jellyfin).

      # Added 2026-10-27. beefy sleeps when idle, so 6 h since boot means something keeps it awake (the idle watcher's reasons are republished by beefy-idle-pull.timer as beefy_idle_*).
      # Based on beefy's real boot time (beefy_boot_time_seconds, S5 power-off so boot = wake), not on Prometheus history: a Prometheus restart cannot make it fire early.
      # Needs fresh idle metrics (< 15 min old), so the message always has a reason list.
      # Not NEW inside 03:58-04:45 local (the maintenance wake and its scans); an alert that already fires carries on through the window instead of resolving with a false "asleep again".
      # Local time is derived from homelab:local_utc_offset_hours (rules/weekly-digest.yml).
      - alert: BeefyAwakeLong
        expr: |-
          probe_success{job="blackbox-beefy"} == 1
            and on() (time() - beefy_boot_time_seconds >= 6 * 3600)
            and on() (time() - beefy_idle_updated_timestamp_seconds < 900)
            and on() (
                  (hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) * 60
                   + minute(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) < 238)
               or (hour(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) * 60
                   + minute(vector(time() + 3600 * scalar(homelab:local_utc_offset_hours))) > 285)
               or (count(ALERTS{alertname="BeefyAwakeLong", alertstate="firing"}) > 0)
            )
        labels:
          severity: warning
        annotations:
          summary: "beefy has been awake for 6 h"
          awake_since: '{{ with query "beefy_boot_time_seconds + 3600 * scalar(homelab:local_utc_offset_hours)" }}{{ . | first | value | humanizeTimestamp }}{{ end }}'
          awake_by: |-
            {{ range query `beefy_idle_busy == 1` | sortByLabel "reason" }}• {{ .Labels.reason | html }}
            {{ end }}{{ range query `beefy_idle_info` }}{{ if .Labels.detail }}• {{ .Labels.detail | html }}
            {{ end }}{{ end }}
          description: >-
            beefy has been up for 6 hours or more since its last boot. Kept awake by: {{ range query `beefy_idle_busy == 1` | sortByLabel "reason" }}{{ .Labels.reason | html }} {{ end }}{{ range query `beefy_idle_info` }}{{ if .Labels.detail }}- detail: {{ .Labels.detail | html }}{{ end }}{{ end }}.
            Check on beefy: <code>journalctl -u beefy-idle-watcher -n 20</code>
