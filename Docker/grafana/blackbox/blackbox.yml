# blackbox-exporter modules.
#
# Purpose: detect "Traefik is up but no longer routing", which is how the
# 2026-10-04 outage looked. A plugin download timed out at startup, every router
# on the websecure entrypoint became invalid, and all public hostnames returned
# 404 for ~24 hours without anyone noticing. Traefik itself was healthy, its
# container was running, and its own metrics endpoint answered fine - so nothing
# that watched the *process* could have caught it.
#
# The signal that matters is therefore not "did it respond" but "did it respond
# like a real backend". A healthy route answers 200, or 302 to a login, or 401
# for basic auth. A route that has lost its router answers 404 from Traefik.
# So 404 must FAIL and those others must PASS.

modules:
  # For hostnames reached through the Cloudflare tunnel.
  http_public:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # Deliberately broad, EXCLUDING 404/5xx. Each of these means Traefik found
      # a router and a backend answered:
      #   200 served · 301/302 redirect to login · 401/403 auth challenge
      valid_status_codes: [200, 301, 302, 401, 403]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # For hostnames that MUST be behind Authentik forward auth.
  #
  # Added 2026-10-09 after cup.holy-grail.ch was found serving its full
  # inventory - 135 images across both hosts, with versions and which were
  # outdated - publicly, with no login, for months. The http_public module
  # above had been probing it the whole time and reporting it healthy, because
  # it accepts 200 and an unprotected app answers 200.
  #
  # That is the same failure as the outage this file was written for, inverted:
  # there the probe was needed because the process looked healthy while the
  # routing was broken; here the probe looked healthy while the GATE was
  # missing. "It answered" is not "it answered correctly".
  #
  # So this module accepts ONLY the redirect to Authentik. A gated route that
  # starts answering 200 means the forwardAuth middleware was dropped from it,
  # and that now fails the probe instead of passing it.
  http_gated:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # 302 only. Not 200 (gate gone), not 404 (router gone), not 5xx.
      valid_status_codes: [302]
      follow_redirects: false
      # The redirect must point at Authentik specifically. Without this a
      # misrouted 302 to anywhere at all would still pass.
      fail_if_header_not_matches:
        - header: Location
          regexp: '^https://sso\.holy-grail\.ch/.*'
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
