# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Samba ###################################################
# #########################################################
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # :445 / :139
      - SETUID             # smbd becomes the connecting user (1101/1102)
      - SETGID
      - KILL               # parent signals per-user children
      - CHOWN              # entrypoint/user setup + file ownership
      - FOWNER
      - DAC_OVERRIDE
      - SYS_CHROOT         # avahi-daemon (share discovery) chroots itself
    labels:
      - autoheal-mouse=true

    network_mode: host

    # The image only reads ACCOUNT_<user> from the env, so the passwords come from secret files at start.
    entrypoint: ["/bin/sh", "-c", "export ACCOUNT_mouse=\"$$(cat /run/secrets/samba_account_mouse)\" ACCOUNT_books=\"$$(cat /run/secrets/samba_account_books)\"; exec /container/scripts/entrypoint.sh \"$$@\"", "--"]
    command: ["runsvdir", "-P", "/container/config/runit"]
    secrets:
      - samba_account_mouse
      - samba_account_books

    environment:
      # --- USERS ---
      UID_mouse: 1101

      UID_books: 1102

      # --- GROUP ---
      GROUP_sambashare: 1100
      # Add users to group
      GROUPS_mouse: sambashare
      GROUPS_books: sambashare

      # --- SAMBA SETTINGS ---
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: Samba Server
      SAMBA_CONF_SECURITY: user
      SAMBA_CONF_MAP_TO_GUEST: Never
      SAMBA_CONF_LOG_LEVEL: 1

      # --- Security ---
      SAMBA_CONF_SERVER_MIN_PROTOCOL: SMB2
      SAMBA_CONF_SERVER_MAX_PROTOCOL: SMB3
      SAMBA_CONF_SMB_ENCRYPT: required

      # --- SHARE ---
      SAMBA_VOLUME_CONFIG_mouse: |
        [mouse]
        path = /srv/downloads
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no
        wide links = no

      SAMBA_VOLUME_CONFIG_admin_books: |
        [admin_books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no
        wide links = no

      SAMBA_VOLUME_CONFIG_books: |
        [books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = yes
        writable = no
        valid users = books mouse
        force group = sambashare
        create mask = 0444
        directory mask = 0555
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no
        wide links = no

    volumes:
      # only the download folders and the library: the qBittorrent/SABnzbd config dirs are never mounted here
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /srv/downloads/torrents
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config/Downloads
        target: /srv/downloads/usenet
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-black/library
        target: /mnt/seagate-black/library
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# #########################################################
# Autoheal ###############################################
# #########################################################
  autoheal-mouse:
    image: willfarrell/autoheal:latest
    container_name: autoheal-mouse
    user: "65012:65012"
    mem_limit: 64m
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-mouse
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container list/inspect plus
      # start/stop/restart (autoheal calls POST /containers/{id}/restart) but denies create, exec,
      # images, volumes, networks and everything else. Own network socket_proxy_heal.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy_heal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# Gluetun VPN #############################################
# #########################################################
  gluetun:
    image: qmcgaw/gluetun:v3.41.3   # pinned release; :latest is the master/dev build
    container_name: gluetun_mouse
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN          # tunnel, routes, firewall
      - NET_RAW            # iptables-legacy
      - NET_BIND_SERVICE   # internal DNS on :53
      - DAC_OVERRIDE       # writes into the 1000-owned /gluetun
      - CHOWN              # chowns /tmp/gluetun/ip
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # Proton WireGuard config "fastpi.mouse" (created 2026-10-24, NAT-PMP on, CH P2P). Its client public key is
      # XPxVUo+9Ia5VpXjSPThQAM9IfZhRJk0SXTizAa5ZYiU= ; Proton's list shows the SERVER key ([Peer] PublicKey), not this one.
      # Check: sudo cat secrets/wireguard_private_key | wg pubkey
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - SERVER_COUNTRIES=Switzerland
      # MAM's session is ASN-locked. ProtonVPN's Swiss port-forwarding servers sit
      # on two ASNs (Proton AG AS209103 and Datacamp AS212238); landing on the
      # other one gives "Invalid session - ASN mismatch" (2026-10-17). node-ch-07
      # is the only CH port-forwarding server on Proton's own ASN. If it is ever
      # retired: drop this line and re-create the MAM session for the new ASN.
      - SERVER_HOSTNAMES=node-ch-07.protonvpn.net
      - TZ=Europe/Zurich
      - VPN_PORT_FORWARDING=on
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      - CONTROL_SERVER=on
      - CONTROL_SERVER_ADDRESS=:8000
    secrets:
      - wireguard_private_key   # root:root 0400, gluetun runs as root
    # expose host ports here because other containers share gluetun's network namespace
    ports:
      # web UI (host_port:container_port) - use 8085:8080 (8080 already used by Traefik)
      # localhost only (2026-10-19, SSO-only): qBittorrent's password form must not be
      # reachable over the network. Use ssh -L 8085:127.0.0.1:8085 fastpi.
      # SSO: https://qbittorrent-audiobooks.holy-grail.ch (Traefik over traefik_mouse, auth bypassed for 10.24.25.3/32 only).
      # port_updater talks to it inside mouse_network (10.24.32.2:8080), not via this port.
      - "127.0.0.1:8085:8080"
      # # torrent listening port (TCP/UDP)
      # # unfortunately we can't choose the port. ProtonVPN assigns a random port on each connection, so we need to expose the default torrent port and let the port updater container handle the dynamic forwarding.
      # - "43210:43210"
      # - "43210:43210/udp"
      # mousehole port - localhost only (2026-10-19): ssh -L 5010:127.0.0.1:5010 fastpi
      - "127.0.0.1:5010:5010"
      # SABnzbd web UI - localhost only (SSO-only): ssh -L 8090:127.0.0.1:8090 fastpi
      # Internal 8081 because qBittorrent holds 8080 in this namespace (sabnzbd.ini port = 8081).
      # Through this bind SABnzbd sees the mouse_network gateway (10.24.32.1), so sabnzbd.ini
      # (not in git) has local_ranges = 10.24.32.0/24, 192.168.1.0/24, 10.24.25.3/32 (Traefik), 10.24.5.5/32 (VPN, checked in X-Forwarded-For); without it: 403.
      - "127.0.0.1:8090:8081"
      # gluetun control server
      # - "8000:8000"
    restart: always
    labels:
      - autoheal-mouse=true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - gluetun-data:/tmp/gluetun
      - ./secrets/gluetun:/gluetun
      # S-05: only prowlarr-gate (65057) and Prowlarr itself (65054) may reach 127.0.0.1:9696; qBit/SAB/Mousehole are refused.
      - ./gluetun/post-rules.txt:/iptables/post-rules.txt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      mouse_network:
        ipv4_address: 10.24.32.2
      # Traefik (10.24.25.3) reaches qBittorrent :8080 and SABnzbd :8081 here, nothing else on this network (H-2).
      traefik_mouse:
        ipv4_address: 10.24.25.2

# #########################################################
# qBitTorrent #############################################
# #########################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls481   # stay on 5.2.x: MyAnonamouse client rules (owner 2026-10-25); do not update to 5.3+ until MAM allows it
    container_name: qbittorrent_mouse
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    # linuxserver non-root mode (supported by this image): s6 and the app run as
    # mouse:sambashare directly, so no root PID1 and no capabilities. PUID/PGID are ignored.
    user: "1101:1100"
    tmpfs:
      - /run:uid=1101,gid=1100,exec   # s6 service dir
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Europe/Zurich
      - WEBUI_PORT=8080
      - TORRENTING_PORT=1
    volumes:
      - type: bind
        source: /mnt/seagate-red/qbittorrent/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /downloads
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# Prowlarr ################################################
# #########################################################
  # Audiobook indexer for AudioBookRequest (Docker/Audiobook-Requests): MyAnonamouse (own session) + AudioBookBay (disabled, approval only).
  # In gluetun's netns so MAM sees the VPN IP. Listens on 127.0.0.1:9696 only; prowlarr-gate (:9697) is the way in. UI: https://prowlarr-audiobooks.holy-grail.ch (auth External = Holy Grail).
  # MAM rules: search type active, EN+DE, UseFreeleechWedge on (fl=1 only for grabs not free already, owner 2026-10-26), no RSS; check with scripts/prowlarr-setup.py --check after every update (smoke-test does).
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    container_name: prowlarr_mouse
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    # linuxserver non-root mode: s6 and the app run as 65054, no root PID1, no capabilities.
    user: "65054:65054"
    tmpfs:
      - /run:uid=65054,gid=65054,exec   # s6 service dir
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Europe/Zurich
    volumes:
      - type: bind
        source: /mnt/seagate-red/prowlarr/config
        target: /config
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# Prowlarr-Gate ###########################################
# #########################################################
  # The only way into Prowlarr (which listens on 127.0.0.1:9696): :9697 in gluetun's netns. Traefik gets the UI,
  # everyone else (ABR, importer, host scripts) only API/download paths with the API key. prowlarr-gate/nginx.conf.
  prowlarr-gate:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    container_name: prowlarr-gate
    user: "65057:65057"
    mem_limit: 32m
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["nginx", "-g", "daemon off;"]
    tmpfs:
      - /tmp:uid=65057,gid=65057,mode=0700,size=16m
    volumes:
      - ./prowlarr-gate/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9697/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# MouseHole ###############################################
# #########################################################
  mousehole:
    container_name: mousehole
    user: "65041:65041"
    image: tmmrtn/mousehole:latest
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    # ports:
    #   - "5010:5010"
    volumes:
      - mousehole:/srv/mousehole
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    network_mode: service:gluetun
    environment:
      - TZ=Europe/Zurich
      # Mousehole >= 0.5 refuses to start without auth for its web UI (5010 is
      # published on 127.0.0.1 via gluetun). Password: secrets/mousehole_auth_password.
      - MOUSEHOLE_AUTH_PASSWORD_FILE=/run/secrets/mousehole_auth_password
      # The UI refuses hosts not listed here ("host not allowed" + Retry).
      # 0.5 keeps its state (incl. the MAM cookie) in /var/lib/mousehole by
      # default - inside the container, lost on every recreate. Point it at the volume.
      - MOUSEHOLE_STATE_DIR_PATH=/srv/mousehole
      - MOUSEHOLE_ALLOWED_HOSTS=localhost,127.0.0.1,192.168.1.2,fastpi,fastpi.local
    secrets:
      - mousehole_auth_password
    restart: always
    labels:
      - autoheal-mouse=true

# #########################################################
# SABnzbd #################################################
# #########################################################
  # Audiobook usenet downloader; moved from Docker/nzb (own gluetun_nzb) into this tunnel 2026-10-24.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    # linuxserver non-root mode: s6 and the app run as mouse:sambashare, no root PID1, no capabilities.
    user: "1101:1100"
    tmpfs:
      - /run:uid=1101,gid=1100,exec   # s6 service dir
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Europe/Zurich
      # This image ignores HOST_WHITELIST_ENTRIES: the list is host_whitelist in sabnzbd.ini (fastpi, fastpi.homelab, sabnzbd-audiobooks.holy-grail.ch).
    volumes:
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config
        target: /config
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/api?mode=version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# Port Updater ############################################
# #########################################################
  port-updater:
    build: ./port-updater
    container_name: port_updater
    user: "65042:65042"
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # localhost only (2026-10-19, SSO-only: no password login over the network).
      # Status page: https://vpn-status-mouse.holy-grail.ch (Traefik over traefik_proxy, Holy Grail injects the basic auth).
      # ssh -L 8087:127.0.0.1:8087 fastpi, then http://localhost:8087/ still works.
      - "127.0.0.1:${WEB_PORT:-8088}:${WEB_PORT:-8088}"
    # Real docker.sock REMOVED (2026-09-26) - it is root on the host. This script
    # only inspects and restarts/stops a few named containers, so it uses the
    # docker CLI against socket-proxy-portupdater (start/stop/restart of its four containers only, inspect of gluetun_mouse, no create/exec, no images, no
    # volumes, no networks). The CLI honours DOCKER_HOST.
    volumes:
      - port-updater-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      mouse_network:
        ipv4_address: 10.24.32.3
      socket_proxy_portupdater:
      traefik_proxy:
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - DOCKER_HOST=tcp://socket-proxy-portupdater:2375
      - QBIT_USER=admin
      - QBIT_PASS_FILE=/run/secrets/qbit_pass
      - CHECK_INTERVAL=600
      - SESSION_CHECK_INTERVAL=15
      - ZERO_RETRY_INTERVAL=60
      - ZERO_PORT_LIMIT=3
      - GLUETUN_IP=10.24.32.2
      - GLUETUN_AUTH_USER=${GLUETUN_AUTH_USER}
      - GLUETUN_AUTH_PASS_FILE=/run/secrets/gluetun_auth_pass
      - TZ=Europe/Zurich
      - WEB_PORT=${WEB_PORT:-8088}
      - WEB_USER=${WEB_USER}
      - WEB_PASS_FILE=/run/secrets/port_updater_web_pass
    secrets:
      - qbit_pass
      - gluetun_auth_pass
      - port_updater_web_pass
    restart: unless-stopped
    labels:
      - autoheal-mouse=true

# =========================================================
# Secrets =================================================
# =========================================================
# Files in secrets/ (gitignored), mode 0400, owned by the uid that reads them (root for samba/gluetun).
secrets:
  wireguard_private_key:
    file: ./secrets/wireguard_private_key
  samba_account_mouse:
    file: ./secrets/samba_account_mouse
  samba_account_books:
    file: ./secrets/samba_account_books
  mousehole_auth_password:
    file: ./secrets/mousehole_auth_password
  qbit_pass:
    file: ./secrets/qbit_pass
  gluetun_auth_pass:
    file: ./secrets/gluetun_auth_pass
  port_updater_web_pass:
    file: ./secrets/port_updater_web_pass

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy_heal:
    external: true
  socket_proxy_portupdater:
    external: true
  traefik_proxy:
    external: true
  # Traefik + gluetun_mouse only, internal. Created by hand (see Traefik README), as Traefik joins it too.
  traefik_mouse:
    external: true
  mouse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.32.0/24
          gateway: 10.24.32.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  mousehole:
  gluetun-data:
  port-updater-data: