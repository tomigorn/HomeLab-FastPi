# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Gluetun VPN #############################################
# #########################################################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun_mouse
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${ProtonVPN_Private_Key}
      - SERVER_COUNTRIES=Switzerland
      - TZ=Europe/Zurich
      - VPN_PORT_FORWARDING=on
      - CONTROL_SERVER=on
      - CONTROL_SERVER_ADDRESS=:8000
    # expose host ports here because other containers share gluetun's network namespace
    ports:
      # web UI (host_port:container_port) - use 8085:8080 (8080 already used by Traefik)
      - "8085:8080"
      # # torrent listening port (TCP/UDP)
      # - "43210:43210"
      # - "43210:43210/udp"
      # mousehole port
      - "5010:5010"
      # gluetun control server
      # - "8000:8000"
    restart: unless-stopped
    volumes:
      - gluetun-data:/tmp/gluetun
    networks:
      mouse_network:
        ipv4_address: 172.32.0.2

# #########################################################
# qBitTorrent #############################################
# #########################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent_mouse
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
      - WEBUI_PORT=8080
      - TORRENTING_PORT=1111
    volumes:
      - /mnt/seagate/qbittorrent/config:/config
      - /mnt/seagate/qbittorrent/downloads:/downloads
    restart: unless-stopped
    network_mode: "service:gluetun"

# #########################################################
# MouseHole ###############################################
# #########################################################
  mousehole:
    container_name: mousehole
    image: tmmrtn/mousehole:latest
    # ports:
    #   - "5010:5010"
    volumes:
      - mousehole:/srv/mousehole
    network_mode: service:gluetun
    environment:
      - TZ=Europe/Zurich
    restart: unless-stopped

# #########################################################
# Port Updater ############################################
# #########################################################
  port-updater:
    image: alpine:3.19
    container_name: port_updater
    networks:
      - mouse_network
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - QBIT_USER=admin
      - QBIT_PASS=${QBIT_PASS}
      - CHECK_INTERVAL=30
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl
        LAST_PORT=0
        while true; do
          PORT=$$(curl -s http://172.32.0.2:8000/v1/portforward | sed -n 's/.*"port":[ ]*\([0-9]*\).*/\1/p')
          if [ -n "$$PORT" ] && [ "$$PORT" != "0" ] && [ "$$PORT" != "$$LAST_PORT" ]; then
            echo "New forwarded port detected: $$PORT (was $$LAST_PORT)"
            # Login and save cookie to file
            curl -s -c /tmp/qbit_cookie -X POST \
              --data-urlencode "username=$$QBIT_USER" \
              --data-urlencode "password=$$QBIT_PASS" \
              http://172.32.0.2:8080/api/v2/auth/login
            echo "Logged in, updating port to $$PORT..."
            # Use cookie jar for API call
            curl -s -b /tmp/qbit_cookie \
              --data-urlencode "json={\"listen_port\":$$PORT}" \
              http://172.32.0.2:8080/api/v2/app/setPreferences
            echo "Port update sent"
            LAST_PORT=$$PORT
          else
            echo "Port unchanged: $$LAST_PORT"
          fi
          sleep $$CHECK_INTERVAL
        done
    restart: unless-stopped


# =========================================================
# Networks ================================================
# =========================================================
networks:
  mouse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
          gateway: 172.32.0.1


# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  mousehole:
  gluetun-data: