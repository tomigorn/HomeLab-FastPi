# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Samba ###################################################
# #########################################################
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    restart: unless-stopped
    labels:
      - autoheal-mouse=true

    network_mode: host

    environment:
      # --- USERS ---
      ACCOUNT_mouse: ${SAMBA_ACCOUNT_MOUSE}
      UID_mouse: 1101

      ACCOUNT_books: ${SAMBA_ACCOUNT_BOOKS}
      UID_books: 1102

      # --- GROUP ---
      GROUP_sambashare: 1100
      # Add users to group
      GROUPS_mouse: sambashare
      GROUPS_books: sambashare

      # --- SAMBA SETTINGS ---
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: Samba Server
      SAMBA_CONF_SECURITY: user
      SAMBA_CONF_MAP_TO_GUEST: Never
      SAMBA_CONF_LOG_LEVEL: 1

      # --- Security ---
      SAMBA_CONF_SERVER_MIN_PROTOCOL: SMB2
      SAMBA_CONF_SERVER_MAX_PROTOCOL: SMB3
      SAMBA_CONF_SMB_ENCRYPT: required

      # --- SHARE ---
      SAMBA_VOLUME_CONFIG_mouse: |
        [mouse]
        path = /mnt/seagate-red
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

      SAMBA_VOLUME_CONFIG_admin_books: |
        [admin_books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

      SAMBA_VOLUME_CONFIG_books: |
        [books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = yes
        writable = no
        valid users = books mouse
        force group = sambashare
        create mask = 0444
        directory mask = 0555
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

    volumes:
      - /mnt/seagate-red:/mnt/seagate-red
      - /mnt/seagate-black:/mnt/seagate-black

# #########################################################
# Autoheal ###############################################
# #########################################################
  autoheal-mouse:
    image: willfarrell/autoheal:latest
    container_name: autoheal-mouse
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-mouse
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# #########################################################
# Gluetun VPN #############################################
# #########################################################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun_mouse
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${ProtonVPN_Private_Key}
      - SERVER_COUNTRIES=Switzerland
      - TZ=Europe/Zurich
      - VPN_PORT_FORWARDING=on
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      - CONTROL_SERVER=on
      - CONTROL_SERVER_ADDRESS=:8000
    # expose host ports here because other containers share gluetun's network namespace
    ports:
      # web UI (host_port:container_port) - use 8085:8080 (8080 already used by Traefik)
      - "8085:8080"
      # # torrent listening port (TCP/UDP)
      # # unfortunately we can't choose the port. ProtonVPN assigns a random port on each connection, so we need to expose the default torrent port and let the port updater container handle the dynamic forwarding.
      # - "43210:43210"
      # - "43210:43210/udp"
      # mousehole port
      - "5010:5010"
      # gluetun control server
      # - "8000:8000"
    restart: always
    labels:
      - autoheal-mouse=true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - gluetun-data:/tmp/gluetun
      - ./secrets/gluetun:/gluetun
    networks:
      mouse_network:
        ipv4_address: 172.32.0.2

# #########################################################
# qBitTorrent #############################################
# #########################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent_mouse
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1101
      - PGID=1100
      - TZ=Europe/Zurich
      - WEBUI_PORT=8080
      - TORRENTING_PORT=1
    volumes:
      - /mnt/seagate-red/qbittorrent/config:/config
      - /mnt/seagate-red/qbittorrent/downloads:/downloads
    restart: always
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# MouseHole ###############################################
# #########################################################
  mousehole:
    container_name: mousehole
    image: tmmrtn/mousehole:latest
    depends_on:
      gluetun:
        condition: service_healthy
    # ports:
    #   - "5010:5010"
    volumes:
      - mousehole:/srv/mousehole
    network_mode: service:gluetun
    environment:
      - TZ=Europe/Zurich
    restart: always
    labels:
      - autoheal-mouse=true

# #########################################################
# Port Updater ############################################
# #########################################################
  port-updater:
    image: alpine:3.19
    container_name: port_updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      mouse_network:
        ipv4_address: 172.32.0.3
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - QBIT_USER=admin
      - QBIT_PASS=${QBIT_PASS}
      - CHECK_INTERVAL=600
      - ZERO_RETRY_INTERVAL=60
      - GLUETUN_AUTH_USER=${GLUETUN_AUTH_USER}
      - GLUETUN_AUTH_PASS=${GLUETUN_AUTH_PASS}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl docker-cli

        # --- Helper functions ---

        wait_for_gluetun() {
          echo "Waiting for gluetun to become healthy..."
          i=0
          while [ $$i -lt 60 ]; do
            STATUS=$$(docker inspect --format='{{.State.Health.Status}}' gluetun_mouse 2>/dev/null)
            if [ "$$STATUS" = "healthy" ]; then
              echo "Gluetun is healthy."
              return 0
            fi
            i=$$((i + 1))
            sleep 5
          done
          echo "WARNING: Gluetun did not become healthy within 5 minutes."
          return 1
        }

        wait_for_qbittorrent() {
          echo "Waiting for qBittorrent web UI..."
          i=0
          while [ $$i -lt 24 ]; do
            CODE=$$(curl -s -o /dev/null -w "%{http_code}" http://172.32.0.2:8080 2>/dev/null)
            if [ "$$CODE" = "200" ] || [ "$$CODE" = "302" ]; then
              echo "qBittorrent is ready."
              return 0
            fi
            i=$$((i + 1))
            sleep 5
          done
          echo "WARNING: qBittorrent did not become ready within 2 minutes."
          return 1
        }

        login_qbittorrent() {
          curl -s -c /tmp/qbit_cookie -X POST \
            --data-urlencode "username=$$QBIT_USER" \
            --data-urlencode "password=$$QBIT_PASS" \
            http://172.32.0.2:8080/api/v2/auth/login >/dev/null 2>&1
        }

        apply_qbittorrent_settings() {
          echo "Setting qBittorrent to use tun0 interface..."
          curl -s -b /tmp/qbit_cookie \
            --data-urlencode 'json={"current_network_interface":"tun0"}' \
            http://172.32.0.2:8080/api/v2/app/setPreferences

          echo "Restarting qBittorrent to apply interface binding..."
          docker restart qbittorrent_mouse
          sleep 15

          # Re-login after restart since the old session cookie is now invalid
          login_qbittorrent
        }

        # Stop dependent containers, restart gluetun, then bring everything back up.
        # qbittorrent and mousehole share gluetun's network namespace — simply restarting
        # gluetun leaves them with a broken network, so we must manage them explicitly.
        restart_stack() {
          echo "Stopping qbittorrent and mousehole before gluetun restart..."
          docker stop qbittorrent_mouse mousehole 2>/dev/null || true

          echo "Restarting gluetun to obtain a new VPN port lease..."
          docker restart gluetun_mouse

          wait_for_gluetun || true

          echo "Starting qbittorrent and mousehole..."
          docker start qbittorrent_mouse mousehole

          wait_for_qbittorrent || true

          login_qbittorrent
          apply_qbittorrent_settings
        }

        # --- Initial startup ---
        echo "Waiting for qBittorrent to be ready..."
        wait_for_qbittorrent || true

        login_qbittorrent
        apply_qbittorrent_settings

        # --- Port monitoring loop ---
        echo "Starting port monitoring loop..."
        LAST_PORT=0
        ZERO_PORT_COUNT=0
        ZERO_PORT_LIMIT=3
        while true; do
          # Re-login periodically (cookie expires)
          login_qbittorrent

          # Get VPN forwarded port (use control server basic auth)
          PORT=$$(curl -s -u "$$GLUETUN_AUTH_USER:$$GLUETUN_AUTH_PASS" http://172.32.0.2:8000/v1/portforward | sed -n 's/.*"port":[ ]*\([0-9]*\).*/\1/p')

          # Get current qBittorrent listen port
          QBIT_PORT=$$(curl -s -b /tmp/qbit_cookie http://172.32.0.2:8080/api/v2/app/preferences | sed -n 's/.*"listen_port":\s*\([0-9]*\).*/\1/p')

          # Update if: forwarded port changed, or qBit port is unset (1) or empty (e.g. after a restart)
          if [ -n "$$PORT" ] && [ "$$PORT" != "0" ] && { [ "$$PORT" != "$$LAST_PORT" ] || [ "$$QBIT_PORT" = "1" ] || [ -z "$$QBIT_PORT" ]; }; then
            echo ">>>"
            echo "      ProtonVPN assigned a new forwarded port: $$PORT (was: $$LAST_PORT) — triggering qBittorrent update"
            echo "<<<"
            echo "Port update needed: VPN=$$PORT, qBit=$$QBIT_PORT (last=$$LAST_PORT)"
            curl -s -b /tmp/qbit_cookie \
              --data-urlencode "json={\"listen_port\":$$PORT}" \
              http://172.32.0.2:8080/api/v2/app/setPreferences
            echo "Port updated to $$PORT"
            LAST_PORT=$$PORT
            ZERO_PORT_COUNT=0

            echo "Reannouncing all torrents..."
            curl -s -b /tmp/qbit_cookie -X POST \
              -d "hashes=all" \
              http://172.32.0.2:8080/api/v2/torrents/reannounce
            echo "Reannounce triggered."

          elif [ -z "$$PORT" ] || [ "$$PORT" = "0" ]; then
            ZERO_PORT_COUNT=$$((ZERO_PORT_COUNT + 1))
            echo "Port is 0 ($$ZERO_PORT_COUNT/$$ZERO_PORT_LIMIT): VPN=$$PORT, qBit=$$QBIT_PORT"
            if [ "$$ZERO_PORT_COUNT" -ge "$$ZERO_PORT_LIMIT" ]; then
              echo "Port has been 0 for $$(( ZERO_PORT_COUNT * CHECK_INTERVAL / 60 )) minutes — restarting stack..."
              restart_stack
              ZERO_PORT_COUNT=0
              LAST_PORT=0
              echo "Stack restarted. Checking for new port immediately..."
              continue
            else
              echo "Port is 0 — will retry in $$ZERO_RETRY_INTERVAL seconds (faster retry)..."
              sleep $$ZERO_RETRY_INTERVAL
              continue
            fi

          else
            echo "Port OK: VPN=$$PORT, qBit=$$QBIT_PORT"
          fi
          sleep $$CHECK_INTERVAL
        done
    restart: unless-stopped
    labels:
      - autoheal-mouse=true

# =========================================================
# Networks ================================================
# =========================================================
networks:
  mouse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
          gateway: 172.32.0.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  mousehole:
  gluetun-data: