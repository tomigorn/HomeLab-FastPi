# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Samba ###################################################
# #########################################################
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # :445 / :139
      - SETUID             # smbd becomes the connecting user (1101/1102)
      - SETGID
      - KILL               # parent signals per-user children
      - CHOWN              # entrypoint/user setup + file ownership
      - FOWNER
      - DAC_OVERRIDE
      - SYS_CHROOT         # avahi-daemon (share discovery) chroots itself
    labels:
      - autoheal-mouse=true

    network_mode: host

    # The image only reads ACCOUNT_<user> from the env, so the passwords come from secret files at start.
    entrypoint: ["/bin/sh", "-c", "export ACCOUNT_mouse=\"$$(cat /run/secrets/samba_account_mouse)\" ACCOUNT_books=\"$$(cat /run/secrets/samba_account_books)\"; exec /container/scripts/entrypoint.sh \"$$@\"", "--"]
    command: ["runsvdir", "-P", "/container/config/runit"]
    secrets:
      - samba_account_mouse
      - samba_account_books

    environment:
      # --- USERS ---
      UID_mouse: 1101

      UID_books: 1102

      # --- GROUP ---
      GROUP_sambashare: 1100
      # Add users to group
      GROUPS_mouse: sambashare
      GROUPS_books: sambashare

      # --- SAMBA SETTINGS ---
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: Samba Server
      SAMBA_CONF_SECURITY: user
      SAMBA_CONF_MAP_TO_GUEST: Never
      SAMBA_CONF_LOG_LEVEL: 1

      # --- Security ---
      SAMBA_CONF_SERVER_MIN_PROTOCOL: SMB2
      SAMBA_CONF_SERVER_MAX_PROTOCOL: SMB3
      SAMBA_CONF_SMB_ENCRYPT: required

      # --- SHARE ---
      SAMBA_VOLUME_CONFIG_mouse: |
        [mouse]
        path = /mnt/seagate-red
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

      SAMBA_VOLUME_CONFIG_admin_books: |
        [admin_books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = no
        writable = yes
        valid users = mouse
        force group = sambashare
        create mask = 0664
        directory mask = 0775
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

      SAMBA_VOLUME_CONFIG_books: |
        [books]
        path = /mnt/seagate-black/library
        browseable = yes
        read only = yes
        writable = no
        valid users = books mouse
        force group = sambashare
        create mask = 0444
        directory mask = 0555
        inherit permissions = yes
        oplocks = no
        level2 oplocks = no

    volumes:
      - type: bind
        source: /mnt/seagate-red
        target: /mnt/seagate-red
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-black
        target: /mnt/seagate-black
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# #########################################################
# Autoheal ###############################################
# #########################################################
  autoheal-mouse:
    image: willfarrell/autoheal:latest
    container_name: autoheal-mouse
    user: "65012:65012"
    mem_limit: 64m
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-mouse
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container list/inspect plus
      # start/stop/restart (autoheal calls POST /containers/{id}/restart) but denies create, exec,
      # images, volumes, networks and everything else. Own network socket_proxy_heal.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy_heal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# Gluetun VPN #############################################
# #########################################################
  gluetun:
    image: qmcgaw/gluetun:v3.41.3   # pinned release; :latest is the master/dev build
    container_name: gluetun_mouse
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN          # tunnel, routes, firewall
      - NET_RAW            # iptables-legacy
      - NET_BIND_SERVICE   # internal DNS on :53
      - DAC_OVERRIDE       # writes into the 1000-owned /gluetun
      - CHOWN              # chowns /tmp/gluetun/ip
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - SERVER_COUNTRIES=Switzerland
      # MAM's session is ASN-locked. ProtonVPN's Swiss port-forwarding servers sit
      # on two ASNs (Proton AG AS209103 and Datacamp AS212238); landing on the
      # other one gives "Invalid session - ASN mismatch" (2026-10-17). node-ch-07
      # is the only CH port-forwarding server on Proton's own ASN. If it is ever
      # retired: drop this line and re-create the MAM session for the new ASN.
      - SERVER_HOSTNAMES=node-ch-07.protonvpn.net
      - TZ=Europe/Zurich
      - VPN_PORT_FORWARDING=on
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      - CONTROL_SERVER=on
      - CONTROL_SERVER_ADDRESS=:8000
    secrets:
      - wireguard_private_key   # root:root 0400, gluetun runs as root
    # expose host ports here because other containers share gluetun's network namespace
    ports:
      # web UI (host_port:container_port) - use 8085:8080 (8080 already used by Traefik)
      # localhost only (2026-10-19, SSO-only): qBittorrent's password form must not be
      # reachable over the network. Use ssh -L 8085:127.0.0.1:8085 fastpi.
      # port_updater talks to it inside mouse_network (172.32.0.2:8080), not via this port.
      - "127.0.0.1:8085:8080"
      # # torrent listening port (TCP/UDP)
      # # unfortunately we can't choose the port. ProtonVPN assigns a random port on each connection, so we need to expose the default torrent port and let the port updater container handle the dynamic forwarding.
      # - "43210:43210"
      # - "43210:43210/udp"
      # mousehole port - localhost only (2026-10-19): ssh -L 5010:127.0.0.1:5010 fastpi
      - "127.0.0.1:5010:5010"
      # gluetun control server
      # - "8000:8000"
    restart: always
    labels:
      - autoheal-mouse=true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - gluetun-data:/tmp/gluetun
      - ./secrets/gluetun:/gluetun
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      mouse_network:
        ipv4_address: 172.32.0.2

# #########################################################
# qBitTorrent #############################################
# #########################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls480   # pinned: 5.3.0 moves to libtorrent 2.1 (worse seeding on the ratio tracker), owner decides
    container_name: qbittorrent_mouse
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    # linuxserver non-root mode (supported by this image): s6 and the app run as
    # mouse:sambashare directly, so no root PID1 and no capabilities. PUID/PGID are ignored.
    user: "1101:1100"
    tmpfs:
      - /run:uid=1101,gid=1100,exec   # s6 service dir
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Europe/Zurich
      - WEBUI_PORT=8080
      - TORRENTING_PORT=1
    volumes:
      - type: bind
        source: /mnt/seagate-red/qbittorrent/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/seagate-red/qbittorrent/downloads
        target: /downloads
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    labels:
      - autoheal-mouse=true
    network_mode: "service:gluetun"

# #########################################################
# MouseHole ###############################################
# #########################################################
  mousehole:
    container_name: mousehole
    user: "65041:65041"
    image: tmmrtn/mousehole:latest
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    # ports:
    #   - "5010:5010"
    volumes:
      - mousehole:/srv/mousehole
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    network_mode: service:gluetun
    environment:
      - TZ=Europe/Zurich
      # Mousehole >= 0.5 refuses to start without auth for its web UI (5010 is
      # published on 127.0.0.1 via gluetun). Password: secrets/mousehole_auth_password.
      - MOUSEHOLE_AUTH_PASSWORD_FILE=/run/secrets/mousehole_auth_password
      # The UI refuses hosts not listed here ("host not allowed" + Retry).
      # 0.5 keeps its state (incl. the MAM cookie) in /var/lib/mousehole by
      # default - inside the container, lost on every recreate. Point it at the volume.
      - MOUSEHOLE_STATE_DIR_PATH=/srv/mousehole
      - MOUSEHOLE_ALLOWED_HOSTS=localhost,127.0.0.1,192.168.1.2,fastpi,fastpi.local
    secrets:
      - mousehole_auth_password
    restart: always
    labels:
      - autoheal-mouse=true

# #########################################################
# Port Updater ############################################
# #########################################################
  port-updater:
    build: ./port-updater
    container_name: port_updater
    user: "65042:65042"
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # localhost only (2026-10-19, SSO-only: no password login over the network).
      # Status page: https://vpn-status-mouse.holy-grail.ch (Traefik over traefik_proxy, Holy Grail injects the basic auth).
      # ssh -L 8087:127.0.0.1:8087 fastpi, then http://localhost:8087/ still works.
      - "127.0.0.1:${WEB_PORT:-8088}:${WEB_PORT:-8088}"
    # Real docker.sock REMOVED (2026-09-26) - it is root on the host. This script
    # only inspects and restarts/stops a few named containers, so it uses the
    # docker CLI against socket-proxy-autoheal (container inspect + start/stop/restart, no create/exec, no images, no
    # volumes, no networks). The CLI honours DOCKER_HOST.
    volumes:
      - port-updater-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      mouse_network:
        ipv4_address: 172.32.0.3
      socket_proxy_heal:
      traefik_proxy:
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - DOCKER_HOST=tcp://socket-proxy-autoheal:2375
      - QBIT_USER=admin
      - QBIT_PASS_FILE=/run/secrets/qbit_pass
      - CHECK_INTERVAL=600
      - SESSION_CHECK_INTERVAL=15
      - ZERO_RETRY_INTERVAL=60
      - ZERO_PORT_LIMIT=3
      - GLUETUN_IP=172.32.0.2
      - GLUETUN_AUTH_USER=${GLUETUN_AUTH_USER}
      - GLUETUN_AUTH_PASS_FILE=/run/secrets/gluetun_auth_pass
      - TZ=Europe/Zurich
      - WEB_PORT=${WEB_PORT:-8088}
      - WEB_USER=${WEB_USER}
      - WEB_PASS_FILE=/run/secrets/port_updater_web_pass
    secrets:
      - qbit_pass
      - gluetun_auth_pass
      - port_updater_web_pass
    restart: unless-stopped
    labels:
      - autoheal-mouse=true

# =========================================================
# Secrets =================================================
# =========================================================
# Files in secrets/ (gitignored), mode 0400, owned by the uid that reads them (root for samba/gluetun).
secrets:
  wireguard_private_key:
    file: ./secrets/wireguard_private_key
  samba_account_mouse:
    file: ./secrets/samba_account_mouse
  samba_account_books:
    file: ./secrets/samba_account_books
  mousehole_auth_password:
    file: ./secrets/mousehole_auth_password
  qbit_pass:
    file: ./secrets/qbit_pass
  gluetun_auth_pass:
    file: ./secrets/gluetun_auth_pass
  port_updater_web_pass:
    file: ./secrets/port_updater_web_pass

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy_heal:
    external: true
  traefik_proxy:
    external: true
  mouse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
          gateway: 172.32.0.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  mousehole:
  gluetun-data:
  port-updater-data: