# prowlarr-gate: Prowlarr listens on 127.0.0.1:9696 only; this is the one way in (gluetun netns, :9697).
# Traefik (10.24.25.3, after Holy Grail) gets everything; anyone else only API and download paths that carry the API key (Prowlarr checks it).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    server_tokens off;
    client_max_body_size 10m;

    map $remote_addr $from_traefik {
        10.24.25.3 1;
        default    0;
    }
    map "$http_x_api_key$arg_apikey" $has_key {
        ""      0;
        default 1;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 9697;

        location = /ping {
            proxy_pass http://127.0.0.1:9696;
        }

        location ~ ^/(api/|[0-9]+/(api|download)) {
            set $allowed "$from_traefik$has_key";
            if ($allowed = "00") {
                return 403;
            }
            proxy_pass http://127.0.0.1:9696;
            proxy_set_header Host $http_host;
            proxy_read_timeout 180s;
        }

        location / {
            if ($from_traefik = 0) {
                return 403;
            }
            proxy_pass http://127.0.0.1:9696;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
