[package]
name = "port-updater"
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "fs", "time", "signal", "sync", "macros"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
