# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Jenkins Docker ##########################################
# #########################################################
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    networks:
      jenkins:
        aliases:
          - docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
      timezone: ${TZ}
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    command: --storage-driver overlay2
    ports:
      - ${JENKINS_DOCKER_PORT}:2376
    restart: always

# =========================================================
# Networks ================================================
# =========================================================
networks:
  jenkins:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  jenkins-docker-certs:
  jenkins-data:

