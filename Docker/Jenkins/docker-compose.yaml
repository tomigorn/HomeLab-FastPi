# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Jenkins Controller ######################################
# #########################################################
  jenkins:
    build: 
      context: .
      dockerfile: ./Dockerfile
    image: jenkins-jdk-21
    container_name: jenkins-jdk-21
    mem_limit: 2g
    privileged: true
    user: root
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # JCasC config location and disable the interactive setup wizard so JCasC is applied
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      # JCasC settings - make configuration read-only and reload on changes
      - IO_JENKINS_PLUGINS_CASC_READONLY=true
      - CASC_JENKINS_CONFIG_RELOAD=true

      # Admin user credentials
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - JENKINS_TESTUSER_PASSWORD=${JENKINS_TESTUSER_PASSWORD}

      # GitHub App configuration
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      
      # Disable setup wizard
      # Disable plugin manager UI
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.PluginManager.workDir=/var/jenkins_home/plugins
    ports:
      - ${JENKINS_DOCKER_PORT}:8080
      - ${JENKINS_AGENT_PORT}:50000
    volumes:
      # Persist Jenkins data
      - jenkins_home:/var/jenkins_home
      # Docker socket and binary for Docker-in-Docker functionality
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      # JCasC configuration files
      - ./jenkins/casc_configs:/var/jenkins_home/casc_configs
      # GitHub App private key
      - ./secrets:/run/secrets:ro
    labels:
      - "traefik.enable=true"
      # Route the registered DuckDNS domain to this Jenkins service
      - "traefik.http.routers.jenkins.rule=Host(`${JENKINS_DOMAIN}`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls=true"
      - "traefik.http.routers.jenkins.tls.certresolver=le"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
      # Middleware to redirect plain HTTP -> HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTP router that redirects to HTTPS
      - "traefik.http.routers.jenkins-http.rule=Host(`${JENKINS_DOMAIN}`)"
      - "traefik.http.routers.jenkins-http.entrypoints=web"
      - "traefik.http.routers.jenkins-http.middlewares=redirect-to-https@docker"
      - "traefik.http.routers.jenkins-http.priority=1"
    networks:
      - traefik_proxy
# #########################################################
# Jenkins Build Node - .NET ###############################
# #########################################################

# #########################################################
# Jenkins Build Node - Flutter ############################
# #########################################################

# =========================================================
# Networks ================================================
# =========================================================
# networks:
  
# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  jenkins_home:
    name: jenkins_home

# =========================================================
# Secrets =================================================
# =========================================================
# secrets:

networks:
  traefik_proxy:
    external: true
