# Jenkins Configuration as Code (JCasC) YAML file
jenkins:
  systemMessage: "Homelab Jenkins configured by YAML / JCasC - Configuration is managed as code"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          name: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "testuser"
          name: "Test User (Read-only for Demonstration Purposes)"
          password: "${JENKINS_TESTUSER_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      permissions:
        # Admin can do everything
        - "Overall/Administer:${JENKINS_ADMIN_USER}"

        # Anonymous/authenticated users can only view and build
        - "Overall/Read:authenticated"
        - "Job/Read:authenticated"
        - "Job/Build:authenticated"
        - "Job/Cancel:authenticated"
        - "Job/Discover:authenticated"
        - "Job/Workspace:authenticated"
        - "View/Read:authenticated"
  
  # Disable plugin installation via UI
  disabledAdministrativeMonitors:
    - "jenkins.diagnostics.SecurityIsOffMonitor"
  
  # Security settings
  remotingSecurity:
    enabled: true
 
# GitHub App configuration
credentials:
  system:
    domainCredentials:
      - credentials:
          - gitHubApp:
              appID: "${GITHUB_APP_ID}"
              description: "GitHub App for CI/CD"
              id: "github-app"
              privateKey: "${readFile:/run/secrets/jenkins-ci-fastpi.2025-10-24.private-key.pem.PKCS8}"
          - usernamePassword:
              scope: GLOBAL
              id: "docker-hub"
              description: "Docker Hub credentials (created from /run/secrets/docker_hub_*)"
              username: "${readFile:/run/secrets/docker_hub_username}"
              password: "${readFile:/run/secrets/docker_hub_token}"

jobs:
  - script: >
      multibranchPipelineJob('LoyaltyCards Multibranch Pipeline') {
        branchSources {
          branchSource {
            source {
              github {
                id('loyalty-cards-repo')
                credentialsId('github-app')
                repoOwner('tomigorn')
                repository('LoyaltyCards')
                repositoryUrl('https://github.com/tomigorn/LoyaltyCards')
                configuredByUrl(true)
                traits {
                  gitHubBranchDiscovery {
                    strategyId(1) // Exclude branches that are also filed as PRs
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(2) // The current pull request revision
                  }
                  gitHubForkDiscovery {
                    strategyId(2) // The current pull request revision
                    trust {
                      gitHubTrustPermissions() // From users with Admin or Write permissions
                    }
                  }
                  gitHubTagDiscovery()
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(1)
          }
        }
      }
