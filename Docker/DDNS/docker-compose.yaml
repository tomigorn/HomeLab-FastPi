# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# DuckDNS #################################################
# #########################################################
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    mem_limit: 64m
    network_mode: host
    environment:
      - PUID=65021
      - PGID=65021
      - TZ=Europe/Zurich
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
    volumes:
      - ./config:/config
      - ../_global/lsio-init/drop-users-group.sh:/custom-cont-init.d/drop-users-group.sh:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:             # linuxserver s6: chown /config, drop root -> PUID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
# #########################################################
# No-IP ###################################################
# #########################################################
  noip:
    image: ghcr.io/noipcom/noip-duc:latest
    container_name: noip
    mem_limit: 64m
    network_mode: host
    # noip-duc is a single static binary and ignores PUID/PGID, so the uid is set here.
    user: "65022:65022"
    environment:
      - TZ=Europe/Zurich
      - NOIP_USERNAME=${NOIP_USERNAME}
      - NOIP_PASSWORD=${NOIP_PASSWORD}
      - NOIP_HOSTNAMES=${NOIP_HOSTNAMES}
    volumes:
      - ./noip_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
