# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# AdGuard Home ############################################
# #########################################################
# SSO only (2026-10-19): conf/AdGuardHome.yaml `users:` holds only the machine
# user authentik-proxy, whose Basic credentials Authentik injects after the SSO
# login (https://adguard.holy-grail.ch, middleware authentik-basic@file). There is
# no human password. Recovery when Authentik is down (server shell only):
#   1. htpasswd -nbB <name> '<password>'          # bcrypt hash
#   2. docker stop adguardhome; sudo nano conf/AdGuardHome.yaml   # add under users:
#        - name: <name>
#          password: <hash>
#      docker start adguardhome                    # DNS is down while stopped
#   3. ssh -L 3000:127.0.0.1:3000 fastpi, then http://localhost:3000/
#   Remove the user again afterwards. Backup: conf/AdGuardHome.yaml.bak-2026-10-19.
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    user: "65033:65033"   # owns ./conf and the adguardhome-data volume
    mem_limit: 256m
    restart: always
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :53 (host network, so the sysctl route is not available)
    # ports not needed with network_mode: host (container binds directly to host)
    # ports:
    #   - "53:53/tcp"       # DNS
    #   - "53:53/udp"       # DNS
    #   - "853:853/tcp"     # DNS-over-TLS
    #   - "853:853/udp"     # DNS-over-QUIC
    #   - "3000:3000/tcp"   # Web UI (http.address in conf/AdGuardHome.yaml)
    volumes:
      - ./conf:/opt/adguardhome/conf
      - adguardhome-data:/opt/adguardhome/work
    environment:
      TZ: 'Europe/Zurich'
    dns:
      - 1.1.1.1 # Cloudflare
      - 9.9.9.9 # Quad9
    healthcheck:
      test: ["CMD", "nslookup", "localhost", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# =========================================================
# Networks ================================================
# =========================================================

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  adguardhome-data:

