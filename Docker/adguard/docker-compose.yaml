# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# AdGuard Home ############################################
# #########################################################
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: always
    network_mode: host
    # ports not needed with network_mode: host (container binds directly to host)
    # ports:
    #   - "53:53/tcp"       # DNS
    #   - "53:53/udp"       # DNS
    #   - "853:853/tcp"     # DNS-over-TLS
    #   - "853:853/udp"     # DNS-over-QUIC
    #   - "3080:3080/tcp"   # Web UI
    volumes:
      - ./conf:/opt/adguardhome/conf
      - adguardhome-data:/opt/adguardhome/work
    environment:
      TZ: 'Europe/Zurich'
    dns:
      - 1.1.1.1 # Cloudflare
      - 9.9.9.9 # Quad9
    healthcheck:
      test: ["CMD", "nslookup", "localhost", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

# =========================================================
# Networks ================================================
# =========================================================

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  adguardhome-data:

