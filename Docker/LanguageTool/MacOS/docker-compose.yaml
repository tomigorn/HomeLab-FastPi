# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# LanguageTool ############################################
# #########################################################
  languagetool:
    # LanguageTool 6.8 (community/self-hosted). Pinned, never :latest.
    image: erikvl87/languagetool:6.8
    container_name: languagetool
    hostname: languagetool
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2560m
    mem_reservation: 1g
    # Local-only: bind to loopback so nothing else on the LAN can reach it.
    # The browser extension on the Mac points at http://localhost:8010.
    ports:
      - "127.0.0.1:8010:8010"
    entrypoint: ["/usr/local/bin/lt-entrypoint.sh"]
    environment:
      TZ: 'Europe/Zurich'
      Java_Xms: 512m
      Java_Xmx: 2g

      # --- LanguageTool server config (see Raspi compose for notes) ---
      langtool_pipelineCaching: 'true'
      langtool_pipelinePrewarming: 'true'
      langtool_pipelineExpireTimeInSeconds: '600'
      langtool_maxPipelinePoolSize: '4'
      langtool_cacheSize: '1000'
      langtool_cacheTTLSeconds: '3600'
      langtool_maxCheckThreads: '4'

      # n-grams OFF by design (precision-first). To enable on the Mac:
      # run scripts/download-ngrams.sh, uncomment the ./ngrams mount
      # below, and uncomment the next line.
      # langtool_languageModel: /ngrams
    volumes:
      - ../shared:/shared:ro
      - ../shared/bin/lt-entrypoint.sh:/usr/local/bin/lt-entrypoint.sh:ro
      - ./config/logback.xml:/LanguageTool/logback.xml:ro
      # - ./ngrams:/ngrams:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--data", "language=en-US&text=test", "http://localhost:8010/v2/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# =========================================================
# Networks ================================================
# =========================================================

