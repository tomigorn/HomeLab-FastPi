# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# LanguageTool ############################################
# #########################################################
  languagetool:
    # LanguageTool 6.8 (community/self-hosted). Pinned, never :latest.
    # Tags: https://hub.docker.com/r/erikvl87/languagetool/tags
    build: .   # erikvl87/languagetool:6.8 + the files it patches at start chowned to 65038
    image: languagetool-local:6.8
    container_name: languagetool
    user: "65038:65038"   # dedicated; the image uid 100 is the host's messagebus (D-Bus)
    hostname: languagetool
    restart: unless-stopped
    # Hardening: never gain privileges; cap memory above the JVM Xmx so a
    # runaway can't OOM-freeze the shared Pi (RSS runs ~0.5-1G over -Xmx).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    mem_reservation: 512m
    # No published ports — public access is via Traefik on the
    # traefik_proxy network, fronted by the Cloudflared tunnel.
    #
    # Our wrapper runs first: it appends spelling, merges custom grammar,
    # and compiles shared/config/disabled-rules.txt into
    # langtool_disabledRuleIds, then execs the image's start.sh.
    entrypoint: ["/usr/local/bin/lt-entrypoint.sh"]
    environment:
      HOME: /tmp   # the dedicated uid has no passwd home
      TZ: 'Europe/Zurich'

      # --- JVM heap. No n-grams. en+de with 5 pooled pipelines live at
      #     ~650M (GC log /tmp/gc.log); 768m gave 2.3 s full GCs, so 1024m.
      #     Raise Xmx and mem_limit together for n-grams or more languages. ---
      Java_Xms: 256m
      Java_Xmx: 1024m

      # G1 with periodic heap-return (JEP 346): after 5 min without a GC,
      # G1 runs a concurrent cycle and gives free heap back to the OS. Was a
      # full GC every 30 s (-G1PeriodicGCInvokesConcurrent): 1.5 CPU-s per
      # run (5% of a core while idle), stop-the-world, and the heap stayed
      # fully committed anyway. SystemLoadThreshold=0 lets it run regardless
      # of load. MaxMetaspaceSize caps class metadata; ExitOnOutOfMemoryError
      # makes a too-tight heap restart visibly (restart: unless-stopped).
      # GC log: /tmp/gc.log in the container (2 x 1 MB).
      # JAVA_TOOL_OPTIONS is auto-read by the JVM.
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseG1GC
        -XX:G1PeriodicGCInterval=300000
        -XX:G1PeriodicGCSystemLoadThreshold=0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc:file=/tmp/gc.log:uptime:filecount=2,filesize=1m

      # --- LanguageTool server config ------------------------------
      # Every langtool_* var is written verbatim into config.properties
      # by the image's start.sh (key = value) and read by the server.
      # See HTTPServerConfig for the full key list.

      # Speed: reuse analysis pipelines and cache identical requests.
      # Prewarming OFF: first request per language is built lazily.
      # Pool 5 (upstream default; was 2): one pool for all languages and
      # settings, and 6.8 never evicts idle pipelines (pipelineExpireTimeInSeconds
      # is read but unused). With 2 slots, one taken by the en-US healthcheck,
      # every en-GB check evicted de-CH; the rebuild re-read the spellers
      # (their static caches expire 10 min after load): 2.7-4 s per switch.
      # A pooled pipeline answered in 30 ms after 23 min idle.
      langtool_pipelineCaching: 'true'
      langtool_pipelinePrewarming: 'false'
      langtool_pipelineExpireTimeInSeconds: '600'
      langtool_maxPipelinePoolSize: '5'
      # Result cache: number of recently-checked sentences kept in memory.
      langtool_cacheSize: '1000'
      langtool_cacheTTLSeconds: '3600'
      # Concurrency: modest on the Pi (4 cores worth of checking).
      langtool_maxCheckThreads: '4'

      # --- Deliberately NOT set (see REVIEW.md) --------------------
      # langtool_languageModel: /ngrams
      #   n-gram confusion rules are statistical ("corpus-majority")
      #   suggestions — the opposite of this setup's precision-first,
      #   every-finding-traceable stance. Left OFF on purpose. To turn
      #   on: run scripts/download-ngrams.sh, re-add the ./ngrams mount
      #   below, and uncomment this line.
      # No word2vec, no remoteRulesFile, no fastText override: the
      # server makes ZERO external/AI calls. Pure rule-based checking.
    volumes:
      # Read-only customization tree (shared by the Pi and Mac instances).
      - ../shared:/shared:ro
      - ../shared/bin/lt-entrypoint.sh:/usr/local/bin/lt-entrypoint.sh:ro
      # Quiet logging (ERROR/WARN only).
      - ./config/logback.xml:/LanguageTool/logback.xml:ro
      # n-gram data intentionally NOT mounted (see above).
      # - ./ngrams:/ngrams:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--data", "language=en-US&text=test", "http://localhost:8010/v2/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
