# =========================================================
# Vale — the second, fully hand-authored deterministic layer
# =========================================================
# Vale complements LanguageTool: it enforces HOUSE-STYLE rules you author
# yourself, so every alert traces to a YAML file in styles/ that you own.
# It runs client-side (Mac, VS Code, CLI) — there is no Vale server.
#
# IMPORTANT design decision (see ../REVIEW.md):
#   * Vale's spell check is ENABLED only for English (en_GB Hunspell dict).
#   * Vale's spell check is DISABLED for German. Vale's Go/Hunspell
#     implementation does NOT handle German compounding and flags valid
#     compounds (e.g. "Funktionswert") as misspellings — a precision
#     disaster. German spelling is left to LanguageTool, which does it
#     properly. So the German style here contains ONLY substitution /
#     existence rules, never `spelling`.
#
# Language is selected by FILE EXTENSION convention (Vale has no language
# auto-detect): name Swiss-German files  *.de.md / *.de.txt / *.de.tex,
# everything else is treated as British English.

StylesPath = styles

# Only surface warnings and errors by default; flip to `suggestion` when
# you want the full picky-style pass.
MinAlertLevel = warning

# Accept project-specific terms (Helvetisms, product names) here so Vale's
# English speller does not flag them. One term per line in
# styles/config/vocabularies/House/accept.txt (created by download-dicts.sh).
Vocab = House

# ---- British English (default for all prose files) ----
[*.{md,txt,tex,rst,html}]
BasedOnStyles = HouseStyle
# English spelling floor via the downloaded en_GB Hunspell dictionary.
# Comment this out if you'd rather leave all spelling to LanguageTool.
HouseStyle.Spelling = YES

# ---- Swiss Standard German (files named *.de.*) ----
# Style rules only — NO spelling (see note above).
[*.de.{md,txt,tex,rst,html}]
BasedOnStyles = Helvetia
