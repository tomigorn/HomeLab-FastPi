
# Loads default set of integrations. Do not remove.
default_config:

# Custom YAML lives in packages/ (one file per feature) — config-as-code.
homeassistant:
  packages: !include_dir_named packages
  # SSO-only (2026-10-18): an EMPTY list disables HA's own username/password
  # provider ("homeassistant"); the only login is "Holy Grail" (auth_oidc below,
  # which registers itself as a provider at runtime). Omitting the key would bring
  # the password provider back (HA defaults to [{type: homeassistant}]).
  # Shell recovery if Authentik is down or auth_oidc fails to load
  # (there is NO local user any more - see README "Authentik SSO"):
  #   1. docker exec -it homeassistant hass --script auth -c /config add <name> <password>
  #      (safe while HA runs: with [] nothing else writes that password store)
  #   2. Temporarily replace [] with:  - type: homeassistant
  #   3. docker compose restart; log in at http://192.168.1.2:8123/?skip_oidc_redirect=true
  #      (the first login creates an admin user). Undo afterwards: delete that user
  #      in Settings > People > Users, put [] back, restart.
  auth_providers: []

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Dashboards (config-as-code):
# Claim the default "Overview" slot (url_path "lovelace") with our committed
# YAML dashboard, replacing HA's auto-generated home dashboard. This is the
# supported replacement for the deprecated top-level `lovelace: mode: yaml`
# (removed in HA 2026.8). Other dashboards (e.g. "Map") stay storage-mode.
lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Electricity
      icon: mdi:power-plug
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Reverse proxy: https://ha.holy-grail.ch is Traefik (Docker/Traefik/traefik/dynamic/
# home-assistant.yml) -> http://192.168.1.2:8123. Since HA 2026.10 the `http:`
# settings are NOT YAML any more: they live in .storage/http (UI: Settings > System
# > Network) and an `http:` block here is ignored (repair issue). Set there:
#   use_x_forwarded_for: true
#   trusted_proxies: [172.24.0.0/16]
# Traefik sits on the docker bridge traefik_proxy, so its connections to the host
# port arrive from its container IP (172.24.255.3, pinned in Traefik compose
# when containers are recreated or the host reboots). HA answers 400 to any
# X-Forwarded-For from an untrusted peer, so the whole bridge is trusted rather
# than the one current IP. Direct LAN requests to :8123 carry no X-Forwarded-For
# and are unaffected. See README "Authentik SSO".

# Authentik login (custom component hass-oidc-auth 1.2.1 in custom_components/auth_oidc).
# PUBLIC client + PKCE, provider/application "home-assistant" provisioned by
# Docker/Authentik/scripts/provision-admin-sso.py; the client id comes from .env
# (HA_OIDC_CLIENT_ID, passed in by docker-compose.yaml). Only members of
# homelab-admins (admins) and homelab-users (normal users, the everyday account) are let in. Roles are applied at FIRST login only.
# Users are never auto-linked to existing HA users. There is no local login any
# more (auth_providers: [] above); the owner is the OIDC user. Break-glass = shell
# recovery, see the comment under homeassistant: above.
# The schema silently drops unknown keys - check names against the component docs.
auth_oidc:
  client_id: !env_var HA_OIDC_CLIENT_ID
  discovery_url: "https://sso.holy-grail.ch/application/o/home-assistant/.well-known/openid-configuration"
  display_name: "Holy Grail"
  roles:
    admin: homelab-admins
    user: homelab-users
  features:
    automatic_user_linking: false
    automatic_person_creation: true
    # Authentik has no "groups" scope; the groups claim comes with "profile".
    include_groups_scope: false
    default_redirect: true
