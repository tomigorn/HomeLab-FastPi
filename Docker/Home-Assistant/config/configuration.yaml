
# Loads default set of integrations. Do not remove.
default_config:

# Custom YAML lives in packages/ (one file per feature) — config-as-code.
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Dashboards (config-as-code):
# Claim the default "Overview" slot (url_path "lovelace") with our committed
# YAML dashboard, replacing HA's auto-generated home dashboard. This is the
# supported replacement for the deprecated top-level `lovelace: mode: yaml`
# (removed in HA 2026.8). Other dashboards (e.g. "Map") stay storage-mode.
lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Electricity
      icon: mdi:power-plug
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
