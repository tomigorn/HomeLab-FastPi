# =========================================================
# "Vampire" draw — virtual plug for standby / parasitic loads
# =========================================================
# NOT a physical device: a template "plug" that sums the small always-on
# (or off-state) loads that the three real myStrom plugs do NOT measure.
# A myStrom plug meters only the DOWNSTREAM load behind it; its OWN
# electronics draw is invisible to it, so that self-draw is accounted for
# here instead (see the FastPi/Beefy/Tower cards' self-draw remark on the dashboard).
#
# Component values (measured; roughly static except the three myStrom plugs,
# which follow their relay on/off state):
#   myStrom plug self-draw ...... 1.4 W when ON, 0.9 W when OFF  (each, x3, dynamic)
#   Noctua fan + AC->DC header ... 0.4 W
#   Netgear 1 GbE switch ......... 2.0 W
#   Power strip .................. 0.4 W
#
# Fixed part = 0.4 + 2.0 + 0.4 = 2.8 W; the three plugs add 2.7 W (all off)
# to 4.2 W (all on), so total vampire draw ranges ~5.5 W .. ~7.0 W.
# (A spare Tuya smart plug, 1.2 W, was counted here until it was unplugged on
# 2026-10-08; vampire history before that date includes it.)
#
# Entity namespace: sensor.vampire_plug_*
# Tariff/price lives in packages/electricity.yaml; the combined
# "total incl. vampire" sensors live there too.

template:
  - sensor:
      - name: "Vampire Plug Power"
        unique_id: vampire_plug_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:sleep
        # myStrom self-draw is dynamic (relay state); the rest are fixed.
        state: >-
          {{ ((1.4 if is_state('binary_sensor.fastpi_plug_relay', 'on') else 0.9)
            + (1.4 if is_state('binary_sensor.beefy_plug_relay', 'on') else 0.9)
            + (1.4 if is_state('binary_sensor.tower_plug_relay', 'on') else 0.9)
            + 0.4 + 2.0 + 0.4) | round(1) }}
        attributes:
          fastpi_plug_self_draw_w: "{{ 1.4 if is_state('binary_sensor.fastpi_plug_relay', 'on') else 0.9 }}"
          beefy_plug_self_draw_w: "{{ 1.4 if is_state('binary_sensor.beefy_plug_relay', 'on') else 0.9 }}"
          tower_plug_self_draw_w: "{{ 1.4 if is_state('binary_sensor.tower_plug_relay', 'on') else 0.9 }}"
          noctua_fan_w: 0.4
          netgear_switch_w: 2.0
          power_strip_w: 0.4

      - name: "Vampire Plug Current Cost Rate"
        unique_id: vampire_plug_current_cost_rate
        unit_of_measurement: "CHF/h"
        icon: mdi:cash-clock
        state: >-
          {{ (states('sensor.vampire_plug_power') | float(0) / 1000
              * states('sensor.electricity_current_price') | float(0)) | round(3) }}

      # Unrounded CHF/h — integration source for the cost odometer (rounding the
      # display rate to 3 dp would floor this few-watt load's cost to ~0).
      - name: "Vampire Plug Cost Rate Raw"
        unique_id: vampire_plug_cost_rate_raw
        unit_of_measurement: "CHF/h"
        state: >-
          {{ states('sensor.vampire_plug_power') | float(0) / 1000
             * states('sensor.electricity_current_price') | float(0) }}

      # Lifetime cost = the cost odometer below, rounded for display.
      - name: "Vampire Cost Lifetime"
        unique_id: vampire_cost_lifetime
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.vampire_plug_cost_accumulated')) }}"
        state: "{{ states('sensor.vampire_plug_cost_accumulated') | float(0) | round(2) }}"

      # --- Projected yearly cost (estimate) — same extrapolation as the plugs,
      # so the toggle can add a Vampire row to the projected-cost card.
      - name: "Vampire Plug Cost Year Proj Week"
        unique_id: vampire_plug_cost_year_proj_week
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        state: >-
          {% set frac = (now().hour*3600 + now().minute*60 + now().second) / 86400 %}
          {% set days = [now().weekday() + frac, 0.5] | max %}
          {{ (states('sensor.vampire_cost_weekly')|float(0) / days * 365) | round(2) }}
      - name: "Vampire Plug Cost Year Proj Month"
        unique_id: vampire_plug_cost_year_proj_month
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        state: >-
          {% set frac = (now().hour*3600 + now().minute*60 + now().second) / 86400 %}
          {% set days = [(now().day - 1) + frac, 0.5] | max %}
          {{ (states('sensor.vampire_cost_monthly')|float(0) / days * 365) | round(2) }}

# --- Lifetime energy (kWh) & cost (CHF) integrated from the live power/rate ---
# Odometer method: because the cost rate already uses the current tariff price,
# the accumulated cost — and every per-period cost meter built on it below — is
# correct across price changes, WITHOUT needing tariff-split meters (so, unlike
# the plugs, vampire needs no entry in the tariff-switching automation).
sensor:
  - platform: integration
    source: sensor.vampire_plug_power
    name: "Vampire Plug Energy"
    unique_id: vampire_plug_energy
    unit_prefix: k
    round: 3
    method: trapezoidal
    max_sub_interval: "00:05:00"   # keep accruing even at dead-constant standby

  - platform: integration
    source: sensor.vampire_plug_cost_rate_raw
    name: "Vampire Plug Cost Accumulated"
    unique_id: vampire_plug_cost_accum
    unit_time: h
    round: 4
    method: trapezoidal
    max_sub_interval: "00:05:00"

# --- Per-period meters (plain — no tariff split needed, price is baked into the
# odometers above). Energy in kWh, cost in CHF, each resetting at period start. ---
utility_meter:
  vampire_energy_daily:
    source: sensor.vampire_plug_energy
    cycle: daily
  vampire_energy_weekly:
    source: sensor.vampire_plug_energy
    cycle: weekly
  vampire_energy_monthly:
    source: sensor.vampire_plug_energy
    cycle: monthly
  vampire_energy_yearly:
    source: sensor.vampire_plug_energy
    cycle: yearly

  vampire_cost_daily:
    source: sensor.vampire_plug_cost_accumulated
    cycle: daily
  vampire_cost_weekly:
    source: sensor.vampire_plug_cost_accumulated
    cycle: weekly
  vampire_cost_monthly:
    source: sensor.vampire_plug_cost_accumulated
    cycle: monthly
  vampire_cost_yearly:
    source: sensor.vampire_plug_cost_accumulated
    cycle: yearly
