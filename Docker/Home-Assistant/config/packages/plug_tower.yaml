# =========================================================
# myStrom Switch — "Tower" plug (powers the Unraid NAS "tower")
# =========================================================
# Talks to the plug's LOCAL API only (no cloud, no subscription):
#   GET /report          -> {"power":W, "Ws":.., "relay":bool, "temperature":C}
#   GET /relay?state=1|0 -> switch the relay on/off
#
# Device : myStrom-Unraid-Tower   MAC 3c:e9:0e:7d:13:a0   (Wi-Fi 2.4 GHz)
# NOTE   : hardcodes IP 192.168.1.248 — keep a DHCP reservation for it!
#
# Entity namespace: sensor.tower_plug_*  /  switch.tower_plug
# Tariff/price + combined-totals live in packages/electricity.yaml.

# --- Relay control (on/off) -------------------------------------------------
rest_command:
  plug_tower_on:
    url: "http://192.168.1.248/relay?state=1"
    method: get
  plug_tower_off:
    url: "http://192.168.1.248/relay?state=0"
    method: get

# --- Telemetry (polled every 5s) -------------------------------------------
rest:
  - resource: "http://192.168.1.248/report"
    scan_interval: 5
    sensor:
      - name: "Tower Plug Power"
        unique_id: tower_plug_power
        value_template: "{{ value_json.power | round(1) }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Tower Plug Temperature"
        unique_id: tower_plug_temperature
        value_template: "{{ value_json.temperature | round(1) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
    binary_sensor:
      - name: "Tower Plug Relay"
        unique_id: tower_plug_relay
        value_template: "{{ 'on' if value_json.relay else 'off' }}"

# --- The on/off switch (reads relay state, calls the rest_commands) ---------
template:
  - switch:
      - name: "Tower Plug"
        unique_id: tower_plug_switch
        state: "{{ is_state('binary_sensor.tower_plug_relay', 'on') }}"
        turn_on:
          - action: rest_command.plug_tower_on
        turn_off:
          - action: rest_command.plug_tower_off

  # --- Derived per-plug energy (combined high+low) & cost -------------------
  - sensor:
      - name: "Tower Plug Current Cost Rate"
        unique_id: tower_plug_current_cost_rate
        unit_of_measurement: "CHF/h"
        state: >-
          {{ (states('sensor.tower_plug_power') | float(0) / 1000
              * states('sensor.electricity_current_price') | float(0)) | round(3) }}

      # Unrounded CHF/h — integration source for the cost odometer (rounding the
      # display rate to 3 dp would floor a few-watt load's cost to ~0).
      - name: "Tower Plug Cost Rate Raw"
        unique_id: tower_plug_cost_rate_raw
        unit_of_measurement: "CHF/h"
        state: >-
          {{ states('sensor.tower_plug_power') | float(0) / 1000
             * states('sensor.electricity_current_price') | float(0) }}

      - name: "Tower Plug Energy Today"
        unique_id: tower_plug_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.tower_plug_daily_high')|float(0) + states('sensor.tower_plug_daily_low')|float(0)) | round(3) }}"
      - name: "Tower Plug Energy This Week"
        unique_id: tower_plug_energy_this_week
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.tower_plug_weekly_high')|float(0) + states('sensor.tower_plug_weekly_low')|float(0)) | round(3) }}"
      - name: "Tower Plug Energy This Month"
        unique_id: tower_plug_energy_this_month
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.tower_plug_monthly_high')|float(0) + states('sensor.tower_plug_monthly_low')|float(0)) | round(3) }}"
      - name: "Tower Plug Energy This Year"
        unique_id: tower_plug_energy_this_year
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.tower_plug_yearly_high')|float(0) + states('sensor.tower_plug_yearly_low')|float(0)) | round(3) }}"

      - name: "Tower Plug Cost Today"
        unique_id: tower_plug_cost_today
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {{ (states('sensor.tower_plug_daily_high')|float(0) * states('sensor.electricity_price_high')|float(0)
            + states('sensor.tower_plug_daily_low')|float(0)  * states('sensor.electricity_price_low')|float(0)) | round(2) }}
      - name: "Tower Plug Cost This Week"
        unique_id: tower_plug_cost_this_week
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {{ (states('sensor.tower_plug_weekly_high')|float(0) * states('sensor.electricity_price_high')|float(0)
            + states('sensor.tower_plug_weekly_low')|float(0)  * states('sensor.electricity_price_low')|float(0)) | round(2) }}
      - name: "Tower Plug Cost This Month"
        unique_id: tower_plug_cost_this_month
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {{ (states('sensor.tower_plug_monthly_high')|float(0) * states('sensor.electricity_price_high')|float(0)
            + states('sensor.tower_plug_monthly_low')|float(0)  * states('sensor.electricity_price_low')|float(0)) | round(2) }}
      - name: "Tower Plug Cost This Year"
        unique_id: tower_plug_cost_this_year
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {{ (states('sensor.tower_plug_yearly_high')|float(0) * states('sensor.electricity_price_high')|float(0)
            + states('sensor.tower_plug_yearly_low')|float(0)  * states('sensor.electricity_price_low')|float(0)) | round(2) }}

      # Lifetime cost = the cost odometer (each moment priced at its own tariff
      # and year's price, so correct across price changes), rounded for display.
      - name: "Tower Plug Cost Lifetime"
        unique_id: tower_plug_cost_lifetime
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        availability: "{{ is_number(states('sensor.tower_plug_cost_accumulated')) }}"
        state: "{{ states('sensor.tower_plug_cost_accumulated') | float(0) | round(2) }}"

      # --- Projected yearly cost (estimate) -----------------------------------
      # Extrapolate the spend-so-far this week / this month to a full year.
      # Noisy early in a period; clearly an estimate (see dashboard note + icon).
      - name: "Tower Plug Cost Year Proj Week"
        unique_id: tower_plug_cost_year_proj_week
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {% set frac = (now().hour*3600 + now().minute*60 + now().second) / 86400 %}
          {% set days = [now().weekday() + frac, 0.5] | max %}
          {{ (states('sensor.tower_plug_cost_this_week')|float(0) / days * 365) | round(2) }}
      - name: "Tower Plug Cost Year Proj Month"
        unique_id: tower_plug_cost_year_proj_month
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        availability: "{{ is_number(states('sensor.electricity_price_high')) and is_number(states('sensor.electricity_price_low')) }}"
        state: >-
          {% set frac = (now().hour*3600 + now().minute*60 + now().second) / 86400 %}
          {% set days = [(now().day - 1) + frac, 0.5] | max %}
          {{ (states('sensor.tower_plug_cost_this_month')|float(0) / days * 365) | round(2) }}

# --- Lifetime energy (kWh) integrated from live power ----------------------
sensor:
  - platform: integration
    source: sensor.tower_plug_power
    name: "Tower Plug Energy"
    unique_id: tower_plug_energy
    unit_prefix: k
    round: 3
    method: trapezoidal
    max_sub_interval: "00:05:00"

  # --- Accumulated cost (CHF): integral of the live CHF/h cost rate ---------
  # Monotonic odometer (never shown directly). Its per-day / per-month *change*
  # drives the historical cost-per-timeframe graphs, and because the cost rate
  # already uses the current period's price it is correct across price changes.
  - platform: integration
    source: sensor.tower_plug_cost_rate_raw
    name: "Tower Plug Cost Accumulated"
    unique_id: tower_plug_cost_accum
    unit_time: h
    round: 4
    method: trapezoidal
    max_sub_interval: "00:05:00"   # keep accruing even when power is dead-constant

# --- Per-period meters (tariff-split create _high / _low + select.<name>) ---
utility_meter:
  tower_plug_hourly:
    source: sensor.tower_plug_energy
    cycle: hourly
  tower_plug_weekly:
    source: sensor.tower_plug_energy
    cycle: weekly
    tariffs: [high, low]
  tower_plug_daily:
    source: sensor.tower_plug_energy
    cycle: daily
    tariffs: [high, low]
  tower_plug_monthly:
    source: sensor.tower_plug_energy
    cycle: monthly
    tariffs: [high, low]
  tower_plug_yearly:
    source: sensor.tower_plug_energy
    cycle: yearly
    tariffs: [high, low]
  tower_plug_total:
    source: sensor.tower_plug_energy
    tariffs: [high, low]
