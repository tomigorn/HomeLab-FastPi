# Push Home Assistant energy/power (and other sensor) data to the shared
# InfluxDB v2 so it can be correlated with fastpi RAM/swap in Grafana.
# Only the sensor domain is exported to keep the bucket small. Token in
# secrets.yaml (influxdb_token).
influxdb:
  api_version: 2
  # HA runs network_mode: host, and InfluxDB publishes 8086 on the host, so
  # reach it on loopback — stable (no LAN-IP dependency) and stays local.
  host: 127.0.0.1
  port: 8086
  ssl: false
  token: !secret influxdb_token
  organization: myorg
  bucket: homeassistant
  max_retries: 3
  measurement_attr: unit_of_measurement
  include:
    domains:
      - sensor
  exclude:
    entity_globs:
      - sensor.*_uptime
