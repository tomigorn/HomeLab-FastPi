# Push Home Assistant energy/power (and other sensor) data to the shared
# InfluxDB v2 so it can be correlated with fastpi RAM/swap in Grafana.
# Only the sensor domain is exported to keep the bucket small. Token in
# secrets.yaml (influxdb_token). host: uses the Pi LAN IP because HA and
# InfluxDB are on different Docker networks (the container name "influxdb"
# does not resolve from the HA container); InfluxDB publishes 8086 on the host.
influxdb:
  api_version: 2
  host: 192.168.1.2
  port: 8086
  ssl: false
  token: !secret influxdb_token
  organization: myorg
  bucket: homeassistant
  max_retries: 3
  measurement_attr: unit_of_measurement
  include:
    domains:
      - sensor
  exclude:
    entity_globs:
      - sensor.*_uptime
