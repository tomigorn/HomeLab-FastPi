# =========================================================
# Plug watch: Telegram alert when a plug relay switches without a Home Assistant
# command, or tower loses power without shutting down. README "Plug watch".
# =========================================================
# Decisions: custom_templates/plug_watch.jinja (tests: tests/test_plug_watch.py).
# Delivery: POST to Alertmanager on 127.0.0.1:9093 (HA runs on the host network),
# route + Telegram layout tg.power in Docker/grafana/alertmanager.

# --- When did Home Assistant last switch each plug? -------------------------
# call_service fires for every rest_command call: the switch.<plug>_plug
# toggle, automations, scripts and Developer Tools alike.
template:
  - triggers:
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_fastpi_on}
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_fastpi_off}
    sensor:
      - name: "FastPi Plug Last Command"
        unique_id: fastpi_plug_last_command
        device_class: timestamp
        state: "{{ now().isoformat() }}"
  - triggers:
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_beefy_on}
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_beefy_off}
    sensor:
      - name: "Beefy Plug Last Command"
        unique_id: beefy_plug_last_command
        device_class: timestamp
        state: "{{ now().isoformat() }}"
  - triggers:
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_tower_on}
      - trigger: event
        event_type: call_service
        event_data: {domain: rest_command, service: plug_tower_off}
    sensor:
      - name: "Tower Plug Last Command"
        unique_id: tower_plug_last_command
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  # --- Debounced relay: on/off held for 30 s (6 polls), sampled every 5 s ----
  # A poll that fails reads "unavailable" and a one-poll glitch never holds
  # 30 s, so neither changes these (2026-11-02 04:30: tower relay unavailable
  # for 6 s while drawing 36 W).
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: "FastPi Plug Relay Stable"
        unique_id: fastpi_plug_relay_stable
        state: >-
          {% set r = states.binary_sensor.fastpi_plug_relay %}
          {{ r.state if r and r.state in ['on', 'off'] and (now() - r.last_changed).total_seconds() >= 30 else this.state }}
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: "Beefy Plug Relay Stable"
        unique_id: beefy_plug_relay_stable
        state: >-
          {% set r = states.binary_sensor.beefy_plug_relay %}
          {{ r.state if r and r.state in ['on', 'off'] and (now() - r.last_changed).total_seconds() >= 30 else this.state }}
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: "Tower Plug Relay Stable"
        unique_id: tower_plug_relay_stable
        state: >-
          {% set r = states.binary_sensor.tower_plug_relay %}
          {{ r.state if r and r.state in ['on', 'off'] and (now() - r.last_changed).total_seconds() >= 30 else this.state }}

  # --- Tower's last alive answer on Nextcloud's port (open or refused) ------
  # A clean Unraid shutdown stops Docker first, so 8080 answers "refused" while
  # the box still draws power; a hard off leaves it "open" until the cut.
  - triggers:
      - trigger: state
        entity_id: sensor.tower_nextcloud_port
        to: ["open", "refused"]
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Tower Nextcloud Port Last Alive"
        unique_id: tower_nextcloud_port_last_alive
        state: >-
          {% set s = states('sensor.tower_nextcloud_port') %}
          {{ s if s in ['open', 'refused'] else this.state }}

# open / refused / down. A bare TCP connect: Nextcloud logs nothing and tower's
# idle-shutdown does not count it (same probe as the Tower-Waker's /status).
command_line:
  - sensor:
      name: "Tower Nextcloud Port"
      unique_id: tower_nextcloud_port
      command: >-
        bash -c 'r=$(timeout 2 bash -c ": >/dev/tcp/$0/$1" 2>&1); [ $? = 0 ] && echo open || { [[ $r == *refused* ]] && echo refused || echo down; }' 192.168.1.101 8080 2>/dev/null
      scan_interval: 5
      command_timeout: 4

# --- Delivery ----------------------------------------------------------------
# data: alertname, host, summary, details (• lines), description (may hold
# <code>), is_test. Each event is its own alert (label at); it ends after 1 h.
rest_command:
  plug_watch_alert:
    url: "http://127.0.0.1:9093/api/v2/alerts"
    method: post
    content_type: "application/json"
    timeout: 10
    payload: >-
      {% set labels = {'alertname': alertname, 'host': host, 'severity': 'critical', 'source': 'home-assistant', 'at': now().strftime('%Y%m%d%H%M%S')} %}
      {% if is_test | default(false) %}{% set labels = dict(labels, test='home-assistant') %}{% endif %}
      {{ [{'labels': labels,
           'annotations': {'summary': summary, 'time': now().strftime('%Y-%m-%d %H:%M:%S'), 'details': details, 'description': description},
           'startsAt': now().isoformat(),
           'endsAt': (now() + timedelta(hours=1)).isoformat()}] | tojson }}

automation:
  # (a) Relay changed (held 30 s) and Home Assistant sent no command for that
  # plug in the 120 s before: the plug's button, the myStrom app/cloud, a
  # direct http://<plug>/relay call, or the plug itself.
  - id: plug_watch_relay
    alias: "Plug watch: relay switched without a Home Assistant command"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.fastpi_plug_relay_stable
          - sensor.beefy_plug_relay_stable
          - sensor.tower_plug_relay_stable
    variables:
      plug: "{{ trigger.entity_id.split('.')[1].split('_')[0] }}"
      name: "{{ {'fastpi': 'FastPi', 'beefy': 'Beefy', 'tower': 'Tower'}[plug] }}"
      ip: "{{ {'fastpi': '192.168.1.151', 'beefy': '192.168.1.152', 'tower': '192.168.1.248'}[plug] }}"
      command_age: >-
        {% set t = as_timestamp(states('sensor.' ~ plug ~ '_plug_last_command'), none) %}
        {{ (as_timestamp(now()) - t) | round(0) if t is not none else 999999 }}
      verdict: >-
        {% from 'plug_watch.jinja' import relay_verdict %}
        {{ relay_verdict(trigger.from_state.state if trigger.from_state else none, trigger.to_state.state, command_age) }}
    actions:
      - action: logbook.log
        data:
          name: "Plug watch"
          entity_id: "{{ trigger.entity_id }}"
          message: "relay {{ trigger.from_state.state if trigger.from_state else 'none' }} -> {{ trigger.to_state.state }}: {{ verdict }}"
      - condition: template
        value_template: "{{ verdict == 'alert' }}"
      - action: rest_command.plug_watch_alert
        data:
          alertname: PlugSwitchedUnexpectedly
          host: "{{ plug }}"
          summary: "{{ name }} plug switched {{ trigger.to_state.state | upper }} without a Home Assistant command"
          details: |-
            • relay: {{ trigger.from_state.state }} → {{ trigger.to_state.state }} (held 30 s)
            • power now: {{ states('sensor.' ~ plug ~ '_plug_power') }} W
            • last HA command: {{ 'none since the sensor exists' if command_age >= 999999 else (command_age / 60) | round(0) | int ~ ' min ago' }}
          description: >-
            Nothing in Home Assistant switched it: the plug's button, the myStrom app or cloud,
            a direct call to the plug, or the plug itself (reboot, firmware). Check:
            <code>curl http://{{ ip }}/report</code>

  # (b) Tower drew running power (> 15 W) and read < 1 W one poll later with the
  # relay still on. Every clean S5 shutdown looks the same at the plug (one
  # 0.0 W poll, then ~2.8 W standby), so the verdict uses Nextcloud's port:
  # refused before the cut = clean shutdown (logbook only), still open = hard
  # off, no answer seen since HA started = cannot tell (alert, says so).
  # beefy has no such port that is safe to poll (README "Plug watch").
  - id: plug_watch_power
    alias: "Plug watch: tower lost power without shutting down"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.tower_plug_power
    conditions:
      - condition: template
        value_template: >-
          {% from 'plug_watch.jinja' import power_drop %}
          {{ power_drop(trigger.from_state.state if trigger.from_state else none, trigger.to_state.state) == 'drop' }}
    actions:
      - variables:
          from_w: "{{ trigger.from_state.state }}"
          to_w: "{{ trigger.to_state.state }}"
          at: "{{ now().strftime('%H:%M:%S') }}"
      # let the relay poll and the port probe catch up
      - delay: "00:00:15"
      - variables:
          relay: "{{ states('binary_sensor.tower_plug_relay') }}"
          alive: "{{ states('sensor.tower_nextcloud_port_last_alive') }}"
          command_age: >-
            {% set t = as_timestamp(states('sensor.tower_plug_last_command'), none) %}
            {{ (as_timestamp(now()) - t) | round(0) if t is not none else 999999 }}
          verdict: >-
            {% from 'plug_watch.jinja' import power_verdict %}
            {{ power_verdict(relay, command_age, alive) }}
      - action: logbook.log
        data:
          name: "Plug watch"
          entity_id: sensor.tower_plug_power
          message: "power {{ from_w }} -> {{ to_w }} W at {{ at }}, relay {{ relay }}, port 8080 last {{ alive }}: {{ verdict }}"
      - condition: template
        value_template: "{{ verdict in ['hard_off', 'unknown'] }}"
      - action: rest_command.plug_watch_alert
        data:
          alertname: ServerPowerLost
          host: tower
          summary: >-
            {{ 'Tower lost power without shutting down' if verdict == 'hard_off' else 'Tower turned off, possibly a clean shutdown' }}
          details: |-
            • power: {{ from_w }} → {{ to_w }} W in one poll ({{ at }})
            • plug relay: stayed on, the plug did not cut it
            • Nextcloud port 8080: {{ 'still open when the power went' if verdict == 'hard_off' else 'no answer seen since Home Assistant started, so clean or hard off cannot be told apart' }}
          description: >-
            A clean shutdown stops Nextcloud (port refused) before the power goes.
            {{ 'Here it answered until the cut: a hard off (power button, PSU, thermal or firmware).' if verdict == 'hard_off' else '' }}
            After the next boot look for an unclean-shutdown note in Unraid's syslog.

  # 🧪 the whole path with made-up inputs through the same decisions:
  # Settings > Automations > this one > Run, or POST to its webhook (README).
  - id: plug_watch_test
    alias: "Plug watch: 🧪 test alert"
    mode: single
    triggers:
      - trigger: webhook
        webhook_id: !secret plug_watch_test_webhook
        allowed_methods: [POST]
        local_only: true
    variables:
      relay_check: "{% from 'plug_watch.jinja' import relay_verdict %}{{ relay_verdict('on', 'off', 999999) }}"
      power_check: "{% from 'plug_watch.jinja' import power_verdict %}{{ power_verdict('on', 999999, 'open') }}"
    actions:
      - action: logbook.log
        data:
          name: "Plug watch"
          message: "test: relay {{ relay_check }}, power {{ power_check }}"
      - condition: template
        value_template: "{{ relay_check == 'alert' and power_check == 'hard_off' }}"
      - action: rest_command.plug_watch_alert
        data:
          is_test: true
          alertname: PlugSwitchedUnexpectedly
          host: tower
          summary: "Tower plug switched OFF without a Home Assistant command"
          details: |-
            • relay: on → off (held 30 s)
            • power now: {{ states('sensor.tower_plug_power') }} W (real reading, nothing was switched)
            • last HA command: none since the sensor exists
          description: "Test message, nothing was switched. <code>curl http://192.168.1.248/report</code>"
      - action: rest_command.plug_watch_alert
        data:
          is_test: true
          alertname: ServerPowerLost
          host: tower
          summary: "Tower lost power without shutting down"
          details: |-
            • power: 31.0 → 0.0 W in one poll (made up)
            • plug relay: stayed on, the plug did not cut it
            • Nextcloud port 8080: still open when the power went
          description: "Test message, no server lost power."
