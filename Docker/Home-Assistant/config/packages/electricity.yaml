# =========================================================
# Electricity tariffs, prices & household totals — config-as-code
# =========================================================
# Global tariff/price (shared by every plug) + the combined "both plugs"
# totals. Per-plug devices & meters live in packages/plug_fastpi.yaml and
# packages/plug_beefy.yaml.
#
# Tariff (City of Zürich / EWZ):
#   HIGH (Hochtarif)  = Mon-Sat 06:00-22:00
#   LOW  (Niedertarif)= nights 22:00-06:00  AND  ALL of Sunday
# now().weekday(): Mon=0 ... Sun=6.  High only when weekday != 6 and 6<=hour<22.

# --- Editable tariff prices (CHF/kWh) --------------------------------------
input_number:
  electricity_price_high:
    name: "Electricity price (high tariff)"
    min: 0
    max: 5
    step: 0.001
    mode: box
    unit_of_measurement: "CHF/kWh"
    icon: mdi:cash-plus
    initial: 0.2988        # EWZ Hochtarif 2026: 29.88 Rp/kWh
  electricity_price_low:
    name: "Electricity price (low tariff)"
    min: 0
    max: 5
    step: 0.001
    mode: box
    unit_of_measurement: "CHF/kWh"
    icon: mdi:cash-minus
    initial: 0.1870        # EWZ Niedertarif 2026: 18.70 Rp/kWh

# --- Tariff switching ------------------------------------------------------
# One rule applies the correct tariff at the boundaries and on start, to the
# tariff-split meters of BOTH plugs.
# (06:00 -> high on Mon-Sat, stays low on Sun; 22:00 -> low always.)
automation:
  - id: electricity_apply_tariff
    alias: "Electricity: apply correct tariff (06:00 / 22:00 / start)"
    triggers:
      - trigger: time
        at: "06:00:00"
      - trigger: time
        at: "22:00:00"
      - trigger: homeassistant
        event: start
    actions:
      - action: select.select_option
        target:
          entity_id:
            - select.fastpi_plug_weekly
            - select.fastpi_plug_daily
            - select.fastpi_plug_monthly
            - select.fastpi_plug_yearly
            - select.fastpi_plug_total
            - select.beefy_plug_weekly
            - select.beefy_plug_daily
            - select.beefy_plug_monthly
            - select.beefy_plug_yearly
            - select.beefy_plug_total
        data:
          option: "{{ 'high' if (now().weekday() != 6 and 6 <= now().hour < 22) else 'low' }}"

# --- Global tariff/price + combined household totals -----------------------
template:
  - sensor:
      - name: "Electricity Current Tariff"
        unique_id: electricity_current_tariff
        state: "{{ 'high' if (now().weekday() != 6 and 6 <= now().hour < 22) else 'low' }}"
        icon: "{{ 'mdi:weather-sunny' if (now().weekday() != 6 and 6 <= now().hour < 22) else 'mdi:weather-night' }}"

      - name: "Electricity Current Price"
        unique_id: electricity_current_price
        unit_of_measurement: "CHF/kWh"
        state: >-
          {{ (states('input_number.electricity_price_high')
              if (now().weekday() != 6 and 6 <= now().hour < 22)
              else states('input_number.electricity_price_low')) | float(0) }}

      # ---- Combined live power & cost rate (both plugs) ----
      - name: "Plugs Total Power"
        unique_id: plugs_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.fastpi_plug_power')|float(0) + states('sensor.beefy_plug_power')|float(0)) | round(1) }}"

      - name: "Plugs Total Current Cost Rate"
        unique_id: plugs_total_current_cost_rate
        unit_of_measurement: "CHF/h"
        state: "{{ (states('sensor.fastpi_plug_current_cost_rate')|float(0) + states('sensor.beefy_plug_current_cost_rate')|float(0)) | round(3) }}"

      # ---- Combined lifetime energy (feeds the Energy dashboard) ----
      - name: "Plugs Total Energy"
        unique_id: plugs_total_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.fastpi_plug_energy')) and is_number(states('sensor.beefy_plug_energy')) }}"
        state: "{{ (states('sensor.fastpi_plug_energy')|float(0) + states('sensor.beefy_plug_energy')|float(0)) | round(3) }}"

      # ---- Combined per-period energy (high+low, both plugs) ----
      - name: "Plugs Total Energy Today"
        unique_id: plugs_total_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_energy_today')|float(0) + states('sensor.beefy_plug_energy_today')|float(0)) | round(3) }}"
      - name: "Plugs Total Energy This Week"
        unique_id: plugs_total_energy_this_week
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_energy_this_week')|float(0) + states('sensor.beefy_plug_energy_this_week')|float(0)) | round(3) }}"
      - name: "Plugs Total Energy This Month"
        unique_id: plugs_total_energy_this_month
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_energy_this_month')|float(0) + states('sensor.beefy_plug_energy_this_month')|float(0)) | round(3) }}"
      - name: "Plugs Total Energy This Year"
        unique_id: plugs_total_energy_this_year
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_energy_this_year')|float(0) + states('sensor.beefy_plug_energy_this_year')|float(0)) | round(3) }}"

      # ---- Combined cost (both plugs) ----
      - name: "Plugs Total Cost Today"
        unique_id: plugs_total_cost_today
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_cost_today')|float(0) + states('sensor.beefy_plug_cost_today')|float(0)) | round(2) }}"
      - name: "Plugs Total Cost This Week"
        unique_id: plugs_total_cost_this_week
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_cost_this_week')|float(0) + states('sensor.beefy_plug_cost_this_week')|float(0)) | round(2) }}"
      - name: "Plugs Total Cost This Month"
        unique_id: plugs_total_cost_this_month
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_cost_this_month')|float(0) + states('sensor.beefy_plug_cost_this_month')|float(0)) | round(2) }}"
      - name: "Plugs Total Cost This Year"
        unique_id: plugs_total_cost_this_year
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_cost_this_year')|float(0) + states('sensor.beefy_plug_cost_this_year')|float(0)) | round(2) }}"
      - name: "Plugs Total Cost Total"
        unique_id: plugs_total_cost_total
        unit_of_measurement: "CHF"
        device_class: monetary
        state_class: total
        state: "{{ (states('sensor.fastpi_plug_cost_total')|float(0) + states('sensor.beefy_plug_cost_total')|float(0)) | round(2) }}"

      # ---- Projected yearly cost (estimate) — sum of both plugs
      - name: "Plugs Total Cost Year Proj Week"
        unique_id: plugs_total_cost_year_proj_week
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        state: "{{ (states('sensor.fastpi_plug_cost_year_proj_week')|float(0) + states('sensor.beefy_plug_cost_year_proj_week')|float(0)) | round(2) }}"
      - name: "Plugs Total Cost Year Proj Month"
        unique_id: plugs_total_cost_year_proj_month
        unit_of_measurement: "CHF"
        device_class: monetary
        icon: mdi:chart-line-variant
        state: "{{ (states('sensor.fastpi_plug_cost_year_proj_month')|float(0) + states('sensor.beefy_plug_cost_year_proj_month')|float(0)) | round(2) }}"
