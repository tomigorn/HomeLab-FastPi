# =========================================================
# myStrom Switch (plug) — fully YAML / config-as-code
# =========================================================
# Talks to the plug's LOCAL API only (no cloud, no subscription):
#   GET /report          -> {"power":W, "Ws":.., "relay":bool, "temperature":C}
#   GET /relay?state=1|0 -> switch the relay on/off
# NOTE: hardcodes IP 192.168.1.150 — keep a DHCP reservation for it!

# --- Relay control (on/off) -------------------------------------------------
rest_command:
  mystrom_plug_on:
    url: "http://192.168.1.150/relay?state=1"
    method: get
  mystrom_plug_off:
    url: "http://192.168.1.150/relay?state=0"
    method: get

# --- Telemetry (polled every 5s) -------------------------------------------
rest:
  - resource: "http://192.168.1.150/report"
    scan_interval: 5
    sensor:
      - name: "MyStrom Plug Power"
        unique_id: mystrom_plug_61a328_power
        value_template: "{{ value_json.power | round(1) }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "MyStrom Plug Temperature"
        unique_id: mystrom_plug_61a328_temperature
        value_template: "{{ value_json.temperature | round(1) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
    binary_sensor:
      - name: "MyStrom Plug Relay"
        unique_id: mystrom_plug_61a328_relay
        value_template: "{{ 'on' if value_json.relay else 'off' }}"

# --- The on/off switch (reads relay state, calls the rest_commands) ---------
template:
  - switch:
      - name: "MyStrom Plug"
        unique_id: mystrom_plug_61a328_switch
        state: "{{ is_state('binary_sensor.mystrom_plug_relay', 'on') }}"
        turn_on:
          - action: rest_command.mystrom_plug_on
        turn_off:
          - action: rest_command.mystrom_plug_off

# --- Derived energy (kWh) for the Energy dashboard -------------------------
sensor:
  - platform: integration
    source: sensor.mystrom_plug_power
    name: "MyStrom Plug Energy"
    unique_id: mystrom_plug_61a328_energy
    unit_prefix: k
    round: 3
    method: trapezoidal
