# "Electricity" dashboard — config-as-code. Registered in configuration.yaml
# under lovelace.dashboards. Edit + save, then just refresh the browser
# (no restart needed for YAML dashboard content changes).
#
# Two plugs: FastPi (fastpi_plug_*) and Beefy (beefy_plug_*), plus the
# combined "Plugs Total ..." household totals from packages/electricity.yaml.
title: Electricity
views:
  # ---------------------------------------------------------------- Overview
  - title: Overview
    path: overview
    icon: mdi:power-plug
    # panel mode: the single vertical-stack below fills the full width, so each
    # horizontal-stack renders as a real full-width row (masonry would instead
    # scatter the stacks across auto-columns — that's what broke the layout).
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # -------- Top row: total power draw | measured | incl. vampire
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.plugs_total_power
                name: Total power draw
                unit: W
                min: 0
                max: 2300
                severity:
                  green: 0
                  yellow: 1000
                  red: 2000

              - type: glance
                title: Total — measured
                columns: 3
                entities:
                  - entity: sensor.plugs_total_power
                    name: Power
                  - entity: sensor.electricity_current_tariff
                    name: Tariff
                  - entity: sensor.plugs_total_current_cost_rate
                    name: Cost/h

              - type: glance
                title: Total — incl. vampire
                columns: 3
                entities:
                  - entity: sensor.total_incl_vampire_power
                    name: Power
                  - entity: sensor.electricity_current_tariff
                    name: Tariff
                  - entity: sensor.total_incl_vampire_current_cost_rate
                    name: Cost/h

          # -------- Second row: FastPi | Beefy | Vampire
          - type: horizontal-stack
            cards:
              - type: entities
                title: FastPi Plug
                state_color: true
                entities:
                  - entity: switch.fastpi_plug
                    name: Switch
                  - entity: sensor.fastpi_plug_power
                    name: Power
                  - entity: sensor.fastpi_plug_current_cost_rate
                    name: Cost rate
                  - entity: sensor.fastpi_plug_temperature
                    name: Temperature
                  - entity: binary_sensor.fastpi_plug_relay
                    name: Relay state
                  - type: section
                    label: "Plug self-draw ≈ 1.4 W on / 0.9 W off — its own use, on top of Power above (counted in Vampire draw)"

              - type: entities
                title: Beefy Plug
                state_color: true
                entities:
                  - entity: switch.beefy_plug
                    name: Switch
                  - entity: sensor.beefy_plug_power
                    name: Power
                  - entity: sensor.beefy_plug_current_cost_rate
                    name: Cost rate
                  - entity: sensor.beefy_plug_temperature
                    name: Temperature
                  - entity: binary_sensor.beefy_plug_relay
                    name: Relay state
                  - type: section
                    label: "Plug self-draw ≈ 1.4 W on / 0.9 W off — its own use, on top of Power above (counted in Vampire draw)"

              - type: entities
                title: Vampire draw
                entities:
                  - entity: sensor.vampire_plug_power
                    name: Total vampire draw
                  - entity: sensor.vampire_plug_current_cost_rate
                    name: Cost rate
                  - type: section
                    label: "Components — measured (static; the two plugs follow their on/off state)"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: fastpi_plug_self_draw_w
                    name: FastPi plug (self-draw)
                    suffix: " W"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: beefy_plug_self_draw_w
                    name: Beefy plug (self-draw)
                    suffix: " W"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: noctua_fan_w
                    name: Noctua fan + AC→DC header
                    suffix: " W"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: tuya_legacy_plug_w
                    name: Tuya legacy plug (spare / future NAS)
                    suffix: " W"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: netgear_switch_w
                    name: Netgear 1 GbE switch
                    suffix: " W"
                  - type: attribute
                    entity: sensor.vampire_plug_power
                    attribute: power_strip_w
                    name: Power strip
                    suffix: " W"

          - type: history-graph
            title: Power (last 24h)
            hours_to_show: 24
            entities:
              - entity: sensor.fastpi_plug_power
                name: FastPi
              - entity: sensor.beefy_plug_power
                name: Beefy
              - entity: sensor.plugs_total_power
                name: Total

  # ----------------------------------------------------------------- Energy
  - title: Measured
    path: measured
    icon: mdi:gauge
    # Same treatment as Overview: panel mode + one vertical-stack of full-width
    # rows, so the ~dozen cards land on a deliberate grid instead of being
    # scattered by masonry. The tables below are driven by two controls under
    # Live: a vampire toggle (adds Vampire + Total-incl-vampire rows) and a
    # timeframe dropdown (which period the tables show) — via input_boolean /
    # input_select in packages/measured_controls.yaml and `conditional` cards.
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # -------- Row 1: Live (+ controls) | Tariff & price | Projected
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: glance
                    title: Live
                    columns: 3
                    entities:
                      - entity: sensor.plugs_total_power
                        name: Power
                      - entity: sensor.electricity_current_tariff
                        name: Tariff
                      - entity: sensor.plugs_total_current_cost_rate
                        name: Cost/h
                  # Controls directly under Live, stacked: vampire show/hide
                  # toggle, then the timeframe dropdown.
                  - type: entities
                    entities:
                      - entity: input_boolean.measured_show_vampire
                        name: Show vampire
                  - type: entities
                    entities:
                      - entity: input_select.measured_timeframe
                        name: Timeframe

              - type: entities
                title: Tariff & price
                entities:
                  - entity: sensor.electricity_current_tariff
                    name: Current tariff
                  - entity: sensor.electricity_current_price
                    name: Current price
                  # Schedule as a full-width section header above each price, so
                  # it wraps to its own line instead of being truncated in the name.
                  - type: section
                    label: High tariff · Mon–Sat 06:00–22:00
                  - entity: sensor.electricity_price_high
                    name: Price
                  - type: section
                    label: Low tariff · nights 22:00–06:00 + all Sunday
                  - entity: sensor.electricity_price_low
                    name: Price
                  - type: section
                    label: Price table
                  - entity: sensor.electricity_tariff_coverage
                    name: Status

              - type: entities
                title: Projected yearly cost
                entities:
                  - type: section
                    label: From this week's rate
                  - entity: sensor.fastpi_plug_cost_year_proj_week
                    name: FastPi
                  - entity: sensor.beefy_plug_cost_year_proj_week
                    name: Beefy
                  - entity: sensor.plugs_total_cost_year_proj_week
                    name: Total
                  - type: conditional
                    conditions:
                      - entity: input_boolean.measured_show_vampire
                        state: "on"
                    row:
                      entity: sensor.vampire_plug_cost_year_proj_week
                      name: Vampire
                  - type: conditional
                    conditions:
                      - entity: input_boolean.measured_show_vampire
                        state: "on"
                    row:
                      entity: sensor.total_incl_vampire_cost_year_proj_week
                      name: Total incl. vampire
                  - type: section
                    label: From this month's rate
                  - entity: sensor.fastpi_plug_cost_year_proj_month
                    name: FastPi
                  - entity: sensor.beefy_plug_cost_year_proj_month
                    name: Beefy
                  - entity: sensor.plugs_total_cost_year_proj_month
                    name: Total
                  - type: conditional
                    conditions:
                      - entity: input_boolean.measured_show_vampire
                        state: "on"
                    row:
                      entity: sensor.vampire_plug_cost_year_proj_month
                      name: Vampire
                  - type: conditional
                    conditions:
                      - entity: input_boolean.measured_show_vampire
                        state: "on"
                    row:
                      entity: sensor.total_incl_vampire_cost_year_proj_month
                      name: Total incl. vampire

          # -------- Row 2: per-timeframe Energy | Cost tables.
          # One `conditional` card per timeframe (only the selected one renders);
          # the Vampire / Total-incl-vampire rows appear only when the toggle is on.

          # ---- Today ----
          - type: conditional
            conditions:
              - entity: input_select.measured_timeframe
                state: Today
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  title: Energy — Today (kWh)
                  entities:
                    - entity: sensor.fastpi_plug_energy_today
                      name: FastPi
                    - entity: sensor.beefy_plug_energy_today
                      name: Beefy
                    - entity: sensor.plugs_total_energy_today
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_energy_daily
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_energy_today
                        name: Total incl. vampire
                - type: entities
                  title: Cost — Today (CHF)
                  entities:
                    - entity: sensor.fastpi_plug_cost_today
                      name: FastPi
                    - entity: sensor.beefy_plug_cost_today
                      name: Beefy
                    - entity: sensor.plugs_total_cost_today
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_cost_daily
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_cost_today
                        name: Total incl. vampire

          # ---- This week ----
          - type: conditional
            conditions:
              - entity: input_select.measured_timeframe
                state: This week
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  title: Energy — This week (kWh)
                  entities:
                    - entity: sensor.fastpi_plug_energy_this_week
                      name: FastPi
                    - entity: sensor.beefy_plug_energy_this_week
                      name: Beefy
                    - entity: sensor.plugs_total_energy_this_week
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_energy_weekly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_energy_this_week
                        name: Total incl. vampire
                - type: entities
                  title: Cost — This week (CHF)
                  entities:
                    - entity: sensor.fastpi_plug_cost_this_week
                      name: FastPi
                    - entity: sensor.beefy_plug_cost_this_week
                      name: Beefy
                    - entity: sensor.plugs_total_cost_this_week
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_cost_weekly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_cost_this_week
                        name: Total incl. vampire

          # ---- This month ----
          - type: conditional
            conditions:
              - entity: input_select.measured_timeframe
                state: This month
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  title: Energy — This month (kWh)
                  entities:
                    - entity: sensor.fastpi_plug_energy_this_month
                      name: FastPi
                    - entity: sensor.beefy_plug_energy_this_month
                      name: Beefy
                    - entity: sensor.plugs_total_energy_this_month
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_energy_monthly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_energy_this_month
                        name: Total incl. vampire
                - type: entities
                  title: Cost — This month (CHF)
                  entities:
                    - entity: sensor.fastpi_plug_cost_this_month
                      name: FastPi
                    - entity: sensor.beefy_plug_cost_this_month
                      name: Beefy
                    - entity: sensor.plugs_total_cost_this_month
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_cost_monthly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_cost_this_month
                        name: Total incl. vampire

          # ---- This year ----
          - type: conditional
            conditions:
              - entity: input_select.measured_timeframe
                state: This year
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  title: Energy — This year (kWh)
                  entities:
                    - entity: sensor.fastpi_plug_energy_this_year
                      name: FastPi
                    - entity: sensor.beefy_plug_energy_this_year
                      name: Beefy
                    - entity: sensor.plugs_total_energy_this_year
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_energy_yearly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_energy_this_year
                        name: Total incl. vampire
                - type: entities
                  title: Cost — This year (CHF)
                  entities:
                    - entity: sensor.fastpi_plug_cost_this_year
                      name: FastPi
                    - entity: sensor.beefy_plug_cost_this_year
                      name: Beefy
                    - entity: sensor.plugs_total_cost_this_year
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_cost_yearly
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_cost_this_year
                        name: Total incl. vampire

          # ---- Lifetime (energy only — no reset-period lifetime cost, by design) ----
          - type: conditional
            conditions:
              - entity: input_select.measured_timeframe
                state: Lifetime
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  title: Energy — Lifetime (kWh)
                  entities:
                    - entity: sensor.fastpi_plug_energy
                      name: FastPi
                    - entity: sensor.beefy_plug_energy
                      name: Beefy
                    - entity: sensor.plugs_total_energy
                      name: Total
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.vampire_plug_energy
                        name: Vampire
                    - type: conditional
                      conditions:
                        - entity: input_boolean.measured_show_vampire
                          state: "on"
                      row:
                        entity: sensor.total_incl_vampire_energy
                        name: Total incl. vampire
                - type: markdown
                  content: >
                    **No lifetime cost — by design.** Costs reset each period, so
                    they never run as a single lifetime total. Use **This year**,
                    or the native **Energy** dashboard for an arbitrary date range.

          # -------- Row 3: per-day graphs — energy | cost
          - type: horizontal-stack
            cards:
              - type: statistics-graph
                title: Energy per day (kWh)
                chart_type: bar
                period: day
                stat_types:
                  - change
                entities:
                  - entity: sensor.fastpi_plug_energy
                    name: FastPi
                  - entity: sensor.beefy_plug_energy
                    name: Beefy

              - type: statistics-graph
                title: Cost per day (CHF)
                chart_type: bar
                period: day
                stat_types:
                  - change
                entities:
                  - entity: sensor.fastpi_plug_cost_accumulated
                    name: FastPi
                  - entity: sensor.beefy_plug_cost_accumulated
                    name: Beefy

          # -------- Row 4: per-month graphs — energy | cost
          - type: horizontal-stack
            cards:
              - type: statistics-graph
                title: Energy per month (kWh)
                chart_type: bar
                period: month
                stat_types:
                  - change
                entities:
                  - entity: sensor.fastpi_plug_energy
                    name: FastPi
                  - entity: sensor.beefy_plug_energy
                    name: Beefy

              - type: statistics-graph
                title: Cost per month (CHF)
                chart_type: bar
                period: month
                stat_types:
                  - change
                entities:
                  - entity: sensor.fastpi_plug_cost_accumulated
                    name: FastPi
                  - entity: sensor.beefy_plug_cost_accumulated
                    name: Beefy

          # -------- Row 5: full-width power graph
          - type: statistics-graph
            title: Power (W) — hourly mean / max
            period: hour
            stat_types:
              - mean
              - max
            entities:
              - entity: sensor.plugs_total_power
                name: Total

          # -------- Row 6: full-width note
          - type: markdown
            content: >
              For any custom date range across years — kWh **and** CHF,
              time-of-use priced — use the built-in **Energy** dashboard in the
              sidebar. Its date picker shows exactly the period you select,
              starting from 0.

  # ----------------------------------------------------------------- Uptime
  # A server counts as "up" when its plug pulls > 3 W; at/below that it is off,
  # sleeping or hibernating. Entities live in packages/uptime.yaml.
  - title: Uptime
    path: uptime
    icon: mdi:server
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # -------- Top row: current status + how long, per host
          - type: horizontal-stack
            cards:
              - type: entities
                title: FastPi
                state_color: true
                entities:
                  - entity: binary_sensor.fastpi_up
                    name: Status
                    secondary_info: last-changed
                  - entity: sensor.fastpi_plug_power
                    name: Power draw
                  - type: section
                    label: Uptime
                  - entity: sensor.fastpi_uptime_today
                    name: Today
                  - entity: sensor.fastpi_uptime_24h
                    name: Last 24 h
                  - entity: sensor.fastpi_uptime_today_ratio
                    name: Today (%)
                  - entity: sensor.fastpi_uptime_7d_ratio
                    name: Last 7 days (%)

              - type: entities
                title: Beefy
                state_color: true
                entities:
                  - entity: binary_sensor.beefy_up
                    name: Status
                    secondary_info: last-changed
                  - entity: sensor.beefy_plug_power
                    name: Power draw
                  - type: section
                    label: Uptime
                  - entity: sensor.beefy_uptime_today
                    name: Today
                  - entity: sensor.beefy_uptime_24h
                    name: Last 24 h
                  - entity: sensor.beefy_uptime_today_ratio
                    name: Today (%)
                  - entity: sensor.beefy_uptime_7d_ratio
                    name: Last 7 days (%)

          # -------- Uptime % gauges (last 7 days)
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.fastpi_uptime_7d_ratio
                name: FastPi up (7 days)
                unit: "%"
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 50
                  green: 90
              - type: gauge
                entity: sensor.beefy_uptime_7d_ratio
                name: Beefy up (7 days)
                unit: "%"
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 50
                  green: 90

          # -------- Up/Down timeline (last 7 days)
          - type: history-graph
            title: Up / down (last 7 days)
            hours_to_show: 168
            entities:
              - entity: binary_sensor.fastpi_up
                name: FastPi
              - entity: binary_sensor.beefy_up
                name: Beefy

          - type: markdown
            content: >
              **"Up" = plug drawing more than 3 W.** At or below 3 W the server
              is shut off, sleeping or hibernating (only standby / WOL trickle).
              Uptime totals are computed from the recorded on/off history, so
              the 24 h / 7-day figures fill in as history accumulates after this
              tab was added.
