# "Electricity" dashboard — config-as-code. Registered in configuration.yaml
# under lovelace.dashboards. Edit + save, then just refresh the browser
# (no restart needed for YAML dashboard content changes).
#
# Two plugs: FastPi (fastpi_plug_*) and Beefy (beefy_plug_*), plus the
# combined "Plugs Total ..." household totals from packages/electricity.yaml.
title: Electricity
views:
  # ---------------------------------------------------------------- Overview
  - title: Overview
    path: overview
    icon: mdi:home
    cards:
      - type: glance
        title: Total — both plugs
        columns: 3
        entities:
          - entity: sensor.plugs_total_power
            name: Power
          - entity: sensor.electricity_current_tariff
            name: Tariff
          - entity: sensor.plugs_total_current_cost_rate
            name: Cost/h

      - type: entities
        title: FastPi Plug
        state_color: true
        entities:
          - entity: switch.fastpi_plug
            name: Switch
          - entity: sensor.fastpi_plug_power
            name: Power
          - entity: sensor.fastpi_plug_current_cost_rate
            name: Cost rate
          - entity: sensor.fastpi_plug_temperature
            name: Temperature
          - entity: binary_sensor.fastpi_plug_relay
            name: Relay state

      - type: entities
        title: Beefy Plug
        state_color: true
        entities:
          - entity: switch.beefy_plug
            name: Switch
          - entity: sensor.beefy_plug_power
            name: Power
          - entity: sensor.beefy_plug_current_cost_rate
            name: Cost rate
          - entity: sensor.beefy_plug_temperature
            name: Temperature
          - entity: binary_sensor.beefy_plug_relay
            name: Relay state

      - type: gauge
        entity: sensor.plugs_total_power
        name: Total power draw
        unit: W
        min: 0
        max: 2300
        severity:
          green: 0
          yellow: 1000
          red: 2000

      - type: history-graph
        title: Power (last 24h)
        hours_to_show: 24
        entities:
          - entity: sensor.fastpi_plug_power
            name: FastPi
          - entity: sensor.beefy_plug_power
            name: Beefy
          - entity: sensor.plugs_total_power
            name: Total

  # ----------------------------------------------------------------- Energy
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    cards:
      - type: glance
        title: Live
        columns: 3
        entities:
          - entity: sensor.plugs_total_power
            name: Power
          - entity: sensor.electricity_current_tariff
            name: Tariff
          - entity: sensor.plugs_total_current_cost_rate
            name: Cost/h

      - type: entities
        title: Tariff & price
        entities:
          - entity: sensor.electricity_current_tariff
            name: Current tariff
          - entity: sensor.electricity_current_price
            name: Current price
          - type: divider
          - entity: sensor.electricity_price_high
            name: Price — high (Mon–Sat 06–22)
          - entity: sensor.electricity_price_low
            name: Price — low (nights + all Sun)
          - entity: sensor.electricity_tariff_now
            name: Price period (from EWZ schedule)

      - type: entities
        title: Energy used (kWh)
        entities:
          - type: section
            label: Today
          - entity: sensor.fastpi_plug_energy_today
            name: FastPi
          - entity: sensor.beefy_plug_energy_today
            name: Beefy
          - entity: sensor.plugs_total_energy_today
            name: Total
          - type: section
            label: This week
          - entity: sensor.fastpi_plug_energy_this_week
            name: FastPi
          - entity: sensor.beefy_plug_energy_this_week
            name: Beefy
          - entity: sensor.plugs_total_energy_this_week
            name: Total
          - type: section
            label: This month
          - entity: sensor.fastpi_plug_energy_this_month
            name: FastPi
          - entity: sensor.beefy_plug_energy_this_month
            name: Beefy
          - entity: sensor.plugs_total_energy_this_month
            name: Total
          - type: section
            label: This year
          - entity: sensor.fastpi_plug_energy_this_year
            name: FastPi
          - entity: sensor.beefy_plug_energy_this_year
            name: Beefy
          - entity: sensor.plugs_total_energy_this_year
            name: Total
          - type: section
            label: Lifetime
          - entity: sensor.fastpi_plug_energy
            name: FastPi
          - entity: sensor.beefy_plug_energy
            name: Beefy
          - entity: sensor.plugs_total_energy
            name: Total

      - type: entities
        title: Cost (CHF)
        entities:
          - type: section
            label: Today
          - entity: sensor.fastpi_plug_cost_today
            name: FastPi
          - entity: sensor.beefy_plug_cost_today
            name: Beefy
          - entity: sensor.plugs_total_cost_today
            name: Total
          - type: section
            label: This week
          - entity: sensor.fastpi_plug_cost_this_week
            name: FastPi
          - entity: sensor.beefy_plug_cost_this_week
            name: Beefy
          - entity: sensor.plugs_total_cost_this_week
            name: Total
          - type: section
            label: This month
          - entity: sensor.fastpi_plug_cost_this_month
            name: FastPi
          - entity: sensor.beefy_plug_cost_this_month
            name: Beefy
          - entity: sensor.plugs_total_cost_this_month
            name: Total
          - type: section
            label: This year
          - entity: sensor.fastpi_plug_cost_this_year
            name: FastPi
          - entity: sensor.beefy_plug_cost_this_year
            name: Beefy
          - entity: sensor.plugs_total_cost_this_year
            name: Total

      - type: markdown
        content: >
          **Projected yearly cost — estimate.** Extrapolates the spending rate so
          far this week / this month out to a full year. This is not a bill; early
          in a week or month it is noisy and can swing a lot.

      - type: entities
        title: Projected yearly cost (estimate)
        entities:
          - type: section
            label: From this week's rate
          - entity: sensor.fastpi_plug_cost_year_proj_week
            name: FastPi
          - entity: sensor.beefy_plug_cost_year_proj_week
            name: Beefy
          - entity: sensor.plugs_total_cost_year_proj_week
            name: Total
          - type: section
            label: From this month's rate
          - entity: sensor.fastpi_plug_cost_year_proj_month
            name: FastPi
          - entity: sensor.beefy_plug_cost_year_proj_month
            name: Beefy
          - entity: sensor.plugs_total_cost_year_proj_month
            name: Total

      - type: statistics-graph
        title: Energy per day (kWh)
        chart_type: bar
        period: day
        stat_types:
          - change
        entities:
          - entity: sensor.fastpi_plug_energy
            name: FastPi
          - entity: sensor.beefy_plug_energy
            name: Beefy

      - type: statistics-graph
        title: Energy per month (kWh)
        chart_type: bar
        period: month
        stat_types:
          - change
        entities:
          - entity: sensor.fastpi_plug_energy
            name: FastPi
          - entity: sensor.beefy_plug_energy
            name: Beefy

      - type: statistics-graph
        title: Cost per day (CHF)
        chart_type: bar
        period: day
        stat_types:
          - change
        entities:
          - entity: sensor.fastpi_plug_cost_accumulated
            name: FastPi
          - entity: sensor.beefy_plug_cost_accumulated
            name: Beefy

      - type: statistics-graph
        title: Cost per month (CHF)
        chart_type: bar
        period: month
        stat_types:
          - change
        entities:
          - entity: sensor.fastpi_plug_cost_accumulated
            name: FastPi
          - entity: sensor.beefy_plug_cost_accumulated
            name: Beefy

      - type: markdown
        content: >
          For any custom date range across years — kWh **and** CHF, time-of-use
          priced — use the built-in **Energy** dashboard in the sidebar. Its date
          picker shows exactly the period you select, starting from 0.

      - type: statistics-graph
        title: Power (W) — hourly mean / max
        period: hour
        stat_types:
          - mean
          - max
        entities:
          - entity: sensor.plugs_total_power
            name: Total
