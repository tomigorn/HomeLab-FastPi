# =========================================================
# Services ================================================
# =========================================================
#
# Mounting /var/run/docker.sock into a container grants that container ROOT ON THE
# HOST: the Docker API can start a privileged container, bind-mount / and read or
# write anything, including every other container's secrets. Eight containers here
# had it. That is eight separate paths to total compromise for features as small as
# "restart an unhealthy container".
#
# These proxies sit in front of the socket and expose only the specific API
# endpoints each consumer needs, over TCP on an internal network. They never
# publish a port to the host.
#
# Two profiles, because the consumers differ:
#   socket-proxy-ro       strictly read-only  (POST=0) - monitoring, update checks (network socket_proxy)
#   socket-proxy-autoheal read + start/stop/restart only - autoheal, port-updater (network socket_proxy_heal)
#
# POST=0 is the important one: without it the API cannot create, start, exec into
# or modify anything, so a compromised consumer can only look.
# The autoheal proxy cannot use POST=0 + ALLOW_RESTARTS=1: in 0.3.0 the shipped template denies every POST
# before the ALLOW_* rules are evaluated (measured: restart returns 403). It runs its own allow-list instead.
services:
# #########################################################
# SOCKET PROXY - READ ONLY ################################
# #########################################################
  socket-proxy-ro:
    image: ${SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy}:${SOCKET_PROXY_TAG:-0.3.0}
    container_name: socket-proxy-ro
    restart: unless-stopped
    environment:
      BIND_CONFIG: ":2375"   # IPv4; the internal networks have no IPv6
      # Endpoints granted. Everything not listed defaults to 0 (denied).
      CONTAINERS: 1      # list/inspect containers - telegraf stats, Cup's version checks
      IMAGES: 1          # Cup compares local image digests against registries
      INFO: 1
      VERSION: 1
      # Explicitly denied, listed so the intent is obvious rather than implied:
      POST: 0            # no create/start/stop/exec/restart - read-only means read-only
      EXEC: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    # Non-root; the docker group (991) opens the socket. The image entrypoint renders
    # haproxy.cfg into a root-owned dir, so haproxy runs the shipped template directly:
    # it expands BIND_CONFIG (environment above) itself, like $SOCKET_PATH.
    user: "65047:65047"
    group_add:
      - "991"
    entrypoint: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg.template"]
    read_only: true
    tmpfs:
      - /run:mode=1777,size=1m   # haproxy.pid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

# #########################################################
# SOCKET PROXY - AUTOHEAL (read + restart) ################
# #########################################################
  socket-proxy-autoheal:
    image: ${SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy}:${SOCKET_PROXY_TAG:-0.3.0}
    container_name: socket-proxy-autoheal
    restart: unless-stopped
    environment:
      BIND_CONFIG: ":2375"   # IPv4; the internal networks have no IPv6
      # The allow-list is autoheal-haproxy.cfg, not the template's switches: GET container list/inspect, info,
      # version, and POST /containers/{name}/(start|stop|restart). create, exec, kill, update, logs, images, volumes,
      # networks are 403. Only autoheal (3x) and port-updater, on their own network, can reach it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./autoheal-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - socket_proxy_heal
    # Non-root; the docker group (991) opens the socket. haproxy runs the mounted allow-list directly
    # and expands BIND_CONFIG (environment above) itself, like $SOCKET_PATH.
    user: "65048:65048"
    group_add:
      - "991"
    entrypoint: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    read_only: true
    tmpfs:
      - /run:mode=1777,size=1m   # haproxy.pid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m


# #########################################################
# UNIX BRIDGE (for clients that cannot speak TCP) #########
# #########################################################
# Some clients only accept a unix socket path - Cup's --socket option is
# documented as "the path to the unix socket", and it ignores DOCKER_HOST. Giving
# those clients /var/run/docker.sock back would hand them the real daemon (mounting
# it :ro protects the socket FILE, not the API behind it).
#
# This bridges a unix socket onto socket-proxy-ro, so such a client gets a socket
# that only exposes the read-only endpoint set. The socket lives on a named volume
# that consumers mount instead of /var/run.
  socket-proxy-unix:
    image: alpine/socat:latest
    container_name: socket-proxy-unix
    user: "65027:65027"   # owns the socket_bridge volume; the socket itself is mode 666
    restart: unless-stopped
    command: >-
      UNIX-LISTEN:/sock/docker.sock,fork,unlink-early,mode=666
      TCP:socket-proxy-ro:2375
    volumes:
      - socket_bridge:/sock
    networks:
      - socket_proxy
    depends_on:
      - socket-proxy-ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy:
    name: socket_proxy
    driver: bridge
    # Internal: containers on this network cannot reach the internet. The proxy has
    # no reason to make outbound connections, and neither has anything that talks
    # to it purely for Docker API access.
    internal: true
  # Own network for the restart-capable proxy: only autoheal (mouse, nzb, antivirus) and port-updater join it.
  # External in the other stacks; this project creates it, so bring this project up first.
  socket_proxy_heal:
    name: socket_proxy_heal
    driver: bridge
    internal: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  # Carries the bridged unix socket to consumers that cannot speak TCP.
  socket_bridge:
    name: socket_bridge
