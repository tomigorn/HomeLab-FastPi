global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

# Allow-list for port-updater (docker CLI, addresses containers by name): exactly its four targets. Everything else is 403. To add a container: extend the name group below.
frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/_ping$ }
    http-request allow if METH_HEAD { path -m reg ^(/v[0-9.]+)?/_ping$ }
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/containers/gluetun_mouse/json$ }
    http-request allow if METH_POST { path -m reg ^(/v[0-9.]+)?/containers/(qbittorrent_mouse|mousehole|sabnzbd|gluetun_mouse)/(start|stop|restart)$ }
    http-request deny
    default_backend dockerbackend
