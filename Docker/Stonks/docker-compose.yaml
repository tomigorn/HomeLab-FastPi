# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Stonks ##################################################
# #########################################################
  stonks:
    image: stonks:latest
    container_name: stonks
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
