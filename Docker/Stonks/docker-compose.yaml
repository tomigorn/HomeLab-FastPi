# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Stonks ##################################################
# #########################################################
  stonks:
    image: stonks:latest
    container_name: stonks
    user: "65007:65007"
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
