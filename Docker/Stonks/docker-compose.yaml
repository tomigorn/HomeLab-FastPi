# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Stonks ##################################################
# #########################################################
  stonks:
    image: stonks:latest
    container_name: stonks
    user: "65007:65007"
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    volumes:
      - ./data:/data
      # pydantic-settings reads /app/.env; it holds only the secrets
      - ./secrets/stonks.env:/app/.env:ro
    networks:
      - traefik_stonks   # shared only with Traefik (H-2)

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_stonks:
    external: true   # defined in Docker/Traefik/docker-compose.yaml

# =========================================================
# Volumes =================================================
# =========================================================
