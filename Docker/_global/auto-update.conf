# Nightly image auto-update (scripts/auto_update.py, auto-update.timer 03:10). Doc: Server/4-Security-Monitoring/auto-updates.md
# Only the digest behind the tag written in the repo moves. Not listed = not touched: LoyaltyCards*, bitwarden (parked), Jenkins (stopped). Local builds (build:) are never pulled: they show as local_build and are rebuilt weekly by rebuild-local (rebuild-local.conf).
# Columns: tier  project  services(-=all)  backups for update-project.sh (-=none)  functional check (shell, -=container checks only)
# tier: auto = applied after the cool-down, verified, rolled back | notify = Telegram with the command | edge = notify, owner's yes needed | edge-auto = owner switched it on

auto    Claude-Mockups          -  -  docker exec claude-mockups wget -qO /dev/null http://127.0.0.1/_assets/answer.js && docker exec claude-mockups wget -qO /dev/null http://127.0.0.1/_inbox/health
auto    M4b-Merge-Dashboard     -  -  curl -sf -o /dev/null http://192.168.1.2:8099/
auto    DDNS                    -  -  docker logs duckdns 2>&1 | grep -q 'request at .* successful' && docker logs noip 2>&1 | grep -q 'checking ip again'
auto    sbb-easyride-taxreport  -  -  curl -skf -o /dev/null https://127.0.0.1:8083/
auto    Wiki                    -  -  docker exec wiki wget -qO /dev/null http://127.0.0.1/
auto    Server-Specs            -  -  docker exec server-specs wget -qO /dev/null http://127.0.0.1/
auto    Notes                   -  -  docker exec notes wget -qO /dev/null http://127.0.0.1/
auto    Cup                     -  -  curl -sf -m 30 http://172.24.0.1:8000/api/v3/json | python3 -c 'import json,sys; sys.exit(not json.load(sys.stdin)["images"])'
# Exporters only (stateless, pinned): each must be scraped up by Prometheus again after the recreate. The core of the stack (the alert path itself) stays notify.
auto    grafana                 node-exporter,blackbox-exporter,blackbox-exporter-wan,json-exporter  -  /home/pi/Projects/Docker/grafana/scripts/exporters-scraped.sh

# Stateful or DB-migrating: a new version may migrate data one way, so a human runs the command (it backs up first). Bind-path backups use sudo tar: they work by hand, not under the service (NoNewPrivileges), so an auto row backs up volumes only.
notify  audiobookshelf          -  ./audiobookshelf/config  -
notify  Home-Assistant          -  ./config  -
notify  grafana                 prometheus,alertmanager,grafana,influxdb,telegraf  vol:monitoring__grafana_grafana_data,vol:monitoring__grafana_influxdb_data  -
notify  mouse                   -  /mnt/seagate-red/qbittorrent/config,/mnt/seagate-red/sabnzbd/config,vol:mouse_mousehole,vol:mouse_gluetun-data  -
notify  antivirus               autoheal-antivirus  -  -
notify  Docker-Socket-Proxy     -  -  -
notify  Portainer               -  vol:docker_portainer_data  -
notify  Audiobook-Requests      -  ./config,./data  -

# Custom-built images (build:, or a local tag): nothing to pull, the base is refreshed by the weekly rebuild (rebuild-local.conf). Reported as local_build.
notify  Avatar-Picker           -  -  -
notify  Activity                -  -  -
notify  Tech-Radar              -  -  -
notify  M4b-Auto-Merge          -  -  -
notify  BackdropCarousel        -  -  -
notify  Stonks                  -  -  -
notify  LanguageTool/Raspi      -  -  -

# Edge, SSO, DNS, VPN (machine.md: owner's yes). cloudflared + adguard switched to edge-auto by the owner 2026-10-25; cloudflared is checked through the real public path (Cloudflare), not the LAN shortcut. Authentik migrates its DB on upgrade: it stays notify for good, never edge-auto.
edge    Authentik               -  vol:authentik_database-pg18  /home/pi/Projects/Docker/Authentik/scripts/canary-verify.sh
edge    Traefik                 -  -  curl -sf -o /dev/null https://home.holy-grail.ch/
edge-auto adguard               -  -  dig +short +time=3 sso.holy-grail.ch @192.168.1.2 | grep -q .
edge-auto cloudflared           -  -  curl -sf -o /dev/null --resolve home.holy-grail.ch:443:$(dig +short @1.1.1.1 home.holy-grail.ch | head -1) https://home.holy-grail.ch/
edge    WireguardVPN            -  ./wg-easy-v15  -
edge    CrowdSec                -  vol:crowdsec_crowdsec_data,vol:crowdsec_crowdsec_config  -
edge    Beefy-Waker             -  -  -
edge    Tower-Waker             -  -  -
