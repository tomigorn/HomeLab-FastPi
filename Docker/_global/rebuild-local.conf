# Weekly rebuild of the locally built images (scripts/rebuild_local.py, rebuild-local.timer 23:23). Doc: Server/4-Security-Monitoring/auto-updates.md "Local builds".
# One [[image]] per project. Keys:
#   project   dir under Docker/, or an absolute path (another repo's compose)
#   day       Mon..Sun: the night it runs (one or two per night, heavy ones alone)
#   services  compose services to rebuild (default: every service with build:)
#   build     own build command instead of "docker compose build --pull --no-cache <services>"; context = where its Dockerfile is
#   unittest  shell command run in the new image (first service): network none, user 65534, the project dir read-only at /src
#   test      host shell command; $IMAGE and $IMAGE_<SERVICE> are the new image ids
#   check     functional check after the recreate (update-project.sh CHECK); the post-update check runs on top when post-update.d/<dir>.sh exists
#   backups   update-project.sh backup paths (none needed: a rebuild does not change our code, so nothing migrates)
#   guard     shell command run before the build and again before the recreate; non-zero = deferred to next week, no alert (last output line = reason)
# Not here: LoyaltyCards-Sync (parked), Jenkins (stopped). Pulled images (caddy, node, ...) are auto-update.conf's.

[[image]]
project = "Tower-Waker"
day = "Mon"
# cargo test runs in the build; the black-box suite runs the new binary against fakes (python:3.13-alpine via ctest.sh)
test = "bash tests/blackbox/run.sh new"
check = "curl -sf -o /dev/null http://192.168.1.2:9002/status"

[[image]]
project = "Beefy-Waker"
day = "Mon"
unittest = "python -m unittest discover -q -s app && python -m unittest discover -q -s night-downloads-wake"
check = "curl -sf -o /dev/null http://192.168.1.2:9001/status"

[[image]]
project = "Avatar-Picker"
day = "Tue"
# scratch image (no shell): cargo test runs in the build; this is the black-box suite against the new image's binary with a fake Authentik
test = "tests/blackbox/run.sh image $IMAGE 2>&1 | tail -1 | grep -qx OK"
check = "docker exec avatar-picker /avatar-picker healthcheck"

[[image]]
project = "M4b-Auto-Merge"
day = "Wed"
# cargo test runs in the build; this is the black-box suite (~3 min) against the new binary, plus the orchestrator's tools
unittest = "WATCHER=/usr/local/bin/m4b-auto-merge python3 tests/blackbox/test_blackbox.py >/tmp/bb.log 2>&1; rc=$?; tail -1 /tmp/bb.log; [ $rc = 0 ] && command -v python3 ffmpeg ffprobe rsync ssh >/dev/null"
check = "docker top m4b-auto-merge | grep -q /usr/local/bin/m4b-auto-merge"

[[image]]
project = "mouse"
day = "Wed"
services = ["port-updater"]
unittest = "sh -n port-updater/legacy/port-updater.sh && sh -n port-updater/legacy/entrypoint.sh && python3 -c 'import ast; ast.parse(open(\"port-updater/legacy/web-server.py\").read())' && command -v curl docker jq >/dev/null"
check = "docker top port_updater | grep -q web-server.py"

[[image]]
project = "antivirus"
day = "Thu"
services = ["clamav", "virustotal"]
unittest = "sh /src/tests/test_scan.sh"
test = "docker run --rm --network none --entrypoint python \"$IMAGE_VIRUSTOTAL\" -c 'import vt'"
check = "docker exec clamav pgrep freshclam"

[[image]]
project = "LanguageTool/Raspi"
day = "Fri"
# scripts/test.sh (every rule and spelling) runs as the post-update check, against the recreated container
check = "docker exec languagetool curl -sf -o /dev/null --data 'language=en-GB&text=This is a test.' http://localhost:8010/v2/check"

[[image]]
project = "BackdropCarousel"
day = "Sat"
# scratch image (no shell): cargo test runs in the build; this is the black-box suite against the new image's binary
test = "tests/blackbox/run.sh image $IMAGE 2>&1 | tail -1 | grep -qx OK"
check = "docker exec backdrop-carousel /backdrop-carousel healthcheck"

[[image]]
project = "Stonks"
day = "Sat"
services = ["stonks"]
build = "docker build --pull --no-cache -q -t stonks:latest /home/pi/Documents/development/Stonks"
context = "/home/pi/Documents/development/Stonks"
# pytest from the code repo's venv, appended after the image's own packages
test = "cd /home/pi/Documents/development/Stonks && docker run --rm --network none --user 65534:65534 -e PYTHONDONTWRITEBYTECODE=1 -v \"$PWD:/src:ro\" -v \"$PWD/.venv/lib/python3.11/site-packages:/opt/devtools:ro\" -w /src --entrypoint python \"$IMAGE\" -c \"import sys; sys.path.append('/opt/devtools'); import pytest; sys.exit(pytest.main(['-q', '-p', 'no:cacheprovider']))\""
check = "docker exec stonks python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).read())\""

[[image]]
project = "/home/pi/Documents/development/WG-Chores"
day = "Sun"
check = "curl -sf -o /dev/null --resolve wg-aemtli.ddns.net:8443:127.0.0.1 https://wg-aemtli.ddns.net:8443/"
