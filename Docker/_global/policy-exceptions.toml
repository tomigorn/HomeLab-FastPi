# --- Moving tag kept: auto_update.py only follows the digest behind the tag in the repo and never bumps a version or digest pin, so a pin would freeze the image
[[exception]]
project = "DDNS"
service = "duckdns"
rule = "image_pinned"
reason = "auto tier: auto-update follows the moving tag (lsio weekly rebuilds); a pin would freeze it. Version pin waits for Renovate, backlog: Update automation for everything"

[[exception]]
project = "DDNS"
service = "noip"
rule = "image_pinned"
reason = "auto tier: auto-update follows the moving tag; a pin would freeze it. Version pin waits for Renovate, backlog: Update automation for everything"

[[exception]]
project = "Stonks"
service = "stonks"
rule = "image_pinned"
reason = "local build, never pulled: rebuild-local.conf and Stonks/redeploy.sh tag stonks:latest; a :local rename also changes the Stonks repo's tests and README"

[[exception]]
project = "WG-Chores-Demo"
service = "wg-chores-demo"
rule = "image_pinned"
reason = "auto tier, own image (latest + vX.Y.Z on Docker Hub): auto-update follows the moving tag; a pin would freeze it. Version pin waits for Renovate, backlog: Update automation for everything"

[[exception]]
