# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Notes ###################################################
# #########################################################
  notes:
    image: caddy:alpine
    container_name: notes
    user: "65059:65059"
    mem_limit: 64m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # bind :80 as non-root
    environment:
      - XDG_CONFIG_HOME=/tmp
      - XDG_DATA_HOME=/tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NOTES_DIR}/www:/srv:ro
    tmpfs:
      - /tmp
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
