# #########################################################
# Services ################################################
# #########################################################
services:
# ---------------------------------------------------------
# LoyaltyCards --------------------------------------------
# ---------------------------------------------------------
  loyalty-cards:
    image: tomigorn/loyalty-cards:${IMAGE_TAG}
    container_name: loyalty-cards
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - traefik_loyalty_cards   # shared only with Traefik (H-2)

# #########################################################
# Networks ################################################
# #########################################################
networks:
  traefik_loyalty_cards:
    external: true   # defined in Docker/Traefik/docker-compose.yaml
