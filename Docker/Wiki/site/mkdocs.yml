site_name: Holy Grail Guide
site_description: How to use the Holy Grail apps
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.instant, navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy, content.tabs.link]
  icon: {logo: material/castle}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Start:
      - Home: index.md
      - Getting started: getting-started.md
      - How to use the media stack: apps/media-guide.md
      - What's new: whats-new.md
  - Watching:
      - Watching (Jellyfin): apps/jellyfin.md
      - Home screen: apps/jellyfin-home.md
      - Moonfin app (TV & phone): apps/moonfin.md
      - Skip intro & credits: apps/skip-buttons.md
      - Audio & subtitles: audio-subtitles.md
  - Requesting:
      - Films & series: apps/requests.md
      - Audiobooks: apps/audiobook-requests.md
  - Audiobooks:
      - Listening (Audiobookshelf): apps/audiobookshelf.md
  - Your account:
      - Profile picture: apps/profile-picture.md
      - Watch history (Tracker): apps/tracker.md
  - About:
      - Our machines: apps/machines.md
      - Help & FAQ: help.md
extra_css:
  - assets/css/nav.css
  - assets/css/toc.css
