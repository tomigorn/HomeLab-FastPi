site_name: Holy Grail Guide
site_description: How to use the Holy Grail apps
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.instant, navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy, content.tabs.link]
  icon: {logo: material/castle}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Watching (Jellyfin): apps/jellyfin.md
  - Requesting films & series: apps/requests.md
  - Audio & subtitles: audio-subtitles.md
  - Audiobooks: apps/audiobookshelf.md
  - Requesting audiobooks: apps/audiobook-requests.md
  - Watch history (Tracker): apps/tracker.md
  - Profile picture: apps/profile-picture.md
  - Our machines: apps/machines.md
  - Help & FAQ: help.md
