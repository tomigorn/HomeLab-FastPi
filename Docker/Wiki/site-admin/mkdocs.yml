site_name: Holy Grail Admin Guide
site_description: Admin steps for Holy Grail
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.instant, navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy, content.tabs.link]
  icon: {logo: material/castle}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Invite a friend: invite-a-friend.md
  - Give or remove access: access.md
  - Disable or remove a person: disable-person.md
  - Lost authenticator or password: recovery.md
