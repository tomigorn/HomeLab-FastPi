http:
  middlewares:
    secure-headers:
      headers:
        # HSTS – force HTTPS for 1 year including subdomains
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # Prevent MIME sniffing
        contentTypeNosniff: true
        # Referrer policy – send origin only on cross-origin requests
        referrerPolicy: "strict-origin-when-cross-origin"
        # Permissions policy – deny all browser APIs
        permissionsPolicy: "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(), xr-spatial-tracking=()"
        # Frame options
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        # CSP – adjust per app needs
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'"
          # Hide the backend server signature
          Server: ""

  routers:
    # security scan http headers with https://securityheaders.com/

    # HTTPS router — HTTP is redirected globally at the entrypoint level
    whoami:
      rule: "Host(`hephaestus-jenkins.duckdns.org`)"
      entryPoints: ["websecure"]
      service: "whoami"
      middlewares: ["secure-headers"]
      tls: {}

  services:

    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"
        passHostHeader: true
