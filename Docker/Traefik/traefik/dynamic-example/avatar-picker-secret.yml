# GITIGNORED - holds the shared secret Traefik adds to picker requests, so only
# requests that passed Authentik forward auth (via Traefik) are accepted by the
# container. Template: dynamic-example/avatar-picker-secret.yml
http:
  middlewares:
    avatar-picker-secret:
      headers:
        customRequestHeaders:
          X-Picker-Secret: "<contents of Docker/Avatar-Picker/secrets/picker_secret>"
