# ─────────────────────────────────────────────────────────────────────────
# EXAMPLE / TEMPLATE for dynamic/languagetool-token.yml (the real file is
# gitignored because it contains live access tokens).
#
# LanguageTool is served on lang-tool.ddns.net (direct ingress + Let's Encrypt,
# see languagetool.yml). The browser add-on CANNOT send Basic-Auth, so each
# person gets an unguessable token in the URL path. One router per person —
# the router NAME is the human label (Person-Device-Client). Revoke someone by
# deleting their router + middleware.
#
# TO ADD / LIST / REVOKE A PERSON: use the helper (prints the link once, keeps a backup,
# Traefik reloads the edited file by itself):
#   Docker/LanguageTool/Raspi/scripts/lt-token.py add|list|remove <Person-Device>
# See Docker/LanguageTool/README.md "Install and new users". The extension appends
# "/check", so requests arrive as /lt-<token>/check and the ReplacePathRegex maps
# them to /v2/check.
#
# Priority 5: below languagetool-preflight (10, answers OPTIONS). TLS via the
# Let's Encrypt HTTP challenge (le), matching wg-aemtli.ddns.net.
# ─────────────────────────────────────────────────────────────────────────
http:
  routers:
    languagetool-token-<LABEL>:
      rule: "Host(`lang-tool.ddns.net`) && PathPrefix(`/REPLACE_WITH_TOKEN`)"
      entryPoints: ["websecure", "langtool"]
      priority: 5
      service: languagetool           # defined in languagetool.yml
      middlewares:
        - languagetool-token-strip-<LABEL>
        - languagetool-secure-headers # defined in languagetool.yml
      tls:
        certResolver: le

  middlewares:
    languagetool-token-strip-<LABEL>:
      # /REPLACE_WITH_TOKEN/check         -> /v2/check
      # /REPLACE_WITH_TOKEN/api/v2/check  -> /v2/check
      # /REPLACE_WITH_TOKEN/v2/languages  -> /v2/languages
      replacePathRegex:
        regex: "^/REPLACE_WITH_TOKEN/(?:api/)?(?:v2/)?(.*)"
        replacement: "/v2/$1"
