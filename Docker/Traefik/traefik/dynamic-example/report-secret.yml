# GITIGNORED - holds the shared secret Traefik adds to report.holy-grail.ch requests, so only
# requests that passed Authentik forward auth (via Traefik) are accepted by beefy's download-now.
# Real file: beefy `~/Projects/Docker/Seerr/scripts/report-setup.sh --print-for-traefik > traefik/dynamic/report-secret.yml` (mode 600).
http:
  middlewares:
    report-secret:
      headers:
        customRequestHeaders:
          X-Report-Secret: "<contents of beefy Docker/Seerr/secrets/report/secret>"
