# wg-easy Admin Panel - https://wg-easy.holy-grail.ch, LAN/VPN only (local-networks@file;
# not published through the Cloudflare tunnel, AdGuard answers *.holy-grail.ch locally).
# Login is Authentik OIDC (Docker/WireguardVPN/docker-compose.yaml). wg-easy builds the OIDC
# redirect URI from the request Host header and Authentik accepts only this hostname's
# /api/auth/oidc/{callback,link}, so the UI is served on this one hostname only (the old
# wg-easy.fastpi.homelab :8080 / self-signed routers are gone).
http:
  routers:
    wg-easy:
      rule: "Host(`wg-easy.holy-grail.ch`)"
      entryPoints: ["websecure"]
      service: wg-easy
      middlewares:
        - local-networks@file
      tls:
        certResolver: cloudflare
  services:
    wg-easy:
      loadBalancer:
        servers:
          - url: "http://WireGuard-VPN:51821"
