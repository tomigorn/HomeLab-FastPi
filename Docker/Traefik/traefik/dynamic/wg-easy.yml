http:
  routers:
    wg-easy:
      rule: "Host(`wg-easy.fastpi.homelab`)"
      entryPoints: ["internal"]
      service: wg-easy
      middlewares:
        - local-networks@file

    # wg-easy v15 only issues its login cookie over HTTPS (Secure flag), so the UI
    # is served on websecure too: https://wg-easy.fastpi.homelab - LAN/VPN only,
    # Traefik's default self-signed cert (.homelab has no public cert; the browser
    # warns once). The plain-HTTP :8080 router above stays for the old bookmark.
    wg-easy-https:
      rule: "Host(`wg-easy.fastpi.homelab`)"
      entryPoints: ["websecure"]
      service: wg-easy
      middlewares:
        - local-networks@file
      tls: {}
  services:
    wg-easy:
      loadBalancer:
        servers:
          - url: "http://WireGuard-VPN:51821"
