http:
  routers:
    wg-easy:
      rule: "Host(`wg-easy.fastpi.homelab`)"
      entryPoints: ["internal"]
      service: wg-easy
      middlewares:
        - wg-easy-ipallowlist

  middlewares:
    wg-easy-ipallowlist:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "::1/128"
          - "192.168.1.0/24"   # LAN
          - "172.24.0.0/16"    # traefik_proxy bridge — covers LAN and VPN traffic NATted by Docker

  services:
    wg-easy:
      loadBalancer:
        servers:
          - url: "http://WireGuard-VPN:51821"
