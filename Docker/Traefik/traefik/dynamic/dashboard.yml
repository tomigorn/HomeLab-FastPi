http:
  routers:
    # SSO only (2026-10-19): there is no local basicAuth login any more.
    # Recovery when Authentik is down = server shell: read `docker logs traefik` /
    # the access log, or temporarily drop a router file into dynamic/ (the file
    # provider watches the directory, no restart); see Docker/Authentik/README.md.
    # https://traefik.holy-grail.ch - LAN+VPN only, Authentik group homelab-admins.
    # Authentik objects (provider traefik-dashboard-proxy, app traefik-dashboard, group
    # binding) come from Docker/Authentik/scripts/provision-admin-sso.py.
    traefik-dashboard-sso:
      rule: "Host(`traefik.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 10
      service: api@internal
      middlewares:
        - local-networks@file
        - authentik@file
        - traefik-dashboard-root
      tls:
        certResolver: cloudflare
    # Outpost callback path: must reach Authentik, so no authentik@file here, and a
    # higher priority than the router above (see authentik-forwardauth.yml).
    traefik-dashboard-sso-outpost:
      rule: "Host(`traefik.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 15
      service: authentik@file
      middlewares:
        - local-networks@file
      tls:
        certResolver: cloudflare

  middlewares:
    # The API service only serves /api and /dashboard/; send the bare host there.
    traefik-dashboard-root:
      redirectRegex:
        regex: "^https://traefik\\.holy-grail\\.ch/?$"
        replacement: "https://traefik.holy-grail.ch/dashboard/"
