http:
  routers:
    dashboard:
      rule: "Host(`fastpi.homelab`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      entryPoints: ["internal"]
      service: api@internal
      middlewares:
        - local-networks@file
        - dashboard-auth

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /dynamic/dashboard.users

