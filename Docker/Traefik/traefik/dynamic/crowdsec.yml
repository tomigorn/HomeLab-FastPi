# CrowdSec bouncer middleware.
#
# Attached to the websecure entrypoint (see traefik.yml), so it covers EVERY
# public route automatically - including services added later. Per-router
# attachment was rejected: it silently misses anything new.
#
# The LAPI key is read from a FILE, not inlined. Dynamic config files are
# committed, and a key pasted here would be published - which is exactly how the
# OAuth2 client secrets leaked. traefik/secrets/ is gitignored.
http:
  middlewares:
    crowdsec:
      plugin:
        crowdsec-bouncer:
          enabled: true
          # stream = keep the whole decision list in memory, synced from the LAPI
          # every updateIntervalSeconds. Chosen (2026-10-19) over `live` for
          # FAILURE BEHAVIOUR, not speed:
          #   live:   every uncached IP is looked up per request; if the LAPI does
          #           not answer, the plugin returns "banned" -> 403 for ALL external
          #           visitors (fail CLOSED; read in bouncer.go handleNoStreamCache).
          #           A CrowdSec restart or a failed update = public edge down.
          #           updateMaxFailure does not apply to live mode.
          #   stream: a failed sync keeps the last known list; with
          #           updateMaxFailure -1 ("never block", per the plugin README)
          #           known attackers stay blocked and everyone else gets through
          #           while CrowdSec is down (fail OPEN on stale data).
          # Trade-off accepted: during a CrowdSec outage NEW bans are not enforced;
          # the CrowdSecDown alert (grafana/prometheus/rules/crowdsec.yml) says so.
          # Cost: a new ban takes up to updateIntervalSeconds to reach Traefik.
          crowdsecMode: stream
          updateIntervalSeconds: 60
          updateMaxFailure: -1
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiKeyFile: /secrets/crowdsec_lapi_key
          # All external traffic arrives via the Cloudflare tunnel, so the real
          # client is in X-Forwarded-For and the packet source is always the docker
          # gateway. Without this the plugin would judge - and could ban - the
          # tunnel itself, taking every service offline.
          forwardedHeadersTrustedIPs:
            - 172.24.0.1/32
          # Never ban the LAN or docker networks. A false positive here would lock
          # administration out of the machine.
          clientTrustedIPs:
            - 192.168.0.0/16
            - 172.16.0.0/12
            - 10.0.0.0/8
            - 127.0.0.1/32
