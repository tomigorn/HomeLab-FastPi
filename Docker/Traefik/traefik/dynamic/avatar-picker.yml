# Avatar picker (Docker/Avatar-Picker).
#   - avatars.holy-grail.ch: Authentik forward auth (every Authentik user), plus a
#     shared-secret header (avatar-picker-secret@file, gitignored) so the container
#     only trusts requests that came through this router.
#   - sso.holy-grail.ch/avatar-img/*: the avatar image URLs stored in Authentik. Two
#     routers for the same path; each sets X-Avatar-Access (overwriting whatever the
#     client sent) and the container decides:
#       avatar-img-local (priority 100): LAN + VPN, header "lan" = every image, no login.
#         Jellyfin (beefy) and Nextcloud (tower) fetch the images server-side from the
#         LAN; they must live on the IdP host because Jellyfin's OIDC plugin only
#         accepts private addresses for the issuer host. The ClientIP() part of the rule
#         mirrors local-networks@file: Traefik never falls through to the next router
#         once a rule matched, so the client IP has to be part of the match itself.
#       avatar-img-public (priority 90): everyone else, header "gated". A picked image
#         (someone's attributes.avatar) is public, so the login page can show the
#         pending user's avatar before login; any other image needs an Authentik login
#         session, which the container checks against Authentik's /api/v3/core/users/me/
#         with the request's authentik_session cookie. No header = gated (fail closed).
http:
  routers:
    avatar-img-local:
      rule: "Host(`sso.holy-grail.ch`) && PathPrefix(`/avatar-img/`) && (ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`192.168.1.0/24`) || ClientIP(`10.24.5.5/32`))"
      entryPoints: ["websecure"]
      priority: 100
      service: avatar-picker
      middlewares:
        - local-networks@file
        - avatar-img-lan
        - avatar-img-strip
      tls:
        certResolver: cloudflare
    avatar-img-public:
      rule: "Host(`sso.holy-grail.ch`) && PathPrefix(`/avatar-img/`)"
      entryPoints: ["websecure"]
      priority: 90
      service: avatar-picker
      middlewares:
        - avatar-img-gated
        - avatar-img-strip
        - default-rate-limit@file
      tls:
        certResolver: cloudflare
    avatar-picker-outpost:
      rule: "Host(`avatars.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare
    avatar-picker:
      rule: "Host(`avatars.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: avatar-picker
      middlewares:
        - authentik@file
        - avatar-picker-secret@file
        - default-rate-limit@file
      tls:
        certResolver: cloudflare
  middlewares:
    avatar-img-lan:
      headers:
        customRequestHeaders:
          X-Avatar-Access: "lan"
    avatar-img-gated:
      headers:
        customRequestHeaders:
          X-Avatar-Access: "gated"
    avatar-img-strip:
      stripPrefix:
        prefixes:
          - "/avatar-img"
  services:
    avatar-picker:
      loadBalancer:
        servers:
          - url: "http://avatar-picker:8080"
