http:
  routers:
    # Authentik outpost callback path: no middlewares, higher priority (see cup.yml).
    server-specs-outpost:
      rule: "Host(`specs.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    server-specs:
      rule: "Host(`specs.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: server-specs
      middlewares:
        - authentik@file
        - default-rate-limit@file
        - server-specs-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # NOTE: authentication is Authentik forward auth (authentik@file); any logged-in user, no group binding.
    server-specs-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        contentSecurityPolicy: "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:"
        customResponseHeaders:
          Server: ""

  services:
    server-specs:
      loadBalancer:
        servers:
          - url: "http://server-specs:80"
        passHostHeader: true
