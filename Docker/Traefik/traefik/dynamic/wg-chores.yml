# Old WG-Chores v1 URL wg-aemtli.ddns.net: since 2026-11-15 a permanent redirect to WG Chores v2 (wg-chores.holy-grail.ch). Direct ingress, WAN 443 -> fastpi:8443 = langtool entrypoint (real-ip + crowdsec there).
# Cert: Let's Encrypt HTTP challenge (le), as lang-tool.ddns.net. v1 containers are stopped (data kept); rollback: git history of this file + docker start wg-chores-app.
http:
  routers:
    wg-chores:
      rule: "Host(`wg-aemtli.ddns.net`)"
      entryPoints: ["langtool"]
      priority: 1
      service: noop@internal
      middlewares:
        - default-rate-limit@file
        - wg-chores-to-v2
      tls:
        certResolver: le

  middlewares:
    wg-chores-to-v2:
      redirectRegex:
        regex: ".*"
        replacement: "https://wg-chores.holy-grail.ch/"
        permanent: true
