http:
  routers:
    # CORS preflight: browsers send an UNAUTHENTICATED OPTIONS before any
    # cross-origin request that carries an Authorization header. Basic-auth
    # would 401 that preflight (and LanguageTool itself answers OPTIONS with
    # 400 + no Access-Control-Allow-Headers), so a dedicated higher-priority
    # router answers preflights via the CORS middleware WITHOUT auth. Real
    # GET/POST requests still hit the authenticated router below.
    languagetool-preflight:
      rule: "Host(`languagetool.holy-grail.ch`) && Method(`OPTIONS`)"
      entryPoints: ["websecure"]
      priority: 10
      service: languagetool
      middlewares:
        - languagetool-cors
      tls:
        certResolver: cloudflare

    languagetool:
      rule: "Host(`languagetool.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: languagetool
      middlewares:
        - languagetool-basic-auth
        - languagetool-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # Handles CORS preflight responses. Traefik answers the OPTIONS request
    # itself (200) with these headers, so the backend is never reached.
    # LT already sends "Access-Control-Allow-Origin: *" on real responses,
    # so CORS is intentionally NOT added to the authenticated router to
    # avoid a duplicate ACAO header.
    languagetool-cors:
      headers:
        accessControlAllowMethods: ["GET", "POST", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type"]
        accessControlAllowOriginList: ["*"]
        accessControlMaxAge: 86400
        addVaryHeader: true

    languagetool-basic-auth:
      basicAuth:
        usersFile: "/dynamic/languagetool.users"
        realm: "LanguageTool"
        # Browser extension stores credentials internally and re-sends
        # them on every request; users see the password prompt once
        # per device when they paste credentials into the extension.
        removeHeader: true

    languagetool-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          # LT is an API; deny embedding and disable scripts via CSP.
          Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"
          # LT itself sends "Access-Control-Allow-Origin: *" on real
          # responses (started with --allow-origin '*'), so the browser
          # extension can call it cross-origin.
          Server: ""

  services:
    languagetool:
      loadBalancer:
        servers:
          - url: "http://languagetool:8010"
        passHostHeader: true
