http:
  routers:
    # LanguageTool is served ONLY on lang-tool.ddns.net (direct ingress + Let's
    # Encrypt HTTP challenge, same as wg-aemtli). Access is exclusively via
    # per-person secret-token URLs (gitignored languagetool-token.yml). There is
    # intentionally NO basic-auth / bare door: a request without a valid token
    # path matches no router and returns 404. The languagetool.holy-grail.ch
    # route (Cloudflare tunnel + basic-auth) was retired 2026-08-24 — the
    # Cloudflare dashboard DNS/tunnel entry for that hostname can be removed
    # separately.
    #
    # CORS preflight: the browser add-on sends an unauthenticated OPTIONS before
    # its cross-origin POST. This higher-priority router answers it via the CORS
    # middleware; real POSTs fall through to the token routers (priority 5).
    languagetool-preflight:
      rule: "Host(`lang-tool.ddns.net`) && Method(`OPTIONS`)"
      entryPoints: ["websecure"]
      priority: 10
      service: languagetool
      middlewares:
        - languagetool-cors
      tls:
        certResolver: le

  middlewares:
    # Traefik answers the OPTIONS preflight itself (200) with these headers, so
    # the backend is never reached. LT sends "Access-Control-Allow-Origin: *" on
    # real responses (started with --allow-origin '*'), so CORS is NOT added to
    # the token routers, to avoid a duplicate ACAO header.
    languagetool-cors:
      headers:
        accessControlAllowMethods: ["GET", "POST", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type"]
        accessControlAllowOriginList: ["*"]
        accessControlMaxAge: 86400
        addVaryHeader: true

    languagetool-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          # LT is an API; deny embedding and disable scripts via CSP.
          Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"
          Server: ""

  services:
    languagetool:
      loadBalancer:
        servers:
          - url: "http://languagetool:8010"
        passHostHeader: true
