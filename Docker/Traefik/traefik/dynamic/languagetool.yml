http:
  routers:
    languagetool:
      rule: "Host(`languagetool.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: languagetool
      middlewares:
        - languagetool-basic-auth
        - languagetool-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    languagetool-basic-auth:
      basicAuth:
        usersFile: "/dynamic/languagetool.users"
        realm: "LanguageTool"
        # Browser extension stores credentials internally and re-sends
        # them on every request; users see the password prompt once
        # per device when they paste credentials into the extension.
        removeHeader: true

    languagetool-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          # LT is an API; deny embedding and disable scripts via CSP.
          Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"
          # The browser extension needs to call this from arbitrary
          # pages, so allow cross-origin XHR via Access-Control-*
          # (LT itself already sends "Access-Control-Allow-Origin: *"
          # because it's started with --allow-origin '*').
          Server: ""

  services:
    languagetool:
      loadBalancer:
        servers:
          - url: "http://languagetool:8010"
        passHostHeader: true
