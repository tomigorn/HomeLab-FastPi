# Jellyfin on beefy.
#
# https://jellyfin.holy-grail.ch/   (public via the Cloudflare tunnel)
#
# ============================================================================
# WHY THERE IS NO `authentik@file` HERE - read before "fixing" it
# ============================================================================
# Jellyfin is the one service that must NOT sit behind forward auth. Its native
# clients - Android TV, Fire TV, iOS, Android, Kodi - are not browsers. They cannot
# render an Authentik login page, cannot follow an interactive OAuth redirect, and
# have no cookie jar to carry the resulting session. Put forwardAuth here and every
# non-browser client breaks instantly and permanently; the web UI keeps working,
# which makes the breakage look like a client bug rather than a proxy decision.
#
# Authentik's own documentation says the same thing: integrate Jellyfin by OIDC,
# not by proxy/forward auth.
#
# So SSO for Jellyfin is done INSIDE Jellyfin, via the "OIDC Authentication"
# plugin (edmogeor/jellyfin-plugin-oidc) pointed at an Authentik OAuth2/OpenID
# provider. See Docker/Traefik/docs/2026-10-06-authentik-sso.md and the Jellyfin
# README in HomeLab-BeefyServer.
#
# ============================================================================
# SSO ONLY: NO PASSWORD LOGIN, FOR ANYONE (2026-10-18)
# ============================================================================
# Like every other homelab app, Jellyfin is "Sign In with Holy Grail" only:
#   1. Server side, in Jellyfin: the plugin's "Local password sign-in" is
#      "Disable for all users", which swaps every user (including the local
#      `admin`) to the plugin's password-disabled auth provider. A correct
#      password is refused. The plugin also hides the password form.
#   2. Here, defence in depth: `jellyfin-password-login-block` answers 403 to
#      every password endpoint for EVERY client, LAN and VPN included - there is
#      deliberately no break-glass over the web. Recovery when Authentik is down
#      is server-shell only (Jellyfin README, "SSO only / recovery").
# Quick Connect is untouched: /QuickConnect/* and /Users/AuthenticateWithQuickConnect
# do not match the block, and TV/phone apps sign in that way.
#
# ============================================================================
# ANONYMOUS WAKES: browsers sign in first, apps still wake (2026-10-11)
# ============================================================================
# Every other beefy route authenticates BEFORE the wake gate, so only a logged-in
# user can boot the machine. Jellyfin cannot put Authentik in front (native apps),
# so the gate itself decides, via `policy=jellyfin` (Beefy-Waker v1.2.0):
#   - a BROWSER page load while beefy sleeps gets an "asleep - sign in to start"
#     page and does NOT wake it. Internet scanners were booting beefy ~3x/day.
#     The button goes to /beefy-wake/ (router below): Authentik login (group
#     streaming-users), then a booting page that wakes beefy and redirects to
#     /web/ once Jellyfin answers.
#   - every OTHER request (the apps) still wakes beefy as before, and the gate
#     logs a redacted "observe" line per request so a safe app rule can be chosen
#     later. jellyfin-web's first connect check carries no Jellyfin header, so a
#     header-only rule would lock out LG/Samsung/browser clients - hence the data.
# Spec: Docker/Beefy-Waker/docs/superpowers/specs/2026-10-11-jellyfin-signin-wake-design.md
# CrowdSec on the entrypoint still applies; beefy idles back off after 15 minutes.
#
# No rate limit on purpose: a video client fires many rapid range requests, and
# `default-rate-limit` (100 avg / 50 burst) would throttle playback. audiobookshelf
# and nextcloud omit it for the same reason. CrowdSec still applies - it is attached
# to the websecure entrypoint, so every public route inherits it.
http:
  routers:
    # Jellyfin's first-run wizard (/Startup/*) was reachable from the internet
    # with the wizard unfinished (found 2026-10-11): anyone could have created the
    # admin account. Blocked publicly for good - finish or redo the wizard on the
    # LAN at http://192.168.1.102:8096. Jellyfin routes are case-insensitive, hence
    # the (?i). The allow-list holds only loopback, so every public request is 403.
    jellyfin-startup-block:
      rule: "Host(`jellyfin.holy-grail.ch`) && PathRegexp(`(?i)^/startup`)"
      entryPoints: ["websecure"]
      priority: 30
      service: jellyfin
      middlewares:
        - jellyfin-deny-all
      tls:
        certResolver: cloudflare

    # Password login is refused for everyone (see header "SSO ONLY"). Covers
    # every route Jellyfin answers for it: /Users/AuthenticateByName, the legacy
    # /Users/{id}/Authenticate, ForgotPassword(/Pin), with or without the /emby or
    # /mediabrowser prefix, any case, trailing slash. Unanchored on purpose.
    # It does NOT match /Users/AuthenticateWithQuickConnect (Quick Connect).
    # jellyfin-deny-all allows only loopback, so every request through Traefik
    # gets 403 and never reaches the wake gate (a refused login must not boot beefy).
    jellyfin-password-login-block:
      rule: "Host(`jellyfin.holy-grail.ch`) && PathRegexp(`(?i)/users/(authenticatebyname|[^/]+/authenticate|forgotpassword)(/|$)`)"
      entryPoints: ["websecure"]
      priority: 29
      service: jellyfin
      middlewares:
        - jellyfin-deny-all
      tls:
        certResolver: cloudflare

    # Authentik outpost callback for the wake page below. No middlewares; must
    # beat the catch-all jellyfin router (priority 1).
    jellyfin-outpost:
      rule: "Host(`jellyfin.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    # Jellyfin's connect check. Every app starts with GET /System/Info/Public;
    # the waker relays it while Jellyfin is up and answers it from a cache while
    # beefy boots, so the app believes the server is there and shows its own
    # loading state instead of "server unavailable" (Beefy-Waker v1.3.0).
    # GET only and case-insensitive (Jellyfin routes are); a CORS preflight OPTIONS
    # falls through to the catch-all (gate -> Jellyfin) as before.
    jellyfin-public-info:
      rule: "Host(`jellyfin.holy-grail.ch`) && PathRegexp(`(?i)^/system/info/public$`) && Method(`GET`)"
      entryPoints: ["websecure"]
      priority: 25
      service: beefy-waker-jf
      middlewares:
        - jellyfin-public-info-rewrite
        - jellyfin-secure-headers
      tls:
        certResolver: cloudflare

    # The signed-in wake page (Beefy-Waker /jf/*). Only /beefy-wake* is routed
    # here, rewritten to /jf/*, so the waker's LAN admin page, /history and /gate
    # are NOT reachable from the internet. Authentik app: jellyfin-wake.
    jellyfin-wake-page:
      rule: "Host(`jellyfin.holy-grail.ch`) && PathPrefix(`/beefy-wake`)"
      entryPoints: ["websecure"]
      priority: 20
      service: beefy-waker-jf
      middlewares:
        - authentik@file
        - jellyfin-wake-page-rewrite
        - jellyfin-secure-headers
      tls:
        certResolver: cloudflare

    jellyfin:
      rule: "Host(`jellyfin.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: jellyfin
      middlewares:
        - jellyfin-wake
        - jellyfin-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # ?port=8096 waits for Jellyfin itself rather than merely for sshd. Without it
    # a cold boot answers 502 for the seconds between sshd and the container being
    # ready, which users experience as "the wake page lied".
    jellyfin-wake:
      forwardAuth:
        address: "http://192.168.1.2:9001/gate?port=8096&policy=jellyfin"
        trustForwardHeader: false

    jellyfin-deny-all:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"

    jellyfin-public-info-rewrite:
      replacePathRegex:
        regex: "(?i)^/system/info/public$"
        replacement: "/jf/public-info"

    jellyfin-wake-page-rewrite:
      replacePathRegex:
        regex: "^/beefy-wake/?(.*)"
        replacement: "/jf/$1"

    jellyfin-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          # Deliberately NO Content-Security-Policy. audiobookshelf sets one, but
          # Jellyfin's web client and its cast/plugin surfaces need blob:, media-src
          # and inline workers; a borrowed CSP breaks playback in ways that only
          # show up on some clients. Add one later, tested per client, or not at all.
          Server: ""

  services:
    beefy-waker-jf:
      loadBalancer:
        servers:
          - url: "http://192.168.1.2:9001"
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.1.102:8096"
        passHostHeader: true
