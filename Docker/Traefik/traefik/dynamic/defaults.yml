http:
  middlewares:
    default-rate-limit:
      rateLimit:
        # Restored to normal 2026-10-20 after the big work run. Authentik static assets
        # are permanently exempt via the `authentik-static` router in sso.yml, so the
        # login spinner stays fixed (that was the reason the limit had to be lifted).
        average: 100
        burst: 50
        # One bucket per real client: the single X-Forwarded-For entry set by real-ip@file. Without it the bucket was RemoteAddr = 172.24.0.1 for the whole internet.
        sourceCriterion:
          ipStrategy:
            depth: 1
            ipv6Subnet: 64
