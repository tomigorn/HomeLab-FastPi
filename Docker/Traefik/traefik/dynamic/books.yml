# AudioBookRequest (Docker/Audiobook-Requests, container audiobookrequest), behind Authentik SSO + its own OIDC login.
#
# https://books.holy-grail.ch/   (public via the Cloudflare tunnel, like requests.holy-grail.ch: friends request from anywhere)
#
# Traefik reaches books-proxy (nginx, 10.24.25.6) over traefik_mouse, which passes to ABR (.4); ABR trusts X-Forwarded-* only from .6.
# books-proxy adds the "Movies / Series" link and the request limit (Docker/Audiobook-Requests).
# Forward auth (app books, streaming-requesters) is the outer gate; inside, ABR logs in over OIDC (app books-login).
# CrowdSec is attached to the websecure entrypoint; default-rate-limit like requests.
http:
  routers:
    # Outpost callback path: no app middlewares, higher priority than the catch-all router below.
    books-outpost:
      rule: "Host(`books.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    books:
      rule: "Host(`books.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: books
      middlewares:
        - authentik@file
        - default-rate-limit@file
        - books-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    books-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""

  services:
    books:
      loadBalancer:
        servers:
          - url: "http://10.24.25.6:8080"
        passHostHeader: true
