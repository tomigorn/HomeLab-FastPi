http:
  routers:
    audiobookshelf:
      rule: "Host(`audiobookshelf.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: audiobookshelf
      middlewares:
        - audiobookshelf-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    audiobookshelf-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'self'"
          Server: ""

  services:
    audiobookshelf:
      loadBalancer:
        servers:
          - url: "http://audiobookshelf:80"
        passHostHeader: true
