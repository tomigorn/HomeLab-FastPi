# Grafana — metrics dashboards, LAN + VPN only, behind Authentik SSO.
# Project: /home/pi/Projects/Docker/grafana
#
# No authentik@file forward auth here: Grafana does the SSO itself (generic_oauth
# against the "grafana" OIDC provider in Authentik, provisioned by
# Authentik/scripts/provision-admin-sso.py). Only members of homelab-admins are
# let in, and they land as GrafanaAdmin. local-networks@file keeps the hostname
# off the internet even though it has a public certificate.
#
# SSO only: Grafana's login form and Basic auth are disabled, and host port 3001
# is bound to 127.0.0.1. Recovery when Authentik is down is from the server shell
# (see the grafana service comments in Docker/grafana/docker-compose.yaml).
http:
  routers:
    grafana:
      rule: "Host(`grafana.holy-grail.ch`)"
      entryPoints: ["websecure"]
      service: grafana
      middlewares:
        - local-networks@file
      tls:
        certResolver: cloudflare

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
        passHostHeader: true
