http:
  routers:
    authentik:
      rule: "Host(`sso.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: authentik
      middlewares:
        - default-rate-limit@file
        - authentik-secure-headers
      tls:
        certResolver: cloudflare

    # Authentik's UI is ~100 hashed JS chunks fetched in parallel on first load.
    # Through default-rate-limit (burst 50 per client IP) dozens of them got 429,
    # and the login page sat on an endless spinner in every fresh browser. Static
    # assets are public, immutable files, so they skip the limiter; logins, the
    # flow executor and the API stay rate-limited by the router above.
    authentik-static:
      rule: "Host(`sso.holy-grail.ch`) && PathPrefix(`/static/`)"
      entryPoints: ["websecure"]
      priority: 50
      service: authentik
      middlewares:
        - authentik-secure-headers
      tls:
        certResolver: cloudflare

    # Admin UI and admin-only API: LAN/VPN only (review D-03). Flows, user UI, OIDC and outposts stay public via the router above.
    authentik-admin:
      rule: "Host(`sso.holy-grail.ch`) && (PathPrefix(`/if/admin/`) || PathPrefix(`/api/v3/admin/`) || PathPrefix(`/api/v3/rbac/`) || PathPrefix(`/api/v3/policies/`) || PathPrefix(`/api/v3/providers/`) || PathPrefix(`/api/v3/propertymappings/`) || PathPrefix(`/api/v3/outposts/`) || PathPrefix(`/api/v3/crypto/`) || PathPrefix(`/api/v3/managed/`) || (PathPrefix(`/api/v3/events/`) && !PathPrefix(`/api/v3/events/notifications/`)))"
      entryPoints: ["websecure"]
      priority: 40
      service: authentik
      middlewares:
        - local-networks@file
        - default-rate-limit@file
        - authentik-secure-headers
      tls:
        certResolver: cloudflare

    # Authentik only refuses a next= URL with a host, so ///x, /\x, \\x, http:x or javascript: still redirect off-site after login (review 2026-11-14). Such requests never reach Authentik.
    authentik-open-redirect-guard:
      rule: 'Host(`sso.holy-grail.ch`) && QueryRegexp(`next`, `^[\x00-\x20]*([/\\]{2}|\\|[A-Za-z][A-Za-z0-9+.-]*:)`)'
      entryPoints: ["websecure"]
      priority: 100
      service: noop@internal
      tls:
        certResolver: cloudflare

  middlewares:
    authentik-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
        passHostHeader: true
