# Cup — Docker image update checker UI, behind Authentik SSO.
# Project: /home/pi/Projects/Docker/Cup
#
# Cup has NO authentication of any kind - verified against cup.schema.json, which
# offers no token, password or allowlist option. So this route's forwardAuth is
# the only thing standing in front of it, and what it protects is worth more than
# it looks: since 2026-10-09 the dashboard merges beefy's agent, so it enumerates
# 135 images across BOTH hosts with exact versions AND which are behind on
# updates. That is a ranked list of what to try exploits against.
#
# Gated 2026-10-09. It was public for months before that, and the reason it went
# unnoticed is worth recording: the blackbox probe in grafana/prometheus.yml lists
# cup and accepts 200 as healthy, so an open Cup and a gated Cup both looked
# green. Same shape of failure as the 2026-10-04 outage - the probe measured
# "answers" where the question was "answers correctly".
#
# Bound to the streaming-admins group in Authentik, not streaming-users: this is
# host inventory, which is admin information.
#
# See docs/2026-10-06-authentik-sso.md.
http:
  routers:
    # The outpost callback path. NO middlewares (it must reach Authentik, not
    # Cup) and a higher priority so it wins over the catch-all router below.
    # Omitting this router is the single most common way to break the login flow.
    cup-outpost:
      rule: "Host(`cup.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    cup:
      rule: "Host(`cup.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: cup
      middlewares:
        - authentik@file
        - default-rate-limit@file
        - cup-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    cup-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
          Server: ""

  services:
    cup:
      loadBalancer:
        servers:
          - url: "http://Cup:8000"
        passHostHeader: true
