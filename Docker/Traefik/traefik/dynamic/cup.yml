# Cup — Docker image update checker UI (fetch-only, no login).
# Project: /home/pi/Projects/Docker/Cup
#
# NOTE: Cup has no built-in authentication and its dashboard enumerates every
# container + exact image version. This route is public (behind Cloudflare) with
# no login, matching the Dashy pattern.
#
# The authentik forwardAuth middleware now EXISTS (dynamic/authentik-forwardauth.yml),
# so gating this is two lines: add `authentik@file` to the middlewares list below and
# a companion `cup-outpost` router for PathPrefix(`/outpost.goauthentik.io/`) - copy the
# pattern from radarr.yml.disabled. Deliberately NOT done yet: it would 404 until a
# matching Proxy Provider + Application exists in Authentik and is assigned to the
# embedded outpost. Worth doing - this route is currently public with no auth at all.
# See docs/2026-10-06-authentik-sso.md.
http:
  routers:
    cup:
      rule: "Host(`cup.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: cup
      middlewares:
        - default-rate-limit@file
        - cup-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    cup-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
          Server: ""

  services:
    cup:
      loadBalancer:
        servers:
          - url: "http://Cup:8000"
        passHostHeader: true
