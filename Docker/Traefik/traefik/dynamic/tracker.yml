# Ryot (watch history & ratings) on beefy, behind Authentik SSO.
#
# https://tracker.holy-grail.ch/   (public via the Cloudflare tunnel)
#
# Two logins in a row, like Seerr: the forward auth (Authentik app `tracker`,
# group streaming-users) is the outer gate, then Ryot's own "Sign in with Holy
# Grail" (OIDC app `tracker-login`) creates/opens the per-user Ryot account.
#
# /_i/<slug> is Ryot's integration webhook (Jellyfin on beefy posts playback there).
# Jellyfin is not a browser and cannot pass forward auth, so that path has NO
# authentik: the secret slug is the credential, and local-networks@file keeps it
# off the internet (tunnel traffic = 403). Jellyfin reaches it via extra_hosts.
#
# Wake: like requests.yml, authentik runs BEFORE tracker-wake, so only a signed-in
# user boots beefy. /_i/ has NO wake on purpose: a webhook only fires while
# Jellyfin plays, so beefy is already up; asleep = Traefik 502, nothing woken.
http:
  routers:
    # The outpost callback path. NO middlewares and a higher priority so it wins
    # over the catch-all router below. Without it the login flow is dead.
    tracker-outpost:
      rule: "Host(`tracker.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    tracker-integrations:
      rule: "Host(`tracker.holy-grail.ch`) && PathPrefix(`/_i/`)"
      entryPoints: ["websecure"]
      priority: 20
      service: tracker
      middlewares:
        - local-networks@file
      tls:
        certResolver: cloudflare

    # /go/tmdb/<movie|show>/<id>: Jellyfin's "Rate in Tracker" link, resolved to the Ryot item by ryot-go (beefy :8011). Same gates as the catch-all.
    tracker-go:
      rule: "Host(`tracker.holy-grail.ch`) && PathPrefix(`/go/`)"
      entryPoints: ["websecure"]
      priority: 15
      service: tracker-go
      middlewares:
        - authentik@file
        - tracker-wake
        - default-rate-limit@file
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

    # PWA install ("Add to Home screen"): browsers fetch the manifest and its icons WITHOUT cookies, so behind forward auth they get the SSO redirect and the app installs as a plain bookmark. Only Ryot's static manifest and icons, GET only, no wake (asleep = 502).
    tracker-pwa:
      rule: "Host(`tracker.holy-grail.ch`) && Method(`GET`) && (Path(`/manifest.json`) || PathRegexp(`^/icons/maskable_icon(_x[0-9]+)?\\.png$`))"
      entryPoints: ["websecure"]
      priority: 18
      service: tracker
      middlewares:
        - default-rate-limit@file
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

    tracker:
      rule: "Host(`tracker.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: tracker
      middlewares:
        - authentik@file
        - tracker-wake
        - default-rate-limit@file
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # ?port=8010 makes the Beefy-Waker wait for Ryot itself, not merely for sshd.
    tracker-wake:
      forwardAuth:
        address: "http://192.168.1.2:9001/gate?port=8010"
        trustForwardHeader: false

    tracker-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""

  services:
    tracker:
      loadBalancer:
        servers:
          - url: "http://192.168.1.102:8010"
        passHostHeader: true

    tracker-go:
      loadBalancer:
        servers:
          - url: "http://192.168.1.102:8011"
