# Floppy (media tracker: films, series, books, games) on beefy, behind Authentik SSO.
#
# https://tracker.holy-grail.ch/   (public via the Cloudflare tunnel)
#
# Two logins in a row, like Seerr: the forward auth (Authentik app `tracker`,
# group streaming-users) is the outer gate, then Floppy redirects to its own
# "Sign in with Holy Grail" (OIDC app `tracker-login`), which creates/opens the
# per-user Floppy account.
#
# Allow-list: the catch-all router only matches the URL prefixes the web UI uses
# (Floppy 26.10.29, incl. covers = hash-named local cover files, youtube-player = GET embed page). Anything else (REST API, OAuth device server, health, new
# upstream features) has no router and gets Traefik's 404. After a Floppy update,
# compare the prefixes with HomeLab-Beefy Docker/Floppy README "Edge allow-list".
#
# Blocked on top (403, review findings in that README): token URLs, shared
# metadata edits, the instance-wide TMDB proxy, comics (XSS sink), integrations
# that fetch a user-given server URL (SSRF), local password login.
#
# Wake: like requests.yml, authentik runs BEFORE tracker-wake, so only a signed-in
# user boots beefy.
http:
  routers:
    # The outpost callback path. NO middlewares and a higher priority so it wins
    # over the catch-all router below. Without it the login flow is dead.
    tracker-outpost:
      rule: "Host(`tracker.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    # 403 for everyone, before any other router: these paths authenticate by a token in the URL
    # (also a full-access API key) or are the token API. Not written to the access log, so a token never lands on disk.
    tracker-token-urls:
      rule: "Host(`tracker.holy-grail.ch`) && (PathPrefix(`/webhook/`) || PathPrefix(`/stremio-addon/`) || PathPrefix(`/apis/`) || PathPrefix(`/calendar/download/`) || PathPrefix(`/rss/`) || (PathPrefix(`/api/`) && !PathPrefix(`/api/cache-status/`)))"
      entryPoints: ["websecure"]
      priority: 30
      service: tracker
      middlewares:
        - tracker-deny
      observability:
        accessLogs: false
      tls:
        certResolver: cloudflare

    # 403 for features that must stay off (Floppy README "Security"): unknown methods; shared Item
    # edits (#3); TMDB proxy (#4); comics (#5); server-URL integrations (#1); password login (#10).
    # Encoded / \ % NUL in the path: Traefik matches the raw path but Django decodes it, so `/accounts/signup%2F` would slip past the prefixes above.
    # Open: GET of ABS cover art (signed token, image only, served from copies pushed by beefy's floppy-abs-push; Floppy holds no ABS key and never pulls).
    tracker-blocked:
      rule: >-
        Host(`tracker.holy-grail.ch`) && (
        (!Method(`GET`) && !Method(`HEAD`) && !Method(`POST`) && !Method(`DELETE`))
        || PathPrefix(`/details/image/`) || PathPrefix(`/details/metadata/`)
        || PathPrefix(`/update_tmdb_proxy`)
        || PathRegexp(`^/([^/]+/){1,3}(comic|comicissue|comicvine|gcd)(/|$)`)
        || (PathRegexp(`^/import/(audiobookshelf|kavita|komga|radarr|sonarr|mylar|kapowarr|storyteller|koreader|plex|koito|gpodder)(/|$)`) && !(Method(`GET`) && PathRegexp(`^/import/audiobookshelf/cover/[A-Za-z0-9_=:-]+$`)))
        || PathPrefix(`/jellyfin/`) || PathPrefix(`/seerr/`) || PathPrefix(`/settings/integrations/jellyseerr/`)
        || (Method(`POST`) && Path(`/accounts/login/`)) || PathPrefix(`/accounts/signup/`) || PathPrefix(`/accounts/password/`)
        || PathRegexp(`(?i)%(2f|5c|25|00)|[\\\x00]`)
        )
      entryPoints: ["websecure"]
      priority: 29
      service: tracker
      middlewares:
        - tracker-deny
      tls:
        certResolver: cloudflare

    # /go/tmdb/<movie|show>/<id>: Jellyfin's "Rate in Tracker" link, sent to Floppy's TMDB details page. Same gates as the catch-all.
    tracker-go:
      rule: "Host(`tracker.holy-grail.ch`) && PathPrefix(`/go/`)"
      entryPoints: ["websecure"]
      priority: 15
      service: tracker
      middlewares:
        - authentik@file
        - tracker-go-movie
        - tracker-go-show
        - default-rate-limit@file
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

    # PWA install ("Add to Home screen"): browsers fetch the manifest and its icons WITHOUT cookies, so behind forward auth they get the SSO redirect and the app installs as a plain bookmark. Only Floppy's static favicon files, GET only, no wake (asleep = 502).
    tracker-pwa:
      rule: "Host(`tracker.holy-grail.ch`) && Method(`GET`) && PathRegexp(`^/static/favicon/[A-Za-z0-9._-]+\\.(webmanifest|png)$`)"
      entryPoints: ["websecure"]
      priority: 18
      service: tracker
      middlewares:
        - default-rate-limit@file
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

    # Search and autocomplete call the metadata providers with the instance API keys: tighter per-user limit.
    tracker-search:
      rule: "Host(`tracker.holy-grail.ch`) && PathRegexp(`^/search(/|$)`)"
      entryPoints: ["websecure"]
      priority: 5
      service: tracker
      middlewares:
        - authentik@file
        - tracker-wake
        - tracker-search-rate-limit
        - tracker-body-limit
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

    # Catch-all of the allow-list: the root page plus the first path segments of the web UI's URL map.
    tracker:
      rule: >-
        Host(`tracker.holy-grail.ch`) && (Path(`/`) || Path(`/serviceworker.js`) || PathPrefix(`/api/cache-status/`)
        || PathRegexp(`^/(accounts|bulk|bulk_delete_by_import_source|bulk_delete_by_media_type|calendar|cancel_import_run|cancel_pending_import|checkin|clear_all_caches|clear_discover_cache|clear_history_cache|clear_search_cache|clear_statistics_cache|collection|covers|create|create_export_schedule|delete_export_schedule|delete_import_schedule|details|discover|episode_bulk_save|episode_drop|episode_save|episodes|export|history|history_modal|home|image-cache|import|jsi18n|library|list|list_item_toggle|lists|lists_modal|matches|media|media_delete|media_rewatch|media_save|medialist|music|notifications|person|podcast|progress|progress_edit|providers|regenerate_token|reload_calendar|retry|rollback_import_run|saved-views|select2|settings|setup|static|statistics|studio|sync|tag_bulk_toggle|tag_create|tag_delete|tag_item_toggle|tags|tags_modal|test_notification|tmdb|track_modal|tv|update-episode-score|update-score|update_group_scrobbled_anime|user|wetrakr|youtube-player)(/|$)`))
      entryPoints: ["websecure"]
      priority: 1
      service: tracker
      middlewares:
        - authentik@file
        - tracker-wake
        - default-rate-limit@file
        - tracker-body-limit
        - tracker-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # ?port=8012 makes the Beefy-Waker wait for Floppy itself, not merely for sshd.
    tracker-wake:
      forwardAuth:
        address: "http://192.168.1.2:9001/gate?port=8012"
        maxResponseBodySize: 1048576   # 1 MiB, as authentik-forwardauth.yml; the gate answers with headers or a small page
        trustForwardHeader: false

    # No address matches: every request gets 403.
    tracker-deny:
      ipAllowList:
        sourceRange:
          - "255.255.255.255/32"

    # Floppy's details URL wants a title segment; any text works, the page shows the real title. The link says show, Floppy says tv.
    tracker-go-movie:
      redirectRegex:
        regex: "^https://tracker\\.holy-grail\\.ch/go/tmdb/movie/([0-9]+)([?].*)?$"
        replacement: "https://tracker.holy-grail.ch/details/tmdb/movie/${1}/item"
    tracker-go-show:
      redirectRegex:
        regex: "^https://tracker\\.holy-grail\\.ch/go/tmdb/show/([0-9]+)([?].*)?$"
        replacement: "https://tracker.holy-grail.ch/details/tmdb/tv/${1}/item"

    # Per real client (X-Forwarded-For from real-ip@file), like default-rate-limit.
    tracker-search-rate-limit:
      rateLimit:
        average: 3
        burst: 30
        sourceCriterion:
          ipStrategy:
            depth: 1
            ipv6Subnet: 64

    # Floppy's nginx takes 512 MB; the largest real upload is an import CSV/JSON.
    tracker-body-limit:
      buffering:
        maxRequestBodyBytes: 67108864
        memRequestBodyBytes: 2097152

    # CSP fits Floppy's UI: own scripts only, but inline + eval (Alpine.js, inline handlers); images from Floppy (image cache) and
    # its approved artwork hosts (app/image_cache.py), so a user-set image URL cannot track viewers; fetch/XHR only to Floppy.
    tracker-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        # camera: the ISBN barcode scanner.
        permissionsPolicy: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=()"
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://image.tmdb.org https://artworks.thetvdb.com https://cdn.myanimelist.net https://images.igdb.com https://covers.openlibrary.org https://assets.hardcover.app https://cf.geekdo-images.com https://coverartarchive.org https://*.coverartarchive.org https://*.archive.org https://upload.wikimedia.org https://static.pocketcasts.com https://media.kitsu.app https://s4.anilist.co https://cdn.cloudflare.steamstatic.com https://cdn2.steamgriddb.com https://cdn.thegamesdb.net https://thumbnails.libretro.com https://i.ytimg.com https://img.youtube.com https://*.mzstatic.com https://*.mangabaka.org https://*.screenscraper.fr;
          font-src 'self' data:;
          connect-src 'self';
          media-src 'self' blob:;
          frame-src https://www.youtube.com https://www.youtube-nocookie.com;
          worker-src 'self';
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self' https:;
          frame-ancestors 'none'
        customResponseHeaders:
          Server: ""
          Cross-Origin-Opener-Policy: "same-origin"

  services:
    tracker:
      loadBalancer:
        servers:
          - url: "http://192.168.1.102:8012"
        passHostHeader: true
