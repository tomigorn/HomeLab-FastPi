# SABnzbd of fastpi's mouse stack (audiobooks, container sabnzbd in gluetun_mouse), behind Authentik SSO.
#
# https://sabnzbd-audiobooks.holy-grail.ch/   (LAN/VPN only, no public DNS record)
#
# Traefik reaches gluetun_mouse over traefik_mouse (internal, only these two). sabnzbd.ini (not in git):
#   username/password empty: this gate is the login
#   local_ranges += 10.24.25.3/32 (Traefik), 10.24.5.5/32 (VPN: verify_xff_header=1 also checks X-Forwarded-For)
#   host_whitelist += sabnzbd-audiobooks.holy-grail.ch
# Edit sabnzbd.ini only while SABnzbd is stopped.
#
# CrowdSec sits on the websecure entrypoint. No rate limit, like the other admin UIs.
http:
  routers:
    # Outpost callback path: no app middlewares, higher priority than the catch-all router below.
    sabnzbd-audiobooks-outpost:
      rule: "Host(`sabnzbd-audiobooks.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      middlewares:
        - local-networks@file
      tls:
        certResolver: cloudflare

    sabnzbd-audiobooks:
      rule: "Host(`sabnzbd-audiobooks.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: sabnzbd-audiobooks
      middlewares:
        - local-networks@file
        - authentik@file
        - sabnzbd-secure-headers
      tls:
        certResolver: cloudflare

  services:
    sabnzbd-audiobooks:
      loadBalancer:
        servers:
          - url: "http://10.24.25.2:8081"
        passHostHeader: true
