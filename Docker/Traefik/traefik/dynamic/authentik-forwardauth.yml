# Authentik forward-auth middleware — the shared SSO gate.
#
# Attach to any router that should require an Authentik login:
#     middlewares: [authentik@file, ...]
#
# ...AND give that router's host a companion router for the outpost callback path,
# with NO middlewares and a HIGHER priority. Without it the login flow cannot
# complete, because the browser is redirected to
# `https://<thathost>/outpost.goauthentik.io/...` and that path has to reach
# Authentik rather than the protected app. Every per-app file here does this; copy
# the pattern rather than inventing a new one. Forgetting it produces a redirect
# loop that looks like "Authentik is broken".
#
# This points at the EMBEDDED outpost inside authentik-server, so there is no
# separate outpost container to run or keep in version lockstep.
#
# PREREQUISITE, and it is not optional: `/outpost.goauthentik.io/auth/traefik`
# returns 404 until Authentik itself has a Proxy Provider whose external host
# matches the request, an Application bound to it, and that provider assigned to
# the embedded outpost. Until then every protected route will 404. That config
# lives in Authentik's database, not in this repo - see
# Docker/Traefik/docs/2026-10-06-authentik-sso.md for the exact objects to create.
#
# Single-application providers are used rather than one domain-level provider,
# because access here is already gated per app by group (the streaming-users /
# streaming-admins pattern), and a domain-level provider collapses that into one
# all-or-nothing application.
http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        # Authentik needs the original host and scheme to build its redirect back.
        # Safe here: the websecure entrypoint only trusts the Cloudflare tunnel
        # gateway (172.24.0.1/32) for forwarded headers, so an outside client
        # cannot spoof them.
        trustForwardHeader: true
        # Copied from the auth response onto the proxied request. The username and
        # groups headers are what let an app trust the proxy instead of running its
        # own login - e.g. Servarr's "External" authentication method.
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
