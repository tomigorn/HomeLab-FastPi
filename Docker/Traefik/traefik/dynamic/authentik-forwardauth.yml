# ============================================================================
#  Authentik forward-auth middleware  —  reusable building block
# ----------------------------------------------------------------------------
#  Attach `authentik` to ANY router's `middlewares:` list to gate that route
#  behind an Authentik login. This is "Mode 1" — for apps that have NO native
#  login of their own. Apps that DO support OIDC (Portainer, Audiobookshelf)
#  use their own login instead; do not double-gate them.
#
#  This middleware is INERT until referenced by a router, so it is safe to keep
#  defined here. BUT to actually work it also needs the Authentik side set up:
#  a Proxy Provider + an Application bound to it, assigned to the embedded
#  outpost. Until then the auth subrequest fails (~400).
#
#  See: Docker/Authentik/docs/auth-integration-modes.md  (full how-to + the
#       two-mode decision guide), and _example-routes.yml for a copy-paste
#       route that uses this middleware.
# ============================================================================
http:
  middlewares:
    authentik:
      forwardAuth:
        # Embedded outpost on the Authentik server (same backend as sso.yml).
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        # Headers Authentik returns about the signed-in user; passed on to the
        # app. Apps that support header/proxy auth can read these to know who
        # the user is (and their groups).
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
