http:
  routers:
    # Authentik outpost callback path: no middlewares, higher priority (see cup.yml).
    music-outpost:
      rule: "Host(`music.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    # Feishin web player (Docker/Feishin), same origin as Navidrome so the login cookie reaches /rest; its nginx serves /feishin/ itself (PUBLIC_PATH), no strip-prefix.
    music-feishin:
      rule: "Host(`music.holy-grail.ch`) && (Path(`/feishin`) || PathPrefix(`/feishin/`))"
      entryPoints: ["websecure"]
      priority: 5
      service: feishin
      middlewares:
        - authentik@file
        - music-secure-headers
        - feishin-trailing-slash
      tls:
        certResolver: cloudflare

    # Web UI and Subsonic API (/rest) alike, browser only: Basic auth is not intercepted (no app passwords), so /rest without a Holy Grail session gets the login redirect.
    # No rate limit on purpose (as jellyfin.yml): an app loading a library fires bursts of cover-art requests.
    music:
      rule: "Host(`music.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: navidrome
      middlewares:
        - authentik@file
        - music-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    feishin-trailing-slash:
      redirectRegex:
        regex: "^https://music\\.holy-grail\\.ch/feishin$"
        replacement: "https://music.holy-grail.ch/feishin/"
        permanent: true

    # NOTE: authentication is Authentik forward auth (authentik@file; app "Music", group music-users; Docker/Authentik/scripts/provision-music-sso.py). Navidrome trusts X-authentik-username only from Traefik (172.24.255.3).
    music-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""
          X-Robots-Tag: "noindex, nofollow"

  services:
    feishin:
      loadBalancer:
        servers:
          - url: "http://feishin:9180"
        passHostHeader: true

    navidrome:
      loadBalancer:
        servers:
          - url: "http://navidrome:4533"
        passHostHeader: true
