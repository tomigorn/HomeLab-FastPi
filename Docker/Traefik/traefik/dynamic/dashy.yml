http:
  routers:
    dashy:
      rule: "Host(`dashy.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: dashy
      middlewares:
        - dashy-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    dashy-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
          Server: ""

  services:
    dashy:
      loadBalancer:
        servers:
          - url: "http://Dashy:8080"
        passHostHeader: true
