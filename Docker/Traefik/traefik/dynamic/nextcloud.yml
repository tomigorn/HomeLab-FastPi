# Nextcloud on tower (192.168.1.101:8080), published via Cloudflare Tunnel -> Traefik.
#
# tower sleeps. The tower-wake-public chain (defined in tower-wake.yml) rate
# limits first, then fires a WoL packet and holds the request behind a
# self-refreshing page until tower:8080 answers. The rate limit matters here
# specifically because this router is public - without it any internet scan
# becomes a power switch for the server.
#
# Deliberately NO Content-Security-Policy: Nextcloud sends its own and an
# injected policy breaks the web UI. This differs from audiobookshelf.yml.
#
# Login is handled by Authentik OIDC (application slug "nextcloud"); access is
# gated by the cloud-users / cloud-admins groups. See
# Docker/Authentik/blueprints/nextcloud-oidc.yaml.
http:
  routers:
    # -------------------------------------------------------------------
    # Local password login is NOT available on the public hostname.
    # -------------------------------------------------------------------
    # Higher priority than the main router, so it wins for these requests.
    #
    # Two paths make up Nextcloud's local password login:
    #   ?direct=1     the only way to reach the form once user_oidc's
    #                 allow_multiple_user_backends=0 hides it
    #   POST /login   the form's submit target - blocking only the form
    #                 would be cosmetic, since the POST can be sent directly
    # Exact Path(`/login`) is used, NOT a prefix: /login/v2 and /login/flow
    # belong to Login Flow v2, which the desktop and mobile sync clients use
    # and which must stay public.
    #
    # This is a hard block, not an IP allowlist, and that is deliberate.
    # An allowlist cannot express "from the LAN" here: cloudflared reaches
    # Traefik from 172.20.0.2 / 192.168.1.2, so a 192.168.1.0/24 sourceRange
    # would match the tunnel itself and allow the entire internet. And a LAN
    # browser opening cloud.holy-grail.ch still exits to Cloudflare and comes
    # back through that same tunnel, so it is indistinguishable from a remote
    # one at the IP layer. 192.0.2.1/32 is TEST-NET-1 (RFC 5737) and can
    # never match a real client, so every request here gets a 403.
    #
    # Admin logs in on the LAN instead, where Nextcloud is reachable directly
    # and the public internet is not: http://192.168.1.101:8080/login?direct=1
    # (already a trusted_domain). Remotely, connect the WireGuard VPN first.
    nextcloud-local-login-denied:
      rule: "Host(`cloud.holy-grail.ch`) && (Query(`direct`, `1`) || (Path(`/login`) && Method(`POST`)))"
      priority: 100
      entryPoints: ["websecure"]
      service: nextcloud
      middlewares:
        - nextcloud-login-ratelimit
        - nextcloud-deny
      tls:
        certResolver: cloudflare

    nextcloud:
      rule: "Host(`cloud.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: nextcloud
      middlewares:
        - nextcloud-ratelimit
        - tower-wake
        - nextcloud-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # Deliberately NOT tower-wake-public. That chain includes tower-wake-ratelimit
    # (6 requests per MINUTE, burst 3), which is sized to bound how often a passing
    # bot can trigger a wake - not to serve a web application. A single Nextcloud
    # page load pulls dozens of CSS/JS assets, so under that limit the first 3
    # requests succeed and every asset after them gets a 429: the page renders
    # unstyled, and a refresh shows "too many requests". Verified 2026-08-16.
    #
    # This limit is generous by comparison: it exists only to stop a runaway
    # client, not to police normal use. Sync clients burst heavily, and a limit
    # tight enough to be interesting here would surface later as unexplained
    # sync failures. Cloudflare already absorbs volumetric abuse in front of this,
    # and Nextcloud runs its own brute-force protection behind it.
    #
    # The wake gate (tower-wake) is still attached, so a request to a sleeping
    # tower still fires the magic packet. Wake-frequency limiting belongs in the
    # waker itself, which knows whether tower is down - not in a middleware that
    # sees every asset request.
    nextcloud-ratelimit:
      rateLimit:
        average: 100
        burst: 200

    # Hard deny. Traefik has no explicit "deny" middleware; an ipAllowList
    # whose sourceRange cannot match any real client is the idiomatic way.
    # 192.0.2.0/24 is TEST-NET-1 (RFC 5737), reserved for documentation and
    # never routed.
    nextcloud-deny:
      ipAllowList:
        sourceRange:
          - "192.0.2.1/32"

    # ~5 attempts per 5 minutes, as requested. Scoped ONLY to the local-login
    # router above, never to the main router - a limit this tight applied to
    # normal traffic is what caused the earlier "too many requests" breakage,
    # since one Nextcloud page pulls dozens of assets.
    #
    # This is defence in depth, not the primary control: these requests are
    # already denied. The real brute-force protection for the surfaces that
    # remain public (WebDAV, OCS, app passwords) is Nextcloud's own, which
    # returns 429 after 10 failed attempts in 30 minutes and applies delays up
    # to 25s. That one is deliberately NOT duplicated at Traefik, because a
    # rate limit tight enough to matter on /remote.php/dav would break every
    # sync client.
    nextcloud-login-ratelimit:
      rateLimit:
        average: 5
        period: 5m
        burst: 5

    nextcloud-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""

  services:
    nextcloud:
      loadBalancer:
        servers:
          - url: "http://192.168.1.101:8080"
        passHostHeader: true
