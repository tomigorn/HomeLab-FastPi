# Nextcloud on tower (192.168.1.101:8080), published via Cloudflare Tunnel -> Traefik.
#
# tower sleeps. The tower-wake-public chain (defined in tower-wake.yml) rate
# limits first, then fires a WoL packet and holds the request behind a
# self-refreshing page until tower:8080 answers. The rate limit matters here
# specifically because this router is public - without it any internet scan
# becomes a power switch for the server.
#
# Deliberately NO Content-Security-Policy: Nextcloud sends its own and an
# injected policy breaks the web UI. This differs from audiobookshelf.yml.
#
# Login is handled by Authentik OIDC (application slug "nextcloud"); access is
# gated by the cloud-users / cloud-admins groups. See
# Docker/Authentik/blueprints/nextcloud-oidc.yaml.
http:
  routers:
    nextcloud:
      rule: "Host(`cloud.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: nextcloud
      middlewares:
        - nextcloud-ratelimit
        - tower-wake
        - nextcloud-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # Deliberately NOT tower-wake-public. That chain includes tower-wake-ratelimit
    # (6 requests per MINUTE, burst 3), which is sized to bound how often a passing
    # bot can trigger a wake - not to serve a web application. A single Nextcloud
    # page load pulls dozens of CSS/JS assets, so under that limit the first 3
    # requests succeed and every asset after them gets a 429: the page renders
    # unstyled, and a refresh shows "too many requests". Verified 2026-08-16.
    #
    # This limit is generous by comparison: it exists only to stop a runaway
    # client, not to police normal use. Sync clients burst heavily, and a limit
    # tight enough to be interesting here would surface later as unexplained
    # sync failures. Cloudflare already absorbs volumetric abuse in front of this,
    # and Nextcloud runs its own brute-force protection behind it.
    #
    # The wake gate (tower-wake) is still attached, so a request to a sleeping
    # tower still fires the magic packet. Wake-frequency limiting belongs in the
    # waker itself, which knows whether tower is down - not in a middleware that
    # sees every asset request.
    nextcloud-ratelimit:
      rateLimit:
        average: 100
        burst: 200

    nextcloud-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""

  services:
    nextcloud:
      loadBalancer:
        servers:
          - url: "http://192.168.1.101:8080"
        passHostHeader: true
