# Seerr (requests for films & series) on beefy, behind Authentik SSO.
#
# https://requests.holy-grail.ch/   (public via the Cloudflare tunnel)
#
# The Authentik application `requests` is bound to group streaming-requesters
# (Authentik/scripts/provision-media-groups.py). This forward auth is the outer
# gate; Seerr's own session comes second via "Sign in with Holy Grail" (app
# `requests-login`), see the Seerr README in HomeLab-BeefyServer.
#
# MIDDLEWARE ORDER IS DELIBERATE: authentik runs BEFORE requests-wake. A request
# page that wakes beefy is acceptable (same as Jellyfin), but only for a signed-in
# user; an anonymous hit must never boot the machine. Unlike Jellyfin this app is
# browser-only, so the plain gate is enough and no sign-in-to-wake page is needed.
#
# default-rate-limit is on: this is a page-style app with bursts of small TMDB
# proxy calls, well inside 100 avg / 50 burst. CrowdSec is attached to the
# websecure entrypoint and not listed here.
http:
  routers:
    # The outpost callback path. NO middlewares and a higher priority so it wins
    # over the catch-all router below. Without it the login flow is dead.
    requests-outpost:
      rule: "Host(`requests.holy-grail.ch`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: ["websecure"]
      priority: 10
      service: authentik@file
      tls:
        certResolver: cloudflare

    # Static build files (Seerr's /_next/static, our versioned /_indexer-bar scripts and styles, the icons) skip forward
    # auth: public code (Seerr is open source, our scripts are in the public repo), and the SSO round trip on each of them
    # made page loads slow (owner 2026-11-15). No requests-wake: an anonymous hit must never boot beefy (502 while it
    # sleeps; the pages that load these files already woke it). Pages, /api, /_indexer-bar data and /_next/image stay gated.
    requests-static:
      rule: "Host(`requests.holy-grail.ch`) && (PathPrefix(`/_next/static/`) || PathRegexp(`^/_indexer-bar/[a-z0-9-]+\\.(js|css)$`) || Path(`/favicon.ico`) || Path(`/favicon-16x16.png`) || Path(`/favicon-32x32.png`) || Path(`/apple-touch-icon.png`) || Path(`/site.webmanifest`) || PathRegexp(`^/android-chrome-[0-9]+x[0-9]+\\.png$`))"
      entryPoints: ["websecure"]
      priority: 5
      service: requests
      middlewares:
        - default-rate-limit@file
        - requests-secure-headers
      tls:
        certResolver: cloudflare

    requests:
      rule: "Host(`requests.holy-grail.ch`)"
      entryPoints: ["websecure"]
      priority: 1
      service: requests
      middlewares:
        - authentik@file
        - requests-wake
        - default-rate-limit@file
        - requests-secure-headers
      tls:
        certResolver: cloudflare

  middlewares:
    # ?port=5055 makes the Beefy-Waker wait for Seerr itself, not merely for sshd.
    requests-wake:
      forwardAuth:
        address: "http://192.168.1.2:9001/gate?port=5055&signed_in=1"
        maxResponseBodySize: 1048576   # 1 MiB, as authentik-forwardauth.yml; the gate answers with headers or a small page
        trustForwardHeader: false

    requests-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        # S-16: enforced 2026-10-31 after a logged-in browser run (only violation was the harmless Zod probe).
        # Expected report, no 'unsafe-eval' on purpose: Zod 4 probes Function("") in try/catch and parses without JIT when eval is refused.
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://sso.holy-grail.ch/avatar-img/ https://image.tmdb.org https://plex.tv https://*.plex.tv https://gravatar.com https://*.gravatar.com; font-src 'self' data:; connect-src 'self'; media-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://sso.holy-grail.ch; frame-ancestors 'self'"
        customResponseHeaders:
          Server: ""

  services:
    requests:
      loadBalancer:
        servers:
          - url: "http://192.168.1.102:5055"
        passHostHeader: true
