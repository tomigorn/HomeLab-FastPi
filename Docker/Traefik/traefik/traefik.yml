entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        # Attached HERE, not per-router, so every public route is covered -
        # including any added later. Per-router attachment silently misses new
        # services, which is the failure mode that matters.
        - crowdsec@file
    # Every external request arrives via the Cloudflare tunnel, so the packet
    # source is always the docker bridge gateway (172.24.0.1) and the real client
    # sits in X-Forwarded-For. Without this, Traefik logged 172.24.0.1 as the
    # client for ALL outside traffic - which meant default-rate-limit was a single
    # shared bucket for the entire internet rather than per client, and any
    # log-based blocking would have banned the tunnel itself.
    #
    # Only the gateway is trusted, not a broad range: anything that can reach
    # Traefik from that address is already inside the host.
    forwardedHeaders:
      trustedIPs:
        - "172.24.0.1/32"
  internal:
    address: ":8080"
    http:
      middlewares:
        - default-rate-limit@file

api:
  dashboard: true

# Prometheus metrics (per-entrypoint/router/service request counters) served on
# the internal entrypoint (:8080, LAN-only) at /metrics. Router labels give
# per-person request counts (each LanguageTool token is its own router).
metrics:
  prometheus:
    entryPoint: internal
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme-http.json
      httpChallenge:
        entryPoint: web
  cloudflare:
    acme:
      storage: /letsencrypt/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  file:
    directory: /dynamic
    watch: true

# Note: Docker provider intentionally omitted to use file-based dynamic configuration

# CrowdSec bouncer plugin. Traefik DOWNLOADS this at startup from GitHub - if the
# download fails, Traefik does not start and every service goes down with it. Pin
# the version, and after changing it confirm the container actually comes up
# before walking away.
experimental:
  # LOCAL plugin, deliberately not a registry plugin.
  #
  # `plugins:` makes Traefik fetch from plugins.traefik.io at EVERY startup, and
  # if that single HTTPS request fails it disables ALL plugins. `crowdsec@file`
  # then does not exist, which invalidates the websecure entrypoint middleware,
  # which disables EVERY public router - so Traefik serves 404 for everything and
  # fails closed. That is exactly what happened on 2026-10-04: one timed-out
  # request took the whole public edge down for ~24 hours.
  #
  # Persisting /plugins-storage does NOT help; that was tested directly - with the
  # full archive and extracted sources present, Traefik still contacted the
  # registry and still disabled plugins when it was unreachable.
  #
  # localPlugins reads the vendored source from /plugins-local and never contacts
  # the network, so a registry outage cannot affect this host. The source is
  # committed at traefik/plugins-local/ and is the unmodified v1.7.1 release.
  # To upgrade: replace that directory with the new release's contents.
  localPlugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
