entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  internal:
    address: ":8080"
    http:
      middlewares:
        - default-rate-limit@file

api:
  dashboard: true

# Prometheus metrics (per-entrypoint/router/service request counters) served on
# the internal entrypoint (:8080, LAN-only) at /metrics. Router labels give
# per-person request counts (each LanguageTool token is its own router).
metrics:
  prometheus:
    entryPoint: internal
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme-http.json
      httpChallenge:
        entryPoint: web
  cloudflare:
    acme:
      storage: /letsencrypt/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  file:
    directory: /dynamic
    watch: true

# Note: Docker provider intentionally omitted to use file-based dynamic configuration
