# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Traefik #################################################
# #########################################################
  traefik:
    image: traefik:v3.7.15   # pinned; was :latest. Rollback image kept locally as traefik:rollback-v3.7.0
    container_name: traefik
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
    - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - 80:80       # HTTP
      - 443:443     # HTTPS
      - 8080:8080   # Internal — dashboard only, restricted by IPAllowList
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      # CrowdSec LAPI key. Kept in a file, not inlined in dynamic config, because
      # dynamic config is committed - inlining it is how secrets leak. Gitignored.
      - ./traefik/secrets:/secrets:ro
      - ./traefik/letsencrypt:/letsencrypt    # this is hidden from git via .gitignore
      - ./traefik/logs:/var/log/traefik       # this is hidden from git via .gitignore
      # Vendored plugin source for experimental.localPlugins. Mounted read-only so
      # Traefik can never rewrite it. This replaces registry plugin downloads,
      # which are a startup-time network dependency on a fail-closed path - see the
      # comment in traefik/traefik.yml for the outage this prevents.
      - ./traefik/plugins-local:/plugins-local:ro
    networks:
      traefik_proxy:
        # Pinned: wg-easy DNATs VPN clients' web traffic for 192.168.1.2 straight to this
        # address (so it arrives as 172.24.0.5 = VPN, not via docker-proxy as 172.24.0.1 =
        # Cloudflare tunnel), and Home Assistant trusts it as proxy. Don't change.
        ipv4_address: 172.24.0.3
    dns:
      - 1.1.1.1
      - 8.8.8.8


