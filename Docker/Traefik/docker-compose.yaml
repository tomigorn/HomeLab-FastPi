# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Traefik #################################################
# #########################################################
  traefik:
    image: traefik:v3.7.16   # pinned; was :latest. Rollback image kept locally as traefik:rollback-v3.7.15
    container_name: traefik
    mem_limit: 256m
    restart: unless-stopped
    # Non-root with zero capabilities. The namespaced sysctl lets it bind :80/:443
    # without NET_BIND_SERVICE. Its secrets in dynamic/ and secrets/ are owner pi,
    # group 65026, mode 640 (secrets/cf_dns_api_token: 65026, 0400); letsencrypt/ and logs/ are owned by 65026.
    user: "65026:65026"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
    # lego reads the Cloudflare token from the file (secrets/cf_dns_api_token, 65026, 0400)
    - CF_DNS_API_TOKEN_FILE=/secrets/cf_dns_api_token
    ports:
      - 80:80       # HTTP
      - 443:443     # HTTPS
      - 8443:8443   # LanguageTool — external 443 forward points here (lang-tool.ddns.net)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      # CrowdSec LAPI key. Kept in a file, not inlined in dynamic config, because
      # dynamic config is committed - inlining it is how secrets leak. Gitignored.
      - ./traefik/secrets:/secrets:ro
      - ./traefik/letsencrypt:/letsencrypt    # this is hidden from git via .gitignore
      - ./traefik/logs:/var/log/traefik       # this is hidden from git via .gitignore
      # Vendored plugin source for experimental.localPlugins. Mounted read-only so
      # Traefik can never rewrite it. This replaces registry plugin downloads,
      # which are a startup-time network dependency on a fail-closed path - see the
      # comment in traefik/traefik.yml for the outage this prevents.
      - ./traefik/plugins-local:/plugins-local:ro
    networks:
      traefik_proxy:
        # Pinned: DOCKER-USER/HOST-GUARD allow this source (beefy/tower, host-network backends).
        # Top of the subnet on purpose: after a reboot Docker hands out addresses from the bottom.
        ipv4_address: 172.24.255.3
        # Default route + published ports stay here: the DOCKER-USER/HOST-GUARD rules and every trust list name 172.24.255.3.
        gw_priority: 100
      # Prometheus scrapes traefik:8080/metrics here; :8080 is not published on the host.
      traefik_metrics:
      # One network per sensitive or public backend, shared only with Traefik (H-2). Traefik is .3 on each.
      traefik_authentik:
        ipv4_address: 10.24.15.3   # in Authentik's TRUSTED_PROXY_CIDRS
      traefik_crowdsec:
        ipv4_address: 10.24.11.3
      traefik_portainer:
        ipv4_address: 10.24.7.3
      traefik_wg:
        ipv4_address: 10.24.5.3    # wg-easy DNATs VPN web traffic for 192.168.1.2:80/443 here
      traefik_loyalty_cards:
        ipv4_address: 10.24.20.3
      traefik_loyalty_sync:
        ipv4_address: 10.24.21.3
      traefik_home:
        ipv4_address: 10.24.22.3
      traefik_stonks:
        ipv4_address: 10.24.23.3
      traefik_wg_chores:
        ipv4_address: 10.24.24.3
    dns:
      - 1.1.1.1
      - 8.8.8.8


# # #########################################################
# # whoami ##################################################
# # #########################################################
# # !!! !!!
# # ONLY FOR TESTING PURPOSES - REMOVE IN PRODUCTION !!!
# # !!! !!!
#   whoami:
#     image: containous/whoami
#     container_name: whoami
#     restart: unless-stopped
# #     labels:
# #       labels no longer needed since we're using file-based dynamic configuration
#     networks:
#       - traefik_proxy
# #     # no host ports required: Traefik will route traffic internally


# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true
  # Only Traefik and Prometheus; internal = no route out, no gateway.
  traefik_metrics:
    name: traefik_metrics
    internal: true
  # Per-app networks (H-2): Traefik + one app each, so a compromised app cannot reach the others.
  # internal = no gateway; the app keeps its egress on its own project network.
  # Not internal where that is the app's only network and it needs egress or a published port.
  traefik_authentik:
    name: traefik_authentik
    internal: true
    ipam:
      config:
        - subnet: 10.24.15.0/28
  traefik_crowdsec:
    name: traefik_crowdsec
    internal: true
    ipam:
      config:
        - subnet: 10.24.11.0/28
  # Portainer egress to the beefy agent (pinned 10.24.7.7, DOCKER-USER) + 127.0.0.1:9443
  traefik_portainer:
    name: traefik_portainer
    ipam:
      config:
        - subnet: 10.24.7.0/28
  # wg-easy: VPN NAT source 10.24.5.5 (local-networks, HOST-GUARD, DOCKER-USER)
  traefik_wg:
    name: traefik_wg
    ipam:
      config:
        - subnet: 10.24.5.0/28
  traefik_loyalty_cards:
    name: traefik_loyalty_cards
    internal: true
    ipam:
      config:
        - subnet: 10.24.20.0/28
  traefik_loyalty_sync:
    name: traefik_loyalty_sync
    internal: true
    ipam:
      config:
        - subnet: 10.24.21.0/28
  traefik_home:
    name: traefik_home
    internal: true
    ipam:
      config:
        - subnet: 10.24.22.0/28
  # stonks fetches quotes from the internet
  traefik_stonks:
    name: traefik_stonks
    ipam:
      config:
        - subnet: 10.24.23.0/28
  # wg-chores-app: 127.0.0.1:8084 needs a gateway network
  traefik_wg_chores:
    name: traefik_wg_chores
    ipam:
      config:
        - subnet: 10.24.24.0/28

