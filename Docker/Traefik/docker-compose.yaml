# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Traefik #################################################
# #########################################################
  traefik:
    image: traefik:v3.4
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
    - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_proxy
      - --api.dashboard=true
      # Let's Encrypt configuration
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --entrypoints.websecure.http.tls.certresolver=le
      # HTTP Challenge configuration (HTTP-01)
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - 80:80       # HTTP
      - 443:443     # HTTPS
      - 8080:8080   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - traefik_proxy
    dns:
      - 1.1.1.1
      - 8.8.8.8


# #########################################################
# whoami ##################################################
# #########################################################
  whoami:
    image: containous/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Route the registered DuckDNS domain to this service
      - "traefik.http.routers.whoami.rule=Host(`${WHOAMI_DOMAIN}`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.tls.certresolver=le"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      # Middleware to redirect plain HTTP -> HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTP router that uses the redirect middleware on entrypoint web
      - "traefik.http.routers.whoami-http.rule=Host(`${WHOAMI_DOMAIN}`)"
      - "traefik.http.routers.whoami-http.entrypoints=web"
      - "traefik.http.routers.whoami-http.middlewares=redirect-to-https@docker"
      - "traefik.http.routers.whoami-http.priority=1"
    networks:
      - traefik_proxy
    # no host ports required: Traefik will route traffic internally


# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================

