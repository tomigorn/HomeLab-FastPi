# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Autoheal ################################################
# #########################################################
  autoheal-nzb:
    image: willfarrell/autoheal:latest
    container_name: autoheal-nzb
    user: "65013:65013"
    mem_limit: 64m
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-nzb
      - AUTOHEAL_INTERVAL=3600
      - AUTOHEAL_START_PERIOD=0
      # Talks to socket-proxy-autoheal over TCP instead of mounting the real
      # socket, which is root on the host. That proxy allows container reads plus
      # POST (autoheal calls POST /containers/{id}/restart) but denies exec,
      # images, volumes, networks and everything else.
      - DOCKER_SOCK=tcp://socket-proxy-autoheal:2375
    networks:
      - socket_proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# #########################################################
# Gluetun VPN #############################################
# #########################################################
  gluetun:
    image: qmcgaw/gluetun:v3.41.3   # pinned release; :latest is the master/dev build
    container_name: gluetun_nzb
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN          # tunnel, routes, firewall
      - NET_RAW            # iptables-legacy
      - NET_BIND_SERVICE   # internal DNS on :53
      - DAC_OVERRIDE       # writes into the 1000-owned /gluetun
      - CHOWN              # chowns /tmp/gluetun/ip
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${ProtonVPN_Private_Key}
      - SERVER_COUNTRIES=Switzerland
      - TZ=Europe/Zurich
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
    # expose host ports here because sabnzbd shares gluetun's network namespace
    ports:
      # SABnzbd web UI (host_port:container_port) - localhost only (2026-10-19,
      # SSO-only: no password form over the network). ssh -L 8090:127.0.0.1:8090 fastpi
      # Through this bind SABnzbd sees the nzb network gateway (172.33.0.1), which is
      # outside its default private ranges, so sabnzbd.ini (not in git) has
      #   local_ranges = 172.33.0.0/16, 192.168.1.0/24
      # (set 2026-10-19, backup sabnzbd.ini.bak-2026-10-19); without it: 403.
      - "127.0.0.1:8090:8080"
    restart: always
    labels:
      - autoheal-nzb=true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - gluetun-data:/tmp/gluetun
      - ./secrets/gluetun:/gluetun
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      nzb_network:
        ipv4_address: 172.33.0.2

# #########################################################
# SABnzbd #################################################
# #########################################################
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:             # linuxserver s6: chown /config, drop root -> PUID 1101
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1101
      - PGID=1100
      - TZ=Europe/Zurich
      - HOST_WHITELIST_ENTRIES=fastpi,fastpi.homelab
    volumes:
      - type: bind
        source: /mnt/seagate-red/sabnzbd/config
        target: /config
        bind:
          create_host_path: false
      - ../_global/lsio-init/drop-users-group.sh:/custom-cont-init.d/drop-users-group.sh:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    labels:
      - autoheal-nzb=true
    # SABnzbd has no direct network access — all traffic routed through gluetun/ProtonVPN
    network_mode: "service:gluetun"

# =========================================================
# Networks ================================================
# =========================================================
networks:
  socket_proxy:
    external: true
  nzb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/16
          gateway: 172.33.0.1

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  gluetun-data:
