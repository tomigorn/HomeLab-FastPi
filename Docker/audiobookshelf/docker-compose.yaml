# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Audiobookshelf ##########################################
# #########################################################
  audiobookshelf:
    container_name: audiobookshelf
    hostname: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    volumes:
      - /mnt/seagate-black/library/audiobooks:/audiobooks
      - /mnt/seagate-black/library/podcasts:/podcasts
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Zurich
    restart: unless-stopped
    networks:
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true


# =========================================================
# Volumes =================================================
# =========================================================

