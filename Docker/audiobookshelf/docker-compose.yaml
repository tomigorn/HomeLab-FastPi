# =========================================================
# Services ================================================
# =========================================================
services:

# #########################################################
# Audiobookshelf ##########################################
# #########################################################
  audiobookshelf:
    container_name: audiobookshelf
    hostname: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      - /mnt/seagate-black/library/audiobooks:/audiobooks
      - /mnt/seagate-black/library/podcasts:/podcasts
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Zurich
    restart: unless-stopped
# =========================================================
# Networks ================================================
# =========================================================


