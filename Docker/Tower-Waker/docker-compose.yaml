# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# Tower-Waker #############################################
# #########################################################
  waker:
    build: .                       # Rust, static binary in a scratch image (see Dockerfile); legacy Python: app/
    image: tower-waker:local
    container_name: tower-waker
    restart: unless-stopped
    # Host network so the magic packet can be broadcast onto the LAN
    # and so Traefik can reach the gate at <fastpi-ip>:${WAKER_LISTEN_PORT}.
    network_mode: host
    env_file: .env
    volumes:
      - ./app/VERSION:/app/VERSION:ro        # app version shown in the page footer
      # No /history key: Unraid has no journal, /history always answers "history key not installed".
    # Liveness probe for observability (docker ps shows healthy/unhealthy). NOTE:
    # plain compose does NOT auto-restart on unhealthy — restart:unless-stopped only
    # catches crashes/OOM. /status answers whenever the gate loop is alive.
    healthcheck:
      test: ["CMD", "/tower-waker", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Non-root + no capabilities: it binds :9002 (>1024), sends a broadcast UDP
    # packet (SO_BROADCAST is unprivileged) — neither needs root or any capability.
    user: "65006:65006"      # dedicated uid (not pi's 1000)
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 16m           # RSS ~1 MB
    cpus: 0.5
    pids_limit: 32
    security_opt:
      - no-new-privileges:true

# =========================================================
# Networks ================================================
# =========================================================
# (none — uses host networking)

# =========================================================
# Volumes =================================================
# =========================================================
# (none)
