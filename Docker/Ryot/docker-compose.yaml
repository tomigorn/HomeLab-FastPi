# =========================================================
# Services ================================================
# =========================================================
# Ryot (watch history & ratings) behind Traefik tracker.holy-grail.ch,
# routes in Docker/Traefik/traefik/dynamic/tracker.yml. No published ports.
services:
# #########################################################
# PostgreSQL ##############################################
# #########################################################
  ryot-db:
    image: docker.io/library/postgres:18.6-alpine
    container_name: ryot-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: Europe/Zurich
      POSTGRES_USER: ryot
      POSTGRES_DB: ryot
      POSTGRES_PASSWORD: ${RYOT_DB_PASSWORD:?database password required}
    volumes:
      - ryot-db:/var/lib/postgresql
    networks:
      - ryot_internal

# #########################################################
# Ryot ####################################################
# #########################################################
  ryot:
    image: ghcr.io/ignisda/ryot:${RYOT_TAG:-v10.5.3}
    container_name: ryot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ryot:${RYOT_DB_PASSWORD}@ryot-db:5432/ryot
    # OIDC calls stay on the LAN even when AdGuard (which rewrites sso to the LAN) is down and the router resolves it via Cloudflare.
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 10s
    depends_on:
      ryot-db:
        condition: service_healthy
    networks:
      - ryot_internal
      - traefik_proxy

# =========================================================
# Networks ================================================
# =========================================================
networks:
  ryot_internal:
    driver: bridge
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  ryot-db:
    driver: local
